################ EVENTS
prk.30.t:0 "Question of Riches"
prk.30.d:0 "After our raid against the Undergaler city of Schneefilde, we have gathered many spoils. Enought for everyone to enjoy them and more! But the council of Perkavland were offered a majority of these spoils from the warlords. In hopes that these will help the Perkav people to go down a better path for a brighter future..."
prk.30.a:0 "Better future? We shall celebrate for it!"
prk.30.b:0 "Krostov has blessed us to succeed, thus we shall return the favour!"
prk.30.c:0 "We must use the spoils to reorganize our production..."
#
prk.31.t:0 "Tribal Dispute!"
prk.31.d:0 "The tribes of Lyrnikova and Nevetko have reached a boiling point. It seems as if they weren't able to share the loot they have got from Schneefilde, with the Chief of Lyrnikova claiming to have looted Prinztpalatz and Nevetko claiming the same. Some people from these tribes have reached out to the council to decide who should get the spoils..."
prk.31.a:0 "Lyrnikova shall receive them."
prk.31.b:0 "Nevetko shall always be on our side."
