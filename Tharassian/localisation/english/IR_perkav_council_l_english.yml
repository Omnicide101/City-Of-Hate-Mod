PRK_spoils_of_schneefilde:0 "Spoils of Schneefilde"
PRK_spoils_of_schneefilde_desc:0 "The prosporous northfolk have treasures ripe for the taking, the city of Schneefilde is an easy target and shall gift us with bountiful loot. Loot we need for our greater future!"
PRK_enjoy_the_spoils:0 "Call a Swietozwyciest"
PRK_enjoy_the_spoils_desc:0 "The Swietozwyciest is an anciet Perkav warrior tradition, after a victory the warriors and chiefs would gather to feast and boast about the battles they have just experienced. Lately this tradition has been dwindiling throughout the Perkavlands, less victories are had. So we shall organize a great feast for this tremendous achievements we have achieved!"
PRK_prioritize_lyrn:0 "Align Lyrn"
PRK_prioritize_lyrn_desc:0 "The Lyrnikova tribe was always known to be treacherous, switching alligence to benefit itself the most. Even if they are allied to Karczyk, maybe we should help them stay on our side by giving them the spoils."
PRK_prioritize_nevet:0 "Support Nevet"
PRK_prioritize_nevet_desc:0 "Nevet and Krell tribes have had quite the long term alliance. Fighting side by side, we shall gift them the spoils they require for their esoteric ways."
PRK_supply_raiders:0 "Support Raider Bands"
#
PRK_supply_raiders_desc:0 "Many raider bands go out to get their spoils ill equiped. We shall change this, by focusing on giving our warriors ample equipment to plunder we shall benefit hugely!"
PRK_enrich_temples:0 "Enrich The Krostovskron"
PRK_enrich_temples_desc:0 "Our spoils of war shall be gifted to Krostov, through the Krostovskron in Vitrczin. For we must remember what gives us strenght and how we survive each day thanks to it. Krostov shall see the beauty of our victories!"
PRK_raid_the_weak:0 "Raid The Weak"
PRK_raid_the_weak_desc:0 "Krostov blesses the strongest and independent, and because of this. Our society shall attempt to not have the weak and submissive, everyone shall fight to be free and strong and if one doesn't then they shall perish!"
PRK_elevate_druids:0 "Elevate Druids"
PRK_elevate_druids_desc:0 "Druids are respected but not many of them get what they deserve, People who undestand the powers of Krostov shall stand next Chiefs and show them the way forward. They share Krostov's blessing as the worthy."
#
PRK_found_production:0 "Modernize Production"
PRK_found_production_desc:0 "In Krell's vision, The Perkav people shall raid until they become self-sufficient, and begin starting friendly relations with other peoples. Despite much opposition from more conservative elements. Krell can begin his grand plan right now..."
PRK_promot_military_produc:0 "Expand Military Production"
PRK_promot_military_produc_desc:0 "By Expanding our military production we can raid more effectively and keep expanding our economy further, and some more militant groups in our council won't mind this development for sure!"
PRK_expand_agriculture:0 "Expand Agriculture"
PRK_expand_agriculture_desc:0 "The Perkavlands are harsh and some-what barren. By attempting to expand our farms and other agriculture we shall be able to be more prepared and expand our economy with less risk of struggle."
PRK_create_a_menial_class:0 "Form The Budownolud"
PRK_create_a_menial_class_desc:0 "The Budownolud, a proposed guild-like organisation by Krell himself, formed out of the best carpenters, artisans and builders of Perkavland. They shall build up the cities to greatness, using our riches from the north so that we can be on par and overcome our Undergaler kin."
