SPW_order_of_living_merc:0 "Order Of The Living"
SPW_order_of_living_merc_desc:0 "The Order Of The Living was formed by Lea Eichenwald after her time as part of the Islicher River Patrol. Inspired by the Schneefidler Taifun-Orden. They brave the nights keeping the haunted Spochwald woods safe."
