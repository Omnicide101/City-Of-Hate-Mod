SPW_Islicher_River_Patrol_donating:0 "Islicher River Patrol"
SPW_Islicher_River_Patrol_donating_desc:0 "The Islicher river is an important artery of our Freiprinztum. Without it we would experience massive famines and unrest. To prevent that future, [SVT.GetFlag] §Y[SVT.GetName]§!, [SPW.GetFlag] §Y[SPW.GetName]§! and [NRK.GetFlag] §Y[NRK.GetName]§! contribute to keeping the Patrol alive. The weakest point in the route is in [SPW.GetFlag] §Y[SPW.GetName]§! with its haunted forests full of bandits. If Spochwald's River patrol would fail systematically, it would be disasterous for us...\n\n§YIf the Islicher River Patrol is defeated in all Spochwalder states, it will collapse,§! §Rleading to dire consequences!§!\n\nThe §2Islicher River Patrol§! currently has:\n[?SPW.IRP_manpower_var|+0] Manpower and [?SPW.IRP_equipment_var|+0] Equipment"
