SPW_GAME_PLAN:0 "@SPW §YSpochwalder§! Strategy"
SPW_Weisz_transition_PLAN:0 "Wilhemina Weisz Ascendant"
SPW_Weisz_transition_PLAN_DESC:0 "Wilhelm Weisz will try to not give up and overcome his depression, with the help of Magdalena." 
SNF_BeKazaal_PLAN:0 "Be'Kazaal Ascendant"
SNF_BeKazaal_PLAN_DESC:0 "Be'Kazaal will possess Wilhelm Weisz and begin a demonic campaign against the Ungerdaler Union."
SPW_temple_PLAN:0 "Soil-Father’s Chosen"
SPW_temple_PLAN_DESC:0 "Lea Eichenwald will zealously usurp power from Weisz and with the Temple of Tergewelft try to bring Spochwald on the right path."
SPW_Wissman_PLAN:0 "The Iron Dawn"
SPW_Wissman_PLAN_DESC:0 "August Wissman of the City Guard will usurp power from Weisz and lead Spochwald to become a repression state as a means to an end."
SPW_jager_PLAN:0 "The Forest-King’s Legion"
SPW_jager_PLAN_DESC:0 "Matthias Jäger of the Darkweald Bandits will become the bandit king of Spochwald, ruling with an iron fist and fear."
#
SPW_breadbasket_of_the_union:0 "Breadbasket of the Union"
SPW_breadbasket_of_the_union_desc:0 "Spochwald is known for it's export of food throughout the Union, even despite the fertile fields between the forests being haunted and banditritten, The Rooks' Halflings still work diligently to provide grain and crops for the union as a whole."
SPW_reapers_of_the_harvest:0 "Reapers Of The Harvest"
SPW_reapers_of_the_harvest_desc:0 "St Vichtlas and Neureik benefit greatly from the food trade with Spochwald via the Islicher River. To the point that it is in their best interest for the Islicher River Patrol to keep working in Spochwald. A couple succesful incursions by bandits or undead could cause great famines throughout the western union!"
SPW_Spectre_BeKazaal:0 "Spectre of Be'Kazaal"
SPW_Spectre_BeKazaal_desc:0 "The ancient and powerful Demon, Be’Kazaal, cast the entire Ungerdaler Union into war and slaughter when he possessed Freiprinzessin Ludmila Klöster of Spochwald and kicked off the Second Succession Crisis. Though eventually beheaded by the great Hochprinzessin Magdalena of Holzbrenn, this was not before laying waste to the Tomb of St. Vichtlas and a vile ritual that saw the vast majority of the people of Spochwald sacrificed. Spochwald had ever been a haunted and unquiet realm, but following the blood-soaked events of the Second Succession Crisis, many commonfolk are convinced Be’Kazaal’s spirit yet haunts the woods…"
SPW_rapidly_collapsing_state:0 "Rapidly Collapsing State"
SPW_rapidly_collapsing_state_desc:0 "Cursewoods, Bandits, Tensions in the Rooks. To anyone it seems Spochwald is not long for this world. Lack of any responsible governing bodies to do anything leaves everything to be neglected and issues to fester and grow. Only the desolate and hopeless live in this wretched land."
#
SPW_the_rooks_modifier:0 "Commune of Die Rücke"
SPW_the_rooks_modifier_desc:0 "These lands are inhabited by the halfling nation of The Rooks, their free, nobleless communes spread throughout the lands. Only wanting to be left alone in their peaceful homeland. They tend to their crops and cooperate with the local governments. \n\n§YYou cannot build in The Rooks until you appease or deal with the Halflings!§!"
#
SPW_bop_willpower_low:0 "Weisz is barely hanging on..."
SPW_bop_willpower_okay:0 "Weisz is still there..."
SPW_bop_willpower_better:0 "Weisz has been better..."
SPW_bop_willpower_good:0 "Weisz smiles at times..."
