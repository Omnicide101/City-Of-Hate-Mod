rks_upset_trigger_val_tt:0 "The Tension in The Rooks is less then a §RPowderkeg§!"
SPW_RKS_Weakened_tooltip:0 "If [RKS.GetFlag] §Y[RKS.GetName]§! were to §Rrebel§!, they will be severely weakened!"
