the_sod-wit_prince:0 "The Sod-Wit Prinzt"
SPW_CITY_OF_HATE_DESC:0 "Spochwald is the land of the violent, the desperate, and the haunted. It has ever had a deeply ominous reputation, shunned by all save the most desolate wretches, and this has only strengthened since the cursed reign of the Demon Be’Kazaal and the subsequent Second Succession Crisis. Its forests are teeming with bandits, the dead do not rest easy, and their Freiprinz has taken to the bottle to escape the many threats that face his reign."
