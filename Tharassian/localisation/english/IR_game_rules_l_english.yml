l_english:
 AI_GAME_PLANS:0 "AI Game Plans"
 DEFAULT_PLAN:0 "Default Strategy"
 DEFAULT_PLAN_DESC:0 "The AI will randomly pick from the options available to it, weighted by factors such as ruling party ideology and general plausibility."
 UNG_GAME_PLAN:0 "@UNG §YUngerdaler§! Strategy"
 UNG_DIPLOMATIC_PLAN:0 "A Diplomatic Union"
 UNG_DIPLOMATIC_PLAN_DESC:0 "The Union will seek to pursue peaceful, diplomatic solutions to problems both at home and abroad."
 UNG_WARMONGER_PLAN:0 "Ungerdaler Militarism"
 UNG_WARMONGER_PLAN_DESC:0 "The Union will centralize into an autocracy and solve its problems with force."
 ORD_GAME_PLAN:0 "@ORD §YOrdorian§! Strategy"
 ORD_TRADITIONALIST_PLAN:0 "The Steward"
 ORD_TRADITIONALIST_PLAN_DESC:0 "The Traditionalists will dominate the Autumn Debate and seek to avenge High King Inskyllithe under Lothinnys' guidance."
 ORD_FAITHFUL_PLAN:0 "The Preacher"
 ORD_FAITHFUL_PLAN_DESC:0 "Histarine Vernythe and the Faithful will emerge victorious from the Autumn Debate and crush the traitor and the vermin under the boot of Itherynism."
 ORD_MODERATE_PLAN:0 "The Heir"
 ORD_MODERATE_PLAN_DESC:0 "Larennis' Moderates will steer Ordoria away from Puritanism and seek to restore Ordorian hegemony through subterfuge, rather than brute force."
 STA_GAME_PLAN:0 "@STA §YStahlhoffer§! Strategy"
 STA_NICE_PLAN:0 "Benevolent Tyranny"
 STA_NICE_PLAN_DESC:0 "Schwarzenbach will respect Neureik's autonomy and institute great benefits for the common soldiery of his army."
 STA_STRICT_PLAN:0 "The Steel Autocrat"
 STA_STRICT_PLAN_DESC:0 "Schwarzenbach will demand absolute obedience from both Freiprinz Hassler and his own army."
 HLZ_GAME_PLAN:0 "@HLZ §YHolzbrenner§! Strategy"
 HLZ_GUTPRINZ_PLAN:0 "The Gutprinz"
 HLZ_GUTPRINZ_PLAN_DESC:0 "Good Prince Beckenbauer will cast down Rosenblut and return good governance to the Freiprinztum of Holzbrenn."
 HLZ_EDLERRAT_PLAN:0 "The Edlerrat"
 HLZ_EDLERRAT_PLAN_DESC:0 "The Council of Dukes will cast down Rosenblut and decentralize the powers of the Freiprinz towards a benevolent aristocratic council."
 HLZ_LEAGUE_PLAN:0 "The League"
 HLZ_LEAGUE_PLAN_DESC:0 "The Solidarity League will cast down Rosenblut and build a just and fair Republic together with the Libertines."
 HLZ_LIBERTINES_PLAN:0 "The Libertines"
 HLZ_LIBERTINES_PLAN_DESC:0 "The Libertines will cast down Rosenblut and build a free and fair Republic together with the League."
 HLZ_PRESSLER_PLAN:0 "The Right Hand"
 HLZ_PRESSLER_PLAN_DESC:0 "Marius Pressler will launch a counterrevolution and restore despotism to Holzbrenn."
 IRI_GAME_PLAN:0 "@IRI §YIrinthian§! Strategy"
 IRI_CHAIROPHON_PLAN:0 "The Irinthian Phoenix"
 IRI_CHAIROPHON_PLAN_DESC:0 "Chairophon will continue to lead a resurgent Irinthios and rebuild the empire of Onesiphoros himself."
 IRI_SOSIBIOS_PLAN:0 "The General"
 IRI_SOSIBIOS_PLAN_DESC:0 "Sosibios will seize power and cleanse Irinthian land of the Ogre and the Lizard."
 IRI_OLD_GUARD_PLAN:0 "The Old Guard"
 IRI_OLD_GUARD_PLAN_DESC:0 "Chairophon will be forced to concede to the army's old guard to ward off Sosibios' influence, allowing conservative influences to temper his ambitions."
 IRI_CINYRAS_PLAN:0 "The Disgraced"
 IRI_CINYRAS_PLAN_DESC:0 "Cinyras will foster revolution against Chairophon and restore his dynasty to the throne of Tion."
 IRI_ROSITE_PLAN:0 "The Revolution"
 IRI_ROSITE_PLAN_DESC:0 "Cinyras will lose control of the revolution he formented and a Rosite republic will be created out of the ashes of the Irinthian Empire."
 BLD_GAME_PLAN:0 "@BLD §YBilodyan§! Strategy"
 BLD_KURBAH_PLAN:0 "Kar Kurbah"
 BLD_KURBAH_PLAN_DESC:0 "Kar Kurbah will retain control of Bilodya and continue established governance."
 BLD_VURKUN_PLAN:0 "Kar Vurkun"
 BLD_VURKUN_PLAN_ESC:0 "Kar Vurkun will lead Bilodya into a government of reforms and changes."
 SNF_GAME_PLAN:0 "@SNF §YSchneefilder§! Strategy"
 SNF_KOLB_PLAN:0 "Freiprinz Kolb"
 SNF_KOLB_PLAN_DESC:0 "Otto Kolb will sideline the nobility and enact his plans for Schneefilde."
 SNF_DRECHT_PLAN:0 "Freiprinz Drecht"
 SNF_DRECHT_PLAN_DESC:0 "Ulrich Drecht will leverage the nobility's discontent to launch himself into the position of Freiprinz."
 SNF_DRECHT_ALTERNATE_PLAN:0 "'Freiprinz' Drecht"
 SNF_DRECHT_ALTERNATE_PLAN_DESC:0 "Drecht will fail to keep the re-empowered nobility in check and becomes a puppet for his own vassals."
 LIR_GAME_PLAN:0 "@LIR §YLirothline§! Strategy"
 LIR_MOREL_PLAN:0 "The High Priestess"
 LIR_MOREL_PLAN_DESC:0 "Charlène Morel will extend the Regency indefinitely and keep Prince Ansoudin under her thumb."
 LIR_ANSOUDIN_PLAN:0 "The King"
 LIR_ANSOUDIN_PLAN_DESC:0 "Jean-Philippe Ansoudin will be crowned rightful King of Lirothlind and end the Regency."
 SKA_GAME_PLAN:0 "@SKA §YSkaelinger§! Strategy"
 SKA_CHARTIST_PLAN:0 "The Chartists"
 SKA_CHARTIST_PLAN_DESC:0 "The Charter Protection League will oversee the transformation of Skaelinger into a Republic and end the ancient practice of monarchy."
 SKA_COUNCIL_PLAN:0 "The Council"
 SKA_COUNCIL_PLAN_DESC:0 "The Grand Lore Council will transform the emergency government into an enduring, fully-fledged aristocratic republic."
 SKA_HELLIRFAST_PLAN:0 "King Hellirfast"
 SKA_HELLIRFAST_PLAN_DESC:0 "Reev Hellirfast will follow in his kin's footsteps and continue the reforms laid out by the late Ystvigg."
 SKA_GRIMVALD_PLAN:0 "King Grimvald"
 SKA_GRIMVALD_PLAN_DESC:0 "Petar Grimvald will be crowned King and pursue isolationist policies, caring little for the outside world."
 SKA_PALMKEVIST_PLAN:0 "King Palmkevist"
 SKA_PALMKEVIST_PLAN_DESC:0 "Kytos Palmkevist will assume the crown of Skaelinger and pursue militaristic goals for the Free Stronghold."
 SKA_IRONBLOOD_PLAN:0 "The Conspiracy"
 SKA_IRONBLOOD_PLAN_DESC:0 "The Ironblood Conspiracy will execute a coup of the government and lead Skaelinger down a path of autocratic tyranny."
 SKA_SOLTRUIST_PLAN:0 "The Legion"
 SKA_SOLTRUIST_PLAN_DESC:0 "The Soltruists will seize power from the Ironbloods and usher in an Age of Mohrok."
 SKA_BROTHERHOOD_PLAN:0 "The Brotherhood"
 SKA_BROTHERHOOD_PLAN_DESC:0 "The Brotherhood of Equals will seize power from the Ironbloods and build a Rosite Republic in the image of Rthauiaur."