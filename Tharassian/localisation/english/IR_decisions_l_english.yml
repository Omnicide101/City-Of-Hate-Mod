 DORF_retake_west_skaelinger:0 "Retake West Skaelinger"
 DORF_retake_west_skaelinger_desc:0 "The Ordorians have occupied the Westernmost reaches of the Central Oramfell, but they have grown distracted by foreign wars. We can exploit this to retake this terrain from the Elves.\n\n§RThis may lead to war with Ordoria.§!"
 DORF_invade_waslgar:0 "Liberate Waslgar"
 DORF_invade_waslgar_desc:0 "The Clanhold of Waslgar languishes under the Ordorian yoke, our people forced to flee from these genocidal maniacs. We will reclaim their homes."
 DORF_invade_derganr:0 "Liberate Derganr"
 DORF_invade_derganr_desc:0 "The Clanhold of Derganr languishes under the Ordorian yoke, our people forced to flee from these genocidal maniacs. We will reclaim their homes."
