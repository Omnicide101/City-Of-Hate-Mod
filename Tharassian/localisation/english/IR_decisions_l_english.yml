 rally_princes:0 "Rally the Freiprinzen"
 rally_princes_desc:0 "The Hochprinztum has fallen, but we must not stand disunified. Send out the rallying cry; the Freiprinzen of the Ungerdaler Union must stand together!"
 FPT_rally_princes:0 "Rally the Princes"
 FPT_rally_princes_desc:0 "Divided we will be conquered, but together we shall stand strong. Send an offer of alliance to all the Freiprinztümer!"
 FPT_loyalties:0 "Where Our Loyalties Lie"
 FPT_loyalties_desc:0 "The peace of the Union is ever tenuous. Shadows have begun to whisper rumours of Freiprinz Schwarzenbach seeking to overthrow Hochprinzessin Adalina in a violent coup. We will have to consider our allegiances carefully. \n \n Union Loyalty:                     Stahlhof Loyalty: \n \n £GFX_freiprinz_union_loyalty  [Root.GetFreiprinzUnionLoyalty]                                    £GFX_freiprinz_stahlhof_loyalty  [Root.GetFreiprinzStahlhofLoyalty]\n"
 FPT_support_UNG:0 "Reaffirm Support for the Hochprinzessin"
 FPT_support_UNG_desc:0 "Adalina is the rightful ruler of the Union, and we will vocally remind the other Freiprinzen of this fact."
 FPT_support_UNG_ii:0 "Denounce Schwarzenbach"
 FPT_support_UNG_ii_desc:0 "Freiprinz Schwarzenbach of Stahlhof has been preparing all sorts of diabolical schemes to usurp power in the Union. By distancing ourselves from his despicable ambitions, we can bring ourselves closer to Adalina."
 FPT_support_UNG_iii:0 "Kneel before Adalina"
 FPT_support_UNG_iii_desc:0 "The Hochprinzen are proud, and they seldom make shows of humility. If our Freiprinz publicly travels to Faustburg to bend the knee before Freithron, it will surely bolster Adalina's position."
 FPT_support_STA:0 "Approach Schwarzenbach"
 FPT_support_STA_desc:0 "We could gain much from an alliance with Schwarzenbach. Let us clandestinely approach the Bear of Stalhof and express our support for his cause."
 FPT_support_STA_ii:0 "Question Adalina"
 FPT_support_STA_ii_desc:0 "It seems Adalina has caused quite the scandal in her home city. If we were to leverage this tactfully, we could question her authority without seeming out of line."
 FPT_support_STA_iii:0 "Support Stahlhof"
 FPT_support_STA_iii_desc:0 "The time for walking on political eggshells is over. We support Schwarzenbach, and we shall not make a secret of it."
 FPT_kriegsspiele_countdown:0 "The 887 Kriegsspiele"
 FPT_kriegsspiele_countdown_desc:0 "The Kriegsspiele are a highlight of the decade, with the Union's finest warriors battling for the glory of their Freiprinztum. We have some time left to prepare; let's make good use of it."
 FPT_kriegsspiele_happening:0 "Kriegsspiele Happening"
 FPT_kriegsspiele_happening_desc:0 "The Kriegsspiele are currently going on. May the best Freiprinztum win!"
 FPT_kriegsspiele_preparations:0 "Preparing for the Kriegsspiele"
 FPT_kriegsspiele_preparations_desc:0 "The decennial Kriegsspiele, or 'War Games', are a cherised Ungerdaler tradition. The finest warriors from each Freiprinztum come together to participate in various mock combats, from jousting, to melees, to full-on mock sieges and battles.\n\nOur current £GFX_freiprinz_kriegsspiele_preparedness  §YKriegsspiele Preparedness§! is §Y[Root.GetFreiprinzKriegsspielePreparedness]§!\n\nThe current best-prepared Freiprinztum is [BestPreparedFreiprinztum], with §Y[?global.FPT_best_prepared_for_kriegsspiele.GetFreiprinzKriegsspielePreparedness]§! £GFX_freiprinz_kriegsspiele_preparedness §YKriegsspiele Preparedness§!\n"
 FPT_kriegsspiele_select_men:0 "Select Troops"
 FPT_kriegsspiele_select_men_desc:0 "We must only send the best of the best to the Kriegsspiele if we are to stand a chance. Let us select the cream of the crop from our army, and prepare them for the Kriegsspiele."
 FPT_kriegsspiele_prepare_equipment:0 "Prepare Equipment"
 FPT_kriegsspiele_prepare_equipment_desc:0 "We must provide our troops with the best weapons this side of the Union, while also making sure they match up to the Kriegsspiele's rigorous safety standards. This may take extensive alterations, but will improve our odds of success."
 FPT_kriegsspiele_training_tactics:0 "Develop New Tactics"
 FPT_kriegsspiele_training_tactics_desc:0 "The Kriegsspiele are always host to a variety of innovative tactics, and we cannot afford to lag behind on this front. We must come up with new ways of warfare suited for the Kriegsspiele."
 FPT_kriegsspiele_prioritize_preparations:0 "Prioritize Preparations"
 FPT_kriegsspiele_prioritize_preparations_desc:0 "Running a government is a Sisyphean task, and our attention is always demanded by fifty different goings-on at once. Divert resources towards preparations for the Kriegsspiele - the rest can wait."
 FPT_kriegsspiele_organize_drill:0 "Organize a Drill"
 FPT_kriegsspiele_organize_drill_desc:0 "Drills are one of the best ways to boost unit cohesion and discipline. Practice our contigent for the Kriegsspiele in such a drill, and we are sure to bolster our chances."
 FPT_kriegsspiele_parade:0 "Throw a Parade"
 FPT_kriegsspiele_parade_desc:0 "Parades and their related festivities might be a bit of a diversion from our preparations, but they are sure to bolster our people's faith in our military and strengthen our troops' resolve."
 FPT_kriegsspiele_sabotage_FPT:0 "Sabotage [FROM.owner.GetName]'s Efforts"
 FPT_kriegsspiele_sabotage_FPT_desc:0 "It would appear that [FROM.owner.GetName] is doing exceedingly well in preparing for the Kriegsspiele. Let's see if we can throw a spanner in their works."
 FPT_border_skirmishes:0 "The Prinzkriege"
 FPT_border_skirmishes_desc:0 "Following the Kriegsspiele, inter-Ungerdaler unity has deteriorated to a point where many now fear the outbreak of all-out civil war yet again. We must prepare for this inevitability, and strike at our neighbours before they strike at us!"
 FPT_justify_border_conflict:0 "Justify Conflict with [From.GetName]"
 FPT_justify_border_conflict_desc:0 "Be it an ancient map showing that a border town belongs to us, a document detailing our lineage's claim to [From.GetName]'s lands, or whatever other opportunity presents itself, we must stake a claim to [From.GetAdjective]'s lands!"
 FPT_border_conflict_timeout:0 "Border Conflict Timeout"
 FPT_border_conflict_timeout_desc:0 "If a conflict drags on for too long, we risk drawing the ire of the Hochprinzessin. We must keep our conflicts short and brief, lest we risk being branded renegades."
 FPT_border_conflict_incident_warning_defender:0 "[From.GetName]'s Warmongering!"
 FPT_border_conflict_incident_warning_defender_desc:0 "We have heard word that [From.GetLeader] is scheming to strike at our lands! We must be ready for their attack."
 commissiaries:0 "The Commissiaries"
 commissiaries_desc:0 "The Commissiaries are Lothinnys' plan to create administrative regions in territory we have conquered from the vermin, designed to expediate the supplanting of the lesser species by Elven settlers."
 ORD_autumn_debate_values:0 "The Autumn Debate"
 ORD_autumn_debate_values_desc:0 "Though the formal Autumn Debate has concluded, the many arguments that were had have taken on a life of their own and spread far beyond the halls of Varinthia. Almost every layer of Ordorian society is embroiled in an endless discussion on the virtues of policies put forward by the various factions, and colloquially, the term 'Autumn Debate' has expanded to encompass this never-ending current of discourse.\n\n£GFX_ordorian_trads §GThe League of Ordorian Glory§!\n§gFanatical industrialists, slavers, and Elven supremacists led by the High King's Steward, Isvenith Lothinnys.§!\n\n§YLeague Loyalty:§!  [GetTradLoyalty]\n§YLeague Influence:§!  [GetTradInfluence]\n\n£GFX_ordorian_moderates §0The Royalists§!\n§gAn eclectic group, combining the reactionary nobility put off by Lothinnys' reforms and the idealistic clique of reformers led by Larennis Valinthir, Heir Apparent to the Ordorian throne.§!\n\n§YRoyalist Loyalty:§!  [GetModLoyalty]\n§YRoyalist Influence:§!  [GetModInfluence]\n\n£GFX_ordorian_faithful §YThe Sublime Sophistium of the Itheryn Way§!\n§gThe newly-reformed and centralized organisation of the Itheryn, Ordoria's primary philosophy. Led by Histarine Vernythe, an iron-fisted authoritarian.§!\n\n§YSophist Loyalty:§!  [GetFaithLoyalty]\n§YSophist Influence:§!  [GetFaithInfluence]"
 ORD_mission_impending_royalist_revolt:0 "§RImpending Royalist Revolt!§!"
 ORD_mission_impending_royalist_revolt_desc:0 "Our complete disregard for the Royalists' positions and policies has led the faction to increasingly vocal opposition to our government. If they are not appeased or checked swiftly, we might very well have a full-blown revolt on our hands!"
 ORD_mission_impending_league_revolt:0 "§RImpending Glory League Revolt!§!"
 ORD_mission_impending_league_revolt_desc:0 "Our complete disregard for the Glory League's positions and policies has led the faction to increasingly vocal opposition to our government. If they are not appeased or checked swiftly, we might very well have a full-blown revolt on our hands!"
 ORD_mission_impending_sophist_revolt:0 "§RImpending Sophist Revolt!§!"
 ORD_mission_impending_sophist_revolt_desc:0 "Our complete disregard for the Sophistium's positions and policies has led the faction to increasingly vocal opposition to our government. If they are not appeased or checked swiftly, we might very well have a full-blown revolt on our hands!"
 ORD_league_call_vengeance_vermin:0 "§G Call for Vengeance against the Vermin§!"
 ORD_league_call_vengeance_vermin_desc:0 "It seems certain elements of our society have forgotten what harms the Humans and Dwarves have inflicted upon is. It would be wise to remind them."
 ORD_league_strengthen_paramilitaries:0 "§GStrengthen the Paramilitaries§!"
 ORD_league_strengthen_paramilitaries_desc:0 "Our people must always be ready to fend off threats from the inside and out. It would be good if those loyal to us were more prepared than others - especially that paranoid lot in the Sophistium."
 ORD_league_legal_powers_to_league:0 "§GConfer Legal Powers on the League"
 ORD_league_legal_powers_to_league_desc:0 "The Glory League has grown to become as important an institution of Ordorian society as the army or the Itheryn - one might even go so far as to say it rivals the monarchy in its importance. It is high time we adjust the law to reflect this fact."
 ORD_royalists_larennis_public_appearance:0 "§0Make a Public Appearance§!"
 ORD_royalists_larennis_public_appearance_desc:0 "The Princeling has expressed his desire to connect with the populace in formal capacity; a public appearance by the royal family could easily facilitate this."
 ORD_royalists_facilitate_commerce:0 "§0Facilitate Commerce§!"
 ORD_royalists_facilitate_commerce_desc:0 "Commerce is the lifeblood of civilisation, and ours is no different. If we are to heal our nation from the wounds inflicted on it by the Steward, it is imperative we restore the flow of goods and money - across the border, if need be."
 ORD_royalists_strengthen_judicial_independence:0 "§0 Strengthen Judicial Independence"
 ORD_royalists_strengthen_judicial_independence_desc:0 "The League and the Sophistium have both started to enforce their own unwritten laws on our citizens. This cannot stand. The official legal system must be further formalized and empowered to curtail these extrajudicial activities."
 ORD_sophists_scrutinize_wayward:0 "§YScrutinize the Wayward§!"
 ORD_sophists_scrutinize_wayward:0 "Some among our people contradict the teachings of the Itheryn. These errant souls are to be brought back into the fold - through fear, if that is what is necessary."
 ORD_looming_steel_crisis:0 "Looming Steel Crisis"
 ORD_looming_steel_crisis_desc:0 "Ordoria has historically had little direct access to iron ore, as monopolized by the vile Dwarves of Vergallheim as the mountains were. With the collapse of their degenerate empire, Ordoria has managed to secure the Khorinor Mountains and the Southmountains, finally providing the Elves with the steel they desperately needed. However, with the Rthaur Revolution, the Khorinor has been lost once again, leaving only the Southmountains of Serthis and Venaur in Ordorian hands. Not only that, the easiest route for shipping the iron to Istaroth's forges, the River Ryselin, has been partially taken over by the rebels. This has left Ordoria's forges only barely supplied enough to continue the creation of arms and armour for its mighty hosts.\n\n§RShould the logistical problems with the Southmountains not be resolved before the army is expanded much more, or should the Southmountains be lost, Istaroth's forges will fall still, and devastating shortages will plague Ordoria's armed forces.§!\n\n§gCurrent amount of divisions compared to the maximum we can support:§! [GetDivisionRatio]\n\nWe currently [GetSouthmountainsStatus]"
 ORD_skirmishes_rebels:0 "Skirmishes with the Rebels"
 ORD_skirmishes_rebels_desc:0 "The accursed rebels yet hold our Eastern lands. They must be pushed back."
 ORD_secure_ryselin_decision:0 "Secure the River Ryselin"
 ORD_secure_ryselin_decision_desc:0 "The Ryselin must be secured if our supply lines to the Southmountains are to be re-established. Push the rebels back!"
 ORD_retribution_anthygynaur:0 "Retribution"
 ORD_retribution_anthygynaur_desc:0 "The vermin of Anthygynaur are responsible for much Ordorian grief. We shall repay them in kind."
 ORD_terrorize_stauhyte:0 "Exact Vengeance on Stauhyte"
 ORD_terrorize_hysbryn:0 "Exact Vengeance on Hysbryn"
 ORD_terrorize_norothe:0 "Exact Vengeance on Norothe"
 ORD_terrorize_nocthorin:0 "Exact Vengeance on Nocthorin"
 ORD_terrorize_ofynhaur:0 "Exact Vengeance on Ofynhaur"
 ORD_terrorize_marysione:0 "Exact Vengeance on Marysione"
 ORD_terrorize_wystine:0 "Exact Vengeance on Wystine"
 ORD_terrorize_lilyasorynthe:0 "Exact Vengeance on Lilyasorynthe"
 ORD_terrorize_anthysione:0 "Exact Vengeance on Anthysione"
 ORD_terrorize_spauhyte:0 "Exact Vengeance on Spauhyte"
 ORD_terrorize_thyssorthor:0 "Exact Vengeance on Thyssorthor"
 ORD_terrorize_vystlissyn:0 "Exact Vengeance on Vystlissyn"
 ORD_terrorize_yghalissa:0 "Exact Vengeance on Ygalissa"
 ORD_second_front:0 "Breaking Their Will"
 ORD_second_front_desc:0 "We must spread the vermin thin. Seizing their precious religious capital and economic heartland would be sure to draw troops away from our main frontline and weaken their resolve."
 ORD_open_second_front:0 "Invade Vystlissyn"
 ORD_open_second_front_desc:0 "Seizing the vermin's holy site would be sure to demoralize them, as well as overextend their forces. Command the navy to set sail at once!"
 ORD_open_second_front_mission:0 "Invading Vystlissyn"
 ORD_open_second_front_mission_desc:0 "Our attempts to establish a second front are ongoing, but the generals grumble. Should we be unable to secure a foothold, we will be forced to withdraw."
 ORD_seize_fritzhafen:0 "Seize Marysione"
 ORD_seize_fritzhafen_desc:0 "Capturing the richest city of the Southern vermin would devastate their pathetic economy, and sap their resistance of vital resources. We march East!"
 ORD_seize_fritzhafen_mission:0 "Seizing Marysione"
 ORD_seize_fritzhafen_mission_desc:0 "Our attempts to conquer Marysione are ongoing, but the generals grumble. Should we be unable to secure the city, we will be forced to withdraw."
 ORD_establish_settler_governments:0 "Establish the Central Commissiary Bureau"
 ORD_establish_settler_governments_desc:0 "Lotihnnys' idea of Commissiaries in conquered territory has found great support during the Autumn Debate. We must set up an organization to commence planning the logistics for future Commissiary operations."
 ORD_skylynaur_commissiary:0 "Establish the Skylynaur Commissiary"
 ORD_skylynaur_commissiary_desc:0 "We have conquered the pitiful remains of the Dwarves in the mountains to our East. Supplanting them would be easy, given their already pathetically low numbers, and would give us access to a great amount of resources!"
 ORD_stauhyte_commissiary:0 "Establish the Stauhyte Commissiary"
 ORD_stauhyte_commissiary_desc:0 "With the fall of the Northern parts of the Ungerdaler Union have come new expansion opportunities.  We shall situate the headquarters of this new Commissiary in Stauhyte, to keep the lines of communication short."
 ORD_nocthorin_commissiary:0 "Establish the Nocthorin Commissiary"
 ORD_nocthorin_commissiary_desc:0 "Though the vermin of the Southern Ungerdaler Princedoms fought tenaciously, we have finally quashed their resistance. Soon enough, Elves shall replace the filthy Humans in their precious cities."
 ORD_wystine_commissiary:0 "Establish the Wystine Commissiary"
 ORD_wystine_commissiary_desc:0 "We have stormed the capital of the worthless Ungerdaler Union, but we shall not grant it the honour of hosting the Western Ungerdaler Commissiary. Instead, the capital shall be in Wystine - its relatively low population means that we should have a glorious Elven city free of Mans' filth in no time!"
 ORD_nasthyrin_commissiary:0 "Establish the Nasthyrin Commissiary"
 ORD_nasthyrin_commissiary_desc:0 "With the conquest of those parts of the Southern Plains closest to us, we must start planning the replacing of the local vermin with true-blooded Elven perfection. Nasthyrin's location amidst fertile lands should aid in quick population growth."
 ORD_irythyn_commissiary:0 "Establish the Irythyn Commissiary"
 ORD_irythyn_commissiary_desc:0 "The heartlands of the old Realm have fallen into our hands! We shall begin colonization efforts immediately - soon, the vermin shall long for the times they toiled under Arthenon."
 ORD_triferyn_commissiary:0 "Establish the Triferyn Commissiary"
 ORD_triferyn_commissiary_desc:0 "The northermost regions of the Northern Plains have at long last come into our possession. Some may complain about the cold in those areas, but if our Lirothline kin can survive in the snow, an Ordorian can do it better."
 ORD_pyrkhiv_commissiary:0 "Establish the Pyrkhiv Commissiary"
 ORD_pyrkhiv_commissiary_desc:0 "Though the lands of the Pyrkhiv vermin are even more of a primitive backwater than those of Anthygynaur, some of our more adventerous spirits have shown a willingness to settle here. Additionally, high command is muttering something about creating somewhat of a penal colony down there. We should consider this."
 ORD_slave_economy:0 "Slave Revolts"
 ORD_slave_economy_desc:0 "The vermin are revolting against their natural superiors. This behaviour cannot be tolerated."
 ORD_crush_slave_revolt:0 "Crush the Revolt"
 ORD_crush_slave_revolt_desc:0 "Local law enforcement has proven that they cannot deal with some measly vermin. We must send in some of our troops to quell the problem."
 ORD_pacify_slave_revolt:0 "Hunt Down Rebel Slaves"
 ORD_pacify_slave_revolt_desc:0 "Now that we have enough troops in the area, it is time to find the rebel vermin, drag them out of their holes and beat them to death in front of their fellow slaves. We must send the vermin a message they won't soon forget."
 ORD_slave_revolt_favours:0 "End the Revolt"
 ORD_slave_revolt_favours_desc:0 "We cannot spare any troops to deal with the revolt right now. By leveraging political capital, making some concessions and calling in favours from the local nobility, we could persuade them to do our work for us... for a price."
 ORD_race_riots:0 "Traditionalist Riots!"
 ORD_race_riots_desc:0 "Traditionalists in our capital are rioting, assaulting demi-Elves and vandalizing demi-Elven neighbourhoods!"
 ORD_crush_race_riots:0 "Subdue the Rioters"
 ORD_crush_race_riots_desc:0 "Though many people in our nation, including members of our government, seem convinced that the demi-Elves somehow started this entire mess, the truth is that property damage from vandalism is rising to unacceptable levels. We must step in and end the violence."
 ORD_suppress_race_riot:0 "Suppress the Riot"
 ORD_suppress_race_riot_desc:0 "With our troops in place, taking over from local law enforcement that is either incapable of stopping the violence our outright joining in with the rioters, we can finally begin to protect citizens and propert from further violence."
 ORD_race_riot_favours:0 "End the Riots"
 ORD_race_riot_favours_desc:0 "We cannot spare any troops to deal with the riots right now. By leveraging political capital, making some concessions and calling in favours from local supporters, we could persuade them to do our work for us... for a price."
 ORD_noble_riots:0 "Nobles Revolt!"
 ORD_noble_riots_desc:0 "The nobility in Ythelmare is revolting against our austerity programme. They must be put down if our plans are to proceed!"
 ORD_crush_noble_riots:0 "Stop the Revolt"
 ORD_crush_noble_riots_desc:0 "Though there is no danger of a succesful coup, the revolting nobles are still in control of large parts of Ythelmare. We must send in the troops to flush them out."
 ORD_suppress_noble_riot:0 "Bring the Rebels to Justice"
 ORD_suppress_noble_riot_desc:0 "Our army is currently fighting skirmishes for control of Ythelmare and arresting the rebellious nobles. We will need to give them some time to finish this task."
 ORD_noble_riot_favours:0 "Bribe the Nobility"
 ORD_noble_riot_favours_desc:0 "The nobles are revolting because they want their precious luxuries. If we give them some leeway in this regard, we could bring them back into the fold."
 ORD_princelings_idealism:0 "The Princeling's Idealism"
 ORD_princelings_idealism_desc:0 "Larennis Valinthir is a dreamer and idealist to the core - a rare breed amongst the Ordorians. However, dreams are often sacrificed on the altar of pragmatic governance, and only time will tell if the Princeling can §Gstay the course§!, or fall into §gbitter disillusionment.§!\n\nLarennis is §Ycurrently:§! [GetLarennisIdealism] ([?larennis_idealism|Y0])"
 ORD_searching_inskyllithe:0 "Searching for Inskyllithe"
 ORD_searching_inskyllithe_desc:0 "High King Inskyllithe, the greatest Elf that ever lived, who single-handedly brought about the Second Ordorian Empire, has had his remains stolen away by the vile Vergall Dwarves. Now that we control their precious mountainhomes, we can begin the arduous task of finding his body, that it may be put to rest in his homeland."
 ORD_search_state:0 "Searching the Mountains"
 ORD_search_state_desc:0 "We will begin searching the old Skaelinger lands for the remains of our High King."
 EOR_pacify_land:0 "Pacify the Realm"
 EOR_pacify_land_desc:0 "The rebels have been crushed, but our government remains deeply unpopular, and cells of rabble-rousers remain hidden throughout the land. We will have to either root them out, or win the support of the people."
 EOR_pacify_lands_ithinis:0 "Crush the Rebels in [FROM.GetName]"
 EOR_pacify_lands_ithinis_desc:0 "We will exterminate any remaining resistance to our rule in [FROM.GetName]."
 EOR_pacify_lands_larennis:0 "Win over the People in [FROM.GetName]"
 EOR_pacify_lands_larennis_desc:0 "We will garner popular support in [FROM.GetName] and thus end the opposition to our rule there."
 STA_launch_civilwar:0 "Cast the Die"
 STA_launch_civilwar_desc:0 "Vlussinger has never been weaker, while Stahlhof stands mighty. It is time to end this charade."
 STA_request_war_resources_category:0 "Request War Resources"
 STA_union_coup_category:0 "Stahlplan Faustburg"
 STA_union_coup_category_desc:0 "The union of Free Ungerdaler Princes is endangered by incompetent leadership and lacks stability. With careful preperations we will arrange a military allegiance that will make sure that Ferdinand Schwarzenbach will be placed in power of the Union."
 STA_request_equipment_decision:0 "Request Union Equipment"
 STA_convince_freiprinzen:0 "Strengthening our Cause"
 STA_convince_freiprinzen_desc:0 "If we are to topple the Union and restore the great Empire of Sigismund, we will need support from the Freiprinztümer. They will be made to fall in line, in time.\n\n[HLZ.GetFlag] §Y[HLZ.GetName]§! is currently [HLZ.GetLoyaltyApproximationStahlhof]\n\n[NOC.GetFlag] §Y[NOC.GetName]§! is currently [NOC.GetLoyaltyApproximationStahlhof]\n\n[SPW.GetFlag] §Y[SPW.GetName]§! is currently [SPW.GetLoyaltyApproximationStahlhof]\n\n[SVT.GetFlag] §Y[SVT.GetName]§! is currently [SVT.GetLoyaltyApproximationStahlhof]\n\n[NRK.GetFlag] §Y[NRK.GetName]§! is currently [NRK.GetLoyaltyApproximationStahlhof]\n\n[TEI.GetFlag] §Y[TEI.GetName]§! is currently [TEI.GetLoyaltyApproximationStahlhof]\n\n[SNF.GetFlag] §Y[SNF.GetName]§! is currently [SNF.GetLoyaltyApproximationStahlhof]\n\n[ARK.GetFlag] §Y[ARK.GetName]§! is currently [ARK.GetLoyaltyApproximationStahlhof]\n\n[FTH.GetFlag] §Y[FTH.GetName]§! is currently [FTH.GetLoyaltyApproximationStahlhof]\n\n[WIS.GetFlag] §Y[WIS.GetName]§! is currently [WIS.GetLoyaltyApproximationStahlhof]\n\n[WSZ.GetFlag] §Y[WSZ.GetName]§! is currently [WSZ.GetLoyaltyApproximationStahlhof]\n\n"
 STA_convince_FPT:0 "Approach [FROM.owner.GetName]"
 STA_convince_FPT_desc:0 "We shall approach the Freiprinztum of [FROM.owner.GetName] and, with promises of wealth and land, sway them to our cause."
 STA_convince_FPT_ii:0 "Coerce [FROM.owner.GetName]"
 STA_convince_FPT_ii_desc:0 "A bit of blackmail here, a bit of extortion there, and the leadership of [FROM.owner.GetName] is sure to see the righteousness of our cause."
 STA_convince_FPT_iii:0 "'Support' [FROM.owner.GetName]"
 STA_convince_FPT_iii_desc:0 "It seems the Freiprinztum of [FROM.owner.GetName] is dealing with a bandit problem as of late. We shall send them a token force to help them eradicate this threat, and defend their most strategic locations against bandit attacks. Any allegations that these bandits are somehow in our employ and this is a trick to occupy their lands with our army are baseless speculation, of course."
 STA_politics_steel_court:0 "Politics at the Steel Court"
 STA_politics_steel_court_desc:0 "Many factions vie for the Freiprinz's ear, hoping to curry favour with Ferdinand. By playing them out against each other, we can entrench the position of the Freiprinz as uncontested ruler while also securing the benefits of their support."
 STA_promote_free_trade:0 "Promote Free Trade"
 STA_promote_free_trade_desc:0 "The Caravaneers have long been clamouring for an end to our protectionistic policies, seeking to trade our goods all throughout the Union and beyond. By allowing this - certain vital military industries being exempt, of course - we are sure to sway them to our side."
 STA_anti_ordorian_propaganda:0 "Anti-Ordorian Propaganda"
 STA_anti_ordorian_propaganda_desc:0 "The Anti-Ordorian Front already hates the Elves with a passion, but helping to spread their message couldn't hurt. It'd simultaneously prepare our people for a conflict with the Ordorians and boost Freiprinz Schwarzenbach's image in the eyes of the A.O.F."
 STA_do_penance:0 "Do Penance"
 STA_do_penance_desc:0 "By publicly confessing to a number of sins and agreeing to do penance for them, the Church will be sure to look more fondly upon the Freiprinz. We'll just make sure none of the more... pragmatic sins come out. Admitting to murders would so dreadfully tarnish our Freiprinz' reputation, after all."
 STA_host_hornbergers:0 "Host the Hornbergers"
 STA_host_hornbergers_desc:0 "The rivalry between the Hornbergers and the Schwarzenbachs is ancient, and even the Freiprinz' formal efforts cannot undo the bad blood that exists in such a short timespan. By inviting the Hornbergers for a feast, they may come to appreciate Ferdinand and his kin more than any speeches and agreements ever could."
 STA_assert_schwarzenbach:0 "Assert Schwarzenbach's Authority"
 STA_assert_schwarzenbach_desc:0 "It seems our erstwhile subjects have forgotten who their master is. Just because Freiprinz Schwarzenbach sees fit to grant them certain liberties as a reward for loyalty does not mean they are free to step out of line. They are to be thoroughly reminded of this fact."
 STA_a_convincing_act_category:0 "A Convincing Act"
 STA_a_convincing_act_category_desc:0 "If we want to request arms from Adalina, she will have to buy our excuse of being at war with the Ordorians. The fact that we are currently not therefore presents a problem. This can be solved through the simple application of military force against those Elven bastards. Let's flare those border conflicts back up again."
 STA_a_convincing_act_decision:0 "Stahlplan Heißjein"
 STA_a_convincing_act_decision_desc:0 "By securing the territory of Heißjein, we not only gain access to the sea, but also prevent Holzbrenn from seizing this territory instead."
 STA_retake_nordland_decision:0 "Retake Nordland"
 STA_retake_nordland_decision_desc:0 "We have been forced to relinquish our territories in Nordland to the Elves. This will have to be rectified."
 STA_retake_westfront_decision:0 "Retake Westfront"
 STA_retake_westfront_decision_desc:0 "We have been forced to relinquish our territories in Westfront to the Elves. This will have to be rectified."
 STA_retake_grunstein_decision:0 "Retake Grunstein"
 STA_retake_grunstein_decision_desc:0 "We have been forced to relinquish our territories in Grunstein to the Elves. This will have to be rectified."
 STA_retake_neuwald_decision:0 "Retake Neuwald"
 STA_retake_neuwald_decision_desc:0 "We have been forced to relinquish our territories in Neuwald to the Elves. This will have to be rectified."
 STA_stahlplan_zhertis_decision:0 "Stahlplan Zhertis"
 STA_stahlplan_zhertis_decision_desc:0 "Within Zhertis lies little land of economic value, but it does boast a part of the Oramfell mountain range. Securing these peaks would provide us with a tremendous strategic advantage in the case of an Ordorian counter-attack."
 STA_stahlplan_venohr_decision:0 "Stahlplan Venöhr"
 STA_stahlplan_venohr_decision_desc:0 "Venöhr is a splendid defensive territory, lying well within the Oramfell. It would give us a formidable redoubt on our Eastern flank, and potential leverage over the Skaelinger rump state should we require it."
 STA_stahlplan_karis_decision:0 "Stahlplan Karis"
 STA_stahlplan_karis_decision_desc:0 "Karis is a highly strategic territory, positioned close to Quellion. Seizing it would poise us to strike directly at the Ordorian heartlands, if need be."
 STA_stahlplan_anzitt_decision:0 "Stahlplan Anzitt"
 STA_stahlplan_anzitt_decision_desc:0 "Anzitt is a long stretch of long-contested land between us and the Ordorians. Finally seizing this territory would allow us to claim a significant symbolic victory in our northward expansion."
 STA_stahlplan_fratin_decision:0 "Stahlplan Fratin - from Zhertis"
 STA_stahlplan_fratin_decision_desc:0 "Following our previous expansions, the province of Fratin has become very vulnerable to our advances. We hadn't originally planned to seize it, but why look a gift Elf skull in the mouth?"
 STA_stahlplan_fratin_decision2:0 "Stahlplan Fratin - from Anzitt"
 STA_stahlplan_fratin_decision2_desc:0 "Following our previous expansions, the province of Fratin has become very vulnerable to our advances. We hadn't originally planned to seize it, but why look a gift Elf skull in the mouth?"
 STA_trial_by_fire_category:0 "Trial by Fire"
 STA_trial_by_fire_category_desc:0 "We have perfected our Nebeltöter squads as much as we can without field testing. Let's agitate the Arkanisturm; that ought to give us all the practical experience we need."
 STA_trial_by_fire_decision:0 "Send in the Nebeltöter"
 STA_trial_by_fire_decision_desc:0 "Instruct our men to seize the town of Nordtorf from the wizards of the Arkanisturm."
 plunder_schneefilde:0 "Raid Schneefilde"
 plunder_schneefilde_desc:0 "Our lands are poor, but the Northmen are wealthy beyond belief. If we muster enough warriors, we can crack open their capital's defenses and take their riches for ourselves! \n §RIf we do not lead this raid ourselves soon, another warlord may take the glory for themselves!§!"
 PRK_plunder_schneefilde:0 "Sack Schneefilde"
 PRK_plunder_schneefilde_desc:0 "We have amassed an army larger than even the Elders can remember. Surely, we shall be able to defeat the Northmen's armies, sail upriver and plunder their city!"
 perkav_piracy:0 "Perkav Piracy"
 perkav_piracy_desc:0 "Our people do not till the land or raise animals like our Northern neighbours. We take what we want by force, gaining glory and gold from raiding the coasts and plundering the ships of those weaker than us!"
 PRK_perkav_piracy:0 "Launch a Raid"
 PRK_perkav_piracy_desc:0 "It is time to hoist the Jolly Roger and set sail for plunder once again. Krostov favours the bold!"
 BER_terugkeer:0 "The Terugkeer"
 BER_terugkeer_desc:0 "Though most of our country has given up on the dream of returning to our ancient homeland, various reactionary elements, most notably Alexander Goudhand's 'Verlossersverbond' or 'Salvation League', still argue in favour of returning home in 'De Terugkeer', 'The Return'. However, without foreign support, this will likely remain a pipe dream."
 BER_initiate_terugkeer:0 "Initiate the Terugkeer"
 BER_initiate_terugkeer_desc:0 "We have found allies abroad willing to help us take the fight to the Kurgur! Whenever we are ready, we can launch our war against the hated Orcs and reclaim our ancient halls."
 DORF_seventh_campaign:0 "The Seventh Campaign"
 DORF_seventh_campaign_desc:0 "Six times before, the Dwarves have tried to retake the mighty city of Zarathum. Six times before, sooner or later, we failed. The Seventh Campaign shall be the last."
 SKA_seventh_campaign:0 "Initiate the Seventh Campaign"
 SKA_seventh_campaign_desc:0 "We have found allies abroad willing to help us take the fight to the Kurgur! Whenever we are ready, we can launch our war against the hated Orcs and reclaim our ancient halls."
 SKA_hire_soltruists:0 "Arm the Sun-Beneath-the-Stone"
 SKA_hire_soltruists_desc:0 "The Soltruists have fashioned themselves into a fearsome paramilitary Legion - they would be a great boon to our forces."
 SKA_hire_equalists:0 "Arm the Brotherhood of Equals"
 SKA_hire_equalists_desc:0 "The Equalists have been a volatile force, with their talk of revolution, but perhaps these rabble-rousers could be of use - if given the right directions."
 SKA_hire_iron_bloods:0 "Arm the Ironbloods"
 SKA_hire_iron_bloods_desc:0 "The Most Sacred Order of the Iron-Blooded Knights are secretive, and little is known about them or their goals. However, some of our advisors promise that they could do great things for our nation on the battlefield, if given a free hand."
 DORF_restore_zarathum:0 "Restore the City of Zarathum"
 DORF_restore_zarathum_desc:0 "Zarathum, once the jewel of the mighty empire of Vergallheim, has long since fallen into ruin, thanks to the depredations of the Kurgur. With it in Dwarven hands once again, we can begin the long and arduous process of rebuilding this jewel of the Oramfell Mountains!"
 DORF_reform_vergallheim:0 "Reform Vergallheim"
 DORF_reform_vergallheim_desc:0 "After years of gruelling conquest, we have finally retaken the most important cities and disputed territories of the Vergall empire of old. With them under conrol, we may finally restore the empire to its former glory!"
 DORF_border_skirmishes:0 "Skirmishes in the Mountainhomes"
 DORF_border_skirmishes_desc:0 "While we do not possess the resources to muster a full campaign to retake our lost homelands, we can send out smaller groups to retake a mountain pass here, an ancient mine there. Slow but steady wins the race."
 DORF_invade_asolfsskali:0 "Retake Asolfsskali"
 DORF_invade_asolfsskali_desc:0 "We have reached the Mountainhomes of Asolfsskali. It's time to return them to proper Dwarven hands."
 DORF_invade_skandar:0 "Retake Skandár"
 DORF_invade_skandar_desc:0 "We have reached the Mountainhomes of Skandár. It's time to return them to proper Dwarven hands."
 DORF_invade_thurgard:0 "Retake Thurgard"
 DORF_invade_thurgard_desc:0 "We have reached the Mountainhomes of Thurgard. It's time to return them to proper Dwarven hands."
 DORF_invade_skaptaholt:0 "Retake Skaptaholt"
 DORF_invade_skaptaholt_desc:0 "We have reached the Mountainhomes of Skaptaholt. It's time to return them to proper Dwarven hands."
 DORF_invade_frostcart_pass:0 "Retake Frostcart Pass"
 DORF_invade_frostcart_pass_desc:0 "We have reached the crucial mountain passage of Frostcart Pass. It's time to return them to proper Dwarven hands."
 DORF_invade_puruzkaduz:0 "Return to Zarathum"
 DORF_invade_puruzkaduz_desc:0 "Victory after victory has led us to the point where Old Zarathum, the legendary Vergall capital, lies at our doorstep. It's time to return to our ancient halls."
 DORF_invade_ugrivonuz:0 "Retake Lagraskr"
 DORF_invade_ugrivonuz_desc:0 "We have reached the Mountainhomes of Lagraskr. It's time to return them to proper Dwarven hands."
