l_english:
 GENERIC_join_wars:0 "A War-Torn World"
 GENERIC_join_wars_desc:0 "Tharassian is a world rife with conflict, and our lands are no exception to this. A state is fighting on our behalf, waiting for us to join them."
 GENERIC_institutions_governance:0 "The Institutions of Governance"
 GENERIC_institutions_governance_desc:0 "Government is not a static fact of life; it is a living, breathing thing that must be actively be maintained and watched over. We must take care of our government, or watch it rot away."
 GENERIC_codify_privileges:0 "Codify Privileges"
 GENERIC_codify_privileges_desc:0 "Our legal system is a mess of oral promises, long-standing traditions and other patchwork agreements. By centralizing and writing down the various privileges held by cities, townships, and fiefs, it will be easier to make the right legal decisions when necessary."
 GENERIC_entrench_feudalism:0 "Entrench Feudalism"
 GENERIC_entrench_feudalism_desc:0 "Everywhere in the delicate web of feudal politics, various actors are trying to pull more power towards them. Religious figures seek powers temporal as well as spiritual, burgomasters of rich cities buy away aristocratic power, and the lowly workers mutter revolution. These ideals must be stamped out, and the righteousness of our cause established forcefully."
 GENERIC_divine_right:0 "Assert the Divine Right"
 GENERIC_divine_right_desc:0 "Our right to rule is not seized by brute force, nor is it derived from the whimsy of the frenzied masses. We derive our right to rule from the Gods themselves, and by this right we must stamp out those who defy us - for they defy the will of the Gods, too."
 GENERIC_constitutional_codifications:0 "Constitutional Codifications"
 GENERIC_constitutional_codifications_desc:0 "Our liege is no tyrant, nor an arbitrary governor. Their powers are limited by our constitutional legislation, reassuring our people that they will not be subject to the whims of an autocrat. Further clarification of the legal rights and duties of our ruler would serve us well."
 GENERIC_strengthen_institutions:0 "Strengthen our Institutions"
 GENERIC_strengthen_institutions_desc:0 "Our government runs on law and procedure, not the random will of some lordling. Strengthening those procedures and laws further will show our people they can put their trust in our government."
 GENERIC_reinforce_ideals:0 "Reinforce Republican Ideals"
 GENERIC_reinforce_ideals_desc:0 "Laws are one key part of our government, faith in the system is another. If our people's belief in the Republic falters, populism and tyranny are sure to set in. We must remind our people of the sacrifices we made to get the liberties we have, that they remain vigilant against the promises of the autocrat and the tyrant."
 GENERIC_convene_families:0 "Convene the Families"
 GENERIC_convene_families_desc:0 "Bickering and discord have set in in our government, hindering our ability to rule. The heads of the most important political dynasties in our countries must meet to decide on the course the ship of state must sail."
 GENERIC_facilitate_commerce:0 "Facilitate Commerce"
 GENERIC_facilitate_commerce_desc:0 "Economic liberty and political freedom go hand in hand. If our government cannot allow our merchants to ply their trade and bring prosperity to our cities, it is worthless. We must work to cut down on tariffs and other outdated barriers to our trade - at least domestically."
 GENERIC_lift_up_commonfolk:0 "Lift up the Commonfolk"
 GENERIC_lift_up_commonfolk_desc:0 "Our government is of all, by all, for all. We must therefore do our utmost to bring every person living under our guidance up to newfound heights of prosperity and happiness."
 GENERIC_spread_word:0 "Spread the Word"
 GENERIC_spread_word_desc:0 "The good message of our Gods has nestled itself in the halls of power, but outside it may yet fall on deaf ears. We must send our mendicant preachers to every city, every county, to any tavern or halfway house they can get themselves to."
 GENERIC_stamp_out_unorthodoxy:0 "Stamp Out Unorthodoxy"
 GENERIC_stamp_out_unorthodoxy_desc:0 "The heretic, the pagan and the heathen remain among us, spreading their lies to the faithful and drawing them away from the light. We will have to rectify their existence. Kill 'em all, and let the Gods sort them out."
 GENERIC_expel_inferior:0 "Expel the Inferior"
 GENERIC_expel_inferior_desc:0 "The lesser races live among us, eating our food, breathing our air, and polluting our national spirit. They will have to be driven from their homes - across the border or into the ground, it matters not."
 GENERIC_celebrate_purity:0 "Celebrate the Pure"
 GENERIC_celebrate_purity_desc:0 "Our people grow weary of our constant campaigns against the lesser races. Let us put a positive spin on our actions, and celebrate the pure among us."
 GENERIC_prisoner_management:0 "The Fate of those in Chains"
 GENERIC_prisoner_management_desc:0 "Through dissent, capture in battle, or simple crime, it is inevitable that some unfortunate souls will find themselves in our prison. We can leave them to rot should we so desire, but alternative options exist."
 GENERIC_execute_prisoner:0 "Execute Prisoner"
 GENERIC_execute_prisoner_desc:0 "Sometimes, the simplest solution is the best one. Ready the headsman."
 GENERIC_ransom_prisoner:0 "Ransom Prisoner"
 GENERIC_ransom_prisoner_desc:0 "Those notable enough to be captives of the state tend to have significant wealth, or the influence to acquire it. We can offer them freedom, for a price."
 GENERIC_turn_prisoner:0 "Turn Prisoner"
 GENERIC_turn_prisoner_desc:0 "Some of those in our cells may be convinced to join our cause in exchange for their freedom. Let's have a talk."
 GENERIC_release_prisoner:0 "Release Prisoner"
 GENERIC_release_prisoner_desc:0 "Sometimes, goodwill is as important a currency as coin or captives. Set one of our prisoners free; their homeland will surely appreciate the gesture."
 GENERIC_exchange_prisoner:0 "Propose Prisoner Exchange"
 GENERIC_exchange_prisoner_desc:0 "One of our enemies holds one of our own in chains, while we have one of theirs captive. Perhaps we could offer a prisoner exchange - their citizen freed, in exchange for ours."
 DORF_join_union_war_against_opponent:0 "The Oramfell Reunification War"
 DORF_join_union_war_against_opponent_desc:0 "After the failure of the Nordtorf Summit, the Ungerdaler Union has declared war on our opponent. We should join them."
 hire_mercenaries:0 "Hire Mercenaries"
 hire_mercenaries_desc:0 "The world is a war-torn place, and there are many warriors of fortune out there willing to sell their blades for the right price. If we need specialized troops or are low on manpower, we should consider hiring mercenaries. They will initially supply their own men and equipment, but we will be expected to replace casualties and broken equipment."
 MERCS_perkav_raiders:0 "Hire Perkav Raiders"
 MERCS_perkav_raiders_desc:0 "The warriors of Perkavland are fearsome, if unpredictable. They are experts at aquatic warfare and ferocious in battle - just keep them away from civilized folk."
 MERCS_drakeskins:0 "Hire the Drakeskins"
 MERCS_drakeskins_desc:0 "The Drakeskins, also known as the 'Iron Line,' are hardened veterans of the wars with Stauhyte, their halberds cutting through even the thickest armour with ease. They tend to stay near our Southern borders, but with sufficient need they may be convinced to redeploy elsewhere."
 MERCS_irinthian_legion:0 "Hire the Irinthian Legion"
 MERCS_irinthian_legion_desc:0 "The Irinthian Legions, once the standing army of Onesiphorus' Empire, have long since turned to mercenary work to secure the pay Tion can no longer provide. They are some of the most disciplined warriors-for-hire available."
 MERCS_green_bastards:0 "Hire the Green Bastards"
 MERCS_green_bastards_desc:0 "Scouts and outriders beyond compare, the Green Bastards are a company of Perkafell warriors from Fritzhafen. Though they no longer rule the lands of the Merchant Republic like their Perkav ancestors did, their homelands in the harsh rural inlands of Fritzhafen provide sublime training in foraging and skirmish tactics."
 MERCS_red_talons:0 "Hire the Red Talons"
 MERCS_red_talons_desc:0 "A band of veteran Teigerholen shock troops, each member of this heavy infantry regiment wears red gauntlets. Though they do not ride the fearsome tigers of their homeland into battle, their experience makes them both excellent frontline infantry and talented - if intimidating - drill sargeants."
 MERCS_twin_axes:0 "Hire the Twin Axes"
 MERCS_twin_axes_desc:0 "The Twin Axes are Dwarves of mostly Rimatan origin; their Fireforge axes cut through even plate like butter."
 MERCS_tlarthingian_paladins:0 "Hire the Order of the Broodmother"
 MERCS_tlarthingian_paladins_desc:0 "Though primarily concerned with the protection of pilgrims, the Tlarthingian Paladins can be convinced to join our cause for the sake of defending the innocent - and a hefty donation to the Order, of course."
 MERCS_the_hand:0 "Hire the Hand"
 MERCS_the_hand_desc:0 "Nochwald is a nation almost entirely consisting of a coastline. This results in a land of shipping and commerce, and with trade comes piracy. The Hand is a band of battle-hardened mariniers that has put down many a buccaneer."
 MERCS_gowie_mercenaries:0 "Hire Gowie Mercenaries"
 MERCS_gowie_mercenaries_desc:0 "Though the Halflings of Gowie prefer to trade in weapons rather than wield them, there's plenty that seek their fortune as a sword-for-hire. "
 UNG_requisition_coast_tithe:0 "Requisitioning the Coastal Tithe"
 UNG_requisition_coast_tithe_desc:0 "The Hochprinztum does not always have a navy of its own, as the Freithron may belong to a landlocked nation, but the Union still often has business overseas. As such, we may requisition the Coastal Tithe, to insure we can move our troops wherever they must go."
 UNG_coastal_tithe:0 "Call Upon the Coastal Tithe"
 UNG_coastal_tithe_desc:0 "Demand our subjects provide us with transport vessels as per ancient agreement, grumble though they may."
 UNG_convince_freiprinzen:0 "Defending our Crown"
 UNG_convince_freiprinzen_desc:0 "An old enemy is stirring in the North. Freiprinz Schwarzenbach of Stahlhof is rumoured to be approaching the Freiprinzen, seeking to coax them into joining his cause. Whatever his plans are, they can't be good for the Union - our legitimacy must be asserted in all corners of the land!\n\n[HLZ.GetFlag] §Y[HLZ.GetName]§! is currently [HLZ.GetLoyaltyApproximationUnion]\n\n[NOC.GetFlag] §Y[NOC.GetName]§! is currently [NOC.GetLoyaltyApproximationUnion]\n\n[SPW.GetFlag] §Y[SPW.GetName]§! is currently [SPW.GetLoyaltyApproximationUnion]\n\n[SVT.GetFlag] §Y[SVT.GetName]§! is currently [SVT.GetLoyaltyApproximationUnion]\n\n[NRK.GetFlag] §Y[NRK.GetName]§! is currently [NRK.GetLoyaltyApproximationUnion]\n\n[TEI.GetFlag] §Y[TEI.GetName]§! is currently [TEI.GetLoyaltyApproximationUnion]\n\n[SNF.GetFlag] §Y[SNF.GetName]§! is currently [SNF.GetLoyaltyApproximationUnion]\n\n[ARK.GetFlag] §Y[ARK.GetName]§! is currently [ARK.GetLoyaltyApproximationUnion]\n\n[FTH.GetFlag] §Y[FTH.GetName]§! is currently [FTH.GetLoyaltyApproximationUnion]\n\n[WIS.GetFlag] §Y[WIS.GetName]§! is currently [WIS.GetLoyaltyApproximationUnion]\n\n[WSZ.GetFlag] §Y[WSZ.GetName]§! is currently [WSZ.GetLoyaltyApproximationUnion]\n\n"
 UNG_convince_FPT:0 "Visit [FROM.owner.GetName]"
 UNG_convince_FPT_desc:0 "Visiting our loyal subjects is a routine part of our feudal contract. However, by putting in just a little bit of extra effort in a Highprincely visit to the Freiprinz of [FROM.owner.GetName], we can surely reinforce their loyalty to the legitimately elected Hochprinzessin."
 UNG_convince_FPT_ii:0 "Host the Freiprinz of [FROM.owner.GetName]"
 UNG_convince_FPT_ii_desc:0 "Being the honoured guest at a Highprincely banquet is a great boon to any leader's prestige, and the Freiprinz of [FROM.owner.GetName] is sure to appreciate the gesture, and repay us with loyalty."
 UNG_convince_FPT_iii:0 "Align [FROM.owner.GetName]"
 UNG_convince_FPT_iii_desc:0 "The Freiprinztum of [FROM.owner.GetName] is simply essential to our strategic plans and national security. By leveraging marriages, gifts, ancient treaties and recent oaths, we can make sure they are on our side when the worst comes to worst."
 UNG_manage_refugee_crisis:0 "Manage the Refugee Crisis"
 UNG_manage_refugee_crisis_desc:0 "Many Schneefilders have fled to neighbouring Freiprinztümer, destabilizing those realms and leaving Schneefilde dangerously underpopulated. We have set up the Umsiedlungsdienst to deal with this, but they require more funds."
 UNG_resettle_refugees_UNG:0 "Resettle Schneefilder Refugees in Faustburg"
 UNG_resettle_refugees_UNG_desc:0 "Let us assist the Schneefilders in Faustburg in returning home."
 UNG_resettle_refugees_TEI:0 "Resettle Schneefilder Refugees in Teigerholen"
 UNG_resettle_refugees_TEI_desc:0 "Let us assist the Schneefilders in Teigerholen in returning home."
 UNG_resettle_refugees_WIS:0 "Resettle Schneefilder Refugees in Wistingen"
 UNG_resettle_refugees_WIS_desc:0 "Let us assist the Schneefilders in Wistingen in returning home."
 UNG_perkav_census_decisions:0 "Conduct the Perkav Census"
 UNG_perkav_census_decisions_desc:0 "With Krell's consent, we are able to conduct a thorough census of the Perkav lands. This will lay the groundwork for a modern Perkav state, to be our ally or - preferably - our vassal."
 UNG_survey_krellsland:0 "Survey Krellsland"
 UNG_survey_krellsland_desc:0 "Conduct a survey of Krellsland."
 UNG_surveying_krellsland:0 "Surveying Krellsland"
 UNG_surveying_krellsland_desc:0 "Our officials are traversing Krellsland, conducting a thorough census."
 UNG_survey_nevetko:0 "Survey Nevetko"
 UNG_survey_nevetko_desc:0 "Conduct a survey of Nevetko."
 UNG_surveying_nevetko:0 "Surveying Nevetko"
 UNG_surveying_nevetko_desc:0 "Our officials are traversing Nevetko, conducting a thorough census."
 UNG_survey_west_perkavland:0 "Survey West Perkavland"
 UNG_survey_west_perkavland_desc:0 "Conduct a survey of West Perkavland."
 UNG_surveying_west_perkavland:0 "Surveying West Perkavland"
 UNG_surveying_west_perkavland_desc:0 "Our officials are traversing West Perkavland, conducting a thorough census."
 UNG_survey_karczyk_weltrova:0 "Survey Karczyk-Weltrova"
 UNG_survey_karczyk_weltrova_desc:0 "Conduct a survey of Karczyk-Weltrova."
 UNG_surveying_karczyk_weltrova:0 "Surveying Karczyk-Weltrova"
 UNG_surveying_karczyk_weltrova_desc:0 "Our officials are traversing Karczyk-Weltrova, conducting a thorough census."
 UNG_survey_south_perkavland:0 "Survey South Perkavland"
 UNG_survey_south_perkavland_desc:0 "Conduct a survey of South Perkavland."
 UNG_surveying_south_perkavland:0 "Surveying South Perkavland"
 UNG_surveying_south_perkavland_desc:0 "Our officials are traversing South Perkavland, conducting a thorough census."
 UNG_create_perkav_script:0 "Create a Perkav Script"
 UNG_create_perkav_script_desc:0 "The Perkav people do not have any sort of writing system, greatly hindering their development. We must dispatch our finest scholars to devise a script for the Perkav people."
 UNG_creating_perkav_script:0 "Creating a Perkav Script"
 UNG_creating_perkav_script_desc:0 "We are creating a writing system for Perkavland."
 UNG_begin_administrative_reforms:0 "Begin Administrative Reforms"
 UNG_begin_administrative_reforms_desc:0 "With the census conducted and a basic writing system in place, we can begin reforming the administration of Perkavland. Our first orders of business is creating a literate class to handle administration, introducing a hereditary monarchy, and forming feudal relations between Krell and his tribal subjects."
 UNG_reforming_adminstration:0 "Reforming Perkav Administration"
 UNG_reforming_adminstration_desc:0 "We are currently reforming the Perkav administration."
 UNG_complete_census:0 "Finish the Perkav Census"
 UNG_complete_census_desc:0 "All our hard work is about to pay off - we are about to finish the Perkav census!"
 UNG_completing_census:0 "Finishing the Perkav Census"
 UNG_completing_census_desc:0 "We are finishing the Perkav Census!"
 SPW_rooks_management:0 "The Question of the Rooks"
 SPW_rooks_management_desc:0 "The Halfling-lands of the Rooks have been under our stewardship for ages, and thus far we have ruled with a loose hand. The Halflings were content to be alone, and we were content to leave them alone. However, the unrest in the Rooklands ruled by St. Vichtlas is starting to spill over. We will have to tread cautiously, lest the Rooks turn on us.\n\n[RKS.GetFlag] §Y[RKS.GetName]§! are currently [SPW.GetRooksTension] and view our rule [SPW.GetRooksLoyalty]."
 SPW_securing_the_spochwald:0 "Securing the Spochwald"
 SPW_securing_the_spochwald_desc:0 "Our lands are awash in a sea of bandits, thieves, and far, far worse. If we are to make use of our provinces, we must first secure them, as it currently is simply too unsafe to collect taxes or engage in construction in vast swathes of our territory."
 SPW_little_drink:0 "Have a Pint"
 SPW_little_drink_desc:0 "Just a little drink to take the edge off..."
 SPW_medium_drink:0 "Crack open a Bottle"
 SPW_medium_drink_desc:0 "Ahhh, Wistinger's amber liquid."
 SPW_big_drink:0 "Roll out the Barrels"
 SPW_big_drink_desc:0 "*Hic* tha-tha's the good shtuff!"
 SPW_go_hunt:0 "Stage a Hunt"
 SPW_go_hunt_desc:0 "Rabbits. Deer. Bandits, sometimes."
 SPW_go_garden:0 "Tend to the Garden"
 SPW_go_garden_desc:0 "The unmatched joy of nurturing something and watching it grow."
 HLZ_presslers_ambitions:0 "Pressler's Ambitions"
 HLZ_presslers_ambitions_desc:0 "Marius Pressler, former Baron of Engelschor and scion of Rosenblut, is trying to delegitimize our government and build an army to take it by force. If not stopped, he might seize control of Holzbrenn!"
 HLZ_pressler_hiding:0 "Pressler in Hiding"
 HLZ_pressler_hiding_desc:0 "We've got Pressler and his clique on the run, but if we don't finish the job, he'll rebuild his strength in the shadows."
 HLZ_pressler_regrouping:0 "Pressler Regrouping"
 HLZ_pressler_regrouping_desc:0 "Pressler's nose has been bloodied by our actions, but he's not down for the count just yet."
 HLZ_pressler_gathering_strength:0 "Pressler Gathering Strength"
 HLZ_pressler_gathering_strength_desc:0 "Pressler is openly gathering strength and slandering the government. This cannot be allowed to continue."
 HLZ_pressler_staking_claim:0 "Pressler Staking Claims"
 HLZ_pressler_staking_claim_desc:0 "Having found some supporters and a decently-sized army, Pressler is now openly calling himself the Freiprinz of Holzbrenn. We must act with haste, before he marches on the city!"
 HLZ_pressler_on_the_move:0 "Pressler on the Move"
 HLZ_pressler_on_the_move_desc:0 "Pressler has assembled a huge army, and he is marching on Holzbrenn as we speak! Unless we act quickly, the city may very well be lost!"
 HLZ_defensive_planning:0 "Defensive Planning"
 HLZ_defensive_planning_desc:0 "Our generals have prepared various strategies for blunting an Ordorian invasion. When the time comes, we will be ready."
 HLZ_defensive_stratagems:0 "Enact the Verteidigungsplan"
 HLZ_defensive_stratagems_desc:0 "The time is here; Ordoria marches on our capital. Instruct the generals to carry out the Defense plan at the first possible opportunity."
 HLZ_invade_ordoria:0 "Kriegsplan Nord"
 HLZ_invade_ordoria_desc:0 "Ordorian pirates are disrupting trade in our territorial waters, and Ordoria's military build-up is concerning to say the least. We can throw a spanner in their works and secure our home waters by waging a limited conflict over the lands surrounding the Thölderbucht."
 HLZ_invade_hisjine:0 "Battle of Heißjein"
 HLZ_invade_hisjine_desc:0 "Conquering Heißjein from the Elves would give us a staging post for further operations in spitting distance of Istaroth, and cement our control over the Thölderbucht."
 HLZ_invade_tholder:0 "Battle of Thölder"
 HLZ_invade_tholder_desc:0 "Thölder is the last major port in the Thölderbucht controlled by the Ordorians; taking it would secure our home waters completely. Not to mention the possibilities of constructing Northern ports for an easy route to Ythelmare..."
 HLZ_invade_polthoraur:0 "Battle of Pöltheren"
 HLZ_invade_polthoraur_desc:0 "Though cut off from the rest of Ordorian-held territory, there are still guerilla fighters hiding in the dense jungles of Pöltheren. It is in our best interests to clear them out."
 ungerdaler_reunion:0 "Die Wiederherstellung"
 ungerdaler_reunion_desc:0 "The Union of Free Ungerdaler Princes has been dismantled, and no central authority governs the Freiprinzen any longer. The title of Hochprinz is up for grabs, and if we prove our right to rule by force of arms, we may become the new ruler of the Union!"
 STA_installed_as_hochprinz:0 "Installed as Hochprinz"
 STA_installed_as_hochprinz_desc:0 "Though the Union of Free Ungerdaler Princes was shattered by the machinations of the wicked, we have once more unified the many Ungerdaler peoples under one banner with the support of our overlord, and can thus lay claim to the title of Hochprinz!"
 HLZ_restore_the_union:0 "Restore the Union"
 HLZ_restore_the_union_desc:0 "Though the Union of Free Ungerdaler Princes was shattered by the machinations of the wicked, we have once more unified the many Ungerdaler peoples under one banner, and can thus lay claim to the title of Hochprinz!"
 NOC_restore_the_union:0 "Restore the Union"
 NOC_restore_the_union_desc:0 "Though the Union of Free Ungerdaler Princes was shattered by the machinations of the wicked, we have once more unified the many Ungerdaler peoples under one banner, and can thus lay claim to the title of Hochprinz!"
