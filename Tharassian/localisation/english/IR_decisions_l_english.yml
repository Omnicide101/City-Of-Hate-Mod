 GENERIC_subject_interactions:0 "Guiding our Subjects"
 GENERIC_subject_interactions_desc:0 "Those that pledge allegiance to us must be guided as would a parent guide their child."
 GENERIC_subject_support_garrison:0 "Suppport [FROM.owner.GetName]'s Occupation Efforts"
 GENERIC_subject_support_garrison_desc:0 "[FROM.owner.GetName]'s expansion efforts have left them dangerously overextended, and this threatens to destabilize their government. We must send our men to assist their garrisons."
 GENERIC_war_exhaustion_category:0 "Supporting the War Effort"
 GENERIC_war_exhaustion_category_desc:0 "Now that we are faced with war, some hard decisions must be made to support the war effort and preserve our nation. We must also manage our people's motivation to fight in the war, and try and minimize war exhaustion, which would undermine our war effort.\n\nCurrent Effects from War Exhaustion:\n§R[?war_exhaustion_mobilization_display]%§! Reduction in Mobilization Speed\n§R[?war_exhaustion_surrender_limit_display]%§! Reduction in Surrender Limit"
