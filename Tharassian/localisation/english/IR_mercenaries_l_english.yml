 MERCS_not_already_hiring_2_groups:0 "Not Already Hiring 2 Groups of Mercenaries"
 MERCS_hiring_irinthian_legion_flag:0 "We are already hiring Irinthian Legionnaires"
 MERCS_hire_irinthian_legion_effects_tt:0 "§YFive to Six§! mercenary divisions of Irinthian Legionnaires will spawn around our capital. They will be hired for §Ysix months§!, after which we will have the option to terminate or renew their contract. We will pay them a cost of §Rfive civilian factories§! for as long as their contract lasts."
 MERCS_hire_tlarthingian_paladin_effects_tt:0 "§YFive to Six§! mercenary divisions of the Order of the Broodmother will spawn around our capital. They will be hired for §Ysix months§!, after which we will have the option to terminate or renew their contract. We will pay them a cost of §Rfive civilian factories§! for as long as their contract lasts."
