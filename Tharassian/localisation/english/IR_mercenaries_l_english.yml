 #companies
 IR_perkav_raider_company:0 "Perkav Raiders"
 IR_perkav_raider_company_desc:0 "Perkav Raiders are known and feared by many coastal towns in the southern hemisphere, and are fairly cheap to hire, though their tendency to loot captured towns causes difficulties in quelling resistance."
 IR_tlarthingian_paladin_company:0 "Order of the Broodmother"
 IR_tlarthingian_paladin_company_desc:0 "Originally created to protect Tlarthingian pilgrimages, the Order of the Broodmother is a paladin order dedicated to the protection of the innocent."
 ORD_corsair_raiders:0 "Corsair Raiders"
 ORD_corsair_raiders_desc:0 "Piracy used to be a problem with foreign trade, but now Ordorian piracy has all but died out. Perhaps by sponsoring some of these corsairs, we could better harrass foreign trade and harm their economies."
 IR_no_mercenaries:0 "No Mercenaries"
 IR_no_mercenaries_desc:0 "Either due to a low budget, or wanting a reliable home guard, we are not relying on any mercenary companies to supplement our forces."
 ORD_drakeskins_company:0 "Drakeskins"
 ORD_drakeskins_company_desc:0 "The Drakeskins, or the 'Iron Line,' are the most honored of soldiers in Ordoria, having defended against Stahlhof during the civil war, when all other troops were busy trying to crush the Rthaur menace. They are an elite troop, and considered the first line of defense against Stahlhof."
 IR_irinthian_mercenary_company:0 "Irinthian Foreign Legion"
 IR_irinthian_mercenary_company_desc:0 "Following the collapse of the Irinthian Empire, much of the army became mercenaries, spreading across the world. Recently, with the restrengthening of Irinthios, many of these mercenary companies founded by those soldiers have coalesced into a single, more Irinthios-aligned group, becoming all but an official part of Irinthian diplomacy and military."
 RMT_twin_axe_band_company:0 "Twin Axes"
 RMT_twin_axe_band_company_desc:0 "The Twin Axes are a group of mostly dwarves who hail from [RMT.GetNameDef], and are known for their ability to cut through the thickest of the fighting."
 UNG_green_bastards_company:0 "Green Bastards"
 UNG_green_bastards_company_desc:0 ""
 UNG_red_talons_company:0 "Red Talons"
 UNG_red_talons_company_desc:0 ""
 UNG_the_hand_company:0 "The Hand"
 UNG_the_hand_company_desc:0 ""
 IRI_bad_mercenary_company:0 "Subsidized Mercenaries"
 IRI_bad_mercenary_company_desc:0 "After the collapse of the Irinthian Empire, most soldiers became mercenaries, and in order to keep some of them here, a large portion of the military budget has had to be spent on keeping these mercenaries here as a standing army.\n"
 IRI_good_mercenary_company:0 "Foreign Legion"
 IRI_good_mercenary_company_desc:0 "Having united most of the disparate mercenaries that made up a significant chunk of the Irinthian Army, now the Foreign Legion serves as a source of recruitment and national pride."
 BLD_roaming_gathering:0 "The Roaming Gathering"
 BLD_roaming_gathering_desc:0 "There is a Gathering, or tribe, of ogres that ventures out from Bilodya, looking for a good fight. They are strong, fierce warriors, well known for their ability to break stalemates"
 IR_gowie_mercenaries:0 "Gowie Mercenaries"
 IR_gowie_mercenaries_desc:0 "[GOW.GetNameDefCap] is an eager participant in many foreign wars, wanting to profit off of the chaos and need for soldiers. Unlike most mercenary companies, they come with a built-in contract for Gowie weapons, making them slightly more expensive than most comparable mercenaries."
 DIA_veteran_tutors:0 "Veteran Tutors"
 DIA_veteran_tutors_desc:0 "There are many veterans of the crusade settled in Dialand. They would make great teachers for the next generation of crusaders."
 IRI_ogre_enforcers:0 "Ogre Enforcers"
 IRI_ogre_enforcers_desc:0 "Meant to deal with the most dangerous assignments, Ogre Enforcers are a great source of fear for any dissidents."
 IR_tlarthingian_slave_hunters:0 "Slave Hunters"
 IR_tlarthingian_slave_hunters_desc:0 "Well equipped for long expeditions and non-lethal forms of acquisitions, Slave Hunters are vital to protect the needs of the slave-owning class and keep dissidents down."
 #mercenary status stuff
 IR_outlawed_mercenary_work:0 "Outlawed Mercenary Work"
 IR_limited_mercenary_work:0 "Limited Mercenary Work"
 IR_extensive_mercenary_work:0 "Extensive Mercenary Work"
 IR_widespread_mercenary_work:0 "Widespread Mercenary Work"
 IR_open_mercenary_trade:0 "Open Mercenary Trade"
 IR_open_mercenary_trade_desc:0 "By freely allowing mercenaries to recruit in our territory and move through our lands, we can help appear like a better trade partner, especially where mercenaries are concerned."
 IR_recruit_mercs_from_occupied_territory:0 "Collaborationist Mercenary Recruitment"
 IR_recruit_mercs_from_occupied_territory_desc:0 "The recruitment of local mercenaries to help our occupation efforts is a strange, yet promising deal"
 IR_deserting_soldiers:0 "Deserting Soldiers"
 IR_deserting_soldiers_desc:0 "Due to the unpopularity of the war, and wanting better pay, many soldiers are deserting and either joining mercenary bands or heading back home."
 MERCS_hiring_irinthian_legion_idea:0 "Hiring Irinthian Legionnaires"
 MERCS_hiring_tlarthingian_paladin_idea:0 "Hiring Tlarthingian Paladins"
 #events
 merc.2.t:0 "Desertion Spreads through the Ranks"
 merc.2.d:0 "Not wanting to fight for us, many of our soldiers have begun to desert our ranks, some going to look for mercenary work, and others just going back home."
 merc.2.a:0 "We must solve this issue immediately"
 merc.4.t:0 "Mercenary Contract for the Irinthian Legionnaires Ends"
 merc.4.d:0 "Our 6-month contract for hiring the Irinthian Foreign Legion has expired, and now they are preparing to head off to the next contract."
 merc.4.a:0 "We will see them off"
 merc.4.b:0 "We will extend the contract"
 merc.5.t:0 "Mercenary Contract for the Order of the Broodmother Ends"
 merc.5.d:0 "Our 6-month contract for hiring the paladins of the Order of the Broodmother as mercenaries has ended, and they are packing up, planning to head to the nearest monastery for prayers."
 merc.5.b:0 "They can pray in 6 more months, we need them now"
