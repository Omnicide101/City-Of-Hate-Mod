l_english:
 autonomous_swarm_1:0 "Autonomous Swarm"
 autonomous_swarm_1_desc:0 "A swarm of creatures without a rider, acting either on training or some form of magical direction."

 dragonfly_mandibles_1:0 "Dragonfly Mandibles"
 dragonfly_mandibles_1_desc:0 "Wickedly sharp mandibles that are more than capable of biting off a man's hand."

 small_plane_airframe_0:0 "Griffinfly Swarm"
 small_plane_airframe_0_desc:0 "The smallest of the Drakeflies, Griffinflies are a common species around Tharassian. Roughly the size of a pig, Griffinflies are fast, agile hunter-creatures that, if reared from hatching or controlled by magic, can be trained for combat."

