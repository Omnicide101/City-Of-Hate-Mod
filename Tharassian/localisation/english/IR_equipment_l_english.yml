l_english:
 cart_equipment:0 "Cart"
 cart_equipment_short:0 "Crt."
 cart_equipment_desc:0 "A caravan of wagons, complete with spare parts and beasts of burden to pull them."
 cart_equipment_1:0 "Basic Cart"
 cart_equipment_1_short:0 "Basic Crt."
 cart_equipment_1_desc:0 "Simple wooden wagons to carry trade goods or supplies for an army on the march."
 infantry_equipment:0 "Infantry Equipment"
 infantry_equipment_short:0 "Infantry Eq."
 infantry_equipment_desc:0 "The basic bits and bobs of warfare necessarry for any soldier's success on the battlefield."
 infantry_equipment_0:0 "Basic Infantry Equipment"
 infantry_equipment_0_short:0 "Basic Inf. Eq."
 infantry_equipment_0_desc:0 "Short swords and oaken shields, without much flair. Simple tools for simple warriors."
 infantry_equipment_1:0 "Infantry Equipment"
 infantry_equipment_1_short:0 "Inf. Eq."
 infantry_equipment_1_desc:0 "Longer swords and spears, made of iron or steel. A notable advance in warfare."
 ranged_equipment:0 "Ranged Equipment"
 ranged_equipment_short:0 "Ranged Eq."
 ranged_equipment_desc:0 "Arrows, quivers, spare bowstrings, and of course the bow itself - everything needed to rain death upon the foe."
 ranged_equipment_0:0 "Basic Ranged Equipment"
 ranged_equipment_0_short:0 "Basic Rng. Eq."
 ranged_equipment_0_desc:0 "A simple shortbow, a sturdy quiver, and a set of arrows. This is all we need to bring death from afar."
 ranged_equipment_1:0 "Ranged Equipment"
 ranged_equipment_1_short:0 "Rng. Eq."
 ranged_equipment_1_desc:0 "A longbow is, as the name implies, significantly longer than the shortbow. Though this requires greater strength form the wielder, it also sends the arrows shot from it flying with far more force."
 crossbow_equipment:0 "Crossbow Equipment"
 crossbow_equipment_short:0 "Crossbow Eq."
 crossbow_equipment_desc:0 "A powerful ranged weapon that is simple to wield and can punch through even plate armour."
 crossbow_equipment_0:0 "Basic Crossbow Equipment"
 crossbow_equipment_0_short:0 "Basic Cross. Eq."
 crossbow_equipment_0_desc:0 "A simple crossbow design with a vertical trigger lock. This powerful weapon is simple to master and devastating on the battlefield."
 light_melee_equipment_short:0 "Lt. Inf. Eq."
 light_melee_equipment:0 "Light Melee Equipment"
 light_melee_equipment_0:0 "Basic Light Infantry Equipment"
 light_melee_equipment_desc:0 "Simple swords, axes and clubs for the rank and file."
 light_cavalry_equipment:0 "Light Cavalry Equipment"
 light_cavalry_equipment_short:0 "Lt. Cav. Eq."
 light_cavalry_equipment_desc:0 "In addition to the standard-issue leather armour and sword, the light cavalryman's kit comes with a bedroll, matches, oil, and rations for extended harrying operations behind enemy lines."
 light_cavalry_equipment_0:0 "Basic Light Cavalry Equipment"
 light_cavalry_equipment_0_short:0 "Basic Lt. Cav. Eq."
 light_cavalry_equipment_0_desc:0 "A horse, a saddle and a spear, nothing fancy. All that you need for a cavalry charge."
 heavy_cavalry_equipment:0 "Heavy Cavalry Equipment"
 heavy_cavalry_equipment_short:0 "Hv. Cav. Eq."
 heavy_cavalry_equipment_desc:0 "Heavy cavalry is a role usually fulfilled by the nobility, and as such they bring to bear the finest weapons and latest advancements in armour technology. Barding to protect the rider's warhorse is not uncommon either."
 heavy_cavalry_equipment_0:0 "Basic Heavy Cavalry Equipment"
 heavy_cavalry_equipment_0_short:0 "Basic Hv. Cav. Eq."
 heavy_cavalry_equipment_0_desc:0 "Barding for the horse, armour for the rider, and a lance to wreak havoc. All that is needed to break the enemy's line."
 ship_hull_light_0:0 "Galley"
 ship_hull_light_0_short:0 "Galley"
 ship_hull_light_0_desc:0 "An ancient ship design, galleys have remained in use as calm-water ships powered by oarsmen rather than relying on sails."
 ship_hull_heavy_0:0 "Quadrireme"
 ship_hull_heavy_0_short:0 "Quadrireme"
 ship_hull_heavy_0_desc:0 "Effectively a larger version of the smaller biremes, quadriremes double the rows of oars on the ship, allowing for more rowers and thus a greater displacement of tonnage. This allows for a heavier ship with more crew to take to the seas."
 light_ship_rowers_0: "Oarsmen"
 light_ship_rowers_0_short:0 "Oarsmen"
 light_ship_rowers_0_desc:0 "Be they slaves, free warrior-pirates, or simple hired muscle, these hardy folk man the oars that propel the galley forward."
 heavy_ship_rowers_0: "Oarsmen"
 heavy_ship_rowers_0_short:0 "Quad-Row Oarsmen"
 heavy_ship_rowers_0_desc:0 "Be they slaves, free warrior-pirates, or simple hired muscle, these hardy folk man the oars that propel the quadrireme forward. The larger ship size allows for more men to man the oars compared to smaller ships."
 light_ship_perkav_raider_rowers_0:0 "Perkav Raiders"
 light_ship_perkav_raider_rowers_0_short:0 "Perkav Oarsmen"
 light_ship_perkav_raider_rowers_0_desc:0 "Even more fearsome on the sea than on land, these mighty Perkav warriors are one with their vessel and can catch up with pretty much anything short of a magically fast ship."
 heavy_ship_perkav_raider_rowers_0:0 "Perkav Raiders"
 heavy_ship_perkav_raider_rowers_0_short:0 "Perkav Oarsmen"
 heavy_ship_perkav_raider_rowers_0_desc:0 "Even more fearsome on the sea than on land, these mighty Perkav warriors are one with their vessel and can catch up with pretty much anything short of a magically fast ship."
 light_ship_ballista_0: "Light Ballista"
 light_ship_ballista_0_short:0 "Light Ballista"
 light_ship_ballista_0_desc:0 "A lightweight oversized crossbow designed to be loaded and operated by a single individual, this piece of ship armament is of little use for anything beyond picking off enemy sailors."
 heavy_ship_ballista_0: "Light Ballista Battery"
 heavy_ship_ballista_0_short:0 "Light Ballista Battery"
 heavy_ship_ballista_0_desc:0 "A series of lightweight oversized crossbows designed to be loaded and operated by single individuals, these pieces of ship armaments are of little use for anything beyond picking off enemy sailors."
 light_ship_harpoon_thrower_0:0 "Harpoon Thrower"
 light_ship_harpoon_thrower_0_short:0 "Harpoon Thrower"
 light_ship_harpoon_thrower_0_desc:0 "Also known as 'Krostov's Wrath', these viciously barbed harpoons are loaded into a mechanism that sends them hurtling at the enemy, piercing even the thickest of whale blubber and on occasion even lightly-armoured enemy ships."
 heavy_ship_harpoon_thrower_0:0 "Harpoon Thrower Battery"
 heavy_ship_harpoon_thrower_0_short:0 "Harpoon Thrower Battery"
 heavy_ship_harpoon_thrower_0_desc:0 "Also known as 'Krostov's Wrath', these viciously barbed harpoons are loaded into a mechanism that sends them hurtling at the enemy, piercing even the thickest of whale blubber and on occasion even lightly-armoured enemy ships."