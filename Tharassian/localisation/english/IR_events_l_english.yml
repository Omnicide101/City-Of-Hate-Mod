 ai.2.t:0 "PLEASE BUILD AN INTEL NETWORK IN THE ADVENTURER'S GUILD!"
 ai.2.d:0 "Because almost everything related to the Espionage mechanics outside of the operations themselves is hardcoded, I've had to work around certain restrictions. You need to have an intel network to do operations, but you can't build intel networks on yourself, essentially preventing you from doing operations on yourself.\n\nAs such, I've added a small island called the Adventurer's Guild to the west of Lirothlind's isles where you can build an Intel Network.\n\nPLEASE BUILD AN INTEL NETWORK IN THE ADVENTURER'S GUILD OR NONE OF THE REWORKED ESPIONAGE MECHANICS WILL WORK!"
 ai.2.a:0 "Understood!"
 occupied_countries.1.c:0 "And we'd trust them to not immediately defect... why, exactly?"
 occupied_countries.1.e:0 "We have plans for that rebel scum."
 occupied_countries.1.f:0 "Certainly not!"
 console_command.1.t:0 "War!"
 console_command.1.d:0 "What is it good for?"
 console_command.1.a:0 "My personal entertainment."
 console_command.2.t:0 "Trans Rights!"
 console_command.2.d:0 "Why is this in the mod? Simple.\n\n1) Because this is my damn mod and I get to celebrate my pride if I bloody well want to, and\n\n2) Specifically to piss off transphobes that happen across this."
 console_command.2.a:0 "Lead dev (me) is a trans woman btw lmao"
 spy.1.t:0 "Granaries Burnt!"
 spy.1.d:0 "Reports have come in that granary after granary has been set ablaze, and our food supplies have been decimated! We are having serious trouble adequately feeding our people."
 spy.1.a:0 "Time to tighten our belts, everyone."
 spy.2.t:0 "Wells Poisoned!"
 spy.2.d:0 "It seems our every source of water has been poisoned - wherever our armies camp, those that take a drink from nearby wells invariably fall severely ill. Our troops are facing the unpleasant choice of being parched or poisoned."
 spy.2.a:0 "Beer it is, then."
 spy.3.t:0 "A Campaign of Terror!"
 spy.3.d:0 "A string of horrific assaults and vicious murders has ravaged our society, striking at anyone from beloved community figures to inspiring leaders and generals. The last victim was found in several pieces, including one sent by post to their mother. Our people are quivering in fear."
 spy.3.a:0 "Double the watch! Nay, triple it!"
 random.1.t:0 "An Artifact in the Mountains?"
 random.1.d:0 "Rumours of a powerful magical item in the Weltsäule Mountains have reached court today. The reports conflict as to the exact nature of this object, but all agree it is a powerful boon to whoever wields it."
 random.1.a:0 "Organize an expedition at once!"
 random.1.b:0 "We have better things to do than hunt after rumours."
 random.2.t:0 "Expedition Reaches the Mountains"
 random.2.d:0 "Today, just before sunset, the expedition arrived at the edge of the Weltsäule. They are restocking in a small town in the shadow of the nearest peaks and are preparing to set out at first light tomorrow."
 random.2.a:0 "We draw close to our goal."
 random.2.b:0 "Turn back, it's too dangerous."
 random.3.t:0 "A Guiding Light?"
 random.3.d:0 "An old man who claims to know the path to our destination has offered his services as a guide. Though some of our men regard him as somewhat shifty, he might significantly increase our chances of success."
 random.3.a:0 "Hire him, a guide could be useful."
 random.3.b:0 "This man is clearly a thief."
 random.4.t:0 "A Magical Ring!"
 random.4.d:0 "After delving through ancient ruins, avoiding many deadly traps and boisterous monsters, our expedition has uncovered a golden ring set with a single sapphire. The legends written on the wall it was found in, in Dwarvish, turned out to be the story of an ancient Dwarven Emperor who wore the ring and was bestowed with untold riches."
 random.4.a:0 "Excellent news!"
 random.5.t:0 "A Magical Sword!"
 random.5.d:0 "After delving through ancient ruins, avoiding many deadly traps and boisterous monsters, our expedition has uncovered a magical sword, sharp despite its age. The legends written on the wall it was found in, in Dwarvish, turned out to be the story of an ancient barbarian warlord who wielded this blade. None could stand before him."
 random.5.a:0 "Excellent news!"
 random.6.t:0 "A Thief Among Us!"
 random.6.d:0 "It turns out we should not have hired the guide after all. This morning, the expedition woke up to find both the old man and the artifact gone."
 random.6.a:0 "Curses!"
 random.7.t:0 "The Expedition Returns"
 random.7.d:0 "Today, the expedition has returned to the capital, proudly displaying the artifact they recovered before handing it over to our ruler. Even if it is not magical, this show of power and prestige has greatly impressed the masses."
 random.7.a:0 "A glorious day!"
 random.8.t:0 "Naught but Dust and Stones"
 random.8.d:0 "Alas, it seems that our expedition has been unsuccesful. Our men spent a week searching the area where the tomb with the artifact should be, but all they found were rocks and insects. They have returned empty-handed."
 random.8.a:0 "A shame."
 random.9.t:0 "[GetStateName1] Demands Privileges"
 random.9.d:0 "The city of [GetStateName1] is one of our realm's most important industrial and military hubs, and its populace has grown increasingly aware of this fact. Recently, a group of influential local merchants, farmlords and councillors have presented a formal request to us for greater autonomy in managing their own affairs. Granting this would inevitably see them pay us fewer taxes, but it might galvanize support for our rule and show us to be a benefactor to our subjects."
 random.9.a:0 "Acquiesce to their request."
 random.9.b:0 "We, and nobody else, govern the [Root.GetAdjective] people!"
 random.12.t:0 "Monster Plagues [GetStateName2]"
 random.12.d:0 "For a while now, we have received scattered reports of trouble brewing in [GetStateName2] - missing children, outlying farmsteads reduced to wrecks, et cetera. Until now, we have assumed that this was the work of deserters or bandits.\n\nLast night's missive, however, has thoroughly disabused us of this notion.\n\nA terrifying monster is roaming those lands, destroying everything in its wake - it has even started to lay waste to entire hamlets and villages! This cannot be allowed to continue."
 random.12.a:0 "Send an Adventurer to deal with this threat!"
 random.13.t:0 "Monster Slaughters Hamlet!"
 random.13.d:0 "Our tarrying in sending an Adventurer to vanquish the monster plaguing [GetStateName2] has come at a cost - reports have reached us that an entire hamlet has been laid to waste! Only one or two souls managed to flee the monster's ontslaught, but all of the others have been brutally murdered and eaten."
 random.13.a:0 "I hope it gets indigestion!"
 random.14.t:0 "Monster Devastates Village!"
 random.14.d:0 "Our tarrying in sending an Adventurer to vanquish the monster plaguing [GetStateName2] has come at a cost - it has destroyed important buildings in its rampage! While we can rebuild, it will be difficult to do so until the monster is gone. Not only because it might just rampage through again, but also because it is hard to find craftsmen willing to risk their hides building things in monster-ridden territory."
 random.14.a:0 "Curses!"
 random.15.t:0 "General Captured!"
 random.15.d:0 "One of our commanders has gone missing in action after the failure of their latest maneuver. Scattered reports from retreating troops indicate they bravely held the line in order to buy time for their troops to escape, but were overwhelmed by a devastating enemy charge."
 random.15.a:0 "What horrors await them in the dungeons?"
 random.16.t:0 "Enemy Officer Captured!"
 random.16.d:0 "Our brave troops have recently secured multiple key victories in our war against [From.GetName]. One of their incompetent generals, making blunder after blunder, helped us tremendously in this regard. They attempted to flee like a coward, abandoning their troops, but our men gave chase and cornered them. The spineless buffoon surrendered without a fight, and they are now languishing in our dungeons!"
 random.16.a:0 "Lock them in the dungeons and throw away the key!"
 random.17.t:0 "[From.GetName] offers Prisoner Exchange"
 random.17.d:0 "With both of our states holding prisoners belonging to the other, [From.GetName] has come forward with a proposal: they are willing to free one of our people, if we are willing to do the same for them. What should we do?"
 random.17.a:0 "Deal."
 random.17.b:0 "No deal."
 random.18.t:0 "Prisoner Exchange - Accepted"
 random.18.d:0 "[From.GetName] has accepted our offer - it is time to arrange a time and place for the exchange."
 random.18.a:0 "Excellent."
 random.19.t:0 "Prisoner Exchange - Rejected"
 random.19.d:0 "[From.GetName] has declined our offer of a prisoner exchange. It seems our captive will continue to enjoy our hospitality for a while."
 random.19.a:0 "Their loss."
 random.20.t:0 "The Creation of An Banner"
 random.20.d:0 "Many are the artists in our realm, and many more are their crafts. It is, however, exceptionally rare to be presented with an artifact as lavish or as detailed as the one now before us: an massive, extremely intricate banner, embroidered with many vivid depictions of tales the creator claims came to them in a series of dreams. Vistas of lands covered in a sanguine rain, a warrior-goddess reborn, mountains to rival the mighty Oramfell in riches that would make even the stoutest Dwarf drool, a rebellion of ghosts, skies choked in ash, bizarre arcanotech, a lost Elven homeland, reclaimed or colonized by dozens of vying powers... there seems to be no end to the stories told on this 'An Banner'.\n\nIt is truly a masterpiece."
 random.20.a:0 "Wait, don't you mean *a* banner?"
 generic.1.t:0 "Governmental Crisis!"
 generic.1.d:0 "Our country is in uproar against the current government, with citizen militias of various convictions erecting makeshift barricades and clashing with the town watch! There have even been reports of army defections to the rebels, and the situation is spiralling out of control - what should we do?"
 generic.1.a:0 "This is clearly the work of seditious foreigners!"
 generic.1.b:0 "The old ways are tried and true, we must cling to the nobility!"
 generic.1.c:0 "We've had enough of your corrupt aristocracy - let the people be heard!"
 generic.1.e:0 "Piety and prayer are the only answers to these dire times!"
 generic.2.t:0 "Puritan Coup!"
 generic.2.d:0 "Having made gains in all strata of societies lately (except, obviously, the racial minorities), the Puritans have increased in power and influence to the point where they have successfully staged a coup! Our government officials have been swiftly arrested by Puritan army elements, and those that have professed a pro-xenos bent have been dealt with. It seems that the new regime has secured their power base quickly - so quickly, in fact, that this must have been a very well-planned coup."
 generic.2.a:0 "At long last, we can purge the xenos from our lands!"
 generic.3.t:0 "Order Maintained"
 generic.3.d:0 "The nobility has acted quickly, with the monarch and the aristocrats setting aside their differences to unite against those that would threaten the stability of the nation. The unrest in the streets has died down, and the nobility is already back to its old infighting..."
 generic.3.a:0 "The monarch cleverly check-mates the aristocracy and seizes unrestrained power!"
 generic.3.b:0 "The monarch and the aristocrats negotiate a compromise!"
 generic.3.c:0 "The aristocracy pressures the monarch into handing over his powers to the aristocracy!"
 generic.4.t:0 "Call for Elections!"
 generic.4.d:0 "Tensions in the country have reached a breaking point, and the various disorganized riots have transformed into an organized revolution! Although a civil war seemed imminent, this was prevented by the defection of the Royal Guard, who have placed the monarch and most powerful nobles under arrest! Emergency elections have been scheduled - who shall lead our newly-forged Republic?"
 generic.4.a:0 "The Guildists emerge victorious - liberty for all!"
 generic.4.b:0 "The Rosites carry the day - justice for all!"
 generic.5.t:0 "Religious Coup!"
 generic.5.d:0 "The increased piety in our country as a whole and our government in particular has led to a massive growth in the power of the Church, and they have finally acted - the priests have declared themselves the new government, denouncing the old regime as sinful and heretical, and the majority of the population seems to accept this decree for now. The old rulers have been apprehended by zealous elements of the army and are now awaiting divine judgement."
 generic.5.a:0 "Praise be!"
 generic.6.t:0 "The Royal Front"
 generic.6.d:0 "The situation is dire - dire enough to force even the aristocrats to stop their factionalism and infighting for the moment, and present an united front against the threat of mob rule. The various nobles of our nation have raised their banners alongside those of our monarch, and the army is being sent out across the country to put down the uprisings that plague our nation."
 generic.6.a:0 "Everything must be done to keep the commoners in their place."
 generic.7.t:0 "The Republican Front"
 generic.7.d:0 "There appears to have been contact between the various rebel groups that have consolidated out of the protest mobs, and it appears this is bad news - they have put aside their differences for now and stand united against our regime!"
 generic.7.a:0 "Spare us from this mob rule!"
 generic.8.t:0 "A Shameful Display"
 generic.8.d:0 "A scandal has rocked the halls of power today as the two top advisors on economic matters have physically assaulted one another in the middle of a debate! One advisor, the representative of the merchant class, insists on giving the Guilds a free hand in economical matters, while our Minister of Economics claims we should do away with the Guilds! It is clear we cannot keep both at court - whose advice should we heed?"
 generic.8.aa:0 "The Guilds are the hearts and soul of our prosperity!" #generic.8.a is bugged for some reason, so .aa is used as a workaround
 generic.8.b:0 "The Guilds are an outdated institution with no place in a modern society!"
 generic.9.t:0 "Officers Brawl!"
 generic.9.d:0 "Embarrassing news form a rather agitated innkeeper today - apparently, a general and an admiral were having a drink in her tavern today, discussing the merits of the army versus the navy. Polite disagreement rapidly heated up into a fist-fight, which sparked a tavern brawl that attracted further soldiers and sailors to fight for their respective officers! We have already paid damages to the innkeep, but we must resolve the army-navy dispute before such a thing happens again."
 generic.9.a:0 "The army must always come first!"
 generic.9.b:0 "The navy is vital to our continued prosperity and must be prioritized!"
 generic.10.t:0 "The Best Laid Plans..."
 generic.10.d:0 "An incident has been bought to our attention today - in an otherwise irrelevant border skirmish with one of our neighbours, one of our generals apparently led his men to charge our own troops, seemingly in the belief that he had 'outmaneuvered a hostile force' and was 'saving the day with a glorious charge'. It is clear our current military staff is not up to standards, and those few competent generals we have are all squabbling over whose doctrine we should adopt."
 generic.10.a:0 "If they'd been cavalry, they would've been able to actually flank!"
 generic.10.b:0 "This would have never happened with a professional army!"
 generic.10.c:0 "Who cares? We have plenty of peasants."
 generic.10.e:0 "Better organization and discipline will prevent future incidents."
 ir.political.5.t:0 "End of the Civil War!"
 ir.political.5.d:0 "The dust has settled, and we have emerged victorious in the devastating civil war that has rocked our nation for the past months. It is now time to rebuild our country under our benevolent leadership."
 ir.political.5.a:0 "We shall lead our people to prosperity."
 ir.political.6.t:0 "War Exhaustion Starts to Creep In"
 ir.political.6.d:0 "After 3 years of constant war, our people have begun to be tired of it, and wish for it to come to an end. This war exhaustion will negatively effect our war efforts unless we counter it or end the war and let peace settle over our country."
 ir.political.6.a:0 "Another Problem of the War"
 merc.1.t:0 "Perkav Mercenary Contract Expires"
 merc.1.d:0 "The mercenary warriors of Perkavland have served our armies for the six months their contract stipulated, and we now have to decide if we wish to extend it."
 merc.1.a:0 "Their ferocity shall be missed, but their odour shan't."
 merc.1.b:0 "We still have need of them - extend their contract!"
 merc.2.t:0 "Desertion Spreads through the Ranks"
 merc.2.d:0 "Not wanting to fight for us, many of our soldiers have begun to desert our ranks, some going to look for mercenary work, and others just going back home."
 merc.2.a:0 "We must solve this issue immediately"
 merc.3.t:0 "Drakeskin Mercenary Contract Expires"
 merc.3.d:0 "The mercenary warriors of the Drakeskins have served our armies for the six months their contract stipulated, and we now have to decide if we wish to extend it."
 merc.3.a:0 "They have served the Elven species well - let them go."
 merc.4.t:0 "Mercenary Contract for the Irinthian Legionnaires Ends"
 merc.4.d:0 "Our 6-month contract for hiring the Irinthian Foreign Legion has expired, and now they are preparing to head off to the next contract."
 merc.4.a:0 "We will see them off."
 merc.4.b:0 "We will extend the contract."
 merc.5.t:0 "Mercenary Contract for the Order of the Broodmother Ends"
 merc.5.d:0 "Our 6-month contract for hiring the paladins of the Order of the Broodmother as mercenaries has ended, and they are packing up, planning to head to the nearest monastery for prayers."
 merc.5.b:0 "They can pray in 6 more months, we need them now"
 merc.6.t:0 "Mercenary Contract for the Green Bastards Ends"
 merc.6.d:0 "Our 6-month contract for hiring the Green Bastards has expired, and now they are preparing to head off to the next contract."
 merc.7.t:0 "Mercenary Contract for the Red Talons Ends"
 merc.7.d:0 "Our 6-month contract for hiring the Red Talons has expired, and now they are preparing to head off to the next contract."
 merc.8.t:0 "Mercenary Contract for The Hand Ends"
 merc.8.d:0 "Our 6-month contract for hiring The Hand has expired, and now they are preparing to head off to their next job, whether that be another mercenary contract or an assassination."
 merc.9.t:0 "Mercenary Contract for Twin Axes Ends"
 merc.9.d:0 "Our 6-month contract for hiring the Twin Axes has expired, and now they are preparing to head off to their next contract."
 merc.10.t:0 "Mercenary Contract for the Roaming Gathering Ends"
 merc.10.d:0 "Our 6-month contract with the Roaming Gathering has ended, and most of the ogres have already left, our questions on whether it would be possible to extend the contract falling on deaf ears."
 merc.10.a:0 "Well, you can't say no to an ogre mercenary."
 merc.11.t:0 "Mercenary Contract with Gowie Mercenaries Ends"
 merc.11.d:0 "Our 6-month contract for hiring the mercenaries from Gowie has ended, and now they are preparing to head off to their next contract."
 masleague.1.t:0 "The Tristal Empire Attacks!"
 masleague.1.d:0 "The doom we have long feared is approaching at last - the Tristal Empire is marching on our lands! We should invoke the treaties of the League of Maslodan and rally the other powers of the continent to our side!"
 masleague.1.a:0 "Light the beacons! Call for aid!"
 masleague.1.b:0 "We need no help, this war will soon be won!"
 masleague.2.t:0 "[FROM.GetName] Invokes Maslodan League Treaty!"
 masleague.2.d:0 "The nation of [FROM.GetName] has been invaded by the damnable Tristal imperialists, and have naturally called upon the League of Maslodan to aid them! Should we honour our obligations and march to war, or will we sit this one out?"
 masleague.2.a:0 "We honour our word - to arms!"
 masleague.2.b:0 "This is not our problem."
 masleague.4.t:0 "War with Tristal Concluded"
 masleague.4.d:0 "Our conflict with the Tristal Empire is over; the League of Maslodan has served its purpose. Per the stipulations of the treaty, we all are to go our separate ways until the Tristal menace raises its head once more."
 masleague.4.a:0 "Until we meet again."
 alliance.1.t:0 "The Ungerdaler United Front"
 alliance.1.d:0 "With the fall of the Hochprinztum, the Freiprinzen have become disunited. One of the Freiprinztümer has now stepped in to suggest an alliance of Freiprinzen against outside threats, and we have been invited to join."
 alliance.1.a:0 "The Freiprinzen must stay united!"
 alliance.1.b:0 "No, the Union is dead!"
 alliance.2.t:0 "Our Kin Calls for Aid!"
 alliance.2.d:0 "Our family in [From.GetName] has been attacked, and our dynastic ties would give us just cause to join the conflict. Should we march to their defence?"
 alliance.2.a:0 "And [Root.GetName] shall answer!"
 alliance.2.b:0 "We cannot afford to meddle in [From.GetAdjective] politics."
 alliance.3.t:0 "[From.GetName] Joins the Fray!"
 alliance.3.d:0 "Great news! Our valourous kin in [From.GetName] have answered our call! Their magnificient armies are now en route to help us deal with our enemies!"
 alliance.3.a:0 "Excellent news!"
 alliance.4.t:0 "[From.GetName] Refuses to Join our War!"
 alliance.4.d:0 "It seems our relatives in [From.GetName] have no interest in defending their kin. They have not made any attempts to join us in our war, and beyond some token words of encouragement, it seems we cannot rely on help from their corner."
 alliance.4.a:0 "That is too bad."
 has.1.t:0 "The Tristal Catastrophe"
 has.1.d:0 "The incompetence and corruption from our long-term Hastalian ally has reached a boiling point, as we have found ourselves dragged into a disastrous war. The families are in uproar, and demand we sort out the Tristalians before they drag us down to our doom with them."
 has.1.a:0 "We shall place a family behind their throne."
 has.1.b:0 "Demand they shape up, else we leave them to their fate."
 has.1.c:0 "We cannot solve Tristal's problems for them."
 has.2.t:0 "Tristalia Bends the Knee"
 has.2.d:0 "The Emperor raged, and he railed against our emissaries, but he could not deny us. The Tristal Empire has acquiesced to our demands."
 has.2.a:0 "Good. Clean up their mess."
 has.3.t:0 "Tristalia Defies Us!"
 has.3.d:0 "The Emperor has dared defy us! He insists on keeping his rotten Empire in the sorry state it is. Fortunately, their long-suffering army has seen the wisdom of our demands, and sided with us against their corrupt Emperor!"
 has.3.a:0 "Then we shall sort them out by force."
 has.4.t:0 "Tristalia Reforms!"
 has.4.d:0 "The Senate of the Tristalians has heeded our wise advice, and significant reforms are already being implemented! The country is on the road to recovery, despite the grumbles of their more decadent Senators."
 has.4.a:0 "Excellent!"
 has.5.t:0 "Tristalia Refuses to Reform!"
 has.5.d:0 "The corruption in Hathliss runs even deeper than we suspected - the Senate of the Tristalians has refused our most reasonable proposals outright! The Tristal Empire is clearly beyond saving."
 has.5.a:0 "Then we shall leave them to their fate."
 trs.1.t:0 "Hastalians Seize Control!"
 trs.1.d:0 "The Hastalian addiction to political scheming is well-documented, and it would appear it has finally sunk its claws into our proud nation. Representatives of the major Bloodlines have demanded a series of reforms that would be tantamount to ceding total political control to Vencedoria! Our position is precarious, and demands a considered response."
 trs.1.a:0 "We have no choice but to yield."
 trs.1.b:0 "Never! Tristalia stands alone - to arms!"
 trs.2.t:0 "Hastalia Demands Reforms"
 trs.2.d:0 "The Hastalian addiction to political scheming is well-documented, and it would appear it has finally sunk its claws into our proud nation. Representatives of the major Bloodlines have demanded a series of reforms that, while doubtlessly beneficial to the nation, enrage a great amount of our Senators and generals! Our position is precarious, and demands a considered response."
 trs.2.a:0 "Our friends in Vencedoria are wise - heed their counsel!"
 trs.2.b:0 "This would plunge our land into chaos - we refuse!"
 ith.1.t:0 "The State of Ith"
 ith.1.d:0 "The Kingdom of Ith finds itself in a precarious situation. The country finds itself split between three groups, The followers of the first, second and third prince. As all three have different goals and plans for the future, the only thing holding them together is the current King and father of these princes, Dolaidh Donodai, who is a good dealbreaker and has become a symbol of Ith independence as he leads the country for over 100 years now. But his age is showing and through it, he is slowly losing his actual power. \n\nThe first Prince is the most radical of the three, avidly supporting the northern puritan dwarves. Through this, he is also the most fringe candidate of the three princes, as not many think that Ith could win against Dialand.\n\nThe second Prince is the most moderate of the three having the support of the King and many of the Nobles in the Kingdom. He represents the old guard, wanting not many changes to happen socially in the kingdom and wanting it to finish its modernization efforts. \n\nThe third Prince is somewhere in between, despising the old order of Ith and having many more meritocratic thoughts. He is the trader's favorite candidate, supporting free trade and the modernization of the country. \n\nBut as Ith has a fast-growing population during the last decades, but a very limited amount of farmland it needs to import growing amounts of grain from the goblins of Dialand, through this Ith has grown more and more dependent on Dialand, slowly losing its power over its domestic affairs."
 ith.1.a:0 "OK"
 ith.2.t:0 "The Stable Kingdom"
 ord.1.t:0 "The Autumn Debate Commences"
 ord.1.d:0 "It has taken a long time to organise the summit and send out the invitations, but at long last all important nobles, priests and other prominent figures of Ordoria have been assembled in Varinthia. From the start it is clear that three rough factions have formed: the Royalists, under the leadership of heir to the throne Larennis Valinthir, the Glory League, led by the King's Steward, Isvenith Lothinnys, and the Sophists, the religious faction commanded by the High Priest, Histarine Vernythe. These three factions will now struggle with each other over the future of Ordoria."
 ord.1.a:0 "Let us hope for a swift and fruitful debate."
 ord.2.t:0 "Domestic-Economic Policy"
 ord.2.d:0 "The first point of debate is the treatment of the other races in our country, as well as our economic plans. The Glory League argues for the immediate enslavement of all 'sub-Elven vermin' and putting them to work in labour camps for their heavy industrialization programs, while the Sophists propose witch hunts and religious courts to deal with the vermin, relying on Ordorian labour alone to build a war economy and relying on a swift reconquest of our Eastern lands to salvage our civilian economic situation. The speaker for the Royalists on this matter, where the faction is a definite minority, was almost booed off the speaker's platform when she suggested allowing the most skilled 'demi-Elves' to stay and work."
 ord.2.a:0 "The Royalists' economic arguments sway the powerful with promises of wealth!"
 ord.2.b:0 "The Glory League sweeps the debate easily."
 ord.2.c:0 "The fiery rhetoric of Vernythe carries the day for the Sophists!"
 ord.3.t:0 "Foreign Policy"
 ord.3.d:0 "With the matter of the treatment of the other races settled, the topic of foreign policy has come up. Perhaps surprisingly, the seemingly most popular plan is the Royalists' proposal for a temporary alliance with the Realm and the Union, so we can focus on dealing with the rebels, who they consider the 'real' enemy. Meanwhile, both the Glory League and the Sophists argue for agressive expansionism, though the Sophists insist on a more spiritual bent to our endeavours than the Glory League."
 ord.3.a:0 "The Royalists' plan for Rthaur containment wins over the nobles!"
 ord.3.b:0 "Lothinnys' doctrine of Ordorian hegemony sways the warmongers!"
 ord.3.c:0 "The Sophistium proposal for an Extermination Crusade resonates with the zealous!"
 ord.4.t:0 "Military Policy"
 ord.4.d:0 "As debate around foreign policy dies down, the army's current state is called into question. It is clear that some reforms are needed, but what direction should we go in?"
 ord.4.a:0 "Rapid raiding parties can strike terror in the hearts of our enemies - the Royalists!"
 ord.4.b:0 "We must stop losing ground before thinking of conquests - the Glory League!"
 ord.4.c:0 "We've been on the back foot for long enough - the Sophist army of aggression!"
 ord.5.t:0 "Royalist Victory!"
 ord.5.d:0 "In a shocking turn of events, the Royalists have come out on top! Many of our more conservative assembly members have loudly protested this, but it seems that, for now at least, our policy of Elven supremacy will be abandoned in favour of realpolitik and a more overt anti-Radicalism."
 ord.5.a:0 "For too long have we made enemies. It's time to look for some friends, instead."
 ord.6.t:0 "Glory League Victory!"
 ord.6.d:0 "It appears that the Glory League faction has emerged victorious from the summit. We will have to alter some parts of our government, of course, as compromises had to be made, but by and large we shall carry on as before."
 ord.6.a:0 "Domestic stability has been secured. Next stop: Quellion!"
 ord.7.t:0 "Sophist Victory!"
 ord.7.d:0 "The religious convictions and fierce oratory of the Sophists has seen them convince the summit of their Crusade plans. Already orders have been sent to weaponsmiths across the nation to ramp up their production - the holy cleansing of the continent shall no doubt begin soon."
 ord.7.a:0 "There shall be order, or there shall be nothing!"
 ord.8.t:0 "Deadlock: Glory League-Sophistium Coalition"
 ord.8.d:0 "The assembly seems very divided, and no faction has managed to gain the upper hand. To allow for any governance at all, and more importantly to stop the Royalists from gaining traction, the Glory League and the Sophists have hashed out a compromise both can tolerate. Neither side is happy with the agreement, but they agree it's better than letting the Royalists have their say."
 ord.8.a:0 "Anything to keep the Royalists out!"
 ord.9.t:0 "The Union Listens"
 ord.9.d:0 "To the surprise of some of our diplomats, High Princess Adelina has decided to hear us out! We have offered her a pact of non-aggression, to grow into an alliance once Arthenon responds, in exchange for the return of certain territories lost to the enroaching Stahlhoffers. However, our advisors are divided on how much we should ask for - if we demand too much, we risk angering the High Princess, or the Prince of Stalhof..."
 ord.9.a:0 "Stahlhof is to return all unjustly seized land!"
 ord.9.b:0 "We will be happy with the return of our most important provinces - for now."
 ord.9.c:0 "We'll cut them a deal - Ghithys and Ancyte for the return of Quenthyne and Utrocyle"
 ord.10.t:0 "The Union Rejects Our Overtures"
 ord.10.d:0 "Our ambassadors to the Union have returned without success. Apparently, Adelina's court treated them with scorn - one general even spat in the face of our most respected envoy! This has reflected extremely poorly on the Royalists - there's rumours of seditions. One more blunder like this and our enemies might attempt a coup!"
 ord.10.a:0 "Damn them!"
 ord.11.t:0 "The Union Agrees!"
 ord.11.d:0 "High Princess Adelina has decided to support our demands! An order has been sent to the Freeprincedom to immediately vacate all of our lands, and our army stands ready to reoccupy the provinces - whether Stahlhof allows us to or not."
 ord.11.a:0 "Let's hope Stahlhof complies..."
 ord.12.t:0 "The Union Declines!"
 ord.12.d:0 "Unfortunately, it seems we asked too much of the Ungerdaler Union - our diplomats have returned with empty hands. Our enemies at court are laughing behind our backs - we'd better score a victory soon, or they might make a move..."
 ord.12.a:0 "Damnation!"
 ord.13.t:0 "The Union Agrees!"
 ord.13.d:0 "It was a wise move to make modest demands - High Princess Adelina has backed our demands! Stahlhof is now facing pressure from both us and their overlord to return Utrocyle and Ythlycthis."
 ord.13.a:0 "Let's hope Stahlhof complies..."
 ord.14.t:0 "The Union Declines!"
 ord.14.d:0 "Unfortunately, it seems even our limited demands were too much for the Ungerdaler Union - our diplomats have returned with empty hands. Our enemies at court are laughing behind our backs - we'd better score a victory soon, or they might make a move..."
 ord.14.a:0 "Damnation!"
 ord.15.t:0 "The Union Agrees!"
 ord.15.d:0 "Good news - High Princess Adelina has agreed to our suggested exchange of territories! Our troops are vacating Ghithys and Ancyte, along with some Glory League and Sophists who do not want to live under Human rule, and now stand ready to reclaim Utrocyle and Ythlycthis."
 ord.15.a:0 "Let's hope Stahlhof complies..."
 ord.16.t:0 "Arthenon Agrees"
 ord.16.d:0 "Excellent news from the North - the Grand Master has agreed to our suggestion of a non-aggression pact, to be formalized into an alliance at the earliest possible opportunity! This has greatly enhanced the prestige of the Royalists."
 ord.16.a:0 "Just as planned!"
 ord.17.t:0 "The Realm Rejects our Proposal"
 ord.17.d:0 "Bad news from the north - Arthenon has decided to not sign our pact. This is a problem for the Royalist faction, whose competence is called into question."
 ord.17.a:0 "Damn him!"
 ord.18.t:0 "Stahlhof Submits!"
 ord.18.d:0 "Word has reached us that the Freeprincedom of Stahlhof has seen reason and agreed to return our lands to us. This has greatly enhanced the legitimacy of the Royalist government."
 ord.18.a:0 "Excellent!"
 ord.19.t:0 "Stahlhof Refuses!"
 ord.19.d:0 "Despite direct orders from the High Princess, the Prince of Stahlhof refuses to return our lands! On the upside, the Ungerdaler diplomats at our court have subtly let us know that the Union would not intervene if we were to take what is ours by force..."
 ord.19.a:0 "Teach them a lesson!"
 ord.19.b:0 "Back down for now."
 ord.20.t:0 "Stahlhof Submits!"
 ord.20.d:0 "Word has reached us that the Freeprincedom of Stahlhof has seen reason and agreed to return our lands to us. This has greatly enhanced the legitimacy of the Royalist government."
 ord.20.a:0 "Excellent!"
 ord.21.t:0 "Stahlhof Refuses!"
 ord.21.d:0 "Despite direct orders from the High Princess, the Prince of Stahlhof refuses to return our lands! On the upside, the Ungerdaler diplomats at our court have subtly let us know that the Union would not intervene if we were to take what is ours by force..."
 ord.21.a:0 "Teach them a lesson!"
 ord.21.b:0 "Back down for now."
 ord.22.t:0 "Stahlhof Submits!"
 ord.22.d:0 "Word has reached us that the Freeprincedom of Stahlhof has seen reason and agreed to our proposed exchange. This has greatly enhanced the legitimacy of the Royalist government."
 ord.22.a:0 "Excellent!"
 ord.23.t:0 "Stahlhof Refuses!"
 ord.23.d:0 "Despite direct orders from the High Princess, the Prince of Stahlhof refuses our suggestion of exchange! On the upside, the Ungerdaler diplomats at our court have subtly let us know that the Union would not intervene if we were to take what is ours by force..."
 ord.23.a:0 "Teach them a lesson!"
 ord.23.b:0 "Back down for now."
 ord.24.t:0 "Southern Lands Reclaimed"
 ord.24.d:0 "People across our proud nation are celebrating as word has reached us that we have fully reclaimed our lands to the South! The Stahlhoffers have been expelled, and those displaced by the enroaching Humans are slowly returning to their homes. This is a great day for Ordoria!"
 ord.24.a:0 "A testament to Elven might!"
 ord.25.t:0 "The Union Declines!"
 ord.25.d:0 "Despite our extremely generous offer, the Ungerdaler Union has seen fit to reject our proposal - there is an outcry, and even some of our Royalist councillors are beginning to doubt our government's current course..."
 ord.25.a:0 "Damnation!"
 ord.26.t:0 "Glory League Coup Fails!"
 ord.26.d:0 "Our country was in shock today as word spread of an attempted Glory League coup! It seems several disgruntled generals and nobles, with the backing of several prominent clergymen, attempted to seize Istaroth and proclaim the reinstatement of the old government. Fortunately, our people's faith in the Royalist government has greatly grown following our successes, and the Glory League's call to arms was barely heeded. Those involved in the attempted coup have swiftly been arrested and are now facing judgement."
 ord.26.a:0 "We shall not go back to the genocidal insanity of the past!"
 ord.27.t:0 "Glory League Coup Succeeds!"
 ord.27.d:0 "People across the country rejoice as several righteous generals and nobles, with the backing of the holy Church, have successfully arrested the Royalist government and reinstated Glory League rule today. The blundering of the Royalists has caused great discontent amongst the populace, and they are happy to see a competent government restored. A great day for Ordoria!"
 ord.27.a:0 "An end to this appeasement of vermin!"
 ord.28.t:0 "Glory League Civil War!"
 ord.28.d:0 "Our nation is reeling from an attempted Glory League coup! This morning, an army of disgruntled soldiers and nobles, backed by a good portion of the Church, marched on Istaroth, seizing the capital and proclaiming the reinstatement of the old government! However, a good portion of the land, including the city of Varinthia, has openly condemned this coup and is rallying to drive the Glory League out. It seems a civil war is unavoidable!"
 ord.28.a:0 "A fine excuse to rid ourselves of the Glory League scum!"
 ord.28.b:0 "Rid our people of this Royalist insanity!"
 ord.29.t:0 "Eastern Ordoria Reclaimed!"
 ord.29.d:0 "After a gruelling campaign through the jungles of the East, we have finally brought the rebels to their knees! Quellion is ours, and the rebels' leaders are being rounded up and executed wherever we can find them. We must now decide what to do with our lands."
 ord.29.a:0 "We cannot allow them even a sliver of autonomy - integrate them!"
 ord.29.b:0 "If we give them a taste of freedom, it will keep them complacent - set up a vassal state!"
 ord.30.t:0 "Skaelinger Offers Peace"
 ord.30.d:0 "It seems the direness of their position has finally seeped through the thick skulls of the Dwarves - their diplomats formally offered peace today. What should our response be?"
 ord.30.a:0 "We've taught them their lesson - we have bigger fish to fry."
 ord.30.b:0 "Peace suits us, but they must accept some border adjustments."
 ord.30.c:0 "Peace?! We shall give them the peace of the grave!"
 ord.30.e:0 "If they swear fealty to the Ordorian Crown, they shall have their peace."
 ord.31.t:0 "Concessions - Skaelinger Accepts"
 ord.31.d:0 "Good news! Skaelinger accepts our proposed border changes - they have vacated the designated mountain ranges and passes, and our engineers are already en route to fortify these crucial strategic positions - our Eastern flank shall evermore be secure!"
 ord.31.a:0 "Excellent!"
 ord.32.t:0 "Concessions - Skaelinger Declines!"
 ord.32.d:0 "Despite their desperate situation, it seems the Dwarves are as stubborn as ever - they have refused our demands!"
 ord.32.a:0 "Their mistake."
 ord.33.t:0 "Vassalage - Skaelinger Accepts"
 ord.33.d:0 "It seems enough brute force can break even a Dwarf's will - the High King of Skaelinger has agreed to bend the knee as our vassal!"
 ord.33.a:0 "They have seen reason."
 ord.34.t:0 "Vassalage - Skaelinger Refuses"
 ord.34.d:0 "Dwarven stupidity knows no bounds - despite their impossible situation, Skaelinger refuses to swear fealty to us!"
 ord.34.a:0 "Their mistake."
 ord.35.t:0 "Punish Stahlhof"
 ord.35.d:0 "The arrogance of Stahlhof knows no bounds, and they have been as brash as laying their filthy hands on our lands! This ends now - we are going to march in and retake what is ours!"
 ord.35.a:0 "Forward!"
 ord.36.t:0 "Stahlhof Accepts!"
 ord.36.d:0 "Great news! Stahlhof has accepted our proposal, and though they will maintain a masquerade of loyalty for now, they will join us when the time is right."
 ord.36.a:0 "Our plans advance..."
 ord.37.t:0 "Stahlhof Rejects!"
 ord.37.d:0 "Those damned Stahlhoffers have the guts to reject our generous offer! We will have to proceed without their support."
 ord.37.a:0 "Damnation!"
 ord.38.t:0 "The Stahlhof Gambit"
 ord.38.d:0 "While the men of Stahlhof have been enroaching on our territory for decades and the ambition of their Freiprinz knows no bounds, perhaps this ambition can be turned to our cause. Rumor has it that Schwarzenbach's attacks on our lands are a mere ruse, allowing him to build up an army under the pretense of fighting us while in reality planning to seize the Freithron. Several of our advisors have now proposed a deal - Stahlhof returns our lands, and they get to rule the Union - under our benevolent guidance, of course."
 ord.38.a:0 "I do love an ironic plot twist..."
 ord.38.b:0 "Working with Stahlhof? Never!"
 ord.39.t:0 "Rthaur Resistance!"
 ord.39.d:0 "Though we have conquered the lands of the Rthaur rebels, they have not been cured of their foolish ideas. Apparently, they are building an underground network in our country, seeking to launch our nation into another civil war! If we do not integrate the rebel's lands quickly, we may yet lose all that we have gained!"
 ord.39.a:0 "Damnation!"
 ord.40.t:0 "Second Rthaur Revolution!"
 ord.40.d:0 "Though the wise among our advisors warned us of the dangers of the rebels' resistance, we did not heed their advice in time. The rebel's ideology has spread through our nation like a cancer, and they have risen up in open revolt, even stronger than the last time!"
 ord.40.a:0 "We've beaten them before, we'll beat them again!"
 ord.40.b:0 "We shall break the chains one final time!"
 ord.41.t:0 "Slave Revolt in Wethaur!"
 ord.41.d:0 "The vermin in one of our logging operations in Wethaur have revolted! Though their rebellion is disorganized, it has the potential to spread like wildfire if we don't act decisively!"
 ord.41.a:0 "Give them two meals a day instead of one, that should pacify their stupid little minds."
 ord.41.b:0 "The local Grove Guards will handle it."
 ord.42.t:0 "Slave Leader Emerges"
 ord.42.d:0 "It appears that local law enforcement has been unable to shatter the rebellious vermin quickly enough. A leader has emerged from amongst them, and the unorganised mass of vermin has turned into a guerillia army inside our own borders."
 ord.42.a:0 "Local law enforcement will have to try harder."
 ord.42.b:0 "Send in the army!"
 ord.43.t:0 "Revolt Crushed"
 ord.43.d:0 "The slave revolt is crushed! The heads of the ringleaders now stand on spikes in front of the slave's encampment, serving as a reminder to the vermin to know their place. Their spirit seems to have been broken."
 ord.43.a:0 "Back to business as usual."
 ord.44.t:0 "Glory League Riot!"
 ord.44.d:0 "It seems our tolerance of the demi-Elves in our country has angered the sympathisers of the Glory League factio, who are now rioting in the streets, attacking demi-Elven passersby and vandalizing propert!"
 ord.44.a:0 "I'm sure those demi-Elves started it!"
 ord.44.b:0 "Unacceptable - send in law enforcement!"
 ord.45.t:0 "Law Enforcement Joins Rioters!"
 ord.45.d:0 "It seems our guards are not exempt from racial prejudices - instead of stopping the riots, they are joining them! Demi-Elven businesses are being robbed and set on fire, and those demi-Elves that resist are beaten and jailed."
 ord.45.a:0 "Pull in law enforcement from other cities!"
 ord.45.b:0 "That's it - send in the troops!"
 ord.46.t:0 "Glory League Subdued!"
 ord.46.d:0 "Our actions have had their desired effects - the Glory League rioters have been subdued, and the day-to-day order of business has been restored!"
 ord.46.a:0 "Let's hope the economic damage was limited."
 ord.47.t:0 "Nobles Protest Austerity"
 ord.47.d:0 "A delegation of nobles has petitioned the government today, complaining about the austerity measures we have passed. They claim that it is their right to enjoy themselves as they see fit - how should we respond?"
 ord.47.a:0 "If they insist... let them eat cake!"
 ord.47.b:0 "They will change their tune once the Inquisition pays a visit to their homes."
 ord.48.t:0 "Nobles Attempt Coup!"
 ord.48.d:0 "Our attempt at strongarming the nobility has failed, and they have tried to seize power today! Though their attempt was pitiful, only securing them parts of the city of Ythelmare, they are still managing splendidly to disrupt our plans."
 ord.48.a:0 "We cannot afford a revolt at this time - let them have their luxuries."
 ord.48.b:0 "That's it! Send in the army."
 ord.49.t:0 "Coup Halted"
 ord.49.d:0 "The nobility's attempted coup has been crushed, the possessions of the rebellious and probably heretical traitors sold off to found a new temple in Ythelmare. Stability has been restored."
 ord.49.a:0 "Our plans advance."
 ord.50.t:0 "The Hofmeyer Question"
 ord.50.d:0 "Adalbrecht Hofmeyer, one of the Humans in our realm, has proven to be an incredibly competent administrator. He has risen far in the ranks of the government, being the personal aide of the recently-passed Governor of Ythelmare, and is now requesting we appoint him as the new Governor!"
 ord.50.a:0 "We must not waste potential, no matter its origin. Hofmeyer shall rule Ythelmare!"
 ord.50.b:0 "Never! The demi-Elves must know their place and be glad they are granted it!"
 ord.51.t:0 "Trial of the Five"
 ord.51.d:0 "Treason against the state in the highest circles of government! Several young nobles, including son of the King and heir to the throne Larennis Valinthir, have been discovered hiding vermin from the authorities! The Glory League demands the death penalty, but the King is pulling all the strings he can to save his son. What shall their fate be?"
 ord.51.a:0 "Larennis Valinthir and his compatriots are acquitted!"
 ord.51.b:0 "Larennis Valinthir and his compatriots are found guilty!"
 ord.52.t:0 "The Resderin Conclave"
 ord.52.d:0 "Religious officials from across the country have gathered today to discuss a matter that has almost split the Church in twain: should the Royalist faction, which advocates co-existence with the vermin in a segregated society, be declared heretical and an affront to our Holy Church?"
 ord.52.a:0 "The Royalists spit on the holy Elven image - they are heretics!"
 ord.52.b:0 "They are still elves - the Royalists are not heretical!"
 ord.53.t:0 "Succesful Raid!"
 ord.53.d:0 "Our policy of sanctioned privateering is paying off! Today, a small fleet of raiding ships sailed into port, laden with wealth from distant ports!"
 ord.53.a:0 "To the victor go the spoils!"
 ord.54.t:0 "The Rebellion Crushed Once More!"
 ord.54.d:0 "The Second Rthaur Revolution ended the same way the first did - humiliating defeat for the rebels. Their ringleaders have been dragged into Quellion's central square and were all beheaded in a display of Ordorian might. There are a few guerillia cells left in the jungles, but they will all be found and put to the sword in time."
 ord.54.a:0 "Final victory over the rebels is ours!"
 ord.55.t:0 "Hysbryn on the Move!"
 ord.55.d:0 "It seems the Humans of Hysbryn, or 'Holzbrenn' in their barbaric tongue, have designs on our lands! Our spies have reported that their armies are exercising for an invasion of our South-Western territories, with the goal of driving us from Tholder Bay!"
 ord.55.a:0 "First Schwarzenbach, and now this? Alert the troops!"
 ord.56.t:0 "Royalist Victory!"
 ord.56.d:0 "The civil war has been brutal and harsh on our people, but we stand triumphant, the purple flag of King Valinthir flown high over Istaroth once more. The King himself and his son and heir to the throne, Laurennis Valinthir, led the final assault on the last Puritan stronghold. The Glory League resistance has been shattered, and Lothinnys has been tried and executed as a traitor. The authority of the Royalists now stands unquestioned."
 ord.56.a:0 "Glory to King Valinthir!"
 ord.57.t:0 "Glory League Victory!"
 ord.57.d:0 "The civil war has been brutal and harsh on our people, but total victory over the Royalists and their sickening tolerance of the vermin has been assured as last. The King was placed under house arrest after trying to flee aboard a ship from Ythelmare, but his son, Laurennis, is still unaccounted for. Regardless, Glory League authority has been restored in Ordoria."
 ord.57.a:0 "Down with the lesser races and their Royalist cronies!"
 ord.58.t:0 "The Future of Ordoria"
 ord.58.d:0 "With the Royalist threat quashed, the old squabbles between the Glory League and the Sophists have flared up again. While they agree on the end goal of Elven supremacy, they are still in disgreement on how to achieve this goal. An impromptu meeting has been called in Istaroth to decide the course Ordorian politics should take."
 ord.58.a:0 "We shall lead Ordoria to glory and purity."
 ord.59.t:0 "A Governor for the East"
 ord.59.d:0 "Now that we have elected to set up Eastern Ordoria as a vassal state, we will need to decide upon who shall run it. A local noble could do the job just fine, but this may be a perfect opportunity to rid us of the government's most vocal critic - by shipping Prince Larennis off to rule the East, we keep him far away from the seat of power and render him unable to meddle with the government."
 ord.59.a:0 "Ship the Prince off to the East!"
 ord.59.b:0 "Lady Alstora will do just fine."
 ord.59.c:0 "A local noble is what we need!"
 ord.59.e:0 "Who else but my trusted Gyume?"
 ord.60.t:0 "The Dwarves Betray Us!"
 ord.60.d:0 "Though we agreed to a peace with the vermin of Skaelinger, it seems their treacherous nature has come to the fore! They have attacked one of our holdings in the Oramfell, taking advantage of our distractions elsewhere."
 ord.60.a:0 "If they are so insistent on being butchered, we are happy to comply."
 ord.60.b:0 "The cowards! But we do not have the troops to respond in force..."
 ord.61.t:0 "The Administration of Eastern Ordoria"
 ord.61.d:0 "With the fall of the despicable Rthaur race traitors, we have come to split control over their lands. Some are occupied by us directly, while others are under the control of the counterrevolutionaries. Until we decide on the best way to rule the East, we will let Farnaur's loyalists rule the entire region to reduce the administrative and military burden on our state."
 ord.61.a:0 "Let the Easterners govern these lands until we find a more permanent solution."
 ord.62.t:0 "Slaves Escaped!"
 ord.62.d:0 "It seems that the spirit of the vermin is not completely broken just yet. A few of them, discontent with serving their betters, have staged an uprising and fled into the forests! They slew several overseers on their way out, and their workplace will struggle to meet its quota if they are not recovered swiftly."
 ord.62.a:0 "Curses!"
 ord.62.b:0 "Send out the Corps!"
 ord.63.t:0 "The Princeling's Pawns"
 ord.63.d:0 ""...And that is why the Steward's despicable plans must be opposed by all true Ordorians!"\n\nA polite applause followed Larennis' impassioned speech. To foreigners, it may have sounded subdued. To an Ordorian, applause like this at court might as well have been raucous cheers and fireworks.\n\nDalyn sneered at the assembled Royalists.\n\n"Damnable traitors," he spat. "Them and that vermin-loving Princeling."\n\nLothinnys raised his hand, bidding Dalyn to silence.\n\n"He may be misguided, but he is still your Prince, Dalyn. Do not speak ill of him." Lothinnys permitted himself a smile. "Besides, the crowds he draws dwindle with every speech. The Princeling is overplaying his hand - he will be a political non-entity in no time."\n\n"Be that as it may, my Steward," Dalyn said, "but this is still a dangerously vocal opposition to your rule. We should squash them before a more sensible leader emerges among them."\n\nLothinnys considered his friend's words. Dalyn could be a little simple at times, but he did have a point - crushing the Royalists now would be much easier than trying to do so later, should a more competent leader step up among them. At the same time, letting Larennis dig his own grave would cause much less resentment to the League's goals than forcing the nobility in line would. After a moment, Lothinnys spoke up."
 ord.63.a:0 ""Larennis' idiocy will tire his supporters out soon enough. Let them come to us.""
 ord.63.b:0 ""Dissent will not be tolerated. They will obey, or they will be disposed of.""
 ord.64.t:0 "A Celebration"
 ord.64.d:0 ""A-and tush, my*hic*-my fellow Ordoriansh, we... we musht ceaz-ceash-shtop promoting the vile inshtitushion of shlavery befo*hic*-before it corruptsh the shoul of our natshion!"\n\nLarennis' words were slurred, as deep in the wine as he was, but his message still resounded with his equally-drunk friends. They had left the grand feasting hall once it had grown empty, retiring instead to one of the Princeling's studies, where celebrations were continuing well into the night. Yntha and Alwyen had snuck off together at some point, but that hadn't stopped Larennis, Thrysmere and Gylar from continuing to bask in the glow of their incredible dark horse-victory. The official celebrations had ended hours ago, but the youthful energies of the Princeling and his friends had seen them keep going well into the night, with Gylar continually egging Larennis on to give a speech after every glass.\n\n"Sho when are you having that bashtard Lothinnish arreshted, Larennish?" Thrysmere asked as he opened another bottle of wine. Larennis laughed loudly, before putting his finger to his lips, almost poking himself in the eye as he did so.\n\n"N*hic*-not too loud, Thrysh - he shtill hash many friendsh in the palash. Thatsh for later, when we've fikshed everything." The three friends cheered at the thought, and glasses were refilled once again."
 ord.64.a:0 "Tomorrow will bring struggles - a hangover chief amongst them - but tonight is ours!"
 ord.65.t:0 "A Question of Protocol"
 ord.65.d:0 "Larennis stifled a groan as he entered the brightly-lit palace courtyard. The weather was good, and so the court assembled outside.\n\n"My prince," a voice like poison spoke up. "We were expecting you at the traditional opening of the court this morning, your presence was sorely missed."\n\nLarennis waved his hand, his headache only compounded by Lothinnys' quasi-complaint.\n\n"We've not opened the court formally for centuries, Steward. Is now really the time to dredge up old formalities? I would like to discuss more important matters, such as the state of the Demi-Elv-"\n\n"I am afraid it is a very good time to restore cherished traditions, my Prince. The people need confidence in their new government. Speaking of," Lothinnys pulled out a quill and a thick stack of parchment, "We have some petitions we need you to sign. This was originally delegated to the Royal Advisors, but as a show of compassion towards your subjects, the court has agreed it would be only right if you signed them personally."\n\nLarennis looked at the tower of parchment now looming over him, and he rubbed his temples."
 ord.65.a:0 "This is going to be a long day."
 ord.66.t:0 "A Sea of Parchment"
 ord.66.d:0 "The sun was setting, and yet the soun of quill on paper did not cease. Larennis, arm weary and vision dancing, took another paper from the pile.\n\n"Local Ordinance 384 - Concerning Maritime Commercial Activities in the Thyldor Bay," it read. A quick glance confirmed Larennis' suspicions - a perfectly reasonable protection clause preventing any non-Ordorian fishermen to catch fish within a certain distance from the Ordorian shorelines in the Tholder Bay. Lothinnys had left this decree untouched, as it had already been twisted to suit his need when he changed the definition of 'Ordorian' from a subject status to a racial one. He put it on the pile of unaltered laws, and looked back at the work he had yet to do. For a moment, his heart sank as he thought the scribes had brought in yet another pile of laws, but Larennis quickly realised he was seeing double\n\nHe let the quill fall on the table and dragged his exhausted body to a nearby bench."
 ord.66.a:0 "Some rest. Just five minutes. Then I'll finish this."
 ord.67.t:0 "The First Decree"
 ord.67.d:0 ""...and this pile is to be delivered to the government's representatives in Ythelmare," Alwyen said. The messenger nodded solemnly, accepting the bundle of letters.\n\n"At once, my Lady. I shall make haste." With a curt bow, the man strode out of the hall, off towards the stable where earlier this morning dozens upon dozens of the finest horses had been prepared for journeys across Ordoria. Alwyen shot a weary smile towards Larennis.\n\n"That's the last of them. The Decree has been sent to every relevant corner of the realm, and some irrelevant ones too." Thrysmere adjusted his spectacles.\n\n"Do you think we've compromised enough? If nobody is going to abide by our Decree, have we really accomplished anything?" Yntha scowled.\n\n"If anything, I'd say we've compromised too much. The fuck does it matter if people listen to us if we don't tell them to be better people?"\n\nLarennis sighed from his throne - a smaller one, though just as ornate, stood to the right of his father's - and raised a hand, snipping the discussion in the bud.\n\n"We cannot know the consequences of our actions until we hear rapport from our subjects. Arguing over it now is fruitless, and I shall not abide by us wasting our time so frivolously." The words felt stilted and unnatural in his throat; the eloquence of Kings, not the carefree banter of mere octogenarians that he was used to. Regardless, when Larennis was sat on the throne, he felt obliged to project the image of a ruler.\n\nAnxiety gnawed at his heart, the same questions asked by his friends spinning through his mind. Half to himself, he muttered the same thing he'd just said."
 ord.67.a:0 ""It is done. Now we wait and see if we succeed.""
 ord.68.t:0 "The Reformers Reformed"
 ord.68.d:0 "Ulythyn was an early riser, and he was often at the local Sophist's forum before anyone else. This time, however, he was far from the only one there at this early hour; several soldiers in the livery of the royal household had cordoned the place off. The local Sophist, Yldin, was arguing with the troops, as animated as ever.\n\n"This is an outrage! You can't just, just... DISSOLVE the Sophistium!" The soldier shrugged, wiping Yldin's spittle off his face.\n\n"Too bad, got an order from the Princeling himself right here says I can," he said. "Funny, that." Yldis took a step back, his mouth hanging open.\n\n"Funny? You think it's funny to undo decades of reformatory work?" One of the other soldiers stepped forward, stern and emotionless.\n\n"The Itheryn have guided our people for millenia without these deluded, hateful reforms. I'd say we're a damn sight better off without them." Ulythyn put his hand on Yldin's shoulder.\n\n"Yldin? What's going on? Are they closing the Sophistium?"\n\nYldin turned, meeting Ulythyn's gaze.\n\n"They're closing the forum, but they're not going to close our hearts to the truth." Yldin's lips contorted into a snarl, and he turned away from the soldiers."Come, Ulythyn. We have work to do, away from these- these reactionaries!"\n\nYldin and Ulythyn left the forum, the soldiers' watchful gazes on their backs.\n\nThat morning, the convention of the Sophistium was held in Ulythyn's cramped hovel. A few Ordorians had failed to show, but those that were there seemed only hardened in their convictions by the actions of the soldiers."
 ord.68.a:0 "Philosophies can be forced underground, but they shall take root and flourish in the dark."
 ord.69.t:0 "The Steward Humbled"
 ord.69.d:0 "Lothinnys slammed the doors to his quarters open, heedless of the damage to the intricate woodwork the impact with the walls casued. His temples throbbing with adrenaline and his face contorted into a scowl, the Steward yanked open his cabinet, scouring his carefully-crafted legislation for anything he could use.\n\n"The little brat - he thinks he can get away with stripping me of my titles - nay, my DIGNITY, in front of all the court like that?"\n\nLothinnys pored over the documents, claims and precedents, looking for anything he could use to reverse the Princeling's decisions. The Sun reached its zenith and was long in its steep decline by the time the Steward's frustrations reached its peak. Decades of painstaking work, building on and correcting centuries of ancient laws, smashed aside by a bone-headed youngling barely into his eighties. He'd formulated and discarded argument upon argument, but as his work progressed, the realisation nothing he could say or do would sway the Princeling's mind. He sighed, resting his head in his hands.\n\n"Fine," he muttered to himself. "If the Princeling won't budge, damn the Princeling. I'll go after his supporters. Let's see him rule without friends or loyal vassals." He pulled out the reports the Oath of Harquiss had sent him - they were fortunately loyal to Ordoria and the Elven race, not to the government - and pored over them, taking notes on leverage he could use against supporters of Larennis. As his scheme began to take shape over the course of the night, one thing became clear:"
 ord.69.a:0 "The Princeling would regret this."
 ord.70.t:0 "A Crumbling Dream"
 ord.70.d:0 "...an unacceptable infringement upon cities' rights..."\n\n"...utterly beyond reasonable..."\n\n"...serious questions regarding the Princeling's fitness for governance..."\n\nReport after report flooded into the halls of the palace, a new messenger arriving by the hour.\n\nNone of them bore good news.\n\nIn the palace proper, Larennis and his friends pored over the irate letters, reports of disobedience, and public outrage against their Decree.\n\n"I knew it," Thrysmere kept quietly saying, "I knew we were pushing our luck too far."\n\n"By the Itheryn, would you shut up, Thrys?" Yntha snarled. "We bent over backwards, pissing on the principles of Venthys to get these cowards to agree to anything, and they still ignore us! If we'd watered the Decree down any further, we'd have accomplished worse than nothing!" Gylar shot up out of his chair, pointing a finger at Yntha.\n\n"That's easy for you to say - none of us are going to see our privileged little lives affected by th-"\n\n"ENOUGH!"\n\nEveryone froze in shock. Larennis rose, knocking the chair he sat in over backwards. He stared furiously at his friends, who one by one lowered their eyes. Even Yntha's rage evapourated, replaced by surprise and a tinge of fear.\n\n"Just... just go. I need to be alone."\n\nNobody moved.\n\n"Just. GO!" Larennis shouted, slamming his fist on the table. Thrysmere let out a yelp, and Alwyen flinched. Yntha put a reassuring arm around the paling Elf's shoulder, gently tugging at her arm.\n\n"Let's go, Alwyen," she whispered. Slowly, bit by bit, the group backed out of the room. Larennis turned and stomped off to his chambers."
 ord.70.a:0 "The doors slammed behind the Princeling, solitude and bitterness his only companions."
 ord.71.t:0 "A Quiet Hope"
 ord.71.d:0 "Larennis laid in his bed, enjoying the warmth of the Sun as it flooded his room. He'd always enjoyed sleeping in; it was one of the few un-Princely habits he'd allowed himself to keep after he'd started to spearhead the Royalist movement. A rapid knocking roused him from his musings, but before he was able to respond, the door burst open, and his friends barged into his room. Larennis began to raise a protest, but before he could get a word in, Alwyen began excitedly shouting at him.\n\n"We've done it! Larennis, we've actually done it! Here, look at these-" she began pulling letter after letter from a leather postman's bag, throwing them on the bed. Larennis shot up, all drowsiness banished from his minds, his objections of privacy forgotten.\n\n"...see the wisdom in your requests and shall comply immediately..."\n\n"...after careful consideration, we accede to your demands..."\n\n"...a tempered Decree that shows wisdom and authority..."\n\nThere were, of course, a few detractors, but even those would fall in line, with the overwhelming support for Larennis' actions. The mood in the room was almost raptorous: Alwyen bounced around the room, only occasionally stopping to plant a kiss on her girlfriend's lips; Thrysmere's pacing and hand-flicking seemed to be of joy rather than anxiety for once, Gylar cheered and punched Larennis' shoulder, and the Princeling himself was practically dancing, completely forgetting about the decorum he tried to maintain or the fact he was in his undergarments. Only Alwyen seemed less than enthused.\n\n"Not to be a spoilsport, Larennis," she began, "but did we really achieve something here? We've made so many compromises - I'm worried this'll just entrench us in token tinkering instead of real change." Larennis looked up at her.\n\n"I understand your worries, Alwyen, but you are wrong - we did accomplish something important here. We asserted our legitimacy and our authority, and that is crucial in enacting change. These changes are small, yes - but now that our subjects have bowed to our demands, our position is stronger, and we can bring about more significant reforms." Alwyen's eyes betrayed uncertainty, but Thrysmere smiled at the Princeling."
 ord.71.a:0 ""Congratulations, Your Grace. You have the makings of a High King in you.""
 ord.72.t:0 "Heavy is the Head"
 ord.72.d:0 "Larennis stifled a groan as Lady Alstora produced yet more papers from her bag. Quietly, he wondered if that bag was enchanted to hold limitless amounts of contracts, treaties, and petitions - it sure seemed like it.\n\n"Well, then, now that the matter of jurisdiction over Quellion is settled, we can discuss the reconstruction of the road network," Alstora said, her face emotionless. Thrysmere felt his eyes glaze over.\n\n"The roads? Aren't those the responsibility of the local rulers?"\n\n"Normally, yes, but given the precedents set during Inskylllithe's campaigns, the duty of infrastructural maintenance during wartime falls to the High King or his representative - this being you. Now," Alstora continued as she shuffled her sheaf of papers around, "the Steward has pioneered the use of indentured demi-Elves for road maintenance. It is my understanding you wish to reverse this practice, but the current economic situation suggests we stay the course to make sure-"\n\nLarennis' thoughts trailed off as Alstora's long-winded, meticulously crafted sentences washed over him. Lothinnys had been using slave labour, a despicable practice that many opposed for various reasons. He and his for the moral abhorrence of the act; many more moderate Royalists for the damage it did to their economic position of feudal lords. And here Alstora Holynthor, spokeswoman for the Royalist faction of the Royalists, sat arguing in favour of continuing that despicable institution? He'd worked so hard, made so many deals, convinced so many people - and now one of his most essential supporters asked him to endorse one of the most evil works of the Elf he had striven to topple? Bile rose in his throat, and before he knew it, Larennis' lips spat out a single word."
 ord.72.a:0 ""No.""
 ord.73.t:0 "What Is Right"
 ord.73.d:0 ""No."\n\nThis interruption, not to mention grave breach of protocol, gave even the impeccable etiquette of Alstora pause for a fraction of a second. "I beg your pardon, my lord?" she asked, her spiel interrupted, seemingly too flabbergasted to even be offended.\n\n"No. Slavery is one of the vilest of crimes imaginable, flies in the face of Venthys and Lombrin alike, and was one of the favoured tools of wicked Vergallheim. We will no longer stoop to a level so low." Alstora nodded, her composure recovered already.\n\n"Instead, I shall personally fund the repair teams for a period of five years. These funds shall come from my royal allowances, supplemented with the sale of my summer estates, chariots, artworks, and other luxuries. Ordorians, Elves or no, shall not toil in poverty while I have more wealth than I know what to do with." If his previous statement had thrown Alstora off guard, this new approach completely blindsided her.\n\n"The sale of your personalia, my liege? But your prestige, the respect of your va-"\n\n"Enough, Lady Alstora," Larennis said, raising his hand. The anger and disgust he felt earlier boiled up again, even worse this time - he was trying to do good, and his reward was nonsense about optics?\n\nHe got up out of his seat, a violation of norms so flagrant it made his previous breaches seem tame in comparison. "They are my goods, and I shall decide what happens to them." Alstora was speechless, making faint choking noises as Larennis' emotions overwhelmed him. All logical parts of his brain screaming against his actions, Larennis turned away from the table, took a few aggressive steps, and pondered for a second before turning towards..."
 ord.73.a:0 "...his father, like he'd done so often."
 ord.73.b:0 "...his friends, who he trusted like no other."
 ord.73.c:0 "...the negotiating table, biting down the bile."
 ord.74.t:0 "Thicker than Water"
 ord.74.d:0 "Larennis strode from the room, Alstora frozen in disbelief, various diplomats and servants rushing in to appease the lady and control the damage Larennis had just caused. The Princeling didn't care; he'd had enough of the power politics and the self-serving cynicism of the court. Barely thinking, he went where his legs took him - where they'd always taken him when life became too much to bear.\n\nBefore he even fully realised where he'd gone, Larennis found himself knocking on the door to his Father's study. Without waiting for a response, he opened the door and stepped in, finding the High King reading a book of First Empire poetry besides the hearth. Galerin looked up, mild annoyance chased away by the same melancholic compassion as always in his eyes as he saw his son.\n\n"What is it, Larennis? Are you all right?" he asked, softly.\n\nBefore he could formulate a single sentence, Larennis burst into tears on the spot.\n\nWithout a word, his father stood up, letting the book fall to the side, and embraced his crying child. They stood there for what seemed like hours, as all the weight that Larennis had been bearing over the past months came flooding out. Eventually, the warmth of his father's loving hug dispersed the grief, and there were no more tears. Gently placing a hand on his son's shoulder and looking him in the eyes, Galerin spoke.\n\n"You have been working very hard, Larennis. You've worked harder than I ever have, and you've not even reached your centennial yet. You've been carrying a great burden in trying to do what you see as good, against the wishes of many powerful people in Ordoria, and that is admirable. But you've been trying to carry it alone, as you've tried since childhood. Please stop doing that."\n\nWith a tear-streaked face, Larennis nodded, and his father hugged him again.\n\n"I love you, son. Should the weight of responsibility become too much, please - come to me. If I cannot give you counsel, I can at least give you support, no matter what you decide to do. I will alway, always be here for you." Larennis felt tears welling up in his eyes again as he hugged back."
 ord.74.a:0 ""Thank you, Father. I love you too.""
 ord.75.t:0 "The Blood of the Covenant"
 ord.75.d:0 "Larennis strode from the room, Alstora frozen in disbelief, various diplomats and servants rushing in to appease the lady and control the damage Larennis had just caused. The Princeling didn't care; he'd had enough of the power politics and the self-serving cynicism of the court. Shoving the door shut behind him, Larennis was so surprised to see his friends waiting there that he'd almost barrelled through them before he realised they were there. He stood there for a moment, processing what just happened.\n\n"So... that bad, huh?" Thrysmere asked, running his thumb around his index finger. Larennis nodded.\n\n"Y-yeah. She actually started arguing for slavery, if you could believe it." Yntha whistled. \n\n"That's audaciously fucked up, glad you got outta there." She produced a flask of something from under her dress. "Need a drink?" Larennis shook his head.\n\n"No, thank you - I've made enough faux pas for today." Yntha shrugged, uncorking the bottle.\n\n"Suit yourself."\n\n"So what now?" Alwyen piped up. Larennis thought for a moment, running through the issue at hand, trying to find a solution to the grave breach of etiquette he'd just caused.\n\nHe couldn't find any. Every idea useless. Every plan a waste.\n\nLarennis felt his shoulders slump. "
 ord.75.a:0 ""I... I don't know. I think I made a mistake.""
 ord.76.t:0 "Never Alone"
 ord.76.d:0 "Before he'd even finished the sentence, Gylar spoke up.\n\n"Nonsense, Larennis. Slavery has to go. We compromise on that now, we set a precedent, and we never rid our country of it. We can find an alternative solution later - for now, you've done the important thing." Thrysmere nodded.\n\n"Plus, I've run the numbers. Slavery is not cost-effective. We'd get worse quality labour compared to free workers or serfs - we'd be spending more on maintaining bad roads in three years than we'll spend on building them properly the first time around."\n\n"And hey - don't worry about the etiquette - I see worse from older Elves at balls every other week. I'll have this smoothed over in no time," Alwyen said, flashing him a smile and a wink. Despite the doubts plaguing him, Larennis smiled.\n\n"Thank you for the vote of confidence, friends. It bolsters me greatly. And, for what it's worth, I've already found that alternate solution, Gylar - I shall auction off my luxuries and bring my allowances to bear to fund the reconstruction." Yntha punched his shoulder as the rest cheered.\n\n"See? This right here is why we love ya, big guy. Always got your heart in the right place." Larennis' smile grew as anxiety made way for warmth in his heart."
 ord.76.a:0 ""Thank you, friends. I love you too.""
 ord.77.t:0 "The Greater Good"
 ord.77.d:0 "Taking a brief second to breathe, Larennis collected himself. He'd made a big mistake, but he could still fix this, or at least limit the damage. He turned around with a perfectly-trained smile.\n\n"My sincere apologies, Lady Alstora," he said, forcing the words out of his protesting throat. "That outburst was unbecoming of me and undignified towards you; I fear the stress of adapting to governance at a mere eight decades old is coming to me. I plead for your forgiveness." Alstora sat, stony-faced, before returning the smile graciously.\n\n"Of course, your Grace," she said. "It has happened to the best of us; I laud your self-awareness, and you are forgiven. You have taken on a great task for your age, none could expect you to remain flawless throughout." That last barb stung almost as much as his grovelling did, but Larennis pushed on. For the sake of Ordoria, he thought, sitting back down.\n\n"Excellent, you have my gratitude. Now, then - I believe that my personal funds should still suffice for the projects?" Larennis settled in and resigned himself for yet more hours of soul-draining negotiations."
 ord.77.a:0 "Larennis hoped it would get easier. It never really did."
 ord.79.t:0 "Peace with Skaelinger?"
 ord.79.d:0 "With the fall of the rebel strongholds in the East, the position of the Skylynaur Dwarves has become increasingly untenable. At the same time, a full-scale invasion of their mountainhomes would inflict horrendous casualties on our forces, and potentially fatally weaken us for when we march against the Humans. Should we strike, or should we sheathe our swords?"
 ord.79.a:0 "We have bigger priorities. If they concede some border territories, they may live - for now."
 ord.79.b:0 "Peace?! We shall give them the peace of the grave!"
 ord.80.t:0 "Expedition Returns Empty-Handed"
 ord.80.d:0 "Though our brave explorers searched long and hard for the tomb of great Inskyllithe, they have been unable to locate his resting place. As their supplies dwindled, they were forced to return home and resupply. We will have to try again in the future."
 ord.80.a:0 "We will not give up. We cannot."
 ord.81.t:0 "Inskyllithe's Tomb Found!"
 ord.81.d:0 "They had been gone for longer than ever before. We thought them lost, perished in some cavern at the hands of a monstrosity, or frozen at some desolate mountain peak.\n\nLate this night, around three in the morning, we were proven wrong, and all of Ordoria rejoiced.\n\nA ragged, weary band was intercepted by a patrol around Quellion, identifying themselves as the raiding party in question. They were tired, and they were hungry, but the were almost rapturous in their joy. After a brief rest, bath and meal in the former rebel capital, they were rushed back to Istaroth, to bear the best news any Ordorian will ever hear."
 ord.81.a:0 "Rejoice, for our High King's Tomb is found!"
 ord.82.t:0 "Skaelinger Returns Our High King!"
 ord.82.d:0 "The entire nation awaited response from our enemies with bated breath, wondering if the vermin would see reason, or risk another war over our demand. Fortunately, it seems they realised how untenable their position was, and a caravan under armed escort arrived at Istaroth today, returning our High King to us."
 ord.82.a:0 "Celebrate, Elves, for our King is returned to us!"
 ord.83.t:0 "Skaelinger Refuses to Return Inskyllithe's Remains"
 ord.83.d:0 "The Vergall vermin continue to be legendarily bone-headed - despite them knowing full well the consequences of denying us, they have refused to give up Inskyllithe's remains!"
 ord.83.a:0 "Damn them! But they are too entrenched..."
 ord.83.b:0 "Fine, then - we'll go get him ourselves!"
 ord.84.t:0 "Inskyllithe's Remains Desecrated!"
 ord.84.d:0 "This is unspeakable.\n\nWe expected very little decency from the vermin, but when we asked them to deliver onto us the remains of our lost High King, we assumed they would at least have the decency to deliver him in good condition.\n\nNot covered in dung, crude inscriptions etched in the bones, delivered in a sack full of maggoty meat and rotten organs, unceremoniously dumped at the gates of one of the border forts.\n\nThe Steward is furious, and we're trying our best to hide this ignoble fate from our populace, but it has left our upper echelons utterly demoralized."
 ord.84.a:0 "How dare they?!"
 ord.84.b:0 "If they want to fucking die, then they shall FUCKING DIE!"
 ord.85.t:0 "Questions of Governance"
 ord.85.d:0 "Lothinnys drank deeply from the mug of coffee his aide had so considerately prepared for him as he watched the sunrise from his balcony. He hadn't slept much, these last few weeks. There had been so much work to do. Not only was there the job of restoring the rightful administration to the former rebel territories, a monstrous task in its own right, but on top of that his coalition had begun to fracture. With the immediate threat of the rebellion crushed, the unity his people had displayed had shown cracks, as some defected to the Royalists and their false promises.\n\nLothinnys had been working around the clock to keep his government together - and it had seemingly been paying off. The last few letters had been penned, though his hand was cramped and he'd almost run out of ink. All he needed to do now was make one final decision: who was to become the new Viceroy of Eastern Ordoria? Though Farnaur Ithys, the landowner-turned-counterrevolutionary hero was the obvious choice, part of the Steward's mind had entertained the notion of removing the Princeling from power by shipping him off to Quellion.\n\nDowning the last of his coffee, Lothinnys turned around. He'd made his decision. The new Viceroy would be..."
 ord.85.a:0 "...Larennis."
 ord.85.b:0 "...Ithys."
 ord.86.t:0 "The Discovery of the Second Oath"
 ord.86.d:0 "Lothinnys' morning delegations were interrupted by the arrival of a messenger, and he tried not to show his frustration. ''What is it?'' he asked, steepling his fingers on top of his desk.\n''Steward, I have just come back from delivering some of your messages to the Oath's headquarters... half of them were wearing Sophist imagery.''\n A moment of tense silent spread over the two of them. ''You must be mistaken, there is no way that the Oath- My Oath- would ever fall to the Sophists.'' Lothinnys had risen out of his chair, and the messenger's eyes grew wide, pressing his back against the frame of the doorway.\n ''Sir, I swear, the Sophists... they've taken control. Even if we were to drive them all out, the Oath would be all but crip-''\n ''Leave me.'' Lothinnys said coldly, stunning the messenger with his interruption. But he was too scared to protest to this violation of order, and quickly left the room. Lothinnys stared at the doorway, before turning to his desk. He slammed his pen into the desk, cracking the top of the expensive wood as it was embedded into the desk. ''Damn you, Vernythe,'' he hissed, fingers curled as if he wanted to strangle someone, anyone, who made their neck available."
 ord.86.a:0 "The Last Days of the Glory League"
 ord.87.t:0 "The Last Night of the League's Oath"
 ord.87.d:0 "Creany climbed out of bed, heading outside for a midnight walk. They always cleared his head, and with the tumultuous events happening, he needed some clearing. Day by day, more and more members of the Oath put on Sophist imagery and openly declared their loyalty to the Sophists instead of the Steward. Something had to be done, but what?\n\n After a quarter of an hour, he returned to his barracks, and heard something wrong.\n Or really, didn't hear what he should have. No quiet breathing, not even the annoying snores of the woman 3 beds to his left. It was as if everyone had suddenly disappeared while he was gone.\n Then he saw it, the splash of red on a pillow. Someone had attacked the barracks! But who would dare attack the Oath of Harquiss!? He hurried through the barracks, and burst through a door when he heard movement on the other side.\n\n An Oath member looked up at him in surprise, dropping the body of another he had been carrying. ''League!'' he shouted.\n Creany backed up to try and escape, not wanting to find out what they intended to do to him, before running right into another elf, the yellow band of a Sophist sympathizer seeming too bright to Creany's eyes. And then he felt something sharp sinking into his stomach.\n Falling to his knees, he looked up in shock at his fellow countrymen, each wearing Sophist imagery, and choked out ''Why? Why betray the Steward?''\n\n He couldn't hear their response as he slumped over onto the wooden floor, and it all faded to black."
 ord.87.a:0 "Another mass grave appeared by next morning"
 ord.88.t:0 "The Fate of Lothinnys"
 ord.88.d:0 "Vernythe stood on his balcony, and looked over at Gyume, his ever-present ally. ''We cannot just let Lothinnys run free, after taking the Oath out from under him,'' he said.\n ''What can he do? You've wiped out most of the influential League loyalists inside, but there's security that Shalyn would struggle to outwit.''\n ''But there is always the chance. He's a loose variable that we can't control.''\n Gyume sighed. ''Histarine, he cannot do anything to you anymore other than inconvenience the Sophists.''\n ''But that inconvenience may come at the wrong time, and ruin everything we've struggled to build up. I cannot let our sacrifices be in vain, let the Rthaur mobs swarm over Istaroth!''\n Gyume put a hand on Vernythe's shoulder. ''My friend, remember that there is more to the country than your ambitions. We must end the divide, but we do not need to eliminate everyone to achieve it.''"
 ord.88.b:0 "''Lothinnys is too big a threat to just let lie.''"
 ord.89.t:0 "Royalists Caught helping Escapees"
 ord.89.d:0 "While there were many rumours and beliefs that the Royalists were running some of the routes non-elf slaves were using to escape the country, until recently there hadn't been any hard proof. But now a carriage of several high-ranking Royalist members full of escaped slaves have been intercepted by the Inquisition.\n It must be decided how these traitors to the state must be dealt with, though we may shake the boat with how these are members of the nobility, as minor as they may be."
 ord.89.a:0 "Put them under house arrest"
 ord.89.b:0 "Send them to labour camps"
 ord.90.t:0 "Investigating the Nobility"
 ord.90.d:0 "The evidence of the Royalist escape attempts being linked to the nobility is now undeniable, but now the question is how to deal with the issue. Dedicating the Inquisition to the nobility would be more trustworthy and less consequential, but would drain resources from other focuses. There is also the possibility of finding nobles that are willing to align with us, and trusting them to do their own dedication."
 ord.90.a:0 "Devote the Inquisition to the Nobility"
 ord.90.b:0 "Get Loyal Nobles to Work on it"
 ord.91.t:0 "Nabbing the Royalist Masterminds"
 ord.91.d:0 "After selective investigation of the nobility, we have located several influential Royalists who are vital to the operations of the slave escapes. Now it must be decided what to do with them, for the good of the state."
 ord.91.a:0 "Arrest the influential Royalists"
 ord.91.b:0 "Exile the Royalists"
 ord.91.c:0 "Send the non-elf sympathizers to work camps"
 ord.92.t:0 "An Exiled Ordorian"
 ord.92.d:0 "An Ordorian named Tasar Beijyre has arrived in our lands, asking for refuge, saying she was exiled for helping non-elfs escape the plantations they worked on."
 ord.92.a:0 "We shall grant her refuge"
 ord.92.b:0 "We cannot trust her, send her elsewhere"
 ord.93.t:0 "The Nobility in Chaos"
 ord.93.d:0 ""
 ord.93.a:0 "Let the Nobles Sort it Out"
 ord.93.b:0 "Have the Inquisition Intervene"
 ord.94.t:0 "Assuring the Princeling's Safety"
 ord.94.d:0 ""
 ord.94.a:0 ""
 ord.95.t:0 "Guerilla Terror Campaign"
 ord.95.d:0 ""
 ord.95.a:0 ""
 ord.96.t:0 "Remaining Glory League Members flock to the Royalists"
 ord.96.d:0 ""
 ord.96.a:0 "An Unholy Alliance"
 ord.97.t:0 "Remaining Royalists flock to the Glory League"
 ord.97.d:0 "Following the virtual destruction of the Royalists after Larennis' restriction to the palace, they have fled to the only other sizeable political group in Ordoria; the Glory League. In spite of their vast differences, they have decided to focus on the greater threat that is the Sophists."
 ord.97.a:0 "An Unholy Alliance"
 ord.98.t:0 "Derathur Kidnapped!"
 ord.98.d:0 "Our glorious leader has disappeared in the night, and there can be no possibility but kidnapping, for he would not abandon us! The Oath of Harquiss must have done it!"
 ord.98.a:0 "The Horror!"
 ord.99.t:0 "Derathur is Ours!"
 ord.99.d:0 ""
 ord.99.a:0 ""
 ord.100.t:0 "Rabble-Rousers Imprisoned!"
 ord.100.d:0 "With the fall of Quellion, our loyal warriors have swept through the city, arresting anyone suspected of involvement with the rebel movement. While some arrestees were let go after proving their loyalty, several high-ranking rebel officials have been caught and imprisoned!"
 ord.100.a:0 "We have plans for you, scum."
 ord.101.t:0 "Lirothlind Agrees to Trade!"
 ord.101.d:0 "Excellent news - our wayward kin in the Northern snowlands have agreed to begin trading with us! This is an excellent first step to ending our isolationism. Our captains are clamouring to be the first to set sail with a full cargo towards Silnarond."
 ord.101.a:0 "Did you bring any of their wodka home?"
 ord.102.t:0 "Lirothlind Declines our Offer"
 ord.102.d:0 "Sadly, it seems those stubborn zealots up North remain as bull-headed as when they first left our homeland. We will have to put our new trade vessels to use domestically."
 ord.102.a:0 "This is a setback."
 ord.103.t:0 "Lirothlind - Quid Pro Quo?"
 ord.103.d:0 "Lirothlind has indicated they would be willing to sign a trade agreement, but not without a favour. It seems the current Heir Apparent to the Lirothline throne is on shaky ground, and seeks to cement his legitimacy through our support. If we are willing to back his right to rule, our frigid cousins will agree to trade."
 ord.103.a:0 "Very well, we shall send a cousin there."
 ord.103.b:0 "The insolence - absolutely not!"
 ord.104.t:0 "Acute Steel Shortages!"
 ord.104.d:0 "Thrystar glanced at his father. The old blacksmith had been leaning against the wooden post propping up the overhang of the family smithy for the last few hours, peering out over the streets of Istaroth.\n\n"I don't think they're coming today, Pa," he said. His father let out a single "Hmph," but otherwise remained quiet.\n\n"Dad, seriously. It's been well past sunrise. The ore should've been here by now. How are we supposed to meet the army's quotas if we dont' get the materials we need?" Thryster's father shrugged.\n\n"Not my problem.""
 ord.104.a:0 ""'Leastwise, not until the rebels come knocking. Still, what can you do?""
 ord.105.t:0 "The Olive Branch"
 ord.105.d:0 ""My Lord, I must protest in the strongest possible terms. These rebels drove out their rightful rulers - killed them even, in some areas - and now you want to pardon them?"\n\nLarennis blinked, resisting the urge to rub his temples. Alstora was a powerful ally, but so set in her ways sometimes.\n\n"My Lady, I appreciate the severity of the situation. Indeed, it is precisely the reason I am seeking a diplomatic solution." The next part was the lie Gylar and Larennis had concocted; the kind of cynical, self-serving motivation that Alstora and her faction would buy. Larennis had always been a terrible liar; he hoped he was a fast learner, too.\n\n"Consider this - if we go to war, we spill a lot more blood before this is through, and that's without even getting into the peace. You've seen the rebels fight; they'll resist us for years, perhaps decades, after the war officially ends. We'd have to maintain active anti-guerilla activities in the Eastern cities and countryside, sapping our strength yet further. Not to mention the economic costs - if half the peasants die resisting us and the other half has to be jailed for revolting, who will till the fields - your fields? If we can convince the peasants to put down their arms and return to their fields in peace, not only will the reintegration be far easier, but we shall also have more bodies to put to work." The callous description of people - his people, the ones he had a duty to protect - as mere 'bodies' to put to work sickened Larennis.\n\nAlstora stared at him, face unreadable, for what felt like hours. Eventually, she nodded.\n\n"Very well, Lord. You argue a persuasive case. I cannot say I believe your... endeavours... will bear fruit, but I shall not stand in you way.""
 ord.105.a:0 "Foolish, perhaps, but we must try."
 ord.106.t:0 "The Response"
 ord.106.d:0 "When the messenger returned, few expected good news, but Larennis still held out hope. Sadly, it turned out to have been misplaced. The response from the rebels was as curt as it was clear; there would be no peace. This dispute, and the future of Ordoria, would be settled on the battlefield."
 ord.106.a:0 "War it is, then. Senseless, bloody, miserable war."
 ord.107.t:0 "Restoration of Order"
 ord.107.d:0 "As the banners of the Royal family fluttered in the brisk wind, hanging proudly from the balustrades of the palace walls, Larennis Valinthir couldn't help but feel the heavy burden of leadership. The dream of a fair and just Ordoria seemed to slip further from his grasp with each passing day. He'd argued for hours with Alstora, pleading for her and her supporters to see reason - the rebels had risen up against the Steward. The Steward was now gone. Therefore, they should at least attempt a diplomatic solution.\n\nThe assembled nobles would have none of it. They had been driven from their lands, their wealth seized, and often had their family injured or slain. They demanded blood.\n\nLarennis heard the door behind him open, and was soon joined by Alwyen. Even her usual smile had dimmed.\n\n"So... war, huh?" Larennis nodded. Alwyen placed a gentle hand on his shoulder.\n\n"It happens, Larennis. You did what you could. We can't expect everything to change overnight. Let's just try to make this work as best we can, and end it with as little bloodshed as possible."\n\nAfter a moment of silence, Larennis nodded."
 ord.107.a:0 ""We do what we can. That is all any can ask of us.""
 ord.108.t:0 "Feast Your Eyes"
 ord.108.d:0 "The night was quiet. This was unusual, as normally even the rare clearings in Ordoria's jungles were rife with the buzzing and chirping of animal life.\n\nNothing lived on the blood-soaked fields that had been a battlefield mere hours ago, however.\n\nLarennis cast his eyes over the site, feeling the numbing chill of desperate horror seep into his bones. Corpses littered the battlefield, the dark and mud-covered uniforms making it impossible to tell friend from foe. Spears and broken banners jutted from the ground, almost as if in mockery of the disciplined Ordorian battle-lines he had overseen that day. Larennis' gaze shifted to the left, and he saw the corpse of an Elf being held almost upright by the broken shaft of a polearm that had been rammed right through his chest. blood slicked the spear's wood, and the woman's eyes bulged out of her head, forever bloodshot and wide open, her face contorted into a look of agony.\n\nLarennis wasn't sure if it was that gaze, or something else, but he could suddeny no longer bear seeing this dead woman standing upright. He kicked his horse in the flanks, trotting over to where she stood. Once arrived, he grabbed the spear close to the ground - her hands were covered in splinters, he now noticed. She'd tried to dig the weapon out of her guts.\n\nFighting back nausea and the urge to flee alike, Larennis yanked the wooden shaft out of the ground, gently letting the corpse slide back onto the ground and off the weapon. Tossing the splintered, broken wood aside, Larennis knelt besides the woman. Were there any back home worrying about her, he wondered? A mother? Children, perhaps? He hoped not.\n\nNot knowing what else to do, Larennis reached out a quivering hand, and folded the woman's stiff hands onto her chest.\n\nShe looked somewhat more peaceful, if you ignored the gaping wound in her gut.\n\nLarennis closed her eyes. It was all he could do."
 ord.108.a:0 "Could any goal justify... *this*?"
 ord.109.t:0 "Securing the Ryselin - Success!"
 ord.109.d:0 "Great news - our brave forces have pushed the rebels back beyond the banks of the river Ryselin! While it will be dangerous, shipping our iron and supplies by barge is now possible."
 ord.109.a:0 "Excellent!"
 ord.110.t:0 "Securing the Ryselin - Stalemate"
 ord.110.d:0 "Due to circumstances beyond our control, the struggle for the River Ryselin has come to a stalemate."
 ord.110.a:0 "We will have to try again."
 ord.111.t:0 "Securing the Ryselin - Defeat"
 ord.111.d:0 "Damnation - the rebels have puhed back our attempt to seize the river Ryselin! Our iron mines remain dangerously isolated."
 ord.111.a:0 "Curses!"
 ord.112.t:0 "Concessions to Skylynaur - Accepted!"
 ord.112.d:0 "Our envoy to the Dwarves has returned with good news - Skylynaur accepts! We are to immediately vacate the mountains, but our mining operations may continue unmolested."
 ord.112.a:0 "Not an ideal solution, but our supplies of ore are safe."
 ord.113.t:0 "Concessions to Skylynaur - Declined!"
 ord.113.d:0 "The Dwarves have rejected our most generous offer for peace! The war goes on, but the Princeling's position has significantly weakened as a result of this embarrassment."
 ord.113.a:0 "Damnation!"
 ord.114.t:0 "Peace with Skylynaur - Accepted!"
 ord.114.d:0 "Good news from the East - the Dwarves have accepted our offer of peace!"
 ord.114.a:0 "At last, the bloodshed ends."
 ord.115.t:0 "Peace with Skylynaur - Declined"
 ord.115.d:0 "Terrible tidings from the East - the Dwarves have refused our peace offer! The war continues, but the Princeling stands weakened."
 ord.115.a:0 "Curses!"
 ord.116.t:0 "Rebel Weapons Seized!"
 ord.116.d:0 "With the fall of the rebellion, many of the weapon caches they have hidden throughout the Eastern territories have been left unused. With the right pressure, we have made some of their former officers squeal and reveal the location of these caches, freeing the weapons up for Ordorian use!"
 ord.116.a:0 "Excellent!"
 ord.117.t:0 "Countryside Stabilizes!"
 ord.117.d:0 "Our programme of rural restoration has been difficult, but we have succeeded! The Steward's damage to our pristine countryside has been undone at last!"
 ord.117.a:0 "Ordoria is feudal - then, now, and forever more!"
 ord.119.t:0 "Light Hearts"
 ord.119.d:0 "Larennis put down his quill and stretched.\n\nIt had been the latest in an endless stream of long days, but he didn't quite feel tired. In fact, the only thing he felt was a sense of tremendous giddiness - so much so that he'd been struggling to maintain his composure.\n\n The rebuilding of the East had gone smoother than he could've ever imagined, the demi-Elves of Ordoria enjoyed increasing freedoms by the day, and his enemies had been scattered to the wind. Vernythe had been seething impotently, finding his own position more tenuous by the day, while the Steward had scarcely been seen outside his residence. Neither seemed a real threat to his plans at the moment.\n\nHearing the sounds of laughter outside his window, Larennis rose from his desk. His friends were outside, enjoying the vistas from one of the palace's many balconies - they'd bought supplies for a picnic, by the sounds of it. After a moment's pause, he stooped over, opening the lowest drawer in his desk, and produced a vintage bottle of priceless Mentherisur wine - his favourite, and an incredible rarity, even amongst the highborn. Larennis figured tonight was as good a night as any to enjoy it; there was much to celebrate. With a smirk, he flung open the door to his study, starting his march to his friends. He finally allowed the mask to slip, and his laughter could be heard long before he joined his companions, and lasted long after the sun had set.\n\nThere would be more struggles.\n\nThere would be more challenges.\n\nBut for now, they had won."
 ord.119.a:0 "It has all been worth it."
 ord.120.t:0 "The Dust Settles"
 ord.120.d:0 "Larennis put down his quill and stretched.\n\nIt had been the latest in an endless stream of long days, and he was very tired. He'd been tired for a long time - so much so that he'd been struggling to maintain his composure.\n\n The conquest of the East, a regrettably bloody affair, had predictably not settled with the destruction of the rebel government. Reconstruction efforts had been difficult, and progress was slow. Though the demi-Elves of Ordoria enjoyed increasing freedoms, no longer being reduced to slavery, many had found themselves subject to the whims of the aristocracy Larennis had been forced to align himself with. At least that very same aristocracy was a powerful boon, both politically and militarily -his enemies had been scattered to the wind. Vernythe had been seething impotently, finding his own position more tenuous by the day, while the Steward had scarcely been seen outside his residence. Neither seemed a real threat to his plans at the moment.\n\n Larennis rose from his desk. He had yet another appointment with Lady Alstora - something about foreign policy, if memory served. After a moment's pause, he stooped over, opening the lowest drawer in his desk, and produced a vintage bottle of priceless Mentherisur wine - his favourite, and an incredible rarity, even amongst the highborn. Larennis figured tonight was as good a night as any to open it; he'd need the pleasant haze of alcohol to dull the stresses of the workday. He took an unceremonious swig and put the bottle down, making his way to his meeting with the now-restored Governess of Quellion. He tried to find some quiet pride in his accomplishments.\n\nThe struggles had not ended.\n\nThe challenges kept coming.\n\nBut for now, they had won."
 ord.120.a:0 "At least we have kept the Steward and the Sophist at bay."
 ord.121.t:0 "Marching to War"
 ord.121.d:0 "The sun glinted off Larennis' blade, oiled and sharpened to perfection. He turned it around in his hand, inspecting it for the slightest errors. He could find none, as expected; Thrysmere had done an excellent job.\n\nAnxiety churned in his stomach, even as the Princeling strove to bite it donw. He'd waged war with the Rthaur rebels, true. The Dwarves of Skylynaur had gotten involved, certainly. But a rebel uprising and a rump state hardly compared to marching against one of the mightiest states on the continent. He gulped.\n\nYntha and he exchanged looks of grim resolve.\n\n"This has to be done, Larennis," she said, feeling the weight of her spear in her hand. "We can't allow Arthenon's tyranny to stand."\n\nThe Princeling nodded."
 ord.121.a:0 ""Indeed. And so off we go.""
 ord.122.t:0 "The Royal Mission"
 ord.122.d:0 "Larennis shivered, the chill of Anthygynaur's southern atmospheres biting through his travel cloak. It was only a few steps from his carriage to the grand, squat, imposing palace of the Hochprinzessin, and he was grateful for the blazing warmth of the many hearts found within, melting away the cold from his bones the second he set foot within its chambers.\n\nThe intial meeting with Adalina was a cavalcade of formalities, with crucial information imparted in every syllable of her lilting voice, every look in her piercing green eyes, and every elegant twitch of her lips. Larennis had been trained for this, had practiced this very type of formality at court in Istaroth for decades, and yet he felt his bowels tangle and constrict as the day passed. Gifts were exchanged, minor dignitaries were received, and a grand banquet capped off the night.\n\n The next day, negotiations that had thus far only been conducted informally began in earnest, and Larennis and Adalina discussed topics from the Thysgynaur to the status of Stauhyte for many hours, though it only felt like minutes had passed. The Princeling and the Hochprinzessin found that they had many things in common, and an agreement seemed likely.\n\nYet, there seemed something... off, to Larennis. The negotiations had gone more smoothly than any he had ever before, and though this was the first time he'd met Adalina, he already felt like he'd known her for decades. She was a composed, educated woman, with a subtle sense of humour that she expertly weaved throughout the negotations, turning droll discussions over the specific wordings of treatises into moments of brilliant mirth. Larennis had never been in a negotiation quite like this.\n\nAltogether too soon, the final points of contention were agreed upon, and Larennis found himself saddened at the prospect of leaving./n/nBut... should he? Or could, perhaps, something more emerge from this?\n\nLarennis' heart thumped in his chest. His throat felt dry. The Princeling swallowed down his nerves..."
 ord.122.a:0 "...and pushed aside his anxieties. He knew how to maintain his composure."
 ord.122.b:0 "...and realised there was something more about this. About the Hochprinzessin."
 ord.123.t:0 "A Royal Wedding"
 ord.123.d:0 "After a bold, perhaps rash proposition, the room fell silent in utter shock. Larennis bit his tongue, cursing his impetuousness. This was an important negotiation, and he could not afford risking everything he'd built with this kind of juvenile-\n\nA clear, beautiful, lilting voice broke the silence. A single word. Enough to make Larennis' heart sing.\n\n"Yes."\n\nThe composed, warm smile on Adalina's face, the sparkle in her eyes, it conveyed all that Larennis needed to know. This would not only be a marriage of convenience.\n\nThis was love."
 ord.123.a:0 "The wedding was of such grand beauty that it would be sung of for years to come."
 ord.124.t:0 "Keeping It Professional"
 ord.124.d:0 "After a bold, perhaps rash proposition, the room fell silent in utter shock. Larennis bit his tongue, cursing his impetuousness. This was an important negotiation, and he could not afford risking everything he'd built with this kind of juvenile-\n\nA clear, beautiful, lilting voice broke the silence. A single word. Enough to make Larennis' heart sink.\n\n"No."\n\nAdalina's face was a mask, her blank stare conveying all that Larennis needed to know. This would strictly be an alliance of convenience."
 ord.124.a:0 "Never has success tasted so bitter."
 ord.125.t:0 "A Great Alliance"
 ord.125.d:0 "After a lengthy, sometimes tedious, negotiation, the room at last fell silent. Larennis held his breath, fighting to keep his face even. This was an important negotiation, and had done his best to see it through succesfully.\n\nAt last, Adalina's voice broke the silence. A single word. Enough to make Larennis' heart sing.\n\n"Yes."\n\nThe composed smile on Adalina's face conveyed all that Larennis needed to know. This would not only be an alliance of convenience.\n\nThis was a true pact of kindred spirits."
 ord.125.a:0 "A brilliant success for the Princeling!"
 ord.126.t:0 "A Bitter Failure"
 ord.126.d:0 "After a lengthy, sometimes tedious, negotiation, the room at last fell silent. Larennis held his breath, fighting to keep his face even. This was an important negotiation, and had done his best to see it through succesfully.\n\nAt last, Adalina's voice broke the silence. A single word. Enough to make Larennis' heart sink.\n\n"No."\n\nThe look of distaste on the Hochprinzessin' face conveyed all that Larennis needed to know.\n\nThere would be no alliance."
 ord.126.a:0 "A dark day for diplomacy."
 ord.127.t:0 "An Anti-Ungerdaler Pact?"
 ord.127.d:0 "An envoy from far Ordoria has arrived today, beesching us to make common cause against Ungerdaler aggression. Apparently, the warlike language coming out of Faustburg as of late has the Elves concerned.\n\nWhat should we do?"
 ord.127.a:0 "Yes, let us stand as one."
 ord.127.b:0 "Yes, let us cast off the Ungerdaler yoke!"
 ord.127.c:0 "A pact with Ordorians? Never!"
 ord.128.t:0 "[From.GetNameDef] Stands with Us!"
 ord.128.d:0 "We have received word from the envoys we have sent out to [From.GetNameDef] - the [From.GetNameAdj] have agreed to join us in our fight against Adalina!"
 ord.128.a:0 "Excellent!"
 ord.129.t:0 "[From.GetNameDef] Stands with Us!"
 ord.129.d:0 "We have received word from the envoys we have sent out to [From.GetNameDef] - the [From.GetNameAdj] stand ready to cast off the Ungerdaler yoke and join us in our fight against Adalina!"
 ord.129.a:0 "Excellent!"
 ord.130.t:0 "[From.GetNameDef] Refuses the Call"
 ord.130.d:0 "We have received word from the envoys we have sent out to [From.GetNameDef] - the [From.GetNameAdj] have rejected our overtures!"
 ord.130.a:0 "Curses!"
 ord.131.t:0 "The Anti-Ungerdaler Revolt"
 ord.131.d:0 "The Ordorians have started their war against the Ungerdaler Union. In accordance with our treaties, we shall now cast off the Faustburger yoke and fight alongside the Elves!"
 ord.131.a:0 "And so we go."
 ord.132.t:0 "The Anti-Ungerdaler War"
 ord.132.d:0 "The Ordorians have started their war against the Ungerdaler Union. In accordance with our treaties, we shall now cast fight alongside the Elves!"
 ord.132.a:0 "And so we go."
 ord.133.t:0 "Electoral Considerations"
 ord.133.d:0 "With the defeat of the warmongering Anthygyne empire and our decision to allow their people to elect their own, hopefully more peaceful, leader under our guidance, we must consider the matter of whom we will allow as candidates. The warmongers of Lilyasorynthe and the seditious rebels of Stauhyte could both be justifiably banned from the elections, but this will almost certainly upset the nobles of Anthygynaur."
 ord.133.a:0 "Let all eligible Freiprinztümer stand for election."
 ord.133.b:0 "The previous Hochprinzessin must not come to rule again."
 ord.133.c:0 "The Bear of Stahlhof has caused enough trouble."
 ord.133.e:0 "Neither shall be allowed to take the crown!"
 ord.134.t:0 "Ordoria Allows Hochprinzliche Elections"
 ord.134.d:0 "It seems the powers that be in our Elven conquerors look kindly upon their new subjects. We have been allowed to elect a new Hochprinz to lead us, under Ordorian guidance."
 ord.134.a:0 "The Union survives after a fashion, then."
 ord_lore.1.t:0 "Steward of Ordoria"
 ord_lore.1.d:0 "Isvenith sipped from the goblet of Ythelmarian wine and smiled, the loud sounds of the League members outside celebrating their recent victory at the Autumn Debate filtering in through his window. He had made a token appearance at the festivities before retreating to his quarters, hoping for an early night. Still, he could not find the rest he desired. Even after he and his men had diligently prevented the vile Dwarves of Skaelinger from installing that race traitor, Derathur, as their puppet ruler of all Ordorians, there were dissenting voices within the nation seeking to undermine his stewardship. Thankfully, sanity had prevailed, and the self-serving scum responsible for the Humiliation at Dosynnis had been prevented from leading his people to ruin again.\n\nIsvenith sighed and placed his goblet down. Relief made way for worry as the full weight of responsibility settled on his shoulders; not just for Ordoria, but for the entire Elven species. He did not relish the first step he had to take, but it had to be done. The rebels in the East, under the sway of that madman, Derathur, had to be put down. Isvenith did not look forward to spilling yet more Elven blood, but it had to be done. Ordoria must be reunited before it can take its vengeance on the Men and Elves of Lathweyne.\n\n'As Vanqys unified the Ordorians centuries ago, so too shall I bring unity to the Elves,' Isvenith thought, rising to his feet. He left his bedroom, the wine practically untouched, heading towards his study.\n\nThere was work to be done."
 ord_lore.1.a:0 "The first steps towards Ordoria's rebirth have been taken."
 ord_lore.2.t:0 "The Old King"
 ord_lore.2.d:0 "Santhyal, servant to the Royal household, carefully moved his dustrag over the imposing portrait of High King Inskyllithe. The Elves of Ordoria did not always see eye to eye - as evidenced by the recently defeated rebels - but few would deny that Inskyllithe was anything less than a saviour of the Ordorians, forcibly taken from this plane all too soon, his body whisked away to prevent the Elves from giving their hero his deserved rest.\nHe stepped back for a moment, to admire both his own efforts and the majesty of the Elf that had single-handedly reunited the Ordorians after centuries of strife. As he turned to leave for the next room, Santhyal heard the door creak open. None other than Isvenith Lothinnys, the King's Steward, stood in the doorframe, his face as resolute as ever.\n\n'A-ah, Lord Lothinnys,' Santhyal stuttered, his composure faltering. 'Can I... can I help you?'\n\nLothinnys waved Santhyal's offer aside. 'No, thank you. I'm just here to pay my respects to an old friend.' The Steward marched - Santhyal had yet to see him walk in even the most informal of circumstances - into the small sideroom of the Royal Palace, coming to a parade rest before the painting of the old High King.\n\n'They won't do this to our people anymore, Vanqys,' the King's Steward said softly. 'Not ever again shall Man or Dwarf divide our fair nation - their latest attempt has been crushed under our heel, as you crushed them under yours all those centuries ago.'\n\nSanthyal silently edged his way out of the room, seeking to not disturb the Steward's musings. The last words Lothinnys spoke as the servant closed the door to the parlour behind him filled Santhyal's veins with ice.\n\n'I shall see them all dead before I let them divide us again.'"
 ord_lore.2.a:0 "It is said that time heals all wounds, but the Steward's bitterness has only festered."
 ord_lore.3.t:0 "Best Served in Cold Blood"
 ord_lore.3.d:0 "'My Steward, are you sure this is wise? Though there's no large-scale Anythygyn forces around, we cannot vouch for the complete pacification of their city.'\n\nIsvenith did not respond, instead slowly coming to a halt in front of one of Faustburg's many mansions. The Humans seemed to consider these primitive stone huts elegant, though to Lothinnys's Elven tastes, they were little more than squalid, artificial caves.\n\n'Is this the place?' he asked, his hand reaching for his sword.\n\nThe Elf that had just spoken up nodded.\n\n'Yes, my Steward. According to the documents concerning Anythygynaur noble lineage we recovered from their palace's library before we put it to the torch, this is where the humans of House Bach reside.'\n\nHouse Bach. The name alone made Isvenith grip his weapon until his knuckles turned cyan.\n\nUriel Bach.\n\nThe sole survivor of the squad that slew High King Inskyllithe. Vanqys put down the other nine Men that came after him, and Bach had lost an arm and a leg, of course, but to the Humans, this was a small price to pay to snuff out the greatest hope of Elvenkind. They'd given Bach a title and lands - a measly reward for one of the most heinous acts in history.\n\nBach himself had long since died, of course - Humans had downright pathetic lifespans - but his spawn continued to enjoy the spoils of their ancestor's travesty. Isvenith had come to end that.\n\n'Stay here - make sure no one leaves, but do not enter the house,' he barked at his companions. 'This is personal'."
 ord_lore.3.a:0 "Everything we have done, we have done for this moment. Inskyllithe will be avenged."
 ord_lore.4.t:0 "Debts Repaid, Scores Settled"
 ord_lore.4.d:0 "Marching down the garden towards Bach Manor's entrance with sword in hand, the King's Steward felt his blood begin to boil. Isvenith kicked down the door, the pathetic Human work splintering under his elven boot. In the entryway, an elderly man stood, dressed in the garb of Anythygyn servants. He barely had the time to respond before Isvenith plunged his sword in the vermin's gut. The man spat out blood, and Isvenith kicked the old butler off his weapon, frail bones crunching as his foot connected. The man fell to the ground, crashing into a nearby coatrack. The racket this made drew the attention of the house's other inhabitants - Isvenith saw a fat, balding man peek out from behind a door, before yelping and slamming it shut.\n\nThe last thing the King's Steward saw before his anger fully overtook the last vestiges of his self-control and all went red was a woman, standing on the stairs, a babe on her breast. The next hour was a blur of blood, flames and screaming, though the latter soon turned into pathetic gurgles and moans, before dying off."
 ord_lore.4.a:0 "An orgy of blood and agony to avenge the murder of the greatest Elf to ever live."
 ord_lore.5.t:0 "An Eye for an Eye, a Life for a Life"
 ord_lore.5.d:0 "When Isvenith came to his senses once more, he found himself standing in a study, flames engulfing the room. Bodies were strewn about the room, slumped over the desk, halfway out the doorway, or scattered about the room. Isvenith found his sword firmly planted in the belly of the fat man he'd seen earlier. The pathetic Human had burn marks and cuts all over his body, though his injuries seemed more deliberate and less vital than the frenzied hack-wounds that marked the corpses, barring the clearly-fatal gut injury. For now, though, the Human was still alive. He had clearly been crying, but that had ceased - whether he had found courage, or simply ran out of tears to cry, Isvenith did not know. He lifted his fat chin off his mutilated chest, pale white face looking up at the Elf that loomed over him. With a trembling lip, the man sputtered out a single word.\n\n'W-why?'\n\nIsvenith opened his mouth to respond, but the words couldn't come. This was his crowning achievement. Everything Isvenith had done over the last centuries had been for this. For justice. For vengeance.\n\nFor Vanqys.\n\nSo why did he feel so hollow? Where was the sense of triumph, of satisfaction? Lothinnys felt nothing. Even the hatred and rage that had driven him for so long had left him. There was nothing left for him here. Without a word, he yanked his sword out of the Human's gut. The man sputtered as he died, blood trickling from his lips. The King's Steward left the burning wreck of a mansion, almost tripping over a tiny, unrecognizable heap of flesh as he walked down the stairs. Without a word to his bodyguards, the King's Steward mounted his horse and rode for camp.\n\nHe had won... hadn't he?"
 ord_lore.5.a:0 "Not even oceans of blood can wash away the past."
 ord_lore.6.t:0 "Foreclosure"
 ord_lore.6.d:0 "Lars Helmauer was a rare sight in Istaroth.\n\nAn Ungerdaler by birth and a merchant by trade, Helmauer remained in the city long after most of his fellows had fled. Business was good, and his friends in high places had kept him safe. He was sweeping his store after close, today's money counted and safely stored away, when he heard a knock on the door.\n\n'Sorry, we're closed, please come back tomorrow,' he said, not thinking much of it. Everything went quiet outside, and Helmauer returned to his cleaning efforts.\nNot a second later, Helmauer's entire world came crashing down along with his front door. A gang of five Elves dressed in the bright green of the League stood in the doorframe, their eyes fixed on him. He began to stammer objections, that these hooligans would regret this, that the Mayor would have their heads for this, but any protest died on his lips as one of the Elves drew his sword and pointed it at his gut.\n\n'You have been found guilty of hoarding resources that should be for Elves, vermin,' he spoke flatly. 'You shall work off your debt to your superiors in the mines.'\n\nThey didn't bother ransacking the store, or even clasping Helmauer in irons. Helmauer was simply marched down the street at swordpoint, never to be seen again."
 ord_lore.6.a:0 "Should've left when he had the chance."
 ord_lore.7.t:0 "Rejoining the Ranks"
 ord_lore.7.d:0 "Ythem looked up as the door to the decrepit shack he and his mates were held in opened. It was the first sunlight they had seen in days. Three officers dressed in the garb of the Steward's men entered. The one in the front was in full dress uniform, a rapier on his hip, while the two behind him carried food. Not the meager gruel they'd been forced to survive on for weeks - actual food.\n\nThe leader swept his gaze over the assembled prisoners of war - mostly Humans, a Dwarf or two. Ythem was the only Elf among the beaten Rthaur squad. The officer locked eyes with the chained Elf. Without a word, the man drew his rapier, then flipped it, thrusting it hilt-first at Ythem. \n\n'You are given exactly one chance to redeem yourself, Orthor,' he spat. 'I suggest you take it.'\n\nYthem knew what he meant. He looked at his friends and comrades - Kalsky, who had fought with him at the Loris Pass. Humbal, who'd taken an arrow for him at the defense of Quellion. Good men, who he trusted and loved to the last.\n\nBut he was hungry. So, so hungry. And cold. And exhausted.\n\nSlowly, avoiding the terrified gazes of his companions, Ythem took the blade."
 ord_lore.7.a:0 "It was them or me."
 ord_lore.8.t:0 "A Lovely Morning"
 ord_lore.8.d:0 "Istaroth, lying practically on the equator, was often a place of beating sun and sweltering heat. The city's architecture was built for this; most buildings were either elegantly white-washed stone, or directly built into the many trees of Ordoria's jungles. Mornings like this one, where the sun shone but a cool breeze washed over the city from the ocean, were rare. As a result, a great many Elves were out and about, appreciating the unexpectedly cool weather. Market stands sold snacks and cooled drinks to passersby, and children darted through the streets, playing this game or that.\n\nIt also meant that the crowd at today's hanging was much larger than expected.\n\nA group of seven important Rthaur rebels - officers, propagandists and agitators - stood on the gallows, as the crowd booed them. A Sophist offered the Elves their last meditations. Some accepted; others ignored the man. One of them, with some fight in his eyes, looked out over the crowd.\n\n'Comrades - good Elves of Istaroth, do you not see what ruin the Steward's hateful plans have wrought? It is not yet too late, we can still cha-'\n\nBefore he could continue his speech, he was hit in the face by a stone, almost falling over as his nose shattered from the impact. The executioner brusquely grabbed the struck traitor and held him upright, pulling the noose taut around the would-be firebrand's neck.\n\nSoon after, seven ropes snapped taut in Istaroth."
 ord_lore.8.a:0 "It is a splendid sunny day, and they had to go."
 ord_lore.9.t:0 "Beneath the Stone"
 ord_lore.9.d:0 "Herjolf swung his pick against the stone in front of him, the subtle streaks of muddied red indicating the boulder hid a worthy prize. His well-placed strike was rewarded with a satisfying crack as the rock split open, revealing its bounty - a fat piece of raw iron ore.\n\nFor a moment, Herjolf stood to admire his handiwork - the first real joy he'd felt in weeks. Despite the hunger and the long hours, few things satisfied a Dwarf as much as a pick in the hand and ore in the rock.\n\nHis brief reverie was immediately interrupted with the flaying agony of a whip tearing over his back, ripping through his dirty shirt. His Ordorian overseer snarled something at him in their foreign language, but the message was clear. Herjolf seethed quietly, but bowed his head and went back to striking at the rock.\n\n'Don't work so vigorously, lad,' the Dwarf next to him said. 'Every bit of ore we dig up, these knife-eared bastards turn into swords to butcher more of our people with. They don't know how hard Dwarves can work, and we best keep it that way, you understand?'\n\nHerjolf nodded and began deliberately hitting the boulder with his pick at an awkward angle, barely chipping off splinters with his next swings. His neigbour continued, voice lowered.\n\n'Now, lad, proper Dwarves like you and me, we're not taking this quietly. In the latrine pits, to your right, you'll find a tunnel dug through the rock. It's hidden with a loose stone - these Elves couldn't spot a hairline in the rock if it danced on their dinner table - but you'll be able to spot it immediately. Once you're through, you'll meet friends. Tell them you're there to help the Legion, and they'll sort you out. Sound good?'\n\nHerjolf weighed his options. He'd heard of the Legion - a rather unpleasant, violent bunch, from what he'd heard - but these were unpleasant, violent times. Besides, anything was better than a slow death in service to the hated Elves. He silently nodded at his newfound comrade, and began making plans for his escape."
 ord_lore.9.a:0 "The next morning, Herjolf was nowhere to be found. Not that his overseer noticed."
 ord_lore.10.t:0 "The Beating Sun"
 ord_lore.10.d:0 "Kjalka swung the hoe at the dry earth, splitting the ground as she struck. Sweat rolled down her brow. She resisted the urge to lick her lips, wary of the salt-crusts that had formed after hours and hours under the Ordorian sun dehydrating her further. She stumbled for a moment, and Ythral caught her by the arm.\n\n'Keep it up, friend,' he said. 'We don't want you used as fertilizer.'\n\nDespite everything, Kjalka smiled. 'Don't worry, they won't get me just ye-'\n\n Her sentence was snapped in half by the lash of the whip that struck her in the face. She stumbled backwards, hands clasped to what used to be her nose.\n\n'Keep it moving!' the taskmaster shouted. Kjalka tried to take another step, but she was dizzy from the loss of blood, the exhaustion, and the lack of food and water. She fell to the ground, landing in the dry earth next to her severed nose.\n\nShe sent out one last prayer to the Ancestors, and then she was still."
 ord_lore.10.a:0 "In the dead of night, her comrades gave her an improvised wake. It was the best they could do."
 ord_lore.11.t:0 "Signs of Pestilence"
 ord_lore.11.d:0 "It started with a simple cough. The Overseers thought it was the smog-choked air at first. Plenty of them were coughing from the pollution too, after all.\n\nConcern began to grow when rashes appeared, rapidly developing into boils. Those unfortunate souls afflicted by this new disease rapidly wasted away, becoming little more than pus-filled husks. Once the boils appeared, those afflicted usually had about three to five days of vomiting and spasming until the final stage - necrosis. Their body rotting while they were still alive, the only mercy was that the brain was often affected first, meaning they were not really there to feel it anymore. The Corpserot Plague, they call it. Only a few survive, and fewer still emerge with their mental faculties intact."
 ord_lore.11.a:0 "We have to solve this, before it hurts our own people!"
 ord_lore.12.t:0 "Agree to Disagree"
 ord_lore.12.d:0 ""...and so it is only right that those... those vermin work off the debt to the Elven people that they built by robbing us of our future!" The Steward's voice echoed through the halls of the palace of Istaroth, sending a ripple of murmurs and discussions through the assembled crowd.\n\n"That is preposterous! What you have done, Lothinnys, is institute slavery in Ordoria - one of the most reprehensible institutions ever to exist! It is a moral blamage on our nation's pride!" Larennis, heir to the throne of Ordoria, paused for a moment, continuing his speech with far less passion. "Besides, the effects on the economy this will have are disastrous - how would our aristans and serfs compete with free labour?" Despite the notably more subdued tone Larennis delivered that line with, the response was much more positive - no surprise, given that the majority in attendance were feudal lords with serfs of their own.\n\n"And what would you have done, Princeling?" A third voice spoke up. "Leave them to scurry about, with no knowledge of what they are doing or how they are undermining our great state?" The hall fell silent as Histarine Vernythe, leader of the Sophistium, spoke up. "For make no mistake, that is what they are doing. They have been undermining us since the Second Empire, and they continue to do so to this day. The rebellion in the East, and their insidious exploitation of our philosophies before our wise and necessary reforms are proof of that."\n\n"Honeyed words that hide a scared little Elf, Vernythe," Lothinnys said. "You pretend to see the natural order of things, but if it were up to you, Elf and vermin would be equal in slavery and tyranny! You do not seek prosperity for our people - you seek control, and your own race be damned!"\n\nThe debate went on for hours and hours, and it became clear that no agreement could be reached between the three groups. It was agreed that a great debate, spanning the entirety of the season, would be held in Ordoria's most central city and bastion of rhetorics - Varinthia. As the three groups left the palace, a single thought was shared by them all:"
 ord_lore.12.a:0 "This will be settled, once and for all."
 ord_lore.13.t:0 "Quiet Nights"
 ord_lore.13.d:0 "Hystarine Vernythe, Reformer of the Sublime Sophistium of the Itheryn Way, took a deep breath. His lungs filled with the balmy Vuid night air, and he smiled. Even at this late hour, the din of swordclash could be heard in the distance, some particularly zealous cadets continuing their training well into the night.\n\n"This is what proper order brings a city, you know," a voice behind him said. Vernythe didn't turn around. He just smiled.\n\n"Quite so. The youth being trained here will lead Ordoria's armies, protecting our people for millenia to come." A translucently white figure - an Elf, scarred and old - walked over next to him, leaning on the balcony just as Vernythe did.\n\n"There's more that needs to be done, Histarine. You've done good work with the Sophistium, but you're not done yet. Traitors abound, in the East as in those lands still nominally loyal." The sprit walked right through the balustrade, hovering into the air - a good three storeys high, as Vernythe's room was reserved for him at the top of the mansion. The ghost of Thulyen Gyume swept his arm over the city."This is a city filled with the young and the impressionable, sent to the Academy for shaping into proper Ordorian officers. Yet it is that same malleability that leaves this city a threat; for those that can be shaped one way can also be shaped the other. We have seen this in Quellion." Vernythe's knuckles turned white as he gripped the balcony at the mention of that traitor-city's name.\n\n"You should not have been lost there, Thulyen," he said, a tear rolling down his cheek. "I'll finish what I started in the Sophistium. I'll put that Republican scum in the ground where they belong, and then their vile masters in Skylynaur and Anythygynaur. Neither the narrow-minded Steward nor the naive Princeling will stay me from my course." He looked over at the ghost of Thulyen, and hardened his heart to the things he would have to do."
 ord_lore.13.a:0 ""Nobody will ever be hurt like you were, Thulyen. I promise this.""
 ord_lore.14.t:0 "Securing Power"
 ord_lore.14.d:0 ""Thank you for agreeing to see me tonight, gentlemen," Lothinnys said. "I appreciate your willingness to show up on such short notice." The assorted group of influential, highborn Elves looked at him suspiciously.\n\n"Enough games, Steward. What do you want?" the oldest among them spat out, his eyes narrowed. Lothinnys smiled.\n\n"Very well, then - to business. Don't mind if I pour myself a drink, though - it's been a long day." The three Elves across from Lothinnys' desk sat in silence, eyes darting from the window to the door. Lothinnys opened a bottle of aged Irinthian red and calmly filled his glass. Sniffing his glass before taking a sip, he let silence hang for a good ten seconds before deigning to speak.\n\n"So," he said, letting the word fill the room before continuing."It's simple. The Autumn Debate we are organising - I want your support." The youngest of the three snorted.\n\n"Support you, Lothinnys? The one that implemented policies so destructive it caused half the country to riot and has promised to push through further foolishness that will see us lose everything we have built? I'd sooner walk naked into Skylynaur." The two other Elves Lothinnys had invited paled slightly, but did not dissent. Lothinnys took a sip and sighed, his smile never fading.\n\n"As you wish," he said. "If I cannot convince you, you are free to go. Dalyn, if you'd be so kind as to show our friends out?" The Elves looked at him, then each other, then at Lothinnys' friend and bodyguard who'd just entered the room. They slowly, carefully got up, and filed out of the room, glancing over their shoulder as they went. Lothinnys saw the oldest breathe a sigh of relief and relax his shoulders as he closed the door to the office.\n\nStill smiling, the Steward refrained from sipping his wine until the screaming and gurgling stopped."
 ord_lore.14.a:0 "The screams of the dying do so spoil a good vintage."
 ord_lore.15.t:0 "Youthful Mischief"
 ord_lore.15.d:0 ""Your Highness! Your Highness!" the guards rode closer and closer, their horses much lighter and faster than Larennis' carriage. Resigned, Larennis sighed and began to bring his coach to a halt. He put on his best boyish grin, having made sure to frazzle his hair somewhat, and laughed at the guards as they came to a halt next to him.\n\n"Your Highness, please - you're almost ninety years old! You can't go taking your father's coaches for joyrides anymore!" Doing his best to sound as immature as possible, Larennis responded.\n\n"Good thing this one's the Steward's, then!" The guard's face turned ashen as his eyes darted to the coach, taking in the intricate designs unique to Lothinnys' carriage.\n\n"Y-your Highness, I implore you to return home with us before this sends the Steward into a rage! Your father would be so disappointed!" Larennis rolled his eyes, knocked once on the carriage, and began to get up off the driver's seat.\n\n"All right, folks, the jig is u-" he began, before he tripped over his own feet, tumbling into the grass below. He let out a loud groan as he lay between the Steward's horse and the guard's, and before he knew it, all the guards had surrounded him, jostling to help him back up. Yntha and Thrysmere had gotten out of the carraige, looking at their crumpled friend on the ground.\n\nLarennis shot them a glance. They subtly nodded.\n\nThat was all Larennis needed. With a loud groan, he got up."Stupid carriage," he said, kicking the wheel."Let's go home."\n\nHe hopped on the back of the lead guard's horse as Yntha took responsibility of the Steward's vehicle, and all of them set off home.\n\nIn the chaos, nobody had noticed the four emaciated Humans that had snuck from underneath the carriage and fled off into Ordoria's jungles, to where Larennis' contacts would be waiting for them. Another job well done, with nobody the wiser."
 ord_lore.15.a:0 "Today, a handful. Tomorrow, all of them."
 ord_lore.16.t:0 "Vengeance, Great and Small"
 ord_lore.16.d:0 ""As I said before, you are too young - you've not even reached your centennial yet! Your spirit is admirable, but you are simply not ready to join the army, child." Alsthyn slammed his hands on the recruiter's table.\n\n"My father was MURDERED by these Stauhyte bastards," he screamed! "Harquiss demands I avenge him - give me a sword and send me to the South!" The recruiter turned away, beginning to shuffle through some paperwork.\n\n"Come back when you're older," was all he said. Alsthyn stormed off, already formulating his own plans to get Grandpa's bow and march off to the South by himself, when he was grasped on the shoudler by a stranger.\n\n"You've got the right idea, son of Ordoria," he said. Alsthyn looked up at him. The stranger stood tall, dressed in an immaculate, green uniform. It wasn't any official army gear, Alsthyn would have remembered that, but it looked militaristic nonetheless.\n\n"Who are you?" he asked. The stranger smiled.\n\n"A vengeful soldier of Ordoria, just like you," he said. "If you want to aid in the downfall of the Humans, come to the field by the boulder on the morrow. We train there every Momera."Alsthyn perked up at the thought - military training? Shattering the machinations of the Human scum? He already knew he would be there tomorrow, but he had one question left.\n\n"'We'? Who is 'we'?" The stranger's smile broadened.\n\n"We are the Glory League," he said. "And with the Steward's backing, we will put the Humans and Dwarves alike in their place.""
 ord_lore.16.a:0 "Every slight will be avenged, one corpse at a time."
 ord_lore.17.t:0 "Ensuring Loyalty"
 ord_lore.17.d:0 "Though Ordoria's thick jungle often drowned out much of the noise created by people going about their day, the din of sword upon sword and the barking of orders cut through the thick ambience of birds and bugs. Lothinnys strode in the direction he'd been pointed, following the sound - the jungle drills were often hard to find, but he knew his way around most of Ordoria. Centuries of experience would do that. His diligence was soon rewarded as he stumbled upon an 'ambush' in progress - blunted blades, their tips twisted back down to prevent accidental injury, clashed as two groups of soldiers went after each other. He scanned the chaos, calmly picking out those he came here to meet.\n\n"Quynara! Thurys! Atten-SHUN!" he barked, his army voice snapping back to him despite ages of disuse. The fight immediately stopped, everyone starting at him. Some reflexively shot into salute; Lothinnys noted with satisfaction that their form was immaculate. The two Elves he'd called for - young, newly-minted officers in the army - stepped forward.\n\n"Yes, Steward, Sir?" Thurys asked. Lothinnys glanced at the other Elves, who got the hint after a second, and the mock fighting picked back up again. Less chance of being eavesdropped that way. Turning his attention back to the two officers who were nervously shifting about, Lothinnys spoke up.\n\n"You two have done good work here - these are more meticulous drills than I've seen from officers ten times your age. I shall see to it that you receive commendations for your efforts." The commanders looked at each other, before trying to double down on their salute. "T-thank you, Steward! We are proud to serve Ordoria!" Quyanara stammered. Lothinnys nodded.\n\n"Good. Oh, and one more thing," he said in an icy tone. "The League is throwing a celebration of your efforts tonight. You are expected."\n\nThe message was clear. Thurys gulped.\n\n"W-we'll be there, Sir," he said.\n\n"Excellent! Dismissed," Lothinnys said, turning around and heading back. Within seconds, both officers were shouting commands at their subordinates again, a hint of pride and authority that hadn't been there before in their voices."
 ord_lore.17.a:0 "And thus the youth joins the fold."
 ord_lore.18.t:0 "Recruitment Drive"
 ord_lore.18.d:0 ""Why should you join up, you ask?" The recruiter's voice rang clearly across Zyanaur's marketplace, commanding rapt attention from all there.\n\n"You may think I would say for glory, or for gold - but no! We are Elves! We are above such petty material concerns as status or wealth! Nay, Elves of Ordoria, we fight for the future of the Elven race itself!" Her words cut through the humbum of the marketplace, causing everyone to fall silent.\n\n"We have seen it at the end of the Second Empire, where the despicable Southerners and Dwarves strangled our chance at glory in its cradle and butchered our High King! We have seen it at Dosinnys, where the Northmen slaughtered good Elves! We see it now, in the East, where vile traitors sell out Elfdom to the Dwarves for their petty revolution!" She drew her sword, raising it high in the air.\n\n"THIS CANNOT STAND! Join the army today - not for yourself, but for your country - for your people! DEFEND NOT ONLY THE LIVES OF YOUR FRIENDS AND FAMILY, BUT THE VERY ELVEN WAY OF LIFE! STAND NOT IDLE AS OUR EXISTENCE ITSELF IS UNDER ATTACK, BUT DRAW STEEL ALONG YOUR COMRADES AND DRIVE BACK THE DARKNESS!"\n\nRagged cheers broke out from the crowd that has assembled as she spoke, and many rushed forward, eager to join Ordoria's forces. The recruiter smiled, knowing her job was done here. She could only hope her colleagues were doing just as well elsewhere."
 ord_lore.18.a:0 "They are enthusiastic now; will the remain so bleeding out on the battlefield?"
 ord_lore.19.t:0 "A Group Effort"
 ord_lore.19.d:0 ""Hey, can you hand me that plank?"\n\n"Careful where you swing that hammer!"\n\nIt was early in the morning, but the village of Thebrell was bustling with activity. The old, long-abandoned shop of some Human merchant that'd been run out of town had been assigned to Thebrell's chapter of the Glory League, and their members were sweating in the autumn sun renovating it. Yldra, the chapter's local chairwoman, was spearheading the effort. They'd already done the big things - patch holes in the roofs, replace the doors, get rid of the last bits of unvandalized Human-style furniture - and they were putting on the finishing touches just now. She hammered the last nail in place, firmly affixing the large sign of the Tri-Pronged Fates above the doorframe. Smiling, Yldra stepped back and admired her handiwork."
 ord_lore.19.a:0 "A good building for good Elves."
 ord_lore.20.t:0 "Initiation"
 ord_lore.20.d:0 "Ylde shot a glance over her shoulder as she turned down one of Varinthia's many twisted alleyways, a bead of sweat dripping from her brow.\n\nDefinitely following me, she thought as her eye fell on the man that had been going in the same direction as her for the last ten minutes. His face obscured by a hood, the only thing she could make out about him was that he definitely was military in some fashion - nobody marched like this untrained.\n\nShe sped up her pace as the man rounded the corner after her, considering her escape routes. She'd scouted out a few options already - no thief worth their salt would spend any real time in a city without knowing how to dodge the guards if need be - but she hadn't been in Varinthia long enough to work out detailed plans yet. She'd have to improvise.\n\nBursting out into a full sprint, Ylde ducked into the basement of a a nearby warehouse, weaving past the surprised workers lugging buckets of coal into it. She shot out the building on the other end, knocking over a grilled sausage vendor as she sprinted full tilt into the main street. Weaving through the crowds of Varinthia, Ylde shot right back into the maze that was the inner city, racing past smugglers bringing their wares into the city, fences haggling over the prices of narcotics or weaponry, and beggars eyeing her up as a potential target for their next meal. She ran and ran, until she was confident she was no longer being followed, hiding behind a pile of rubble for several hours until she was sure her track had gone cold.\n\nExhausted, but finally safe, Ylde returned to her hideout by the most roundabout route she could think of. As she pushed open the door of the dusty old attic room she'd rented, a smile crept over her face.\n\nThat smile froze as she heard a voice speak up from the room.\n\n"That was impressive, Mistress Ghyaleen. I almost lost you on more than one occasion."\n\n"Wh-who-what- how?!" Ylde began to stammer out, utterly dumbfounded. The man smiled, rising from the one chair in the room.\n\n"I'm with a certain group of people that have Ordoria's best interests at heart, and to save you time - we want you on board. Are you at all interested?" His smile contorted into a wicked grin. "Do keep in mind, the alternative is that I have you arrested. Choose wisely."\n\nLeft with no choice, Ylde shook his outstretched hand."
 ord_lore.20.a:0 "Another hero steps into the shadows."
 ord_lore.21.t:0 "...Twice Shy"
 ord_lore.21.d:0 ""But my Steward - we do not know what protective wards lay on these items! We cannot risk setting them off!"\n\nLothinnys rolled his eyes at the nervous Elf's protests.\n\n"These items are full of the loathsome arcane, Ghylame. We must not abide their continued existence, for they may betray Elfkind at a moment's notice - they've done it before. We are in no position to survive another magical stab in the back."\n\n"But my Steward, there have been reports of these items bestowing curses on those who destroy them! There have been cases of illnesses, petrifications - even magical explosions! Surely we could not risk your personage, or the integrity of the palace?"\n\nGhylame prattled on as Lothinnys felt his irritation rise. Quickly, it boiled over, and the Steward snatched the staff Ghylame was holding from the Elf's shocked hands, breaking it over his knee. Lothinnys tossed the broken relic aside, stretching out his arm towards the terrified Ghylame."
 ord_lore.21.a:0 ""There. No explosions. Now give me the rest.""
 ord_lore.22.t:0 "The Greenhorn"
 ord_lore.22.d:0 ""Hey, Sarge?" Thyulmar asked. "Why do we gotta fight the Humans?" Sergeant Quimeyde glared at the new recruit, who continued unabashedly.\n\n"See, now, the Dwarves? The Dwarves, I understand. They've been wrecking the country by helping those Rthaur scum in the East, they gotta go. Besides," Thyulmar grimaced, "their stunty little legs unnerve and disgust me."\n\n"But the Humans? The Humans I just don't understand. We've squabbled with them, sure, but they've generally left us alone for the past few decades. We had a Human move into our village once, he was real nice. Why do we gotta go after them, once the Dwarves are dealt with?" Quimeyde sized up the trooper, trying to ascertain whether the question was genuine. He rubbed his hand over the spot where the mark of the Oath had been branded upon him.\n\n"Come with me," he eventually said, pointing to a nearby storage room. Thyulmar followed him, his hands trembling though he did his best to hide it.\n\n"Close the door." Thyulmar obliged.\n\n"Listen, Thyulmar. Have you ever had rats in your home?" Thyulmar shook his head.\n\n"No sir. We got 'em in the barn a few times, since that's where the worst-protected feed is, but we kill 'em all the moment they get there. They never get to the house."\n\n"But they cause no harm in the barn, correct? Should you not leave them in peace?"\n\n"No can do, sir. We let 'em keep the barn, they're all over the pantry next week. Gotta take preventative measures." Quimeyde nodded.\n\n"Exactly. Do you want to know why we need to rid this continent of the Humans? It is not because they have fought with us. It is because they are vermin - the Steward himself has decreed as such. You don't want to go against the Steward, do you?" Sweat began to drip from Thyulmar's brow.\n\n"N-no, Sir! Of course not!"\n\n"Good. Then drop the questions and do as your told," Quimeyde said. "And if I catch you spreading seditious inquiries like this again, I'll personally make sure you lose the capacity to ask them in the first place. Understood?"\n\nThyulmar gulped."
 ord_lore.22.a:0 ""Y-yes sir!""
 ord_lore.23.t:0 "An Evening at Court"
 ord_lore.23.d:0 "Myla smiled to herself as she sipped her wine. She'd only been at Lord-Minter Ascylyn's ball for a scant few hours, but she'd already overheard some incredibly juicy secrets that were not meant for her ears. The hearing-enhancing earrings she had been assigned for the mission were worth their weight in gold a hundred times over. Indiscretions by Duke Jhylmire, financial troubles for House Aldysre, the list went on. She'd identified several pieces of information that could be used as leverage directly, and dozens of further leads the Oath could investigate further.\n\n"...I once again thank you deeply for sponsoring this ball, Lady Alstora. House Ascylyn is in your debt."\n\nMyla's ears perked up as she overheard scraps of a conversation from somewhere in the mansion between Lord Ascylyn himself, and Alstora Holynthor - a known associate of the Royalists.\n\n"It is my pleasure, Lord-Minter Ascylyn - we are grateful for the support you have offered us. I appreciate your position is a precarious one." Ascylyn snorted.\n\n"'Precarious' doesn't even begin to cover it, Alstora - you've seen my records. If any of this gets out, I'd be hanged before the Sun rises on the morrow."\n\nMyla held her breath. She'd have to go digging in Ascylyn's archives, by the sound of it - whatever this was, it sounded big.\n\nA few polite conversations and seductive glances later, Myla had gracefully separated herself from the main event, requesting solitude on the grounds that the business and heat were causing her to feel faint. She had been escorted to Ascylyn's study for a liedown and politely been left alone by an enterprising - and clearly smitten - young butler. Myla was neck-deep in financial documents and records before the door had even closed.\n\nVery quickly, she began to realise something - none of these records were adding up. Ascylyn's famous gold mines were reporting lower and lower yields, and there had been a spike in debtors making calls, but Ascylyn had been putting more gold on the market, not less. No, not gold - coinage. Slowly, a picture began to form.\n\nAscylyn was debasing Ordoria's currency to hide his own financial troubles.\n\nA predatory grin crept over Myla's face."
 ord_lore.23.a:0 "The Steward will want to hear of this."
 ord_lore.24.t:0 "Idle Speculation"
 ord_lore.24.d:0 ""See, now what I don't get is - why invest this much into fortifications that we'll not be using anymore in a few years?" Ylmar rolled his eyes at the question. Ulmarys had always been of the philosophical sort, head too far in the clouds to see a good job for what is was.\n\n"Iunno. Maybe the Steward's afraid we'd lose?" Ulmarys shook his head.\n\n"Nah, nah. My brother was in the army back when we first fought the rebels - we'd have crushed them if those fuckin' Dwarves hadn't gotten involved, and we're way stronger now. Besides, then why didn't we fortify against Stauhyte? Them's been at war with us for much longer. Or Thysgynaur - after Dosynnis, you'd think we'd want a nice thick wall between us and the Northerners." The Elf leaned closer to his colleague, continuing his ramble in whispers.\n\n"Now what I think, see, is the Steward's planning for more than just crushing the rebels. What with the Princeling being all against him, like - he's been presented as the Viceroy for the East. I reckon the Steward wants rid of him, and put a bunch of forts between himself and the Princeling, prevent the High King's son gettin' any ideas. Whaddaya reckon?"\n\nYlmar sighed."
 ord_lore.24.a:0 ""'s A good day's pay, I reckon. Hand me that trowel, would ya?""
 ord_lore.25.t:0 "Job Security"
 ord_lore.25.d:0 "Alsyon left the commander's tent smiling ear to ear. Yula hoisted their halberd back on their shoulder, switching from parade rest to attention in a snap.\n\n'You seem pleased,' they said. In response, Alsyon simply tossed a fat pouch into the air, coins clinking as he caught it.\n\n'I got us seventy,' he said. His second-in-command raised an eyebrow as they fell in behind the Captain.\n\n'Only seventy percent? The troops won't like the pay cut,' they said. Alsyon spun on his heels, throwing his arms in the air.\n\n'Who said anything about pay cuts, love? Normally, our full commission has to stretch us four month's work and eight month's job hunting - this is a pay RISE! Plus,' he said with a wink, 'I convinced that old fart of a General to replace our kit on the High King's dime.' In spite of themselves, Yula cracked a smile. 'Nice. I've been looking to replace this pitchfork,' they said, knocking the well-worn shaft of their weapon. They made their way back to company camp, where the many campfire conversations died immediately once they were spotted. Every Drakeskin in the area held their breath, awaiting the results of the negotiations. Alsyon pulled a bottle of top-notch Ythelmare rum from his sack, hoisting it in the air. Cheers broke out as the cork popped."
 ord_lore.25.a:0 ""First round's on me, boys! To our new post!""
 ord_lore.26.t:0 "The Traitor's Reward"
 ord_lore.26.d:0 "Vynthis fought back another wave of nausea as he swept the streets, the usual detritus of society having been mixed with viscera for the last few weeks. He steeled himself, reminding him that at least it was the guts of those vandals and rebels this time, not the true Elven heroes that had liberated the capital so recently. He swept the street for several more hours, eventually reaching the city's gates. He glanced up, seeing a crowd of those Phoenix Corps folk from the West up on the walls. They seemed to be cheering and parading something around. Vynthis adjusted his spectacles, doing his best to make out the sight of their trophy against the bright backdrop of the sun.\n\nWhen the broken spectacles fell from the impaled head, he recognized who it belonged to.\n\nThe men jeered for a few moments more, eventually planting the pike firmly above the gates of the city, Derathur's severed head now looking out over the entrance to Quellion. His tongue, once used for eloquent speeches of sedition and betrayal, now lolloped out of his gaping maw, silenced for good."
 ord_lore.26.a:0 "A fitting end for a treasonous dog."
 ord_lore.27.t:0 "Treason's Due"
 ord_lore.27.d:0 "Tyndwyl's hands shook.\n\nShe wasn't sure if it was the tremor of sobriety, or the fear of what she knew was to come. The first rays of the sun crept through the tiny, barred window of her cell, bringing her fate ever closer. Soon, she heard the steps of the gaoler marching through the prison, keys jingling as he strode. Islwyn and Thwysyld had already been sent to the headsman, and now it was her turn.\n\nTyndwyl took a deep breath of air, letting her lungs fill with the sweet winds of the Ordorian jungle one last time. She nearly gagged as the scent of iron tainted the air. She was sat on her knees, head resting on the blood-soaked chopping block. She looked up at the sun one last time, idly hoping her death would martyr her.\n\nThe swift blow of the headsman's axe made sure she would never know."
 ord_lore.27.a:0 "Thus always unto traitors."
 ord_lore.28.t:0 "A New Life, of Sorts"
 ord_lore.28.d:0 "Alyth sat on the doorstep of the hastily-erected tenement building she had been forced to call her new home, staring blankly at the unfamiliar street before her. She missed the sound of the birds and the rustling of the leaves in the trees, which had been her constant companions in the countryside of Ytholine. Here, the only sounds were the incessant chatter of the people and the rumble of carts and carriages passing by. Her mind cast back to the farm she had tended to with her parents - the work had been hard, but she'd had people to call 'friend' or 'family. That was all torn away from her, now. Her mother, she'd been told, had been resettled in Laurathine, and her father had been sent to the mines for suspicion of rebel sympathies. She longed to be back in the fields, working alongside her family and friends, but she knew that was impossible now. As she watched the people hurrying past, an argument broke out between two complete strangers. Idly, Alyth wondered if any of them had been resettled from the same region as her."
 ord_lore.28.a:0 "Despite the sea of bodies around him, Alyth had never felt more alone."
 ord_lore.29.t:0 "By Any Other Name"
 ord_lore.29.d:0 "Thyrid re-read the pamphlet that had been hammered into their front door during the night. They read it again.\n\nAgain.\n\nNo matter how many times their eyes ran over the words, they could simply not understand the words on the paper. Banning the rose? Has the regime in Istaroth lost its mind? They cast a quick glance over their stock; though they did not stock the rose as plentifully as they had before the Istaroth regime had returned, there were still some beautiful scarlet flowers dotted amongst the other bouquets. They stood for a moment, uncertain of what to do, when they caught the gleam of metal-clad soldiers marching down the streets from the corner of their eye. They dashed inside, taking the prettiest rose from their shop, and dashing upstairs. As the knocks on their front door turned into thumps, they pulled out their diary, pressing the rose between the pages and quickly shoving it under their bed. They'd have to dry it properly later; for now, they'd need to deal with the troops come to carry out Istaroth's orders in her floristry."
 ord_lore.29.a:0 "When the world returns to reason, perhaps they could reopen the book."
 ord_lore.30.t:0 "The First Merchanter"
 ord_lore.30.d:0 "Larennis took a deep breath, a smile growing across his face. The cold, salty ocean air filling his lungs perked him right up, dispelling the fatigue that had set in during the long nights drafting and re-drafting his proposal to the Snow Elves of Lirothlind. They'd already agreed to the big picture, but the demons, as always, were in the details. The vessel below contained not only the finest of Ordorian hardwoods, silks, and other luxury products, but an enclosed, wax-sealed copy of the trade agreement he'd drafted for Lirothline approval. Next to him, Thrysmere could barely contain his excitement.\n\n"She's such a modern vessel, Larennis - I went and had a chat with the shipwright, because I could tell he'd done *something* with the mast designs, and he told me it was a design he'd picked up from all the way in what the Humans call 'Fritzhafen'! Oh, she's a marvel of engineering!"\n\nLarennis turned his head slightly to look at his friend, arms still clasped behind his back in a pose of royal dignity.\n\n"Ah, but she's a marvel of politics too, I'm hoping - she'll need to be. That being said, I'm optimistic - relations between us and our estranged kin in the North-East had been on the mend for the first time in centuries just before the Steward took over, and their willingness to re-open trade with us is a good sign. I'm sure they'll be pleased to see the riches we have to offer.\n\nLarennis thought about what he'd said. Normally when he spoke those words, they were a front, a brave face put on to hide the terrified princeling beneath. But truth be told, this time, he *was* optimistic. He'd grown over the last few years, much more than in the decades before he'd thrown himself into Ordorian politics. He'd negotiated the terms of his proposal with Lady Alstora, and came to a solution they both were happy with. He'd sidelined the Sophists during the entire discussion without giving them cause to react - Inskyllithe's blade, he'd even caught the Steward himself flat-footed during the debate on this plan. The look on the old bastard's face when he realised Larennis' proposal didn't give him any angles for his anti-Elven nonsense was priceless.\n\n"Look- she's raised the flag!" Alywen pointed at the vessel below, having made its final preparations before casting off. Larennis narrowed his eyes - "Hang on... that's not the flag of the merchant navy. That's-"\n\n"Your personal banner, yes." Larennis was surprised to hear Gylar speak up; he was usually not the type for this kind of grandiose ceremony. Larennis turned to his friend, raising an inquisitive eyebrow. Gylar simply smiled and spread his arms. "If you're going to send a Royal missive, best do it under Royal colours. Besides, you should take a look to your right - Vernythe's face is turning an *exceptionally* entertaining shade of purple right now."/n/nDespite all of his training and practice, a singular guffaw burst through Larennis' lips, though he quickly disguised it as a cough.\n\nAs the first Ordorian merchanter in quite some time set off for foreign shores, Larennis smiled. Perhaps everything would turn out alright."
 ord_lore.30.a:0 "Off they go."
 ord_lore.31.t:0 "Just Good Business"
 ord_lore.31.d:0 ""Are you INSANE?! We have spent YEARS building up our proud state's self-sufficiency with blood, sweat and toil, and now you want to throw all of that away for some - some banal decadence?!"\n\nThe assembled Elves shuffled around uncomfortably under Vernythe's withering gaze.\n\n"It's just... y'know," one of them began, "they got good medicine up North, and me Ma's been real sick, an' their cures've been real good for her, 's all." Vernythe's head swivelled to focus on the impudent whelp that dared speak up against him. He opened his mouth to speak, but before he could respond, another interjected.\n\n"Yeah, and they got some real good furs up there. My husband came back from the Skylynaur mountains with three fingers lost to frostbite - a Lirothline fur would've kept him in fighting shape, so we got one for our son." One by one, the assembled members of Vernythe's flock began spouting their pathetic excuses, their slimy words worming their way into his ears until he could take it no more.\n\n"ENOUGH!"\n\nThe room fell silent.\n\nVernythe continued to speak, letting the disgust drip from his inflection. "We're better than this - you're ALL better than this! If your precious family members are too weak to survive on their own strength, then you should have the good sense to just let them die! We are Ordorians! We stand on our own two feet! Have some dignity and reject this foreign influence creeping into your lives!"\n\nQuiet settled upon the room once more, but not with fear this time, Vernythe realised - with contempt. The first one to speak up glared at Vernythe with such searing hatred that it made even the Sophist flinch for a moment.\n\nWithout a further word, the Elf spat on the ground in front of Vernythe's feet, turned around, and left the building. The rest soon followed, until Vernythe was alone. Even Thulyen did not speak to him, now."
 ord_lore.31.a:0 "For the first time in a long time, Vernythe's words failed him."
 ord_political.4.t:0 "Extralegal Violence in [GetRiotStateName]"
 ord_political.4.d:0 "A contigent of Glory League members has visciously assaulted Human members of a local community in [GetRiotStateName] today. The Glory League claims its members were provoked by the Humans, but the Royalists are incensed and demand justice. The Sophists, surprisingly, backed Larennis' faction, claiming that the use of force should be a monopoly of the state, and that letting paramilitaries run roughshod would doom the Ordorian nation."
 ord_political.4.a:0 "The Humans had it coming!"
 ord_political.4.b:0 "Let the judiciary make an example of these rioters!"
 ord_political.5.t:0 "Philosophical Debate in the Sophistium"
 ord_political.5.d:0 "Though the Itheryn are old, the centralized doctrine introduced by Vernythe is not. As the tenets of the reformed philosophy are solidifying, heated debates are known to break out from time to time. One such debate has sprung up recently: we could either smooth things over and strenghten the Sophistium, or we could take the opportunity to drive a wedge between the two sides."
 ord_political.5.a:0 "Resolve the matter amicably."
 ord_political.5.b:0 "Discord within the Sophistium, you say?"
 ber.1.t:0 "The Union Offers Aid!"
 ber.1.d:0 "We have been deepening our ties with our Southern neighbours for a while now, and this seems to have paid off in a huge way - the Union has officially announced their support for the Terugkeer, and they have promised to aid us when the time is ready to retake the Mountainhomes!"
 ber.1.a:0 "Wonderful news!"
 ska.1.t:0 "Ordoria Threatens Us!"
 ska.1.d:0 "An envoy from the Ordorians have arrived today, delivering a threat in no uncertain terms: either we renounce our alliance with Rthauiaur, or they will not stop until our Freehold is in ruins and the last family has been tossed off the cliffs."
 ska.1.a:0 "It is a difficult choice, but we cannot risk the destruction of our people."
 ska.1.b:0 "A plague on Istaroth! We stand with our friends, especially against such maniacs!"
 ska.2.t:0 "Ordoria Offers Peace"
 ska.2.d:0 "An Ordorian emissary appeared at our gate today, waving the white flag. It appears Ordoria would be content to end the fighting now, as they have retaken Rthauiaur. Though it would guarantee our safety, at least for the time being, it would also condemn our Rthaur allies to suffering under the Ordorian boot..."
 ska.2.a:0 "There is no dishonour in conceding defeat in a lost war. Agree to the peace."
 ska.2.b:0 "Never - we shall liberate Quellion and march right on to Istaroth!"
 ska.3.t:0 "Peace with Ordoria?"
 ska.3.d:0 "Our Rthaur allies have fallen and our proud capital is in the hands of the Ordorians. Reports of atrocities and the destruction of ancient works of art and holy relics are already filing in from refugees - perhaps we should bend the knee to Ordoria and concede defeat?"
 ska.3.a:0 "We must swallow our pride and admit defeat."
 ska.3.b:0 "Stomp out these defeatist thoughts!"
 ska.4.t:0 "Ordoria Accepts!"
 ska.4.d:0 "Our diplomats have returned, bearing good news - Ordoria has accepted our offer of peace! Yet, this news is received with little warmth at court - we might have peace, but our people still lay massacred, our buildings destroyed and the tombs of our ancestors desecrated."
 ska.4.a:0 "Vae victis."
 ska.5.t:0 "Ordoria Demands Concessions"
 ska.5.d:0 "Ordoria's diplomats have made clear that they are willing to end the war if we accept some border adjustments. It seems Ordoria wants to put some mountains between them and our vengeance."
 ska.5.a:0 "It is this peace or the peace of the grave."
 ska.5.b:0 "A true Dwarf will die before losing their honour! We will fight to the end!"
 ska.6.t:0 "Ordoria Declines!"
 ska.6.d:0 "The grim mood at court grew even gloomier when our haggard diplomats walked in. Their sorrowful eyes betrayed the message they had before they said a word - Ordoria has rejected our offer of peace."
 ska.6.a:0 "A fight to the end it is, then."
 ska.7.t:0 "Ordoria Demands Vassalage!"
 ska.7.d:0 "Ordoria's diplomats have offered us peace, but at the cost of our sovereignty - they demand we submit as a vassal state!"
 ska.7.a:0 "At least they're just imperialists now, instead of genocidal maniacs..."
 ska.7.b:0 "Dwarves, bowing to an Elf? Never!"
 ska.8.t:0 "The Second Rthaur Revolution"
 ska.8.d:0 "It seems the Ordorians could break the armies of our allies, but not their spirit. Across Ordorian territory, Rosites are rising up in what is called the 'Second Rthaur Revolution'. An envoy of these revolutionaries has come to our court today, imploring us to aid their cause once more."
 ska.8.a:0 "A Dwarf never forgets a friend - Rthauiaur calls for aid, and Skaelinger shall answer!"
 ska.8.b:0 "We wish them the best, but another war would spell doom for us. They are on their own."
 ska.8.c:0 "It is tragic, but our obligations to our liege prevent us from helping."
 ska.9.t:0 "Rthauiaur Falls!"
 ska.9.d:0 "Our allies in Rthauiaur have fallen to the Ordorian ontslaught! Our troops have scattered into the jungles and made their way home to reconsolidate and defend our mountain halls!"
 ska.9.a:0 "Fall back and defend, enemy coming!"
 ska.10.t:0 "The Union Sends Aid!"
 ska.10.d:0 "Good news from an unexpected corner - a sizable regiment of well-armed soldiers from the Union of Free Ungerdaler Princes has arrived! Although the situation was initially tense, with the captain of the guard of Skaelinger demanding the disarmament and dispersal of the troops, it was soon made clear they were here on direct orders of the Hochprinzessin to aid us in retaking our homelands! They are sure to provide a crucial boon to our troops."
 ska.10.a:0 "It is good that they remember old alliances."
 ska.11.t:0 "The Union Offers Aid!"
 ska.11.d:0 "We have been deepening our ties with our Southern neighbours for a while now, and this seems to have paid off in a huge way - the Union has officially announced their support for the Seventh Campaign, and they have promised to aid us when the time is ready to retake the Mountainhomes!"
 ska.11.a:0 "Wonderful news!"
 ska.12.t:0 "Attend the Nordtorf Summit?"
 ska.12.d:0 "The Union of Free Ungerdaler Princes has been involving itself more and more in Dwarven politics, and all of that meddling seems to have come to a climax. High-ranking diplomats from Faustburg have arrived, inviting our King to personally attend a meeting with the King of Skaelinger, in order to settle our differences once and for all. Should we attend?"
 ska.12.a:0 "Could we really find common ground? After so long?"
 ska.12.b:0 "There shall be no negotiations with those Rimatan bastards!"
 ska.13.t:0 "The Union Backs Us!"
 ska.13.d:0 "Good news! Thanks to our King's impassioned plea, Adalina has wisely sided with us in the Nordtorf Summit! She has spoken out in favour of Dwarven unity. As soon as she finished speaking, the Skaelingers in attendance - except for our dignified King, of course - broke out in raucous cheers, and the Rimatan delegation asked for a recess to discuss these developments."
 ska.13.a:0 "Let us hope Rimatü sees reason."
 ska.14.t:0 "The Union Backs Skyldske!"
 ska.14.d:0 "Despite our King's fiery speech in favour of Skaelinger's rightful claims, Adalina has not been swayed. She has viciously backed Rimatü and the rebel Skyldske in their ludicrous claims to our territories! Yet, at the same time, this centuries-long hostility has brought great harm to our people...\nWhat should we do?"
 ska.14.a:0 "Perhaps, for the sake of peace, we must agree."
 ska.14.b:0 "Concede to the Rimatan secessionists? Never!"
 ska.17.t:0 "The Union Marches to War!"
 ska.17.d:0 "Following the breakdown of negotiations, the Union has decided to march to war to aid our side. We can join them, once we are ready."
 ska.17.a:0 "Excellent!"
 ska.18.t:0 "Ordoria Demands Inskyllithe's Corpse"
 ska.18.d:0 "When a blue-skinned envoy appeared at our gates, we feared the worst. Fortunately, it seems Ordoria is not interested in further conflict, at least for now. Rather, their arrogant 'diplomat' demanded that we return the rotting corpse of their long-dead High King, which we took the liberty of burying in our Mountainhomes after the war against their petty Second Empire. It seems they're as stuck in the past as ever; what should we do?"
 ska.18.a:0 "Let them have their dead king."
 ska.18.b:0 "Absolutely not!"
 ska.18.c:0 "Oh, we'll send him back alright - in style!"
 rth.1.t:0 "Ordorian Influence"
 rth.1.d:0 "Our inability to properly patrol our borders is hurting our cause severely, as it appears that Ordoria is sending over warriors, equipment and propaganda to assist sympathisers to their despicable cause in preparing for a coup against the government! We must aim to secure our borders and root out these cells, lest they send our country into another destructive civil war!"
 rth.1.a:0 "Damn them!"
 rth.2.t:0 "Pro-Ordorian Coup!"
 rth.2.d:0 "When it rains, it pours. Following the murder of our great leader, our worst fears have come true today - across the country, Ordoria's sympathisers are rising up in arms to overthrow our rightful government! Fortunately, it appears that many of our loyal citizens have taken what arms they can find and risen to defend the revolution, but the situation looks dire indeed..."
 rth.2.a:0 "For the sake of our people, we must not lose this war!"
 rth.2.b:0 "At long last, we can cast off the shackles of the xeno-lovers!"
 rth.3.t:0 "Skaelinger Abandons Us!"
 rth.3.d:0 "A message from the Free Stronghold arrived, looking rather downtrodden, even ashamed. We soon found out why. Under Ordorian pressure, our 'steadfast' allies in the mountains have rescinded their protection of us - we will have to face the Ordorian onslaught alone!"
 rth.3.a:0 "Damn those Dwarves!"
 rth.4.t:0 "War with Ordoria!"
 rth.4.d:0 "Whether we are ready or not, the civil war has flared up to full-scale war once more. The fate of our people will be decided at last."
 rth.4.a:0 "To arms!"
 rth.5.t:0 "The Revolution Triumphant!"
 rth.5.d:0 "Though they tried and tried again, the genocidal despots in Ordoria could not break our people's indomitable spirit! Our brave soldiers have shattered the Ordorian troops, and the Bread-and-Rose Banner now flies from the keep of Istaroth!"
 rth.5.a:0 "The people victorious, now and forever more!"
 rth.6.t:0 "Loris Pass Lost!"
 rth.6.d:0 "The Loris Pass, the only easily traversable route between Quellion and Thurgithon, has been lost to the enemy! This is a major setback, as our military communications are disrupted and our country is split in two halves."
 rth.6.a:0 "Damnation!"
 rth.7.t:0 "Loris Pass Regained"
 rth.7.d:0 "We have retaken the Loris pass, and held against the enemy's counter-attack! Military communications are back to normal, though civilian travel is, obviously, still limited."
 rth.7.a:0 "Excellent news!"
 rth.8.t:0 "Loris Pass Unnecessary"
 rth.8.d:0 "A trickle of survivors have crossed into the half of our country we still control, through the mountains or through enemy lines. All share the same message; the other half of our country has fallen. At least we don't have to worry about communication issues anymore..."
 rth.8.a:0 "That's... good?"
 rth.9.t:0 "Alucien Assassinated!"
 rth.9.d:0 "Terrible news has struck our nation today. When the secretaries of state sent a messenger to Derathur's house, inquiring why he was late to today's meeting, he was found brutally murdered in his bed! The Tri-Pronged Fates, symbol of vile Ordoria, was branded into his forehead. The new Prime Speaker has already been sworn in, but the nation is in deep mourning."
 rth.9.a:0 "A dark day for our nation."
 rth.10.t:0 "Assassination Attempt on Derathur!"
 rth.10.d:0 "There is truly no deed too low or vile for those damnable Ordorians! Our leader, Alucien Derathur, the Hero of the Revolution, barely survived an assassination attempt in his own house today! Rthaur workers throughout the nation are crying out for blood, and people are signing up for the army in droves!"
 rth.10.a:0 "We must wipe these barbaric murderers from the face of the planet!"
 rth.11.t:0 "Skaelinger Joins Us!"
 rth.11.d:0 "It was wise to call upon our historical allies - Skaelinger has reaffirmed the bond our nation shares, and has agreed to take up arms against the evil of Ordoria alongside us for a second time!"
 rth.11.a:0 "Once more into the breach!"
 rth.12.t:0 "Skaelinger Refuses to Join Us"
 rth.12.d:0 "Though we had hoped Skaelinger would be willing to fight alongside us once more, our messenger came back with ill news today - Skaelinger won't join us! They're still devastated from the last war, and fear another might spell their extinction."
 rth.12.a:0 "It appears we're on our own this time."
 rth.13.t:0 "Skaelinger Cannot Join Us"
 rth.13.d:0 "Though we had hoped Skaelinger could take up arms alongside us yet again, our envoy has returned empty-handed; citing responsibilities to their overlords, Skaelinger informed us they can sadly not join our war."
 rth.13.a:0 "First we destroy Ordoria, then we liberate our comrades!"
 rth.14.t:0 "The Union Offers Aid"
 rth.14.d:0 "The humans of Anthygynaur, or 'the Ungerdaler Union' as they call themselves, have come to us with a proposal for Ordorian containment. Though they uphold oppressive feudal principles, can we really afford to turn their aid down?"
 rth.14.a:0 "Ordoria is a threat orders of magnitude greater than any petty Human tyrant. We must accept."
 rth.14.b:0 "Death before dishonour!"
 rth.15.t:0 "The Pact Comes to An End"
 rth.15.d:0 "After the defeat of the Ordorians, it is clear to our people that we can no longer continue working with the Humans of Anthygynaur and their monarchist ways. We shall inform them of the end to our makeshift alliance."
 rth.15.a:0 "The Puritans were first. The Monarchists are next."
 rth.16.t:0 "Aid from the Union"
 rth.16.d:0 "The Provisional Government was surprised to find a procession of Anthygyne officers and weapons caches marching down the streets of Quellion this morning. Having travelled through Skaelinger, they have arrived here to offer us weapons and training to fight Ordoria, no strings attached."
 rth.16.a:0 "The Ordorians shall find us well-prepared."
 rth.17.t:0 "The Union Offers Conditional Aid"
 rth.17.d:0 "The Union has reached out with a difficult proposal today. They are offering to train our officers and smuggle us shipments of weapons, both of which we desperately need, but they demand that we give influential government positions to members of aristocratic anti-Ordorian factions. This would greatly influence our government's founding principles and future policy, but the alternative might be a lack of existence at all in the near future."
 rth.17.a:0 "We shall never betray the Revolution!"
 rth.17.b:0 "Defeating the Ordorians is more important than ideological purity."
 rth.79.t:0 "The Offer"
 rth.79.d:0 "A messenger from the West rode in on an early Krymina morning; a rare sight these days.\n\nRarer still was the dress; a formal envoy's tunic bearing the High King's personal coat of arms.\n\nRarer yet still was the message itself, from the Heir Apparent and de facto ruler of Ordoria; no boasts of war, nor vile gloating, but a message of peace.\n\nThe Steward had been cast down, it said. The original grievance for which we rose up had been resolved. There was no further need for violence.\n\nPatently ridiculous, of course. As if a system that produced the likes of Lothinnys was worth keeping around. As if the tyranny of kings and crowns was of negligible concern. As if.\n\nThe reply was short and curt. There would be no negotiations. The Empire would come crashing down, and the people of Ordoria would be liberated."
 rth.79.a:0 "Sic semper tyrannis."
 rth.80.t:0 "Struggle for the Ryselin - Success!"
 rth.80.d:0 "The Ordorians sought to seize the Ryselin from us, but our brave revolutionary forces have pushed them back!"
 rth.80.a:0 "Ha!"
 rth.81.t:0 "Struggle for the Ryselin - Stalemate!"
 rth.81.d:0 "Due to circumstances beyond our control, the struggle for the River Ryselin has come to a stalemate."
 rth.81.a:0 "Good enough for us."
 rth.82.t:0 "Struggle for the Ryselin - Driven Back!"
 rth.82.d:0 "The accursed Ordorians have seized control of Gythus, and with it have gained access to the River Ryselin! Their hold on the Southmountains grows stronger."
 rth.82.a:0 "Damnation!"
 rth.83.t:0 "Commanders Gain Experience"
 rth.83.d:0 "The Revolution has seen many brave souls step up to the task of leading our armies. Thus far, this has been an unmitigated disaster, but no more! With experience gained in the field, our commanders have improved significantly!"
 rth.83.a:0 "Glory to the Revolution!"
 gmr.1.t:0 "Ordorian Overtures"
 gmr.1.d:0 "Our border guards were taken by surprise this morning as an Ordorian delegation came riding out of the jungles, waving the white flag. Apparently, there's been a rather radical shift in attitude in Ordoria's government, and we are now being approached with a proposal: if we pledge to assist Ordoria in putting down the Rthaur rebellion, they are willing to sign a pact of non-aggression with us. What should we do?"
 gmr.1.a:0 "Securing our Southern border would free up troops for our Rimatü campaign - sign the pact!"
 gmr.1.b:0 "Around Elves, watch yourselves - there shall be no such treaty!"
 gmr.2.t:0 "Ordoria Formalizes the Pact"
 gmr.2.d:0 "An envoy from our friends to the South has arrived - they have worked out the final details, and they are ready to formalize our alliance. We have been invited to send a delegation to the port city of Ythelmare to finalize the creation of the pact."
 gmr.2.a:0 "Excellent! Send our most respected diplomats to Ythelmare!"
 gmr.3.t:0 "Ordoria Breaks the Pact"
 gmr.3.d:0 "Citing the defeat of the Rthaur rebellion, the Ordorians have informed us that our alliance has 'outlived its usefulness'. Ordoria considers all treaties between us null and void, and scouts have reported Ordorian troop movements at our border!"
 gmr.3.a:0 "Damn those treacherous Elves!"
 gmr.4.t:0 "Ordoria Seizes Sothane!"
 gmr.4.d:0 "Word has reached us that Ordorian troops have swiftly marched on the small Duchy of Sothane, taking the soldiers there by complete surprise! Sothane is now firmly under Ordorian control..."
 gmr.4.a:0 "Assemble the generals - this means war!"
 gmr.4.b:0 "We must back down for now."
 gmr.5.t:0 "Arthenon Assassinated!"
 gmr.5.d:0 "Terrible news! The Grand Master has been assassinated by an outlaw Noctheurge today. The military has stepped in to maintain order, but the situation is dire..."
 gmr.5.a:0 "Sing of his final stand, long live Trabaster..."
 gmr.6.t:0 "The Realm Shatters!"
 gmr.6.d:0 "The death of the Grand Master, the takeover by the Kingsmen Rebels and now Jace's coup has proven too much to handle for the Realm - the country has shattered, with the natives in every major city driving out the nobility that landed with Arthenon and declaring independence!"
 gmr.6.a:0 "Ierethayne, first nation to fall to the Tyrant, will be the first freed!"
 gmr.6.b:0 "Felweyne, heart of the inland trade of the Northern Plains, will rise once more!"
 gmr.6.c:0 "Kortinall, city of woodworkers, is free at last!"
 gmr.6.e:0 "No, we shall lead another nation..."
 gmr.7.t:0 "Ordorian Raids"
 gmr.7.d:0 "It seems Ordoria is on the move - the village of Dorissus has been put to the torch! Though not many people died, it will take a while to repair the damage..."
 gmr.7.a:0 "Damn them!"
 gmr.8.t:0 "Noble Assassinated!"
 gmr.8.d:0 "The royal court was in shock today, as word reached us a prominent local noble has been assassinated! All signs point to this being the work of Ordoria."
 gmr.8.a:0 "Tragic."
 gmr.9.t:0 "Ordorian Terror Campaign!"
 gmr.9.d:0 "People out late at night are found the next morning as horribly mutilated corpses, children are stolen from their beds, and tortured shrieks can be heard throughout the night. All signs point to Ordoria being behind this."
 gmr.9.a:0 "Double the watch! Nay, triple it!"
 gmr.10.t:0 "Ordorian Meddling"
 gmr.10.d:0 "A disturbing pattern of assassinations, riots and blackmail has come to our attention as of late. It appears that there is a conspiracy in the works with the goal of shattering our Union! All signs point to Ordoria..."
 gmr.10.a:0 "Damn those Elves!"
 gmr.11.t:0 "Separatist Uprisings!"
 gmr.11.d:0 "Funded by foreign groups - all traces leading back to the Ordorians - separatist movements across the nation have risen up! They are well-organized, and if not quickly stopped could bring the entire Realm come crashing down!"
 gmr.11.a:0 "Do everything in our power to stop the separatists!"
 gmr.12.t:0 "Irenthar Remains Loyal"
 gmr.12.d:0 "Though even the capital had to deal with some uprisings, the city's status as capital meant that any such revolt was doomed from the start. Arthenon himself led the charge against the last separatist stronghold, and the heads of the movement's leaders now jut from spikes in front of the gates of the city."
 gmr.12.a:0 "We hold Irenthar. This means not everything is lost."
 gmr.13.t:0 "Irenthar Revolts!"
 gmr.13.d:0 "The separatists have made gains beyond their wildest dreams - Irenthar itself has fallen to the rebels! Arthenon has fled the city, and the Blacksteel Throne has been paraded through the city before being tossed into the harbour. The situation is dire."
 gmr.13.a:0 "We built the city too well - we cannot take it by storm. We must regroup and prepare for siege."
 gmr.13.b:0 "If the capital falls, all is lost - send all available men to retake Irenthar!"
 gmr.14.t:0 "Felwerin Remains Loyal"
 gmr.14.d:0 "Good news! We have received reports from the Enforcers of Felwerin that they have quelled the uprising there. Martial law has been declared, and the city stands ready to aid us in defeating the uprisings!"
 gmr.14.a:0 "The heart of the Northern Plains remains in our hands."
 gmr.15.t:0 "Felwerin Revolts!"
 gmr.15.d:0 "At dawn, a single horseman rode into the city, slumped on his horse with an arrow in his shoulder. It was one of Felwerin's Enforcers, having ridden non-stop for three nights and three days to bring us word that the city has fallen to separatists!"
 gmr.15.a:0 "Regrettable, but the open plains of Felwerin would have been impossible to hold anyway."
 gmr.15.b:0 "Felwerin is the key to controlling the Plains - send in the Enforcers!"
 gmr.16.t:0 "Cortineal Remains Loyal"
 gmr.16.d:0 "The Enforcers in our city of Cortineal have sent word that they have beaten down all separatist movements in the city! Some isolated rebels remain in the thick woodlands surrounding the city, but they should not prove any threat to our control of the region."
 gmr.16.a:0 "Our Southern border is secure!"
 gmr.17.t:0 "Cortineal Revolts!"
 gmr.17.d:0 "Terrible news! After a sustained campaign of guerillia warfare from both the woodlands in the countryside and the slums in the city, Cortineal has fallen to the separatists!"
 gmr.17.a:0 "That is a disappointment, but we cannot do anything right now."
 gmr.17.b:0 "We cannot lose their timber supplies - send in the Enforcers!"
 gmr.18.t:0 "Nastrogdar Remains Loyal"
 gmr.18.d:0 "The Enforcers in Nastrogdar have beaten down a peasant's uprising, and the city stands ready to defend the Realm!"
 gmr.18.a:0 "We won't have to worry about our food supplies, then!"
 gmr.19.t:0 "Nastrogdar Revolts!"
 gmr.19.d:0 "Nastrogdar has fallen to a peasant rebellion! The serfs have put the many aristocratic manors in the countryside to the torch and taken control of the city!"
 gmr.19.a:0 "They're too far away from our secured territory. We'll have to pacify them later."
 gmr.19.b:0 "We msut secure our food supply - send in the Enforcers!"
 gmr.20.t:0 "Caltireth Remains Loyal"
 gmr.20.d:0 "We have received word that Caltireth's loyalty has not wavered! There were some scuffles in the foundries and the mines, but the nobility's troops have put these all down."
 gmr.20.a:0 "Looks like we'll have all the equipment we need to put down these uprisings."
 gmr.21.t:0 "Caltireth Revolts!"
 gmr.21.d:0 "Ill tidings from the East today - Caltireth has declared independence! The nobility has cited the lack of stability in the Realm as the reasaon, proclaiming that we have failed in our obligation to defend them and as such all feudal ties are dissolved."
 gmr.21.a:0 "Without me, those ungrateful bastards would have been rotting away in Eokgi slave ships!"
 gmr.21.b:0 "We must secure the smithies of Kaltire - send in the Enforcers!"
 gmr.22.t:0 "Trifersi Remains Loyal"
 gmr.22.d:0 "Many in our government feared that Trifersi, ever a hub of rebels and other scum, would fall to the separatists, but it seems the local Enforcers acted swiftly to calm the situation down. Martial law has been declared and the gallows are rich with traitor corpses."
 gmr.22.a:0 "Finally some good news for once..."
 gmr.23.t:0 "Trifersi Revolts!"
 gmr.23.d:0 "It seems we were not thorough enough with rooting out the Enstlas dynasty - a young man purporting to be the heir to the Last King has rallied the citizenry and driven out our forces!"
 gmr.23.a:0 "Gah! Do I have to commit every act of regicide myself?!"
 gmr.23.b:0 "Tell the Enforcers to go back in there and do their job properly this time."
 gmr.24.t:0 "Navandon Remains Loyal"
 gmr.24.d:0 "The Navy has proven to be worth its weight in gold today; our sailors have marched from their ships and put down the budding revolutionaries in Navandon!"
 gmr.24.a:0 "We must see the captains responsible get a pay rise."
 gmr.25.t:0 "Navandon Revolts!"
 gmr.25.d:0 "It seems we cannot trust our Navy - the sailors have defected to the separatists en mass, made their captains walk the plank, and declared independence as a Pirate Kingdom under a self-styled Admiral!"
 gmr.25.a:0 "This is purely a land battle. The Navy is of no concern for now."
 gmr.25.b:0 "Time to exploit the Army-Navy rivalry; send in the troops to put down this uprising!"
 gmr.26.t:0 "Enforcers Restore Order in Irenthar"
 gmr.26.d:0 "It was a wise decision to send the Enforcers to retake the capital - Irenthar is once again ours! The Blacksteel Throne has been dredged from the ocean, and a reign of terror by the Enforcers is currently making sure the population never again considers stepping out of line."
 gmr.26.a:0 "The capital is safe. Now, to restore order in the rest of the Realm."
 gmr.27.t:0 "Failed Suppression in Irenthar"
 gmr.27.d:0 "Ill tidings - it turns out we made our capital too well-defended. The Enforcers have tried to take the city by storm, but the citizenry took to the walls and has repelled every attack. Without the numbers for a siege, the Enforcers returned to our current headquarters with heavy losses."
 gmr.27.a:0 "Damnation!"
 gmr.28.t:0 "Enforcers Restore Order in Felwerin"
 gmr.28.d:0 "Our rapid response to the situation in Felwerin has borne fruit - the city is once again in our hands!"
 gmr.28.a:0 "The heartland of the Plains is secure once again."
 gmr.29.t:0 "Failed Suppression in Felwerin"
 gmr.29.d:0 "Sadly, our Enforcers have failed to take Felwerin by surprise. The remaining Enforcers in the city have been bribed by the separatists and are now unwilling to help us sneak into the city. We will have to abandon Felwerin for now."
 gmr.29.a:0 "We will return, and they will pay!"
 gmr.30.t:0 "Enforcers Restore Order in Cortineal"
 gmr.30.d:0 "Excellent news - our Enforcers have retaken Cortineal! Already supplies of timber are flowing into the city again, replenishing our critically low stocks."
 gmr.30.a:0 "This should make the fletchers happy..."
 gmr.31.t:0 "Failed Suppression in Cortineal"
 gmr.31.d:0 "Our advance force has failed to retake Cortineal! This leaves our southern borders dangerously exposed to Ordorian advances..."
 gmr.31.a:0 "Damnation!"
 gmr.32.t:0 "The Realm Shatters!"
 gmr.32.d:0 "Which country shall we lead?"
 gmr.32.a:0 "Navandonne, the base of the Realm's Navy, shall set sail for a Golden Age!"
 gmr.32.b:0 "Nastrodoge, breadbasket of the Northern Plains, shall be ascendant!"
 gmr.32.c:0 "Kaltire's foundries shall pave the way to greatness!"
 gmr.32.e:0 "No, let us rule from elsewhere..."
 gmr.33.t:0 "The Realm Shatters!"
 gmr.33.d:0 "Which country shall we lead?"
 gmr.33.a:0 "Trifell, last to fall, shall be the first to rise from the ashes!"
 gmr.33.b:0 "We shall not give up on the ambitions of the Grand Master!"
 gmr.33.c:0 "No, we must govern from another city."
 gmr.34.t:0 "Failed Suppression in Nastrogdar!"
 gmr.34.d:0 "The Enforcers we sent to pacify the farmers of Nastrogdar have been bled dry by a sustained campaign of harassment, and when they arrived at the city they were laughed off by the defenders. It seems our efforts to retake the Realm's breadbasket have failed."
 gmr.34.a:0 "Curses!"
 gmr.35.t:0 "Enforcers Restore Order in Nastrogdar"
 gmr.35.d:0 "Our Enforcers have marched into Nastrogdar, fighting off the occasional group of disorganized farmers, and have retaken the city with little effort."
 gmr.35.a:0 "Excellent news!"
 gmr.36.t:0 "Enforcers Restore Order in Caltireth"
 gmr.36.d:0 "Our armies have successfully retaken the foundries of Caltireth, and the rebellious nobles have surrendered. They are now locked in their own prisons!"
 gmr.36.a:0 "Our supply of arms is secured."
 gmr.37.t:0 "Failed Suppression in Caltireth"
 gmr.37.d:0 "The Caltiran nobility has unfortunately had the bright idea to arm their troops with the weapons and armour from their foundries. This has helped them beat back our troops!"
 gmr.37.a:0 "Damnation!"
 gmr.38.t:0 "Enforcers Restore Order in Trifersi"
 gmr.38.d:0 "The Enforcers have finally done their job - the corpse of the last heir of the Enstlas Dynasty now hangs from the gates of the city, and the rebellion is broken at last!"
 gmr.38.a:0 "Good news!"
 gmr.39.t:0 "Failed Suppression in Trifersi"
 gmr.39.d:0 "The citizens of Trifersi continue to defy us - they have fought off the troops we sent in to quash the rebellion, and they now stand ready to march on our territory!"
 gmr.39.a:0 "Curses!"
 gmr.40.t:0 "Enforcers Restore Order in Navandon"
 gmr.40.d:0 "The Navy has shown why it should stick to the seas - our troops have easily shattered their resistance and put down the rebellion!"
 gmr.40.a:0 "The generals responsible should be promoted!"
 gmr.41.t:0 "Failed Suppression in Navandon"
 gmr.41.d:0 "The rebellious sailors have beaten back our troops sent in to retake our rightful lands!"
 gmr.41.a:0 "I knew we should have just given them those oranges..."
 gmr.42.t:0 "Order Restored!"
 gmr.42.d:0 "The situation was dire, but we have presevered and put down every last separatist movement! The Black Gargoyle flies proudly from every major city on the Northern Plains once more!"
 gmr.42.a:0 "Glory to the Grand Master!"
 gmr.43.t:0 "The Kingsmen Rebellion"
 gmr.43.d:0 "Rumours of discontent and sedition are nothing new to the Enforcers, but unrest has reached a boiling point as of late. A young Half-Elven peasant from the farms of Nastrodoge claims he was told by the false gods of the native populace that he was destined to rule the Northern Plains, and he has been assembling an army of traitors for years. It seems that he finally felt ready to raise his banner in open revolt, and several cities have already fallen to his rebellion!"
 gmr.43.a:0 "Crush this upstart half-blood and wipe his army from the face of the planet!"
 gmr.43.b:0 "No longer shall the Northern Plains suffer under the tyranny of the Black Gargoyle!"
 gmr.44.t:0 "Dominance Restored!"
 gmr.44.d:0 "Victory is ours! Those foolish enough to question the will of the Grand Master have been beaten down, their little rebellion crushed. Arthenon is once more the undisputed lord of the Northern Plains!"
 gmr.44.a:0 "Glory to the Grand Master!"
 gmr.45.t:0 "Ordorian Raid!"
 gmr.45.d:0 "Terrible news - it seems one of our merchant fleets has been raided by Ordorian pirates! This will hurt our economy..."
 gmr.45.a:0 "Damn those Ordorians!"
 gmr.46.t:0 "The Ungerdaler Union offers Pact"
 gmr.46.d:0 "Envoys from the Human realm to the South of Ordoria, the Ungerdaler Union, have arrived in Irenthar today. Meeting with the Juridity of Influence, they have argued that Ordoria is an existential threat to the both of us, and they have offered us an alliance. The matter has been deferred to Arthenon - what is the Grand Master's Judgement?"
 gmr.46.a:0 "The Black Gargoyle shall unite with the Cobalt Eagle - let the pact be made!"
 gmr.46.b:0 "We have better things to do than get involved with Ungerdaler politicking."
 gmr.47.t:0 "The Union Denounces Us!"
 gmr.47.d:0 "Shocking news from the Union - with the defeat of the Ordorians, the Union no longer considers our alliance beneficial, and they have informed us that it they consider the Twothrone Concord null and void! Their armies have already been spotted on our borders, and our advisors and observers have been ejected from their lands..."
 gmr.47.a:0 "Curse those damnable Southerners!"
 gmr.48.t:0 "The Jurditiy of Benevolence Declares for Arthenism"
 gmr.48.d:0 "Though for most of the duration of the Conquest, our generals-turned-nobility remained unified behind the Sothrist faith of our homeland, some were so awestruck by Arthenon's might that they began to whisper rumours of the Grand Master being more than human. Eventually, these seeds grew into a cult and then a fully-fledged, if fringe, religion. This religion has spread amongst the nobility, and even some of the natives. It has, in fact, grown so popular that the Juridity of Benevolence has openly declared itself Arthenist and is pushing for the faith to be made the state religion! This is doubtlessly a move by the High Juritor of Benevolence to increase his power, but we must nonetheless decide a course of action."
 gmr.48.a:0 "We will have to consider this development."
 gmr.49.t:0 "Religious Struggles"
 gmr.49.d:0 "With the recent declaration by the Juridity of Benevolence, religious tensions in our nation have come to a head. The nobility is now bitterly divided between the Sothrists and the Arthenists, and the local faith is more and more becoming the crux of the resistance movement. We need to decide what religion will guide the Realm before this schismatism undoes all we have fought for!"
 gmr.49.a:0 "Muzma and Dibegar would strike us down if we abandoned them!"
 gmr.49.b:0 "God-King, huh? I like the sound of that!"
 gmr.49.c:0 "Pragmatism must prevail - we must adopt the native religion!"
 gmr.50.t:0 "A Royal Proposal"
 gmr.50.d:0 "An envoy has arrived from the Ungerdaler Union, with the offer of uniting the houses of Vlussinger and Arthenon through marriage. We have a spare cousin or two lying around - what do we say?"
 gmr.50.a:0 "Let us bind our houses together!"
 gmr.50.b:0 "No, we shall not sully our bloodline."
 npc.1.t:0 "The Kingsmen Revolution"
 npc.1.d:0 "The war has been brutal, and has taken a heavy toll upon the land, but we have finally succeeded in overthrowing the Blacksteel Tyrant! The banner of the Confederation now flies from the gates of Ierethayne, and the last of the Black Gargoyles have surrendered. Great celebrations are going on in the streets, but Astrellion and his most trusted advisors have already gathered to form a new government."
 npc.1.a:0 "Oh rally, all ye sons of freedom!"
 npc.2.t:0 "Attempt on the King's Life!"
 npc.2.d:0 "Early this morning, when the King was out on a stroll through his garden, he was beset upon by several men led by Jace Stoutfellow, the Rebellion's old cook and now palace chef! It seems he has assembled a gang of cronies from among the thugs of the Rebels, and is now attempting a coup d'etat by slaying Astrellion!"
 npc.2.a:0 "Woe is us, Astrellion is slain and Stoutfellow takes power!"
 npc.2.b:0 "Ulmién survives his attack and defeats his would-be assassins!"
 npc.3.t:0 "Choosing the Capital"
 npc.3.d:0 "Astrellion's government is still in formation, but there is one question that has to be settled as soon as possible; which city should become our new capital? Some argue in favour of Ierethayne for its formidable defenses, while others say that we should stay in Nastrodoge. Of course, the locals of every major city in the Confederation are clamouring for their city to be granted the honour of being the new capital."
 npc.3.a:0 "Let us stick to Nastrodoge."
 npc.3.b:0 "Ierethayne has been purged of Arthenon's taint."
 npc.3.c:0 "No, let us choose another city."
 npc.4.t:0 "Choosing the Capital"
 npc.4.d:0 "Which city should become the new capital?"
 npc.4.a:0 "Kortinall!"
 npc.4.b:0 "Felweyne!"
 npc.4.c:0 "No, let us choose another city."
 npc.5.t:0 "Choosing the Capital"
 npc.5.d:0 "Which city should become the new capital?"
 npc.5.a:0 "Kaltire"
 npc.5.b:0 "Navandonne!"
 npc.5.c:0 "Trifersi!"
 npc.5.e:0 "No, let us choose another city."
 npc.6.t:0 "Ordoria Seizes Sothane!"
 npc.6.d:0 "Word has reached us that Ordorian troops have swiftly marched on the small Duchy of Sothane, taking the soldiers there by complete surprise! Sothane is now firmly under Ordorian control..."
 npc.6.a:0 "Assemble the generals - this means war!"
 npc.6.b:0 "We must back down for now."
 krt.1.t:0 "Ordoria Seizes Sothane!"
 krt.1.d:0 "Word has reached us that Ordorian troops have swiftly marched on the small Duchy of Sothane, taking the soldiers there by complete surprise! Sothane is now firmly under Ordorian control..."
 krt.1.a:0 "Assemble the generals - this means war!"
 krt.1.b:0 "We must back down for now."
 vrg.1.t:0 "Zarathum Restored!"
 vrg.1.d:0 "The thousands of masons we have hired from all over the Dwarven lands have swarmed the ancient ruins of what was once the mightiest citadel of Dwarvenkind on Lathweyne for months, working hard to restore it to its former glory. They have finally completed their task, and our people are flocking to the newly-restored city by the hundreds of thousands!"
 vrg.1.a:0 "Glory to Zarathum and the Dwarven peoples!"
 vrg.2.t:0 "Citizens Migrate to Zarathum!"
 vrg.2.d:0 "With the re-establishment of the jewel of the Oramfell Mountains, the mighty City of Zarathum, many of our subjects have left our country to return to our peoples's ancient homeland! Zarathum swells as our cities grow empty."
 vrg.2.a:0 "They shall be missed, but we cannot blame them"
 vrg.3.t:0 "Settlers arrive in Zarathum!"
 vrg.3.d:0 "Word of our glorious reconquest of Zarathum has arrived, and many of our people have made the hard trek homeward to join us in our endeavours! The streets of Zarathum have grown more populated as a result."
 vrg.3.a:0 "A wave of migrants has arrived?"
 vrg.4.t:0 "Dwarven Diaspora Returns!"
 vrg.4.d:0 "The reconstruction of the Zarathum has become renowned all over Latherin and Asweyne, and many of those that had settled in Human or Elven lands are now returning to the mountainhomes! Zarathum has undergone a veritable population explosion."
 vrg.4.a:0 "Long lost but home again!"
 vrg.5.t:0 "Migrants Arrive at Zarathum"
 vrg.5.d:0 "Zarathum continues to act as a beacon of hope to Dwarvenkind, and migrants continue to trickle in. On some days, we receive an especially large influx of new citizens, either through co-ordination or sheer fortune. Today is one such day. Eventually, this influx of new migrants will run out, but for now, we can enjoy a steady pace of growth."
 vrg.5.a:0 "Welcome, Dwarves!"
 vrg.6.t:0 "Bergialer Autonomy?"
 vrg.6.d:0 "Though we have done the impossible and reconquered the Oramfell, many of our kin do not share our pro-Vergall sentiment. A large contigent of our people, especially among the youth, identify more as Bergialer than as Vergall. So much, in fact, that they demand a measure of autonomy in governing themselves!"
 vrg.6.a:0 "We shall let them administer their own affairs."
 vrg.6.b:0 "Laughable - they are Vergall!"
 vrg.7.t:0 "The Bergialer War of Independence"
 vrg.7.d:0 "The Bergialer Dwarves have completely rejected our authority, and are now taking up arms to assert their independence. This is unacceptable!"
 vrg.7.a:0 "To arms!"
 ung.1.t:0 "Ordorian Overtures"
 ung.1.d:0 "The Freiprinz of Stahlhof has sent word of a strange occurence - it seems that an Ordorian delegation has emerged from the forest, requesting an audience with High Princess Adelina. Apparently, they want to strike a deal of some sorts. What should we do?"
 ung.1.a:0 "We can at the very least listen to what they have to say."
 ung.1.b:0 "I don't trust this - send the Ordorians home!"
 ung.2.t:0 "Ordoria Demands Return of Territory"
 ung.2.d:0 "After several hours of negotiations, our diplomats have come to Hochprinzessin Adelina with the Ordorians' final proposal - Stahlhof is to return all land they have conquered from Ordoria, in exchange for a non-aggression treaty, to be turned into an alliance once the Grand Master has responded to a similar deal offered by Ordoria."
 ung.2.a:0 "Ordoria would be a powerful ally... Very well, send a letter to Freiprinz Schwarzenbach."
 ung.2.b:0 "What nerve! Tell the Ordorians where they can shove their treaty!"
 ung.3.t:0 "Ordoria Settles for Partial Concessions"
 ung.3.d:0 "After several hours of negotiations, our diplomats have come to Hochprinzessin Adelina with the Ordorians' final proposal - if Stahlhof returns half of the land they took from Ordoria, the Ordorians are willing to forego the remainder of their claims. Additionally, Ordoria proposes a non-aggression treaty, to be turned into an alliance once the Grand Master has responded to a similar deal offered by Ordoria."
 ung.3.a:0 "A reasonable compromise, sign the pact and send a letter to Stahlhof."
 ung.3.b:0 "Ordoria hasn't been trustworthy in the past, why should we believe them now?"
 ung.4.t:0 "Ordoria Suggests Territorial Exchange"
 ung.4.d:0 "After several hours of negotiations, our diplomats have come to Hochprinzessin Adelina with the Ordorians' final proposal - Stahlhof is to return half of the land they took from Ordoria. In exchange, Ordoria will forego the remainder of their claims and grant Stahlhof some land to the East. Finally, they proposes a non-aggression treaty, to be turned into an alliance once the Grand Master has responded to a similar deal offered by Ordoria."
 ung.4.a:0 "An excellent suggestion! Sign the treaty and send a letter to Schwarzenbach."
 ung.4.b:0 "This stinks of treachery - no deals with Ordoria!"
 ung.5.t:0 "Ordoria Breaks the Pact"
 ung.5.d:0 "Citing the defeat of the Rthaur rebellion, the Ordorians have informed us that our alliance has 'outlived its usefulness'. Ordoria considers all treaties between us null and void, and scouts have reported Ordorian troop movements at our border!"
 ung.5.a:0 "Damn those treacherous Spitzohren!"
 ung.6.t:0 "Ordoria Formalizes the Pact"
 ung.6.d:0 "An envoy from our friends to the North has arrived - they have gotten a response from Arthenon, and they are ready to formalize our alliance. We have been invited to send a delegation to the port city of Ythelmare to finalize the creation of the pact."
 ung.6.a:0 "Excellent! Send our most respected diplomats to Ythelmare!"
 ung.7.t:0 "Ordorian Raids"
 ung.7.d:0 "It seems Ordoria is on the move - the village of Ohnewasser has been put to the torch! Though not many people died, it will take a while to repair the damage..."
 ung.7.a:0 "Damn them!"
 ung.8.t:0 "Noble Assassinated!"
 ung.8.d:0 "The royal court was in shock today, as word reached us a prominent local noble has been assassinated! All signs point to this being the work of Ordoria."
 ung.8.a:0 "Tragic."
 ung.9.t:0 "Ordorian Terror Campaign!"
 ung.9.d:0 "People out late at night are found the next morning as horribly mutilated corpses, children are stolen from their beds, and tortured shrieks can be heard throughout the night. All signs point to Ordoria being behind this."
 ung.9.a:0 "Double the watch! Nay, triple it!"
 ung.10.t:0 "Ordorian Meddling"
 ung.10.d:0 "A disturbing pattern of assassinations, riots and blackmail has come to our attention as of late. It appears that there is a conspiracy in the works with the goal of shattering our Union! All signs point to Ordoria..."
 ung.10.a:0 "Damn those Elves!"
 ung.11.t:0 "The Union Fraying!"
 ung.11.d:0 "Acts of politicide and terrorism have rocked our city for weeks on end, and all evidence points towards Schwarzenbach! We have ordered our armies to march on Stahlhof and arrest him at once. Some rumours abound that the Ordorians are behind this, but that's clearly nonsense. What do they stand to gain from this?"
 ung.11.a:0 "Seize the traitor!"
 ung.12.t:0 "Ordorian Raid!"
 ung.12.d:0 "Terrible news - it seems one of our merchant fleets has been raided by Ordorian pirates! This will hurt our economy..."
 ung.12.a:0 "Damn those Ordorians!"
 ung.13.t:0 "The Sack of Schneefilde"
 ung.13.d:0 "The sky filled with smoke today, as the city of Schneefilde burnt. The marauders of Perkavland have broken down the gates of the city and razed it to the ground, looting and burning as they go. The entire Freiprinztum of Schneefilde is reeling from this blow, and adequate responses, both to Perkavland's actions and the resulting devastation, must be formulated at once."
 ung.13.a:0 "Curse those Perkav barbarians!"
 ung.14.t:0 "The Princely Response"
 ung.14.d:0 "One of our subjects' capitals has been ransacked, and the Freiprinzen are balking for blood. It is crucial that we formulate a decisive response with haste."
 ung.14.a:0 "We have bigger threats to worry about than some barbarians stealing trinkets."
 ung.14.b:0 "We must end the Perkav threat once and for all."
 ung.14.c:0 "A diplomatic solution is in our long-term interests."
 ung.15.t:0 "Territorial Concessions?"
 ung.15.d:0 "A large reason for the Perkav raids into our territory is the lack of arable land in their realm. If we gave them some land to farm, they would likely stop raiding our territory. The only question is which lands to give up."
 ung.15.a:0 "Schneefilde can miss some of their territory!"
 ung.15.b:0 "Schneefilde has suffered enough, Wertszvörde can make some sacrifices!"
 ung.16.t:0 "Perkavland Rejects Territorial Concessions"
 ung.16.d:0 "It seems that Perkavland is not interested in stopping their raids in exchange for lands. Our ambassadors have returned empty-handed, and the raids continue."
 ung.16.a:0 "It is clear that Krell cannot govern competently."
 ung.17.t:0 "The Policy of Appeasement"
 ung.17.d:0 "Although the hawkish elements at court protested vehemently, we have decided on a policy of appeasement. The only thing left to decide now is whether to offer money or land."
 ung.17.a:0 "We should give them some lands, that ought to pacify them."
 ung.17.b:0 "We ought to pay off their raiders."
 ung.18.t:0 "Perkavland Accepts!"
 ung.18.d:0 "Good news! Perkavland has accepted our offer of aid. It appears that the chieftains were bitterly divided on the matter, debating the issue for three days. It was finally settled when Krell declared that they were going to accept, then promptly beating down three challengers on the spot. Our diplomats claim it was quite impressive to behold."
 ung.18.a:0 "Excellent!"
 ung.19.t:0 "Perkavland Rejects!"
 ung.19.d:0 "Our diplomats have returned without success; Perkavland has rejected our generous offer, with our officials being laughed out of the room - Krell himself told our delegates that 'they have nothing to learn from some uppity, fat city-dwellers'. It is clear a diplomatic option is out of the question."
 ung.19.a:0 "This means war!"
 ung.19.b:0 "We have bigger concerns than some unwashed barbarians..."
 ung.20.t:0 "Proselytize in Perkavland?"
 ung.20.d:0 "Our diplomatic efforts in Perkavland have not gone unnoticed by the clergy. Today, we have been approached by Erzbischof Rosenstock of St. Vichtlas, who as requested permission to send a mission into the barbarian lands to the South. Should we allow Rosenstock to send his people to preach among the pagans?"
 ung.20.a:0 "Yes, we must spread the True Faith!"
 ung.20.b:0 "Let them keep their superstitions."
 ung.21.t:0 "Perkavland Allows Proselytizing"
 ung.21.d:0 "We have received word from Krell that our priests are allowed to spread the word of the Seven. We will soon have them weaned off of their foolish belief in but a single god."
 ung.21.a:0 "Praise the Seven!"
 ung.22.t:0 "Perkavland Declines Priests"
 ung.22.d:0 "Unfortunately, it seems Rosenstock's mission has failed. Krell has - albeit respectfully, to his credit - declined the offer of preachers. It seems that Perkavland prefers to stay true to their old ways."
 ung.22.a:0 "It's their souls at stake, not ours."
 ung.23.t:0 "Krell Bends the Knee"
 ung.23.d:0 "Great news - Krell has accepted the Freithron, and is now on his way to Faustburg to swear fealty to the Hochprinzessin. Perkavland shall soon become a new Freiprinztum in the Unionn!"
 ung.23.a:0 "A victory for diplomacy!"
 ung.24.t:0 "Krell Declines"
 ung.24.d:0 "Sadly, it seems that Perkavland is adamant in its independence. They have refused to swear fealty, but they have agreed to a mutual defense treaty."
 ung.24.a:0 "At least our Southern border is secure."
 ung.25.t:0 "Foreign Policy"
 ung.25.d:0 "With the ascension of a new Hochprinzessin comes a chance to reinvigorate our position on the world stage. Where our predecessors took a somewhat isolationist stance to international relations, spending most of their time on internal affairs, Adalina is notable for her determination to turn the Union into a great power. Several of her advisors have pleaded for an aggressive, expansionist policy, while others advocate the use of soft power, using alliances and diplomacy to bring glory to the Union."
 ung.25.a:0 "The Bundesfahne shall fly over all of Latherin and Asweyne!"
 ung.25.b:0 "A network of alliances shall secure our rise to power."
 ung.26.t:0 "Tlarthingia Refuses!"
 ung.26.d:0 "An envoy from the Lizardmen has arrived today, letting us know that 'our fathers and mothers did not fight for an independent Tlarthingia only for us to give it away to another tyrant,' and that 'the proud people of Tlarthingia would never bend the knee' to the Hochprinzessin. While we could declare war on them in response, many within the Union would see this as a shockingly illegitimate act of statecraft, which would hurt our position greatly..."
 ung.26.a:0 "It is a shame they called our bluff."
 ung.26.b:0 "So be it! Let them know they are on their own."
 ung.26.c:0 "The Freiprinzen be damned, to arms!"
 ung.27.t:0 "Rthauiaur Accepts!"
 ung.27.d:0 "Our envoy returned from Quellion today, covered in sweat and with a couple nasty snake-bites, but with good news. After hours of tense deliberation between the various representatives of the villages and towns of the rebels, they have decided to stand with us against Ordoria!"
 ung.27.a:0 "Onwards, to Istaroth!"
 ung.28.t:0 "Rthauiaur Declines!"
 ung.28.d:0 "Our guards were met with a strange vision this morning - clad in simple brown peasant's garg, waving a red and gold banner imprinted with the bread and rose of the Rthaur rebellion, our envoy returned today, having clearly gone mad. Though most of what he says is heretical nonsense about 'peasant's rights' and 'strange women sitting on thrones raking in votes not being a basis for a system of government', he did tell us in no uncertain terms that the Rthaur had refused our request."
 ung.28.a:0 "That damn rabble has caused its own downfall! Oh, and throw that envoy in the oubliette."
 ung.29.t:0 "Rthauiaur Ends the Pact"
 ung.29.d:0 "After our victory over the Ordorians today, a representative of the Rthaur people informed our Hochprinzessin of the pact coming to an end. Though we have parted peacefully, we are under no illusions as to what they would do with our system of governance if given the chance."
 ung.29.a:0 "We must be vigilant."
 ung.30.t:0 "Lirothlind Accepts!"
 ung.30.d:0 "Our envoy has returned from the frozen lands of Lirothlind. The Elves of the North have let us know they are willing to stand with us against Arthenon."
 ung.30.a:0 "Excellent."
 ung.31.t:0 "Lirothlind Refuses."
 ung.31.d:0 "Unfortunately, it seems that Lirothlind does not wish to stand with us against the Realm. They claim they do not wish to risk angering Arthenon."
 ung.31.a:0 "Too bad."
 ung.32.t:0 "Rimatü Accepts!"
 ung.32.d:0 "Our envoy has returned from the imposing mountains of Rimatü. The Dwarves of the North have let us know they are willing to stand with us against Arthenon."
 ung.32.a:0 "Excellent."
 ung.33.t:0 "Rimatü Refuses."
 ung.33.d:0 "Unfortunately, it seems that Rimatü does not wish to stand with us against the Realm. They claim they do not wish to risk angering Arthenon."
 ung.33.a:0 "Too bad."
 ung.34.t:0 "Influx of Orodian Refugees"
 ung.34.d:0 "A trickle of Elves has been entering the Union ever since Lothinnys' coup, but the uprising in the East and subsequent paranoid crackdowns by the government have turned this into a flood. Though this is clearly a humanitarian crisis, some of our officials are concerned Ordorian spies may be among the refugees. What should we do?"
 ung.34.a:0 "We shall provide these victims of war and madness with whatever they need."
 ung.34.b:0 "We cannot afford to give Ordoria eyes throughout our nation."
 ung.35.t:0 "Tlarthingian Complacency"
 ung.35.d:0 "It appears that Tlarthingia has grown a little too confident in our protection. Reports from our observer missions and stationed troops claim that Tlarthingian military discipline has grown lax, relying on our reputation to keep the Irinthians at bay. This is clearly not an ideal situation - how should we respond?"
 ung.35.a:0 "We guaranteed warriors, not useless lizards. Remind the Tlarthingians of their obligations."
 ung.35.b:0 "Lax and not guarding their borders you say?"
 ung.36.t:0 "Reach Out to the Rthaur?"
 ung.36.d:0 "Citing the existential threat posed to our people by the Ordorian menace, several of our advisors have come forth with a drastic proposal - to ally ourselves with the Rthaur rebels. They might oppose our existence as nobility, they argue, but at least they don't oppose our existence as Humans. Should we commit to such an unthinkable alliance?"
 ung.36.a:0 "Rather them than the Ordorians!"
 ung.36.b:0 "The Rosites are exactly as dangerous as the Puritans!"
 ung.37.t:0 "Seeking Allies in the North"
 ung.37.d:0 "With the Ordorian threat dealt with, the Hochprinzessin and her advisors have been preparing for the next campaign, against Arthenon's Realm. It has become clear that we need an ally in the region if we are to emerge victorious. Our options are the Elves of Lirothlind, or the Dwarves of Rimatü. Given their well-documented loathing for each other, approaching one will inevitably alienate the other. Who should we make overtures to?"
 ung.37.a:0 "The narrow border of Lirothlind shall prove a most valuable defensive line!"
 ung.37.b:0 "The Fireforge weapons of Rimatü will cleave the Realm asunder!"
 ung.38.t:0 "Rthauiaur Rejects!"
 ung.38.d:0 "The Rthaur have categorically refused to grant any concessions to the nobility, forgoing our support."
 ung.38.a:0 "That is a shame."
 ung.39.t:0 "Rthauiaur Makes Concessions"
 ung.39.d:0 "Though they are not happy about it, the Rthaur government has accepted some noble blood in their government. Already the divine right to rule is being restored in some places in their land. Naturally, we have upheld our end of the bargain."
 ung.39.a:0 "Excellent."
 ung.40.t:0 "Stahlhof Requests Arms"
 ung.40.d:0 "Freiprinz Schwarzenbach has been skirmishing with the Ordorians on and off for years now, and to this end he has received men and material from Adalina on multiple occasions. He is once again asking for our material support, but rumour has it he is planning to stage a coup and attempt to seize the Prinzthron. Should we be arming a potential traitor?"
 ung.40.a:0 "Let him and Ordoria bleed each other dry."
 ung.40.b:0 "We cannot risk arming Stahlhof even more."
 ung.41.t:0 "Assisting the Revolution"
 ung.41.d:0 "The East of Ordoria has been in open revolt for several years now, and though the conflict has been quietly simmering for a while, it appears Ordoria is preparing for some aggressive moves. Our advisors are suggesting we assist the Rthaur in preparing for the inevitable Ordorian attack, but they are divided on whether or not that aid should come with any strings attached."
 ung.41.a:0 "We cannot risk the Rthaur declining and being crushed by Ordoria. Offer unconditional support."
 ung.41.b:0 "If they want our help, they'll have to play quid pro quo. Demand concessions for support."
 ung.42.t:0 "Arthenon Accepts Pact"
 ung.42.d:0 "Word from the Northern Plains - Arthenon is willing to stand with us against Ordoria! Our generals have met with the Grand Master's for a strategic planning session in Irenthar. Ordoria does not stand a chance against the two most powerful Human nations on Latherin united."
 ung.42.a:0 "The Freithron and the Blacksteel Throne stand united."
 ung.43.t:0 "Arthenon Rejects Pact"
 ung.43.d:0 "Sadly, Arthenon has expressed a lack of interest in forming a united front against the Ordorian menace. We stand alone against the Elves, and the Grand Master's Realm does, too."
 ung.43.a:0 "So be it."
 ung.44.t:0 "Risk of Civil War!"
 ung.44.d:0 "The Hochprinztum is not what it has been. Despite Adalina's best efforts, our realm's stability has been on the decline, and with rampant crime, corruption and general disregard for the laws of the land, many are now beginning to question the legitimacy of Adalina's rulership. This situation cannot be allowed to continue."
 ung.44.a:0 "This cannot be allowed to continue."
 ung.45.t:0 "Beginnings of Stabilization"
 ung.45.d:0 "It seems the worst of our period of instability is behind us. Adalina's leadership has rounded up the bandits, thieves and corrupt officials that have been plaging the land, and her rule is slowly becoming respected once more. We should never again let our country slide so far into chaos."
 ung.45.a:0 "The Seven save the Hochprinzessin!"
 ung.46.t:0 "The Anniversary Ball"
 ung.46.d:0 "After months of preparations, the Anniversary Ball is finally here! Guests from all over the Union have arrived, the drinks are flowing freely, and Adalina is talking to people left and right. After she'd given a well-received speech before the ball's start, she's been making good impressions on nobles, merchants and other dignitaries from across the land."
 ung.46.a:0 "A riveting success!"
 ung.47.t:0 "Noble's Plot Foiled!"
 ung.47.d:0 "Excellent news! The Royal Guard has reported no major problems in the arrests of those suspected of treachery - they were taken by complete surprise, and those few that put up a fight were quickly subdued. Adalina's reign is once again secured."
 ung.47.a:0 "For the glory of the Hochprinzessin!"
 ung.47.b:0 "The safety of Her Highness is paramount - make sure this can never happen again!"
 ung.48.t:0 "The Nobility Revolts!"
 ung.48.d:0 "Ill tidings - it appears that there was a spy among court, and the nobility was ready for those sent to arrest them! Our troops walked into a multitude of ambushes and traps, and most are arrested or slain. The nobility is now openly marching on the Faust!"
 ung.48.a:0 "Rally those of our troops that remain and prepare the defenses!"
 ung.49.t:0 "The Rebellion Crushed!"
 ung.49.d:0 "All seemed lost as traitor forces broke down the gates of the Faust, but at the eleventh hour, a young lieutenant from the Royal Guard, who had apparently rallied the surviving troops sent to the arrests, charged the rear of the foe! This threw the enemy in complete disarray, and Adalina herself led the countercharge from the defenders. The treasonous rebels have been scattered to the winds!"
 ung.49.a:0 "For the glory of the Hochprinzessin!"
 ung.49.b:0 "The safety of Her Highness is paramount - make sure this can never happen again!"
 ung.50.t:0 "The Rebels Victorious"
 ung.50.d:0 "With the initial forces sent to arrest the nobility shattered, the Faust was left without its most skilled defenders. When the nobility and their retinues marched on the castle, the writing was on the wall, and Adalina met the revolutionaries outside to surrender and save the city from bloodshed. She has been placed under house arrest, and though she is still nominally the Hochprinzessin, the nobility is well and truly in charge of Faustburg."
 ung.50.a:0 "Adalina's time is over. It is time for the adults to step in and take charge."
 ung.51.t:0 "Tlarthingia Agrees to Alliance!"
 ung.51.d:0 "The Tlarthingians have responded positively to our proposal for an alliance! Our generals are already exchanging intelligence and planning joint exercises."
 ung.51.a:0 "Wonderful."
 ung.52.t:0 "Tlarthingia Rejects Alliance!"
 ung.52.d:0 "The Tlarthingians have responded negatively to our proposal for an alliance. It seems we will have to find friends elsewhere."
 ung.52.a:0 "That is disappointing."
 ung.53.t:0 "Pick Your Power"
 ung.53.d:0 "Waltz or Keohane?"
 ung.53.a:0 "Hard Power"
 ung.53.b:0 "Soft Power"
 ung.54.t:0 "Irinthios Agrees to Alliance!"
 ung.54.d:0 "The Irinthians have responded positively to our proposal for an alliance! Our generals are already exchanging intelligence and planning joint exercises."
 ung.54.a:0 "Wonderful."
 ung.55.t:0 "Irinthios Rejects Alliance!"
 ung.55.d:0 "The Irinthians have responded negatively to our proposal for an alliance. It seems we will have to find friends elsewhere."
 ung.55.a:0 "That is disappointing."
 ung.56.t:0 "The Bergialer Call for Aid!"
 ung.56.d:0 "Our Dwarven friends to the North have officially declared war on the Kurgur Orcs in order to retake their homeland. As promised, we will join their side."
 ung.56.a:0 "To arms!"
 ung.57.t:0 "Irinthios Accepts!"
 ung.57.d:0 "Our envoy to Irinthios has returned - with a Chairophon! He and our Hochprinzessin's cousin are already happily chatting away, and the wedding is scheduled for within the week!"
 ung.57.a:0 "The Seven bless the happy couple!"
 ung.58.t:0 "Irinthios Declines!"
 ung.58.d:0 "Our envoy has returned from Irinthios, alone. It seems the Irinthians are not interested in binding our houses together through blood ties."
 ung.58.a:0 "A shame."
 ung.59.t:0 "Arthenon Accepts!"
 ung.59.d:0 "Our envoy to the Realm has returned - with an Arthenon! He and our Hochprinzessin's cousin are already happily chatting away, and the wedding is scheduled for within the week!"
 ung.59.a:0 "The Seven bless the happy couple!"
 ung.60.t:0 "Arthenon Declines!"
 ung.60.d:0 "Our envoy has returned from the Realm, alone. It seems the Grand Master is not interested in binding our houses together through blood ties."
 ung.60.a:0 "A shame."
 ung.61.t:0 "Skaelinger Calls for Aid!"
 ung.61.d:0 "Our Dwarven friends to the North have officially declared war on the Kurgur Orcs in order to retake their homeland. As promised, we will join their side."
 ung.61.a:0 "To arms!"
 ung.62.t:0 "Skaelinger Attends!"
 ung.62.d:0 "Our diplomats have returned, and with them has come King Ystvigg Hellirfast! Though he is sceptical as to the success of the summit, he is at least willing to attend."
 ung.62.a:0 "It is good to see that diplomacy has not yet faltered."
 ung.63.t:0 "Skaelinger Declines Invitation!"
 ung.63.d:0 "Sadly, our diplomats have returned empty-handed. King Hellirfast has refused to attend our meeting, claiming that 'meeting with those secessionists is tantamount to betraying my country and my people'. It seems our summit has died before it has even begun."
 ung.63.a:0 "A shame."
 ung.64.t:0 "Rimatü Attends!"
 ung.64.d:0 "Our diplomats have returned, and with them has come King Joris Skyldske! Though he is sceptical as to the success of the summit, he is at least willing to attend."
 ung.64.a:0 "It is good to see that diplomacy has not yet faltered."
 ung.65.t:0 "Rimatü Declines Invitation!"
 ung.65.d:0 "Sadly, our diplomats have returned empty-handed. King Skyldske has refused to attend our meeting, claiming that 'meeting with those imperialists is tantamount to betraying my country and my people'. It seems our summit has died before it has even begun."
 ung.65.a:0 "A shame."
 ung.66.t:0 "The Nordtorf Summit"
 ung.66.d:0 "The Kings of Rimatü and Skaelinger have both arrived to discuss the hostility between their nations. Skyldske has cited Skaelinger's failure to protect the Vergall Empire from the Kurgur, as well as the unjust treatment of the Northern thaigs in general. Hellirfast pleaded Skaelinger's case with equal passion, citing abuses of power by Rimatan officials, historical dominion over Rimatü, and the unity of Dwarvenkind. The two remain at loggerheads, but our voice might just make a decision - what is our stance?"
 ung.66.a:0 "King Hellirfast is in the right!"
 ung.66.b:0 "Truth is on the side of King Skyldske!"
 ung.67.t:0 "Rimatü Accepts Ruling"
 ung.67.d:0 "After an impassioned speech by Hochprinzessin Adalina, King Skyldske has softened his stance. \n'Perhaps, then, for the good of all Dwarfkind, we should bury the hatchet'.\n On behalf of Rimatü, he has agreed to cease all hostilities towards Skaelinger and recognize Hellirfast as the sovereign lord of all of old Vergallheim."
 ung.67.a:0 "Peace in the Oramfell at last!"
 ung.68.t:0 "Rimatü Rejects Decision!"
 ung.68.d:0 "Despite Adalina's best efforts, King Skyldske remains unmoved.\n 'I wish for peace in the Oramfell as much as anyone here, but I cannot in good conscience consign my people to Skaelinger oppression once more.'\n Relations have soured, and the Kings returned home the very next day. A brawl almost broke out between their personal retinues as to who was to leave through the gate first."
 ung.68.a:0 "Diplomatic measures have failed, then."
 ung.69.t:0 "Skaelinger Accepts Ruling"
 ung.69.d:0 "After an impassioned speech by Hochprinzessin Adalina, King Hellirfast has softened his stance. \n'Perhaps, then, for the good of all Dwarfkind, we should bury the hatchet'.\n On behalf of Skaelinger, he has agreed to cease all hostilities towards Rimatü and recognize Skyldske as the sovereign lord of all of independent Rimatü."
 ung.69.a:0 "Peace in the Oramfell at last!"
 ung.70.t:0 "Skaelinger Rejects Decision"
 ung.70.d:0 "Despite Adalina's best efforts, King Hellirfast remains unmoved.\n 'I wish for peace in the Oramfell as much as anyone here, but I cannot in good conscience consign my ancestor's accomplishments to history.'\n Relations have soured, and the Kings returned home the very next day. A brawl almost broke out between their personal retinues as to who was to leave through the gate first."
 ung.70.a:0 "Diplomatic measures have failed, then."
 ung.71.t:0 "Half a Summit is No Summit"
 ung.71.d:0 "While we were pleased to see at least one delegation turn up to the Nordtorf summit, it appears that they are all the visitors we can expect. The other King has made it known that he shall not attend."
 ung.71.a:0 "I suppose the choice is made for us, then?"
 ung.72.t:0 "A Humiliating Failure"
 ung.72.d:0 "Sadly, neither the High King of Skaelinger nor the Oberjarl of Rimatü has decided to attend our summit. Our attempt at a diplomatic solution has been a dramatic failure."
 ung.72.a:0 "It seems we will be backing our ungrateful allies, then."
 ung.73.t:0 "Trade Expedition Succeeds!"
 ung.73.d:0 "Good news from the Oramfell! Our trade expedition was warmly received by [FROM.GetLeader], who was very receptive to our proposal of a trade deal. The expedition has returned with signed and sealed documents confirming our new agreements!"
 ung.73.a:0 "Excellent!"
 ung.74.t:0 "Trade Expedition Failed."
 ung.74.d:0 "Our expedition to Rimatü has sadly returned empty-handed. While they have bought some baubles and trinkets in Lägtû, neither the Rimatan government nor any of the major merchant factions was particularly interested in formal trade deals."
 ung.74.a:0 "Regrettable."
 ung.75.t:0 "A Royal Indiscretion"
 ung.75.d:0 "It turns out that our Hochprinzessin was a little too sociable at the Anniversary Ball. Apparently, when the festivities wound down, she slipped away to her chambers with an unknown gentleman, despite being unwed. What's worse, Alko Blau, a minor Faustburger noble that fancies themselves a journalist saw this happen, and has published it in his Faustbürger Zeitung! Everyone in the Freiprinztum is talking about Adalina's dalliance!"
 ung.75.a:0 "That damnable eavesdropper!"
 ung.76.t:0 "Restless Nobility"
 ung.76.d:0 "After the Faustbürger Zeitung's coverage of Adalina's dalliance became widespread, our nobility has grown restless. They claim that Adalina is an embarrassment to the Freiprinztum and her 'reckless behaviour' is endangering our standing both in the Union and abroad. It seems they might prove a destabilizing factor in our domestic political sphere for the forseeable future."
 ung.76.a:0 "Unacceptable - root out this treasonous sentiment!"
 ung.76.b:0 "Let's see if we can negotiate with these rogue elements."
 ung.76.c:0 "We must stabilize the government - devolve powers to the nobility!"
 ung.77.t:0 "Negotiating with the Nobles"
 ung.77.d:0 "Leading figures among Faustburg's nobility have gathered in Adalina's palace to discuss the future of the Freiprinztum with her. Though most of them view her as naive and inexperienced, the younger among them support her still. The fate of Adalina and the entirety of Faustburg are balanced on a knife's edge..."
 ung.77.a:0 "Take a hardline stance and demand obedience!"
 ung.77.b:0 "Soothe their tempers, but make no concessions."
 ung.77.c:0 "Concede to their demands and grant the nobility political dominance."
 ung.78.t:0 "Adalina Triumphant!"
 ung.78.d:0 "After negotiations carried on for hours, the Freiprinzessin has finally emerged victorious! While there is still some demurring among the ranks of the nobility, most have either been convinced or coerced to fall in line and support Freiprinzessin Vlussinger."
 ung.78.a:0 "Glory to the Freiprinztum!"
 ung.79.t:0 "Negotiations Break Down!"
 ung.79.d:0 "Despite arguing for hours, the debate raging well into the night, no solution has been reached. The atmosphere in the room has grown tense, and several nobles have already quietly slipped away to their estates. Scouts have reported large masses of troops in the livery of local nobility marching on the city!"
 ung.79.a:0 "Guards! Arrest these traitors!"
 ung.80.t:0 "A Faustburger Constitution?"
 ung.80.d:0 "It has long since been Adalina's dreem to codify the laws and rights of the people of Faustburg into a grand Constitution. Now, with her enemies politically outplayed and her position secure, she can finaly begin the laborious process of creating such a massive legal document. However, while she and the rest of the nobility would prefer to keep the process behind closed doors, influential middle-class citizens are calling for a popular constitution, with the citizens able to provide input on the exact contents. What should we do?"
 ung.80.a:0 "We must receive the input of the common people!"
 ung.80.b:0 "Our constitution must be penned by the best and brightest."
 ung.81.t:0 "Rumours of Brilliance"
 ung.81.d:0 "Word has reached us of an inventor of unparalleled intelligence, who has already revolutionized several production processes in her hometown of Schlosserhelmer. The Hochprinzessin has expressed great interest in this 'Genius of Schlosserhelmer,' and she is already considering granting patronage."
 ung.81.a:0 "Interesting..."
 ung.82.t:0 "Schwarzenbach Defeated"
 ung.82.d:0 "It is over, at long last. Schwarzenbach's ambitions have plunged the Union into civil war, but the fire of rebellion has been snuffed out, as devastating as it was. Stahlhof is on its knees, and we are left to speak judgement over the traitorous would-be king."
 ung.82.a:0 "We are merciful. Herr Ferdinand will live the rest of his life in retirement in St. Vichtlas."
 ung.82.b:0 "Examples must be made, and traitors must die!"
 ung.82.c:0 "Scharzenbach will be stripped of his titles and banished from the realm!"
 ung.83.t:0 "Perkav Reactionaries Rise Up!"
 ung.83.d:0 "It seems our assistance in the South is not universally appreciated. A large faction of reactionaries have gathered under the banner of Miroslav Zlatko and are denouncing Krell as a foreign puppet!"
 ung.83.a:0 "We must secure our Southern interests."
 ung.84.t:0 "Perkav Reactionaries Victorious!"
 ung.84.d:0 "Krell's Hall has been stormed, and the warlord himself put to the sword in a fierce duel with Zlatko. It seems our hopes of reforming Perkavland have been torched, along with Krell's throne."
 ung.84.a:0 "We will have to correct them by force, then."
 ung.85.t:0 "Ordoria Reaches out!"
 ung.85.d:0 "The government of @ORD [ORD.GetNameDef], having taken a turn for the diplomatic recently, reached out to us. They seek to establish diplomatic ties, but we have not yet formulated a coherent foreign policy - what should we do?"
 ung.85.a:0 "A capital idea! Let us make accord."
 ung.85.b:0 "Never! The Prinzadler shall fly above all of southern Lathweyne!"
 ung.86.t:0 "The Ordorian Offer"
 ung.86.d:0 "A majestic delegation from the sweltering jungles to our North has arrived: the Heir Apparent to the Ordorian Throne, Larennis Valinthir, seeks to negotiate an alliance with us! How should we proceed?"
 ung.86.a:0 "Certainly! This suits our ambitions."
 ung.86.b:0 "Nay, we shall not be constrained by a treaty with the Ordorians."
 ung.87.t:0 "The Ordorian Proposal"
 ung.87.d:0 "A majestic delegation from the sweltering jungles to our North has arrived: the Heir Apparent to the Ordorian Throne, Larennis Valinthir, has come to seek alliance with us!\n\nHowever, during the negotiations, an undeniable spark has emerged between the Princeling and the Hochprinzessin, and Larennis has proposed to strengthen our bonds through marriage! How should we proceed? "
 ung.87.a:0 "How forward! But he is quite the catch..."
 ung.87.b:0 "How improper! But an alliance would be in our interests..."
 ung.87.c:0 "Nay, we shall not be constrained by a treaty with the Ordorians."
 spw.1.t:0 "The Princely Pints"
 spw.1.d:0 "heated alcoholism moment"
 spw.1.a:0 "*Hic* Another!"
 spw.2.t:0 "Glorious Magdalena"
 spw.2.d:0 "heated egg moment"
 spw.2.a:0 "Solace and peace, even if only for a moment."
 spw.3.t:0 "The Flower or the Falcon?"
 spw.3.d:0 "go commit touch grass"
 spw.3.a:0 "The woods nearest the city aren't *that* haunted - saddle my horse!"
 spw.3.b:0 "The princely gardens could do with a touch-up."
 sta.1.t:0 "Ordoria Demands Return of Territory"
 sta.1.d:0 "A letter has arrived from Faustburg today - apparently, the High Princess has struck a deal with Ordoria, and we are to return the lands we managed to take from them. Between the lines, Adelina implies that if we refuse and Ordoria decides to settle this on the battlefield, she will not come to our aid..."
 sta.1.a:0 "Curses! But an order is an order..."
 sta.1.b:0 "The Hochprinzessin be damned, we'll defend what is ours!"
 sta.2.t:0 "Ordoria Demands Partial Return of Territory"
 sta.2.d:0 "A letter has arrived from Faustburg today - apparently, the High Princess has struck a deal with Ordoria, and we are to return half of the lands we managed to take from them. Between the lines, Adelina implies that if we refuse and Ordoria decides to settle this on the battlefield, she will not come to our aid..."
 sta.2.a:0 "It could be worse... give the orders."
 sta.2.b:0 "Our people bled for this land - we will not surrender it without a fight!"
 sta.3.t:0 "Territorial Exchange with Ordoria"
 sta.3.d:0 "A letter has arrived from Faustburg today - apparently, the High Princess has struck a deal with Ordoria, and we are to return half of the lands we managed to take from them, in exchange for Ordorian lands to the East. Between the lines, Adelina implies that if we refuse and Ordoria decides to settle this on the battlefield, she will not come to our aid..."
 sta.3.a:0 "We have plenty of jungle anyway, and we can use the quarries... Very well."
 sta.3.b:0 "Curses on Ordoria and curses on the Hochprinzessin - we'll sign no such treaty!"
 sta.4.t:0 "The Ohnewasser Massacre"
 sta.4.d:0 "Terrible news! Ordorians have crossed the border and laid waste to the village of Ohnewasser - many people have died and the town is in ruins!"
 sta.4.a:0 "This despicable act shall not go unpunished!"
 sta.5.t:0 "Ordoria Seizes Northlands!"
 sta.5.d:0 "The Northlands, painstakingly wrested from Ordorian control and tamed with blood sweat and tears, has been re-occupied by Ordoria! What should we do?"
 sta.5.a:0 "Back down for now."
 sta.5.b:0 "This will not stand - to arms!"
 sta.6.t:0 "The Ordorian Proposal"
 sta.6.d:0 "An emissary of the High King of Ordoria has arrived today, with a most intruiging offer. The Ordorians have set their sights on the lands of the Union, but they would be content with rule through a vassal. Having caught wind of our ambitions for the Freithron, they have offered us the position as this vassal, provided we return the lands we won from them. They might be our ancient adversaries, but with their support we are sure to succeed in our bid for the Freithron..."
 sta.6.a:0 "Stahlhoffer determination and Ordorian grace combined would be an unstoppable force..."
 sta.6.b:0 "Bend the knee to Spitzohren? I'd rather see Rosenblut as Hochprinz!"
 sta.7.t:0 "The Fate of the Adalinatruppen"
 sta.7.d:0 "The troops our ever-so-dear Hochprinzessin sent us have been a nuisance ever since they arrived, poking around where they shouldn't be and asking questions we don't want to answer. We need to neutralize them as a threat, one way or the other."
 sta.7.a:0 "With enough propaganda, we can turn them into an asset."
 sta.7.b:0 "Perhaps an expedition into Ordorian lands with a... tragic end."
 sta.8.t:0 "Stahlhof Requests Equipment"
 sta.8.d:0 "The Freiprinztum of Stahlhof has requested extra equipment for their campaigns against Ordoria and for internal protection. Militarizing Stahlhof further may be dangerous but, as long as it keeps the Ordorians at bay..."
 sta.8.a:0 "If it's needed..."
 sta.8.b:0 "We cannot afford to strengthen Stahlhof further!"
 sta.8.c:0 "If only we had any equipment of our own..."
 sta.9.t:0 "[UNG.GetLeader] sends us equipment."
 sta.9.d:0 "[UNG.GetLeader] announced that we will get our requested equipment. It will be delivered shortly."
 sta.9.a:0 "We are draining them effectively."
 sta.10.t:0 "[UNG.GetLeader] refuses to send us equipment."
 sta.10.d:0 "[UNG.GetLeader] announced that the [UNG.GetName] is very well informed about our current situation and will not support us any further."
 sta.10.a:0 "Their public support won't last long if they keep it up."
 sta.11.t:0 "[UNG.GetLeader] can not contribute."
 sta.11.d:0 "[UNG.GetLeader] announced that the [UNG.GetName] is currently not able to support us with additional equipment."
 sta.11.a:0 "If that isn't a lie, power seems to have shifted more quickly than expected."
 sta.12.t:0 "The Last March of the Faustburg Soldiers"
 sta.12.d:0 "" #They got killed
 sta.12.a:0 ""
 sta.13.t:0 "Southern Borders under attack" #ORD gets this
 sta.13.d:0 "" #Ordoria got tipped and knew the attack was coming
 sta.13.a:0 ""
 sta.14.t:0 "The Last March of the Faustburg Soldiers"
 sta.14.d:0 "" #They got killed, ordoria thinks UNG attacked
 sta.14.a:0 ""
 sta.15.t:0 "Surprise Attack by the Union" #ORD gets this
 sta.15.d:0 "" #Ord thinks it was a poor surprise attack
 sta.15.a:0 ""
 sta.16.t:0 "The Last March of the Faustburg Soldiers"
 sta.16.d:0 "" #A few survived and escaped to UNG
 sta.16.a:0 ""
 sta.17.t:0 "A Planned Attack by the Union" #ORD gets this
 sta.17.d:0 "" #Didnt find tip and thinks UNG and STA attacked
 sta.17.a:0 ""
 sta.18.t:0 "[STA] sent Faustburg Soldiers on a Suicide Mission" #UNG gets this
 sta.18.d:0 "" #Faustburg Soldier Survivors arrive in UNG and tell the story
 sta.18.a:0 ""
 sta.19.t:0 "We won the skirmish!"
 sta.19.d:0 "Our troops successfully fought off the defending forces and occupied their territory. This is now our land."
 sta.19.a:0 "Most impressive."
 sta.20.t:0 "We lost the skirmish!"
 sta.20.d:0 "Our troops fought well and furiously, but we did not stand a chance against the opposing forces."
 sta.20.a:0 "Disastrous."
 sta.21.t:0 "Conflict Cancelled!"
 sta.21.d:0 "As our troops have been facing the opposing threat, both parties got distracted by surrounding events and cancelled the attacks."
 sta.21.a:0 "We will settle this later."
 sta.22.t:0 "We won the skirmish!"
 sta.22.d:0 "We succesfully drove back the invading Union forces with ease."
 sta.22.a:0 "That will teach them a lesson."
 sta.23.t:0 "We lost the skirmish!"
 sta.23.d:0 "Our troops suffered a humiliating defeat in the recent conflict on the southern border. Their troops are now occupying our territory!"
 sta.23.a:0 "They will pay for this. Sooner or later."
