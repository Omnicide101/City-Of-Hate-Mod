l_english:
 news.1.t:0 "Glory League Victory in Ordoria"
 news.1.d:0 "Though Ordoria has grown increasingly isolationist and xenophobic over the past centuries, some rumours still spread. It appears that the ruling elite has held a Congress of sorts, in which they debated the future of their nation. The Glory League, which has led the country since the de facto coup in 819 A.t.I., maintained their grip on governance. Their policy, though not as agressive as members of their Church advocated, is still highly expansionist and supports the doctrine of Elven supremacy."
 news.1.a:0 "The Puritans solidify their control."
 news.1.b:0 "Onward, to glory!"
 news.1.c:0 "We must prepare our defenses."
 news.2.t:0 "Sophist Victory in Ordoria"
 news.2.d:0 "Though Ordoria has grown increasingly isolationist and xenophobic over the past centuries, some rumours still spread. It appears that the ruling elite has held a Congress of sorts, in which they debated the future of their nation. The Sophists faction, comprised of influential priests and the more pious among the nobility, has carried the day. Though they share much in terms of worldview with the Glory League, they advocate a more agressive stance to the non-Elves than the Puritans do. Rumours are that the nations is preparing itself for a 'Crusade' against non-Elves."
 news.2.a:0 "They are a zealous lot."
 news.2.b:0 "By the tenets of Harquiss, we will prevail!"
 news.2.c:0 "Their corruption of the Itheryn's teachings will not save them!"
 news.3.t:0 "Royalist Victory in Ordoria"
 news.3.d:0 "Though Ordoria has grown increasingly isolationist and xenophobic over the past centuries, some rumours still spread. It appears that the ruling elite has held a Congress of sorts, in which they debated the future of their nation. In a surprise victory, the Royalist faction, comprised of anti-Glory League and Royalists, has emerged victorious. Though still believing Elves are superior to other races, they do not take this to the genocidal levels of the other factions, instead being more concerned with securing Ordoria's continued existence, primarily focussing on putting down the Rthaur revolution."
 news.3.a:0 "It is good to see the triumph of common sense."
 news.3.b:0 "For King and Country!"
 news.3.c:0 "Dark days are ahead."
 news.4.t:0 "Governmental Deadlock in Ordoria"
 news.4.d:0 "Though Ordoria has grown increasingly isolationist and xenophobic over the past centuries, some rumours still spread. It appears that the ruling elite has held a Congress of sorts, in which they debated the future of their nation. Though there were fierce debates stretching many days, no clear victor has emerged from between the three factions. Putting aside their differences, the Glory League and Sophists factions have united against the Royalists. Though they are able to rule the country, this disunity has weakened Ordoria."
 news.4.a:0 "Ordorian politics appear unstable."
 news.4.b:0 "Our government stands united against the vermin!"
 news.4.c:0 "Hah! Divided they shall fall!"
 news.5.t:0 "Glory League Civil War in Ordoria!"
 news.5.d:0 "Though the Royalists have been in charge of the country for a brief while, they have not been able to consolidate their rule properly. With several public failures of their foreign policy, the humiliation has become too much for the more militant Glory League of the country, who have declared the government illegitimate and seized the capital of Istaroth. The Military Academy in Vuid, too, has declared for the Glory League and seized the city. It appears Ordoria is now in a state of civil war."
 news.5.a:0 "Ordoria is in crisis."
 news.5.b:0 "Death to the weak!"
 news.5.c:0 "For King and Country!"
 news.5.e:0 "We don't even have to do anything for their state to collapse..."
 news.6.t:0 "Failed Glory League Coup in Ordoria"
 news.6.d:0 "Although the Royalist faction, spiritual successor to the Royalists, has reasserted its control over the nation of Ordoria, not everyone supports them. Today, several Military Academy cadets, high-ranking priests and fanatical Elven supremacists tried to seize control of the machinations of Ordorian government. Fortunately for the Royalists, their succesful policies have made them immensely popular, and the coup was quickly put down by loyalist army elements and patriotic citizens."
 news.6.a:0 "The Royalists have asserted themselves."
 news.6.b:0 "Treason is punishable by death."
 news.6.c:0 "A shame they didn't cause more damage."
 news.7.t:0 "Glory League Seizes Power in Ordoria!"
 news.7.d:0 "While the Royalists managed to emerge victorious from the recent Autumn Debate, their grip on power has always been tenuous. Today, that grip was finally shattered, as a large section of the army declared for the Glory League and orchestrated a coup. Having seized several key locations and executed several influential Royalists for treason, it appears that the coup has been succesful. The Glory League once again rules Ordoria."
 news.7.a:0 "Can those Elves have a government for longer than a season?"
 news.7.b:0 "Ordorian greatness has been saved."
 news.7.c:0 "At least we won't have to worry about them having any friends."
 news.8.t:0 "Restoration of Zarathum!"
 news.8.d:0 "Today, [GetDateText], Dwarves have returned to the city of Zarathum. Six times before, various Dwarven clans have tried to retake the city, but none held the city for longer than a few years. Now, with the entire might of a nation behind the effort, Zarathum has been restored to its former glory, and it is unlikely anything short of total catastrophe will dislodge the Dwarves from their ancestral home. Thousands of Dwarves, a sizable chunk of which are old enough to remember the Fall of Vergallheim, are already flocking to the city, and the first forays to reclaiming the ancient treasures of the Great Bank of Vergallheim have already begun."
 news.8.a:0 "The Ancestors smile upon this day!"
 news.8.b:0 "The Dwarves have returned home at last."
 news.8.c:0 "If only it could have been us..."
 news.9.t:0 "Chaos at the Kriegsspiele!"
 news.9.d:0 "The Kriegsspiele, the decennial Ungerdaler war games, are always an energetic affair, but it seems events have taken a dark turn this year. Though [GetKriegsspieleWinner] has been crowned the victor, accusations of sabotage and cheating have been flung around on all sides. Notably, the Freiprinz of Stahlhof, Ferdinand Schwarzenbach, refused to join in the traditional closing ceremonies in honour of the Freiprinzessin, having left early. Relations between the Freiprinzen have grown frosty, and their troops are reaching for their weapons.\n\nIt seems the tentative peace in the Ungerdaler Union may be drawing to a close."
 news.9.a:0 "...At least we won, right?"
 news.9.b:0 "These mock battles may have been the prelude to the real deal."
 news.9.c:0 "This loss is an insult to Sigismund's legacy!"
 news.9.e:0 "Our legitimate victory shows Sigismund is with us."
 news.9.f:0 "Do these Ungerdaler people never tire of conflict?"
