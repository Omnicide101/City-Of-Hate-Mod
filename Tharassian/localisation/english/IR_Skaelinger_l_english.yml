 SKA_raid_miskuruz:0 "Raid Miskuruz"
 SKA_raid_irggezuug:0 "Raid Irggezuug"
 SKA_RTH_support_stuff:0 "Investing into Our Ally"
 SKA_RTH_support_stuff_desc:0 "While we will not formalize our alliance against [ORD.GetNameDef], supporting each other's industry will help both of us when war comes."
 SKA_invest_into_nythis:0 "Build up the Town of Nythis"
 SKA_invest_into_ytholine:0 "Invest into Ytholine's Industry"
 SKA_invest_into_wetheraus:0 "Invest into Wetheraus' Farms"
 SKA_invest_into_unspykaur:0 "Invest into Unspykaur's Mines"
 SKA_invest_into_khorinor:0 "Invest into Khorinor's Mines"
 SKA_invest_into_becthaurir:0 "Build up Becthaurir"
 RTH_invest_into_derganr:0 "Invest into Derganr"
 RTH_invest_into_ventrenger:0 "Invest into Ventrenger"
 RTH_invest_into_verstordr:0 "Invest into Verstordr"
 SKA_enemies_of_the_army:0 "The Enemies in the Army"
 SKA_enemies_of_the_army_desc:0 "There are many extremists who have infiltrated the army: The Equalists, the Iron Bloods, and the Soltruists. We must get rid of them so that they cannot plot against our nation from the shadows."
 SKA_purge_equalists:0 "Purge Equalists from the Army"
 SKA_purge_legionaires:0 "Purge Soltruists from the Army"
 SKA_purge_iron_bloods:0 "Purge Iron Bloods from the Army"
 SKA_all_or_nothing_KUR:0 "Preparing for the Destruction of the Kurgur"
 SKA_all_or_nothing_KUR_desc:0 "The Kurgur are nothing but a giant horde of mindless nomads, unable to do anything constructive with their land and its potential. The time has come to retake Zarathum and prevent the Kurgur from taking it ever again."
 SKA_start_operation_kur:0 "Start Preparations"
 SKA_preparing_kur_invasion:0 "The Invasion of [KUR.GetNameDef]"
 SKA_KUR_preparing_supply_lines:0 "Preparing Supply Lines"
 SKA_KUR_dedicate_industry:0 "Dedicate Industry to the War Effort"
 SKA_KUR_stir_up_restorationist_sentiments:0 "Stir Up Restorationist Sentiments"
 SKA_KUR_seize_private_weaponry:0 "Seize Private Weaponry"
 SKA_for_king:0 "For the King!"
 SKA_all_or_nothing_RMT:0 "Preparing for the Destruction of the Rimatans"
 SKA_all_or_nothing_RMT_desc:0 "The secessionists of the north will not be forgotten, and they will be crushed under our heel, so they will not rebel again."
 SKA_start_operation_rmt:0 "Start Preparations"
 SKA_preparing_rmt_invasion:0 "The Invasion of [RMT.GetNameDef]"
 SKA_RMT_preparing_supply_lines:0 "Preparing Supply Lines"
 SKA_RMT_dedicate_industry:0 "Dedicate Industry to the War Effort"
 SKA_RMT_stir_up_restorationist_sentiments:0 "Stir Up Restorationist Sentiments"
 SKA_RMT_seize_private_weaponry:0 "Seize Private Weaponry"
 DORF_invade_kurgo:0 "Invade the Kûrgo Pass"
 SKA_sponsoring_moderate_rthaur:0 "Sponsoring Moderate Rthaur"
 SKA_sponsoring_moderate_rthaur_desc:0 "While there are many radicals in [RTH.GetNameDef] who get in the way of our goals, there are still some groups who have a decent amount of support and are willing to work with us. We just need to provide them with our economic might and a bit of military force here and there, and then eventually we can bring the [RTH.GetAdjective] back to sanity and perhaps even as a client state, eventually...\n\nCurrent Progress to Moderate Victory: [?SKA_RTH_moderate_power_inf]%\nCurrent [RTH.GetAdjective] Reliance on Us: [?SKA_RTH_overlord_inf]%"
 SKA_supply_moderates_campaign_funds:0 "Supply Moderates with Campaign Funds"
 SKA_supply_moderates_arms:0 "Siphon Weapons to the Nobles"
 SKA_start_aristocrat_coup:0 "Aristocrat Coup"
 SKA_anti_radical_propaganda_rthaur:0 "Sponsor Anti-Rose-Bearer Propaganda"
 SKA_build_up_RTH_industry:0 "Build up Rthaur Industry"
 SKA_help_put_down_radical_resistance:0 "Help Put Down Radical Remnant Cells"
 SKA_request_total_oversight:0 "Request Total Oversight"
 SKA_competing_with_steel_road:0 "Competing with the Steel Road"
 SKA_competing_with_steel_road_desc:0 "While we obviously cannot completely replace the Steel Road and make every caravaneer come through [SKA.GetNameDef] instead of through the well-traveled path they are used to, perhaps we can tempt a fair number to come through our lands instead."
 SKA_promise_less_bandits:0 "Ensure a Bandit-Free Passage"
 SKA_river_navigation:0 "Provide Aid to River-Goers"
 SKA_promote_beautiful_sights:0 "Promote the Beautiful Sights"
 SKA_building_on_steel_road_decision:0 "Establish Smithies in [FROM.GetName]"
 SKA_social_war_decisions:0 "The Social War"
 SKA_social_war_decisions_desc:0 "There are many reasons for our war with [ORD.GetNameDef], but there are those in our nation who wish to take advantage of it, claiming we are at war with [ORD.GetNameDef] in order to achieve something. The Soltruists claim it is to defeat the elves, the Brotherhood of Equals claim it is to defend our allies, and there are some who whisper of restoring past glories.\n\n§YCurrent Soltruist Influence: [?SKA_social_war_soltruist_inf]§!\n§RCurrent Brotherhood Influence: [?SKA_social_war_boe_inf]§!\n§OCurrent Iron Blood Influence: [?SKA_social_war_iron_blood_inf]§!"
