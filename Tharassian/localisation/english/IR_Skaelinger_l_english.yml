 SKA_national_guard_desc:0 ""
 SKA_bicameral_legislature_desc:0 "By merging the Riksdag and the Grand Lore Council, we will manage to politically and economically unite the country like we never have before."
 SKA_price_ceilings:0 "Price Ceilings"
 SKA_price_ceiling_desc:0 "By setting up maximum prices, we can ensure our economy will keep going in times of trouble because many will be able to afford the goods they need."
 SKA_no_need_for_casteless:0 "No Need for the Casteless"
 SKA_no_need_for_casteless_desc:0 "There is no societal need for the casteless. So what better way to deal with them than to draft them into the army? This will be unpopular, but will expand our recruitable population"
