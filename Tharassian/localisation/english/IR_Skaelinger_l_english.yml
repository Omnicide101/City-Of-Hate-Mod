 SKA_the_return_to_zarathum:0 "The Return to Zarathum"
 SKA_the_return_to_zarathum_desc:0 "The eighth campaign was a success! However, we must not make the same mistakes as the third and fifth campaigns. The Orcish counterattack is inevitable. Destiny demands that we delay the libations and prepare to defend our ancient capitol."
 SKA_fortifying_orallheim_claims:0 "Fortifying former Kurgur Lands"
 SKA_fortifying_orallheim_claims_desc:0 "Can you hear them? The steady drumbeat? the snarling? The stampede of feet reverberating from the approaching Orcish hordes? Steel yourselves men, and prepare to hold the line. We must not let them take our city again. With makeshift barricades and retrofitted old watchtowers and ersatz chokepoints, we will make Zarathum a death trap to any meandering Orcs unfortunate enough to cross the threshold into the Oramfell mountains."
 SKA_army_zarathum_defense:0 "The Army of Zarathum's Defense"
 SKA_army_zarathum_defense_desc:0 "The riksdag has passed a measure to immediately draft auxilliary soldiers into a brand new garrison force to man the defenses at Zarathum. This will be the biggest military operation that the Vergall dwarfs have undertaken in the southern Oramfell since the original loss of Zarathum centuries ago. Every dwarf counts. We will not fail again."
 SKA_secured_zarathum:0 "A Secure Zarathum"
 SKA_secured_zarathum_desc:0 "It took agonizing labor, tortured days, and sleepless nights. Day after day of our warriors sullying their weapons with the blood of Orks and suffering their piercing yowls in their dreams. All our effort; all our stone forged might was put to the test. Against all odds, we have passed our greatest trial yet. Zarathum is ours to keep. Ours to defend. Ours to rebuild."
 SKA_connecting_new_capital:0 "Connecting our New and Former Capital"
 SKA_connecting_new_capital_desc:0 "Now begins the real work. Tunnels must bebored, outposts must be manned, and a stable supply line must reach areas so long abandoned that our cartographers must be sent to survey them. Patience, friends. This moment has been a long time coming, and our people's united efforts will one day bear fruit. For the first time in centuries, we can feel our nation healing."
 SKA_repopulating_zarathum:0 "Repopulating Zarathum"
 SKA_repopulating_zarathum_desc:0 ""
 SKA_enhancing_zarathums_industry:0 "Enhancing Zarathum's Industry"
 SKA_enhancing_zarathums_industry_desc:0 ""
 SKA_zarathum_restored:0 "Zarathum Restored"
 SKA_zarathum_restored_desc:0 "Zarathum is the home of the Vergalls forever more!"
 SKA_take_rthaur_industry:0 "'Borrow' Rthaur Industry"
 SKA_take_rthaur_industry_desc:0 "The Rthaur are very industrially mighty for such a young nation. Obviously they wouldn't mind if we borrowed some of the fruits of their industry for the greater good of our Ordorian War Effort."
 SKA_demand_khorinor_mountains:0 "Demand the Khorinor Mountains' Return"
 SKA_demand_khorinor_mountains_desc:0 "Even though we gave the Rthaur the Khorinor Mountains to reside in during the Rthaur Revolution until we had beaten Ordoria, we have changed our minds and wish for its return immediately."
