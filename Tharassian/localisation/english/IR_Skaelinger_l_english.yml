 #events
 skaelinger.1.t:0 "The Miner's Blight"
 skaelinger.1.d:0 "Miner's Blight was a mysterious plague that spread through Skaelinger a century ago, wiping out a third of the dwarvish population within 2 years, before mysteriously disappearing. In spite of it's name, ''Miner's Blight'' made no distinction between classes, castes, or occupations in its devastation.  This has caused massive manpower and labor pool depletions, which we still have not recovered from."
 skaelinger.1.a:0 "Perhaps now we can finally recover"
 skaelinger.2.t:0 "The Emergency Enclave"
 skaelinger.2.d:0 ""
 skaelinger.2.a:0 "Perhaps the time has come to transition to a republic"
 skaelinger.2.c:0 "Many Were Bought off by Iron Bloods..."
 skaelinger.2.b:0 "Things went as they should have, with debates for the next king beginning swiftly"
 skaelinger.2.e:0 "Mohrok's Legion Mobilizes..."
 skaelinger.3.t:0 "Republican Transformation"
 skaelinger.3.d:0 "The various parties in the Riksdag have begun swiftly moving in the split decision to reform to a republic, vying for power and influence, cashing in favors to try and make their parties win."
 skaelinger.3.a:0 "The Grand Lore Council Stops the Transformation"
 skaelinger.3.b:0 "The Charter Protection League wins the debates"
 skaelinger.3.c:0 "The Brotherhood of Equals wins the debates"
 skaelinger.4.t:0 "[SKA.GetName] Cuts Diplomatic Ties"
 skaelinger.4.d:0 "Now that the Odorians have been dealt with, the Skaelinger have apparently decided to cut ties with us, giving in to their isolationist tendencies."
 skaelinger.4.a:0 "We shall return the favor and give them peace and quiet, then"
 skaelinger.5.t:0 "The Monarchial Election"
 skaelinger.5.d:0 "Now the Emergency Enclave can go back to its intended purpose, and must choose which of the three main houses will have the next monarch.\nThere is the old king's son, Reev Hellirfast, who wants to continue the alliance with [RTH.GetNameDef], along with advancing the rights of the lower castes and the republican parties.\nThen there is Petar Grimvald, who is a staunch isolationist and wishes to just build up the kingdom's mines and defenses, making it clear that as soon as the threat of Ordoria was dealt with, that the alliance with the [RTH.GetAdjective] will end.\nFinally, there is Kytos Palmekvist, a war hawk who wishes to restore glory to the kingdom through military conquest. A vehement anti-radical, he wishes to 'teach' the [RTH.GetAdjective] the mistake of Radical Republicanism and restore monarchist rule." 
 skaelinger.5.a:0 "Continue the Rule of the Hellirfasts"
 skaelinger.5.b:0 "The Stone Hermit is chosen to lead us to safety"
 skaelinger.5.c:0 "Palmekvist will lead us to glory"
 skaelinger.6.t:0 "[SKA.GetLeader] Dies"
 skaelinger.6.d:0 "Some of the king's advisors were worried when he did not come out of his bedroom at the usual time, but gave him some space because of his advanced age, knowing that not getting enough sleep was hard on his body. Eventually they decided to check up on him, and a hurried murmur of rumors spread through the palace before the news finally broke: Oberjarl Hellirfast had died in his sleep. The kingdom began entering mourning for their dead king, while frantic discussions began in the Riksdag about what this could mean for the future of the nation"
 skaelinger.6.a:0 "We Must Convene the Emergency Enclave Immediately"
 skaelinger.7.t:0 "Refugees Arrive from [SKA.GetNameDef]"
 skaelinger.7.d:0 "A large amount of refugees from [ORD.GetNameDef] that were residing within [SKA.GetNameDef] were expelled from the dwarf kingdom, and they fled to our nation, many lost from the mountains, Kurgur raids, and the cold and starvation."
 skaelinger.7.a:0 "We must provide for the refugees"
 skaelinger.8.t:0 "An Alliance with [FROM.GetNameDef]?"
 skaelinger.8.d:0 "[FROM.GetLeader] has requested an alliance with our nation, so that we may stand strong against our enemies."
 skaelinger.8.a:0 "We will protect each other"
 skaelinger.8.b:0 "We will not work with the [FROM.GetAdjective]"
 skaelinger.9.t:0 "[FROM.GetLeader] Accepts our Alliance"
 skaelinger.9.d:0 "Now the alliance between [FROM.GetNameDef] and [ROOT.GetNameDef] is secure, and we are all the stronger for it."
 skaelinger.9.a:0 "We shall stand strong against our enemies"
 skaelinger.10.t:0 "[FROM.GetLeader] Refuses our Alliance"
 skaelinger.10.d:0 "Either out of distrust, arrogance, or just plain foolishness, our offer of an alliance with [FROM.GetNameDef] has fallen through, and now we must make do without them."
 skaelinger.10.a:0 "A sad day for diplomacy"
 skaelinger.11.t:0 "The Iron Blood Conspiracy Bears Fruit"
 skaelinger.11.d:0 "The most elite and trustworthy of the Most Sacred Order of the Iron-Blooded knights stormed the building the Grand Lore Council was meeting, armed with assorted weapons, swiftly and stealthily breaking into the building and assassinating the guards they came across, before they finally broke into the main debate chamber.\n''Who are you, I demand you leave!'' an older loremaster demanded. ''This is supposed to be an undisturbed ch-'' He was cut off by a crossbow's thrum, his neck sprouting a bolt as he choked on his own blood, before toppling to the floor.\nIn the moments of shock the rest of the loremasters stood staring at the old man's body, the Iron Bloods burst into action, quickly trying to put down every loremaster they could reach."
 skaelinger.11.a:0 "Some managed to escape and raise troops against the Iron Bloods, causing a civil war"
 skaelinger.11.b:0 "Some managed to escape, crossing the border into [RTH.GetNameDef]"
 skaelinger.11.c:0 "And they were all put down without a hitch"
 skaelinger.11.e:0 "A Power Struggle Began within the Iron Bloods"
 skaelinger.12.t:0 "Iron Blood Power Struggle"
 skaelinger.12.d:0 "Due to the lack of debate over who should be the leader of the country after the coup, infighting has begun between them. The two main contenders are a fairly popular noble named Gayra Hafahlif and a general who has earned the loyalty of many soldiers named Egviel Hvassøx"
 skaelinger.12.a:0 "Gayra Hafahlif Wins the Struggle with their honeyed tongue"
 skaelinger.12.b:0 "Egviel Hvassøx Wins the Struggle with Promises of Glory"
 skaelinger.13.t:0 "Grand Lore Council Flees to Us from [SKA.GetNameDef]"
 skaelinger.13.d:0 "Due to a coup orchestrated by the Iron Bloods, a secret society in Skaelinger, the Grand Lore Council, the previous governing body of the country, has fled to us for protection."
 skaelinger.13.a:0 "Condemn the Iron Bloods and Protect the Grand Lore Council"
 skaelinger.13.b:0 "We won't allow aristocrats within our nation, but we will still condemn the Iron Bloods"
 skaelinger.14.t:0 "Successful Slave Acquisition"
 skaelinger.14.d:0 "We have managed to successfully fight off the border patrols of the Kurgur and seize a hundred or so slaves. This will help fuel our industry, at least for a short time."
 skaelinger.14.a:0 "Glory to the Army"
 skaelinger.15.t:0 "Slave Acquisition Mission Failed"
 skaelinger.15.d:0 "Our raiding party failed to break past the border guards of the Kurgur in order to plunder her people, so they must trudge back in failure."
 skaelinger.15.a:0 "A Tragedy"
 skaelinger.16.t:0 "Successful Defense Against [SKA.GetAdjective] Raiders"
 skaelinger.16.d:0 "Our warriors have managed to fend off the dwarfs from plundering our towns and stealing our women and children, and celebrations have rung out in the region they have protected."
 skaelinger.16.a:0 "We must prepare for the next raid now"
 skaelinger.17.t:0 "Our Women and Children Stolen"
 skaelinger.17.d:0 "Those damned [SKA.GetAdjective] Raiders broke through our border guards, kidnapping many from their homes and dragging them back to their cold, cruel mountains."
 skaelinger.17.a:0 "We grieve for those we lost, and build up defenses for the next raiding party"
 skaelinger.18.t:0 "[SKA.GetNameDef] Prepares for Raids on Us"
 skaelinger.18.d:0 "After the recent Iron Blood coup, the Skaelinger have become more xenophobic and oppressive. This has finally come to a head with our nation, as we have received word from people inside [SKA.GetNameDef] that their army is preparing raiding parties to kidnap our people and use them as slave labor."
 skaelinger.18.a:0 "We will defend ourselves against the dwarf menace"
 skaelinger.19.t:0 "Idea of a Mutual Economic Investment Strategy from [SKA.GetLeader]"
 skaelinger.19.d:0 "Not wanting to formalize our alliance due to the fierce anti-radical sentiments in the populace, but also wanting to empower the both of us economically, [FROM.GetLeader] has proposed an economic pact, where FILL IN LATER"
 skaelinger.19.a:0 "This Will Benefit the Both of Us"
 skaelinger.20.t:0 "[FROM.GetName] is Interfering in Our Politics"
 skaelinger.20.d:0 "Not content with us simply being allies, [FROM.GetNameDef]'s propagandists have begun promoting more conservative and moderate sentiments within our nation, talking about the chaos and failures of radical republicanism."
 skaelinger.20.a:0 "Those Damned Dwarfen Fools"
 skaelinger.21.t:0 "The Restoration Question"
 skaelinger.21.d:0 "Many wish to restore Vergallheim to its former glory, and we must decide how we will answer these demands."
 skaelinger.21.a:0 "We will focus on the Rimatan Secessionists"
 skaelinger.21.b:0 "We will fully restore Vergallheim"
 skaelinger.21.c:0 "We will forge an alliance with all Dwarves"
 skaelinger.22.t:0 "Skaelinger Demands of Subjugation"
 skaelinger.22.d:0 "Shaking off their isolationist tendencies, now [SKA.GetNameDef] turns their eyes towards us with vengeance, over our secession from Vergallheim. They demand that we accept Skaelinger dominance as we did so many years ago as part of Vergallheim, promising war if we do not accept."
 skaelinger.22.a:0 "Then War We Shall Have"
 skaelinger.22.b:0 "We Must Bow to Skaelinger's Will"
 skaelinger.23.t:0 "[FROM.GetName] Bows to Skaelinger"
 skaelinger.23.d:0 "Now we dominate the northern mountains, for the Rimatan secessionists have once again pledged their loyalty to the home of the dwarves."
 skaelinger.23.a:0 "Glory to Vergallheim"
 skaelinger.24.t:0 "The Rimatans Deny Our Threat"
 skaelinger.24.d:0 "Still full of disobedience and stubbornness, the Rimatans have decided not to listen to our rightful demands."
 skaelinger.24.a:0 "Then We Shall Grind Them to Dust on Our Rightful Mountains"
 skaelinger.25.t:0 "Reconciliated Alliance"
 skaelinger.25.d:0 "In a change of policy, [FROM.GetLeader] appears to be trying to mend relations with us after decades of tensions and border conflicts over our secession, instead offering an alliance to honor the united nation we once were."
 skaelinger.25.d1:0 "Wanting to become a protector of all of dwarfkind [FROM.GetLeader] has invited us to an alliance of protection, so that they can better protect us."
 skaelinger.25.a:0 "We Are Still Dwarfs, Are We Not?"
 skaelinger.25.b:0 "A Foolish Ploy to Subjugate Us"
 skaelinger.26.t:0 "[RMT.GetName] Accepts our Offer of Alliance"
 skaelinger.26.d:0 ""
 skaelinger.26.a:0 "A Great Day for Dwarfkind"
 skaelinger.26.b:0 "A Great Day for Dwarfkind"
 skaelinger.27.t:0 "Northern Dominionship?"
 skaelinger.27.d:0 "[SKA.GetName] has offered a closer union between our people, with us becoming a sort of dominion to Skaelinger while still maintaining some of our freedom."
 skaelinger.27.a:0 "Unity with Skaelinger!"
 skaelinger.27.b:0 "Why are you playing as [RMT.GetNameDef]? Just choose the other option."
 skaelinger.28.t:0 "[FROM.GetAdjective] Investment"
 skaelinger.28.d:0 "Following our economic aid pact, us and our ally [FROM.GetNameDef] have invested into each other, and this is the latest investment."
 skaelinger.28.a:0 "We Are Grateful for this Investment"
 skaelinger.29.t:0 "Skaelinger Requests a Re-Drawing of the Borders"
 skaelinger.29.d1:0 "Due to the several border conflicts between our nations, [SKA.GetLeader] has suggested a summit where the subject of borders can be debated and hopefully redrawn. Their main want is a secure border on the mountains on the edge of our west, especially the Ruins of Zarathum."
 skaelinger.29.d2:0 "Due to the several border conflicts between our nations, [SKA.GetLeader] has suggested a summit where the subject of borders can be debated and hopefully redrawn. Their main goal is the Kûrgo pass, our main defense against any potential invasion from them."
 skaelinger.29.a:0 "We will accept their demands to redraw the borders in their favor"
 skaelinger.29.b:0 "This offensive demand will not be given in to!"
 skaelinger.30.t:0 "[FROM.GetLeader] Accepts Redrawing of Borders"
 skaelinger.30.d:0 "Our words have won over the leader of [FROM.GetNameDef], convincing them that we are the rightful owner of some of their territory."
 skaelinger.30.a:0 "Kûrgo is Ours!"
 skaelinger.30.b:0 "Zarathum is Ours!"
 skaelinger.31.t:0 "[FROM.GetName] Denies our Rightful Claims"
 skaelinger.31.d:0 "In an insult to our nation, the lands which we requested in redrawing the borders have been denied, staying in [FROM.GetNameDef]. This cannot be accepted, we must take the regions that are rightfully ours by force!"
 skaelinger.31.a:0 "Skirmishes on the Kûrgo Pass"
 skaelinger.31.b:0 "Crusade to Zarathum"
 skaelinger.32.t:0 "The Legalization of the Brotherhood of Equals"
 skaelinger.32.d:0 "As the debates for the transitioning of Skaelinger into a republic drag on, a somewhat young council member named Heljarchen Froki gave a passionate speech about the value of the freedom of speech, and eventually trailed towards the Brotherhood of Equals, and how the group should be legalized as a party in order for every party together to best represent the people's wishes."
 skaelinger.32.a:0 "He makes a good point for freedom of speech"
 skaelinger.32.b:0 "The Brotherhood is too dangerous, we can't allow them to take office"
 skaelinger.32.c:0 "Heljarchen Froki is obviously a radical, arrest him!"
 skaelinger.33.t:0 "Charterist Guilds Offer to Sponsor the Debates"
 skaelinger.33.d:0 "In an attempt to secure the good will of the Grand Lore Council and further their influence, some guilds have offered to help supply the capital during the debates, including providing the best of food."
 skaelinger.33.a:0 "This would help motivate the Grand Lore Council"
 skaelinger.33.b:0 "Our chefs are skilled, we do not need guild interference"
 skaelinger.33.c:0 "This attempt of bribery is an insult and should be banned from our republic"
 skaelinger.34.t:0 "The Centralization Question"
 skaelinger.34.d:0 "Now as the Grand Lore Council finalizes their discussions on the way the republic would work, the question of how centralized the nation would be has come to the forefront. The more conservative members of the Council want a strong central government, while the more progressive and radical members prefer a more decentralized method."
 skaelinger.34.a:0 "A Unitary Republic would be best"
 skaelinger.34.b:0 "A Federal Republic would be best"
 skaelinger.35.t:0 "Terrorist Attack by the Brotherhood of Equals!"
 skaelinger.35.d:0 "Angered by the discussions of the Grand Lore council, the Brotherhood of Equals have burnt down a manufacturing plant to send a message and to try and intimidate us."
 skaelinger.35.a:0 "Focus on Rebuilding Efforts"
 skaelinger.35.b:0 "Focus on Hunting Down the Terrorists"
 skaelinger.36.t:0 "Heljarchen Froki Proposes the Foundation of Minor Communities"
 skaelinger.36.d:0 "Trying to push the advantage he gained by the legalization of the Brotherhood of Equals, Heljarchen Froki has proposed the foundation of small towns in less-populated areas of [SKA.GetName], where communities can gather and develop themselves and forge tight bonds. This idea is obviously based on communalism, a subset of the Brotherhood of Equal's ideology."
 skaelinger.36.a:0 "Seems like a good way to improve our citizen's lives"
 skaelinger.36.b:0 "That seems like a foolish endeavor."
 skaelinger.37.t:0 "[SKA.GetName] Providing Aid to Our Aristocrats"
 skaelinger.37.d:0 "There are a few remnant minor nobles who still have some influence in our nation, and the Skaelinger are taking advantage of that, trying to use them to infiltrate our nation and cause our revolution to backslide."
 skaelinger.37.a:0 "Keep an Eye on These Nobles and the Skaelinger Diplomats..."
 skaelinger.38.t:0 "Noble Coup Attempt"
 skaelinger.38.d:0 "[RTH.GetLeader] woke up to a scuffle outside his bedroom door, before a masked man holding a sword burst through it, the crimson-soaked blade glimmering in the moonlight.\n''Your Radical Tyranny is at an end,'' the figure said as they approached, not noticing his target's eyes going towards a knife he kept on the endtable. [RTH.GetLeader] lunged for the knife and"
 skaelinger.38.d1:0 "After seemingly taking time to lick their wounds after the failure of their last coup attempt, the nobles stormed the capital building again, this time in broad daylight, crossbows at the ready as they entered the council chambers, where all the leaders of [RTH.GetNameDef] were gathered."
 skaelinger.38.a:0 "The assassin stabbed him in the back before he could reach it"
 skaelinger.38.b:0 "He managed to slay the assassin and alert the rest of the guards in the city to the coup attempt"
 skaelinger.38.c:0 "The council members were massacred, and a purple banner rose over the capital building"
 skaelinger.38.e:0 "The nobles were caught by surprise from a group of guards, barely being stopped"
 skaelinger.39.t:0 "Noble Coup Succeeds!"
 skaelinger.39.d:0 "Our machinations in Rthauriaur have come to fruition, and now the country has abandoned its radical ways, with [RTH.GetLeader] now in charge."
 skaelinger.39.a:0 "Time to further our influence in the nation"
 skaelinger.40.t:0 "Noble Coup Fails"
 skaelinger.40.d:0 "In spite of our preparations, the coup has failed, and now the Rthaur know of our involvement. It is only a matter of time until they break contact with us."
 skaelinger.40.a:0 "Uh oh"
 skaelinger.41.t:0 "[SKA.GetName] Requests Oversight of Our Nation"
 skaelinger.41.d:0 "Due to our increased reliance on the Skaelinger as of late after the noble coup, the [SKA.GetLeader] has begun to feel ambitious, and has requested oversight of our nation, so that our foreign policies can be similar to each other in order to ''ensure our cooperation and the prosperity of both our peoples''. This obviously means subjugation, in polite terms"
 skaelinger.41.a:0 "They Now Hold Our Strings"
 skaelinger.41.b:0 "They cannot control us"
 skaelinger.42.t:0 "The Rthaur Client State"
 skaelinger.42.d:0 "Our dreams of a client state in [RTH.GetNameDef] have been achieved, and now our nation is much more powerful because of it."
 skaelinger.42.a:0 "Glory to [SKA.GetNameDef]"
 skaelinger.43.t:0 "Our Offer of Oversight was Rejected"
 skaelinger.43.d:0 "In spite of the vast amounts of aid we have given them, apparently the Rthaur people are not yet ready to be subservient to us."
 skaelinger.43.a:0 "In due time, once we have increased their dependency on us"
 skaelinger.44.t:0 "Investigating the Coup Attempt"
 skaelinger.44.d:0 "After a decent investigation into the coup and the nobles who took part in it, conspiracy theories have erupted saying our ally the Skaelinger sponsored these terrorists. But why would they do that? They obviously had some foreign support from somewhere, but the idea that it would be our Skaelinger allies is absurd."
 skaelinger.44.a:0 "Crush the Conspiracy Theorists"
 skaelinger.44.b:0 "Perhaps they are right. Cut off all diplomatic ties with the Skaelinger"
 skaelinger.45.t:0 "Ungerdaler Aristocratic Influence"
 skaelinger.45.d:0 "In exchange for aid against the Ordorians, the Ungerdaler have forced the Rthaur to accept nobles more. This will make our empowering of the nobles to rise up against the Rose-Bearers much easier."
 skaelinger.45.a:0 "Never Look a Gift Horse in the Mouth"
 skaelinger.46.t:0 "A Social War"
 skaelinger.46.d:0 "As the war with [ORD.GetNameDef] rages on, it seems that many groups are trying to take advantage of our war with the Ordorians in order to try and further their own agenda, by appealing to our people and influencing the war with [ORD.GetNameDef]"
 skaelinger.46.a:0 "A Troubling Sign for our Future"
 skaelinger.47.t:0 "Iron Blood Influence in our Military"
 skaelinger.47.d:0 "Due to the increasing influence of the Iron Bloods in our military, they have begun to reshape the army, making them somewhat more effective."
 skaelinger.47.a:0 "Interesting. They will be tolerated as long as they are useful"
 skaelinger.48.t:0 "Iron Blood Knights Join Our Army"
 skaelinger.48.d:0 "A few legions of knights have shown up at a recruiting station, causing tensions as the recruiting agent had no idea what they were here for, before a commander stepped forth and introduced himself, saying that they were here to join the war effort."
 skaelinger.48.a:0 "We need every man we can get"
 skaelinger.49.t:0 "Iron Blood Indoctrination in the Army"
 skaelinger.49.d:0 "Reports have come of some Iron Bloods in our army, slowly but surely indoctrinating the officer ranks as well as the common rank and file."
 skaelinger.49.a:0 "Uh oh"
 skaelinger.50.t:0 "[SKA.GetName] Renounces all Claims on Dwarven Nations"
 skaelinger.50.d:0 "In a startling change in policy, [SKA.GetNameDef] will no longer consider itself the 'true home of all dwarves', with claims on all Dwarven nations. Instead, now they are renouncing their claims in an attempt to reconcile with us, perhaps wishing for an alliance in the future, or just wanting to leave us alone and be left alone in return."
 skaelinger.50.a:0 "This is Good News"
 skaelinger.51.t:0 "Iron Blood Knights Abandon the Army"
 skaelinger.51.d:0 "Now that the war with [ORD.GetNameDef] has come to an end, the Iron Blood Knights have disappeared from the army to who knows where. Now we must fear what they plan now that the war is over."
 skaelinger.51.a:0 "Uh oh"
 skaelinger.52.t:0 "The Social War Ends: Stalemate!"
 skaelinger.52.d:0 "Due to the equality of influence between the Brotherhood and the Soltruists throughout our nations, both have risen up against us, seeking to destroy us and our way of life in order to acheive their goals!"
 skaelinger.52.a:0 "We will crush these traitors and restore order"
 skaelinger.111.t:0 "The Social War Ends: Stalemate!"
 skaelinger.111.d:0 "Due to the exhaustion of each other during their conflicts during our war with Ordoria, neither the Soltruists or Brotherhood have been able to get enough support to rise up against us."
 skaelinger.111.a:0 "Finally, we can have peace"
 skaelinger.53.t:0 "The Social War Ends: Soltruist Victory!"
 skaelinger.53.d:0 "The Soltruists have managed to outmaneuver the Brotherhood of Equals, and have thus risen up against us in order to slay the gentry and establish their strange god Mohrok as the new god."
 skaelinger.53.a:0 "Slay the Upstarts and Restore Order"
 skaelinger.54.t:0 "The Social War Ends: Brotherhood Victory!"
 skaelinger.54.d:0 "The Brotherhood of Equals have managed to outmaneuver the Soltruists, and have thus risen up against us in order to dismantle the castes and burn the systems built up over millennia to the ground!"
 skaelinger.54.a:0 "Protect Our Order by Killing the Radicals!"
 skaelinger.55.t:0 "Brotherhood of Equals Form Anti-Ordorian Militias"
 skaelinger.55.d:0 "As [RTH.GetNameDef] starts to fall beneath the Ordorian onslaught, the Brotherhood of Equals has mobilized militias and moved them into Rthaur territory. This has garnered them some popular support as heroes willing to fight for our Elven comrades, not just terrorize the guilds."
 skaelinger.55.a:0 "Perhaps the Brotherhood can be Useful"
 skaelinger.56.t:0 "The Soltruists Mobilize Against the Ordorians"
 skaelinger.56.d:0 "Due to the growing strength of the Soltruists in the population, some of the believers have organized into militias, arming themselves and marching out to face the Ordorians."
 skaelinger.56.a:0 "Perhaps the Soltruists can be Useful"
 skaelinger.57.t:0 "[SKA.GetName] Offers Economic Support"
 skaelinger.57.d:0 "In an attempt to mend ties with us and to help support our dwarven population, [SKA.GetLeader] has offered us economic aid."
 skaelinger.57.a:0 "Sounds like a good idea"
 skaelinger.57.b:0 "We are independent, in politics and economics"
 skaelinger.58.t:0 "Miners Beginning to Go Crazy"
 skaelinger.58.d:0 "Due to the depths we are going to, we are starting to come across ancient artifacts. After interacting with some of these artifacts, some miners have seemingly gone crazy, attacking their fellow miners, trying to keep them from mining deeper, and resisting all efforts to help them."
 skaelinger.58.a:0 "Concerning"
 skaelinger.59.t:0 "Extensive Gold Reserves Discovered!"
 skaelinger.59.d:0 "In one of our mines, we have discovered a large gold deposit. This has begun a gold rush, with people migrating to that state in search of gold. Even outsiders have somehow heard rumors of the massive gold deposit, and are entering our nation in order to get rich."
 skaelinger.59.a:0 "We will put this gold to good use"
 skaelinger.60.t:0 "Demon in Mine!"
 skaelinger.60.d:0 "We have dug too deep, and we have awakened a demon! It slaughtered the miners who freed it, before rushing out of the mines, killing and burning all in its path"
 skaelinger.60.a:0 "Cordon off the Area Immediately!"
 skaelinger.61.t:0 "The Demon Has Moved"
 skaelinger.61.d:0 "The demon who was released from the mines has moved on from its current location, leaving a path of destruction and death in its wake."
 skaelinger.61.a:0 "Hunt it Down"
 skaelinger.62.t:0 "The Demon Has Been Slain!"
 skaelinger.62.d:0 "Through the brave sacrifice of our troops and defenses, we have managed to take down the demon. Its body was carved up, and the separate pieces spread around [SKA.GetName] in order to prevent any possible reforming."
 skaelinger.62.a:0 "At last, our people can know peace and feel no fear"
 skaelinger.63.t:0 "[SKA.GetLeader] Offers Industrial Support and Resources"
 skaelinger.63.d1:0 "Not wanting to be invaded by us, or further incursions, an offer has been made from [SKA.GetNameDef] offering resources and some industrial support in exchange for an agreement that we will not invade them."
 skaelinger.63.d2:0 "Wanting to thoroughly remain isolationist, but still not wanting to anger their old allies, Skaelinger resources and industry have been offered in exchange for a non-interference agreement between our nations."
 skaelinger.63.a:0 "They will have their agreement"
 skaelinger.63.b:0 "Empty agreements in exchange for industry"
 skaelinger.64.t:0 "Skaelinger Engineers Fortify Loris Pass"
 skaelinger.64.d:0 "We have received news of a group of Dwarven engineers who crossed into our lands, heading to Loris pass and offering their service to the local military commander there, in order to fortify the pass, knowing how important it is to the Rthaur Defensive Strategy."
 skaelinger.64.a:0 "We thank the Skaelinger for their support"
 skaelinger.65.t:0 "Hellirfast's Final Decree"
 skaelinger.65.d:0 "[SKA.GetLeader] knows his time will soon come to join his ancestors, and he has made it his mission to make one final decree that will help his nation keep together and prevent destruction as long as it follows the Great Houses and their will."
 skaelinger.65.a:0 "The Decree of Diplomacy"
 skaelinger.65.b:0 "The Decree of Stability"
 skaelinger.65.c:0 "The Decree of Wealth"
 skaelinger.66.t:0 "The Path of the Resistance"
 skaelinger.66.d:0 "Fill in something about a cliche Y/A Teenage Girl yada yada."
 skaelinger.66.a:0 "The Path of Revolution"
 skaelinger.66.b:0 "The Path of Knives in the Night"
 skaelinger.67.t:0 "Stirring Up Popular Opinion"
 skaelinger.67.d:0 ""
 skaelinger.67.a:0 "Denounce the Iron Bloods' Actions"
 skaelinger.67.b:0 "Praise the Rthaur's Actions"
 skaelinger.68.t:0 "Who to Coup With"
 skaelinger.68.d:0 ""
 skaelinger.68.a:0 "Elites trained by Rthaur Veterans"
 skaelinger.68.b:0 "The People's Will Shall Storm the Capital"
 skaelinger.69.t:0 "Acquiring Weapons"
 skaelinger.69.d:0 ""
 skaelinger.69.a:0 "Knock Out the Guard and Take the Weapons"
 skaelinger.69.b:0 "Perhaps we can sway the Guard to Our Side?"
 skaelinger.70.t:0 "The Revolution"
 skaelinger.70.d:0 ""
 skaelinger.70.a:0 "It was won without a hitch"
 skaelinger.70.b:0 "Messy, but succeeded"
 skaelinger.70.c:0 "It failed, prepare the people for civil war"
 skaelinger.71.t:0 "The Grand Offering to Mohrok"
 skaelinger.71.d:0 "The Legion of the Sun-Beneath-the-Stone gathered around the city of Skaelinger, the prayers to their god Mohrok filling the air with hums.\n\n''We have made many offerings to Mohrok,'' Halstigg Urkbani called out to the crowd. ''But now we will offer the greatest offering: The death of all those who oppose him, and the nobles who dare stand in the path of his righteous fury''\n\nCheers rang out, and the Legion stormed the capital."
 skaelinger.71.a:0 "Skaelinger's Streets ran Red with Mohrok's Offerings"
 skaelinger.71.b:0 "Many Soltruists sacrificed their lives, but the Grand Offering was Made"
 skaelinger.71.c:0 "Mohrok's Protection did not Save the Soltruists"
 skaelinger.72.t:0 "The First Lathweyne Republican Conference"
 skaelinger.72.d:0 "Today Marks the First Lathweyne Republican Conference, hosted in Skaelinger in spite of the instability that plagued their nation that led to the establishment of a republican state.\n\nThe main issue of the discussion was an agreement to diplomatically align with each other and support republican movements both within their own nations and abroad, to try and enlighten and free the populace under monarchist or puritan tyranny. This was agreed to by all parties involved.\n\nWhile this continent-spanning meeting was not very productive, mostly focused on discussing future meetings, it has helped set the stage for further developments in the next Lathweyne Republican Conference."
 skaelinger.72.a:0 "The Future Looks Bright for Republicanism"
 skaelinger.73.t:0 "Putting Down Stubborn Clanholds"
 skaelinger.73.d:0 "Recently we have gotten reports of some clanholds not accepting the rule of the Brotherhood, and are resisting contributing to the nation. We have dispatched troops to teach them the error of their ways and take what is rightfully the people's."
 skaelinger.73.a:0 "Slaughter the Greedy Pigs"
 skaelinger.74.t:0 "Universal Suffrage for All?"
 skaelinger.74.d:0 "Now that we have provided universal suffrage for all men, some radicals in the Brotherhood have suggested that we expand this universal suffrage to include women as well."
 skaelinger.74.a:0 "We shall be a republic for all Skaelinger, including women"
 skaelinger.74.b:0 "This goes too far! Women belong in the household, not in the voting booths"
 skaelinger.75.t:0 "Hardliner Legionnaire Revolt!"
 skaelinger.75.d:0 "Angered by the pragmatist measures the nobles leading the Legion have taken, the hardliners, wanting to free all dwarves from the bonds of servitude to the Old Order, have revolted against the nobles that lead them before."
 skaelinger.75.a:0 "They Are Insane"
 skaelinger.75.b:0 "For True Soltruism! Kill the Revisionists!"
 skaelinger.76.t:0 "Radical Riots Plague the Streets"
 skaelinger.76.d:0 "Recently it has seemed like there has been a massive increase in pro-Radical sentiments in the populace. Some suggest that they are being supplied by [SKA.GetNameDef], in an attempt to influence us after our secession."
 skaelinger.76.a:0 "The Radical Fools"
 skaelinger.77.t:0 "Radical Republican Coup Attempt!"
 skaelinger.77.d:0 "The capital has been stormed by rabble who wish to overthrow the rightful rulers of [RMT.GetNameDef], and bring chaos to our nation!"
 skaelinger.77.a:0 "And Chaos They Shall Bring..."
 skaelinger.77.b:0 "We will fight against these radical fools!"
 skaelinger.78.t:0 "Rimatan Civil War"
 skaelinger.78.d:0 "Unwilling to allow a fair government to rule them, some more conservative Rimatans have begun a civil war against our Republican Bretheren, and they ask for our aid"
 skaelinger.78.a:0 "And we shall give them all the aid they require"
 skaelinger.78.b:0 "They can fend for themselves"
 skaelinger.79.t:0 "[SKA.GetName] Proposes Merger of our Nations"
 skaelinger.79.d:0 "Due to the similarities of our nations, both being republican dwarven majority states, [SKA.GetLeader] has proposed a merger of our nations into a new union."
 skaelinger.79.a:0 "This Union Shall Not Be Like the Last One"
 skaelinger.79.b:0 "That Union Would Be Just Like the Last One"
 skaelinger.80.t:0 "Merging with the Rimatans"
 skaelinger.80.d:0 "The Rimatans have accepted our proposal, and now we must simply adapt our bureaucracy to handle the sudden increase in the size and population of our state. But we will quickly adapt, and we welcome back the dwarves who seceeded from us so long ago."
 skaelinger.80.a:0 "A Happy Ending for Us All"
 skaelinger.81.t:0 "The Rimatans Refuse"
 skaelinger.81.d:0 "Due to their stubbornness and independent-mindedness, the Rimatans have refused to reunite our people. Thus we must unite with them by force."
 skaelinger.81.a:0 "A Tragedy, but One that Must Be Done"
 skaelinger.82.t:0 "Palmekvist's Plotting"
 skaelinger.82.d:0 "Kytos Palmekvist looked out upon the city of Skaelinger, pondering his plans for the city and the nation at large. It was obvious most of the populace was upset at the part he played in the coup that allowed him to acquire power, and he had to think of a way to placate their anger, lest they rise up against him. He glanced at his two guards, soldiers he knew were doubtlessly loyal to him. Perhaps he could use the part of the army loyal to him in order to earn the people's goodwill."
 skaelinger.82.a:0 "A Counter-Coup to Restore the Charter, with some minor changes"
 skaelinger.82.b:0 "We will placate the people in some other way."
 skaelinger.83.t:0 "[SKA.GetLeader] Demands Our Submission"
 skaelinger.83.d:0 "In an effort to unite all dwarves under one banner, [SKA.GetLeader] has sent a strongly-worded letter demanding that all dwarves, for the safety of our race, be united under the Skaelinger Banner."
 skaelinger.83.a:0 "We must submit to them"
 skaelinger.83.b:0 "These demands are insane!"
 skaelinger.84.t:0 "[FROM.GetLeader] Accepts our Demands"
 skaelinger.84.d:0 "In a surprising sign of intellect and selflessness, the nation of [FROM.GetName] has submitted to us, and now we are their benevolent overlord."
 skaelinger.84.a:0 "Only Good Things for Dwarfkind can come from this"
 skaelinger.85.t:0 "[FROM.GetLeader] Rejects our Demands"
 skaelinger.85.d:0 "In a demonstration of foolishness and pride, the nation of [FROM.GetName] has refused to align with us and allow us to dictate their policy. This cannot be allowed to stand."
 skaelinger.85.a:0 "We will be united under our soldier's boots"
 skaelinger.86.t:0 "The Election of the Head of the Vergall Riks Party"
 skaelinger.86.d:0 "Now that we have decided to reform the Vergal Riks Party, we must decide who will lead the party. There is Chill Dude, a fairly popular but moderate Council member that could hep stabilize our nation. There is Cnute Stauningr, a noble with a keen eye for economics and proponent of markets. Finally there is Generallete, a retired general who is a veteran of many border conflicts and has proposed many potential reforms for our military."
 skaelinger.86.a:0 "Chill Dude for Unity!"
 skaelinger.86.b:0 "Cnute Stauningr for Prosperity!"
 skaelinger.86.c:0 "Generallete for Protection!"
 skaelinger.87.t:0 "Searching for Allies"
 skaelinger.87.d:0 "We know our position is tenuous, especially with our own people after we refused to establish the republic many thought we would. We need to have some kind of diplomatic victory, and one way to achieve this would be by gaining a powerful ally."
 skaelinger.87.a:0 "The Ungerdaler are an honorable folk"
 skaelinger.87.b:0 "Perhaps the Irinthians have room for us in their ambitions"
 skaelinger.88.t:0 "[FROM.GetName] Requests an Alliance"
 skaelinger.88.d:0 "With many potential enemies around them, the Grand Lore Council that leads [FROM.GetNameDef] know their position is tenuous, and wishes to appeal to us for an alliance."
 skaelinger.88.a:0 "We should form a defensive pact"
 skaelinger.88.b:0 "They should join our formal alliance"
 skaelinger.88.c:0 "No, they should fend for themselves"
 skaelinger.89.t:0 "[SKA.GetLeader] Offers Subservience to Us"
 skaelinger.89.d:0 "Admitting that they cannot control their populace without our aid, [SKA.GetLeader] has requested that we make [SKA.GetNameDef] a protectorate, in order to make sure their nation is stable."
 skaelinger.89.a:0 "A free protectorate cannot be denied"
 skaelinger.89.b:0 "We'll make them a Freiprinztum"
 skaelinger.89.c:0 "If they cannot control their own people, what good are they to us?"
 skaelinger.90.t:0 "[FROM.GetName] Accepts our Subservience"
 skaelinger.90.d:0 ""
 skaelinger.90.a:0 "A Good Thing, We Hope"
 skaelinger.91.t:0 "Anti Grand Lore Council Riots Break Out"
 skaelinger.91.d:0 "Riots against the Grand Lore Council and the prevention of the transformation to a republic as we promised have broken out in Hostringr. This is only the most recent outbreak of discontent, but we must be careful to make sure it doesn't spread."
 skaelinger.91.a:0 "Send in the Troops"
 skaelinger.91.b:0 "It'll blow over soon"
 skaelinger.92.t:0 "Anti Grand Lore Council Riots Put Down"
 skaelinger.92.d:0 "We have finally managed to put down the riots against the Grand Lore Council, restoring order in our nation."
 skaelinger.92.a:0 "We can rest at last"
 skaelinger.93.t:0 "The Hostringr Fires"
 skaelinger.93.d:0 "Due to the riots, large amounts of fires have recently broken out in Hostringr. The fire crews are overworked in their efforts to put the fires out, and request help from the gendarmes, who are preoccupied with hunting down the arsonists."
 skaelinger.93.a:0 "Focus on Putting Out the Fires"
 skaelinger.93.b:0 "Focus on Putting Down the Riots"
 skaelinger.94.t:0 "Hostringr Riots Spread!"
 skaelinger.94.d:0 "The riots against the Grand Lore Council that began in Hostringr have spread throughout Skaelinger, and now threaten to throw the entire nation into disarray and chaos."
 skaelinger.94.a:0 "Enact Martial Law and Kill the Rioters"
 skaelinger.94.b:0 "Give in to Some of Their Demands"
 skaelinger.95.t:0 "[SKA.GetName] in Chaos"
 skaelinger.95.d:0 "We have officially lost control of our nation. The streets are in chaos, farms burned to the ground, and disorder everywhere. The issue can't be fixed by us anymore."
 skaelinger.95.a:0 "Military Rule, put down the dissidents"
 skaelinger.95.b:0 "Perhaps a Benefactor can help us?"
 skaelinger.96.t:0 "Finding a Benefactor"
 skaelinger.96.d:0 "We must search for a powerful nation willing to help us, even if it costs our independence. The two main choices are either [IRI.GetNameDef], or [UNG.GetNameDef]."
 skaelinger.96.a:0 "Faustburg Sounds Nice this Time of Year"
 skaelinger.96.b:0 "Tion Sounds Nice this Time of Yearn"
 skaelinger.97.t:0 "Iron Blood Revolt!"
 skaelinger.97.d:0 "Due to the submission of ourselves as a subject state to a greater power, the Iron Bloods have been enraged, and have stoked nationalist fires within our people until they managed to assemble an army, threatening to force all foreigners out of our lands."
 skaelinger.97.a:0 "Crush the Nationalist Threat"
 skaelinger.98.t:0 "Zarathum Lost, Again"
 skaelinger.98.d:0 "In spite of our best efforts, we have lost Zarathum after holding it for a few months due to frenzied Ork raids. Our spirit is broken, and our hopes of reforming Vergallheim are dashed"
 skaelinger.98.a:0 "The End of Restorative Ambitions"
 skaelinger.99.t:0 "Zarathum Being Rebuilt"
 skaelinger.99.d:0 "Stealing our land wasn't enough, now the Dwarves must rebuild their ruins on our land. [KUR.GetLeader] has demanded that Kurgur raids against [SKA.GetNameDef] increase in order to try and retake the land they have stolen before they can secure their holds."
 skaelinger.99.a:0 "To War!"
 skaelinger.100.t:0 "The Skaelinger have Secured Zarathum"
 skaelinger.100.d:0 "The Kurgur raids have not stopped [SKA.GetNameDef] from securing their hold on their ruined former capital, and now our raids are pointless, achieving nothing but killing a few good raiders."
 skaelinger.100.a:0 "Call the Raids Off"
 skaelinger.101.t:0 "The Successful Civil War"
 skaelinger.101.d:0 "Now we have finally established ourselves as the true controllers of Skaelinger, and we can finally go back to doing what we rose up to achieve"
 skaelinger.101.a:0 "The Iron Blood Conspiracy is Successful"
 skaelinger.101.b:0 "The Skaelinger Revolution is Won"
 skaelinger.101.c:0 "The Sun-Beneath-the-Stone Calls to Us"
 skaelinger.102.t:0 "Palmekvist Demands we Lift the Exile of Monarchist Officers"
 skaelinger.102.d:0 "Knowing our desparate situation, [SKA.GetAdjective] advisors have recommended we lift the exile of officers we had enacted when they turned against the Rose-Bearers. They are very skilled, but we worry that this would mean more monarchist influence within our nation."
 skaelinger.102.a:0 "The situation is too desparate for us to deny this"
 skaelinger.102.b:0 "We will not allow the reactionaries to return!"
 skaelinger.103.t:0 "[RTH.GetName] Ripe for Monarchism"
 skaelinger.103.d:0 "Due to the influence we have spread through the nation, our Rthaur allies are now ready to accept a monarchy. Or at least will not revolt the instant we suggest the idea."
 skaelinger.103.a:0 "Let's be cautious and suggest a very weak king"
 skaelinger.103.b:0 "Let's push our advantage and try to make them a subject kingdom"
 skaelinger.104.t:0 "Skaelinger Pressure to Become a Monarchy"
 skaelinger.104.d:0 "Touting that being ideologically similar would help our relations, and promising that the monarch would be weak, [SKA.GetLeader] has suggested that to match popular demand of our people we reform into a monarchy."
 skaelinger.104.a:0 "If it is what the people wish"
 skaelinger.104.b:0 "No we won't let Reactionaries Take Control"
 skaelinger.105.t:0 "Skaelinger Pressure to Become a Subject Kingdom"
 skaelinger.105.d:0 "Touting that being ideologically similar would help our relations, and promising that the monarch would be weak, [SKA.GetLeader] has suggested that to match popular demand of our people we reform into a monarchy. But we know that really, [SKA.GetLeader] just wants to rule over us like he does the dwarves in his own kingdom."
 skaelinger.105.a:0 "For the sake of our alliance, we will accept"
 skaelinger.105.b:0 "No we won't let Reactionaries Take Control"
 skaelinger.106.t:0 "A Rthaur Monarchy"
 skaelinger.106.d:0 "Our allies have accepted and become a kingdom like us, and now our bonds can be closer than ever"
 skaelinger.106.a:0 "Good news for our alliance"
 skaelinger.107.t:0 "No Rthaur Monarchy"
 skaelinger.107.d:0 "Our allies have denied our request for them to reform to the less chaotic form of government that is monarchism, causing our relations to suffer."
 skaelinger.107.a:0 "Perhaps in the future, they will learn the error of their ways..."
 skaelinger.108.t:0 "[SKA.GetLeader] Suggests Autonomy for Thurgithon Merchants"
 skaelinger.108.d:0 ""
 skaelinger.108.b:0 "No, those authoritarian money-grubbers should have no place in our government"
 skaelinger.109.t:0 "Industrial Sabotage!"
 skaelinger.109.d:0 "Some of our industry has been ruined and its products stolen! There are some who accuse the Skaelinger of doing this raid, but that couldn't possibly be true"
 skaelinger.109.a:0 "We must find the perpetrators now"
 skaelinger.110.t:0 "The Skaelinger Demand the Khorinor Mountain's Return"
 skaelinger.110.d:0 "The mountains the Skaelinger gave us to reside in during the Rthaur Revolution have been demanded back by the increasingly nationalist Skaelinger government and people, even though we promised that we would return it at the end of the war once Ordoria was defeated"
