 SKA_lowborn_workers:0 "Lowborn Workers"
 SKA_lowborn_workers_desc:0 "By employing the lower born castes as the brunt of our labor force, we can expand our industry and production quickly and cheaply."
 SKA_war_prisoners:0 "War Prisoners"
 SKA_war_prisoners_desc:0 "If we declare that all refugees in our nation who might be foreign spies are war prisoners, then we can exploit their labor buy putting them in work camps :big brain:"
