 SKA_invading_KUR_idea:0 "The Grand Invasion of the Kurgur"
 SKA_invading_KUR_idea_desc:0 "After a year of preparation, the time has come to crush the nomadic orcs to our east. We shall regain the territory we lost, and so much more!"
 SKA_invading_RMT_idea:0 "The Grand Invasion of the Rimatans"
 SKA_invading_RMT_idea_desc:0 "After a year of preparation, the time has come to crush the foolish secessionists who abandoned us so long agao."
