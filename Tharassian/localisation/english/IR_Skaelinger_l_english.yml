 SKA_second_scheme_category:0 "The Second Scheme"
 SKA_second_scheme_category_desc:0 "First the Iron Bloods schemed against the rulers of our nation before, and now we must scheme against them in order to bring about the government that all dwarves deserve, revolution against the caste system."
 SKA_assassinate_noble:0 "Assassinate an Iron Blood Noble"
 SKA_stoke_isolated_communes:0 "Agitate Isolated Communes"
 SKA_preach_of_mohrok:0 "Preach of Mohrok"
 SKA_balancing_soltruists:0 "Balancing the Soltruists"
 SKA_balancing_soltruists_desc:0 "There are many factions within the Soltruists, who have different ideas on how to guide our nation to greatness. There are the pragmatists who simply want a Mohrok-focused dictatorship, and the radicals who wish to focus all Skaelinger efforts on Mohrok and spreading his words.\n\nOur Relationship with the Radicals is: [GetRadicalSoltruistAnger]"
 SKA_runesmithing_category:0 "Runesmithing"
 SKA_runesmithing_category_desc:0 "Runesmithing is a risky act, and is more of an art than a science with its unpredictability. But it can greatly strengthen our military if we are lucky. Currently Our Runesmithing has the following effects on our army:\n\nAttack Bonus: [?SKA_runesmithing_attack_var]\nDefence Bonus: [?SKA_runesmithing_defence_var]\nBreakthrough Bonus: [?SKA_runesmithing_breakthrough_var]\nIncrease in Attrition: [?SKA_runesmithing_attrition_var]\nOrganization Bonus: [?SKA_runesmithing_org_var]\nPlanning Speed Bonus: [?SKA_runesmithing_plan_var]"
 SKA_runesmith_decision:0 "Put the Runesmiths to Work"
 SKA_supporting_republicans:0 "Supporting Republicans Abroad"
 SKA_supporting_republicans_desc:0 "We must make ties with our republican brothers, so that we may one day end tyranny on Lathweyne together!"
