 SKA_building_walls:0 "Building the Impenetrable Wall"
 SKA_building_walls_desc:0 "We must make our borders impenetrable to conventional warfare, and then further secure our cities. We will achieve this by constructing fortifications throughout our nation, so no one will be able to conquer it."
 SKA_building_border_walls:0 "Building Up the Border Fortifications in [FROM.GetName]"
 SKA_building_walls_blank:0 "You can Build up Border Fortifications on the Map"
 SKA_strengthen_stronghold_fortifications:0 "Strengthen the Stronghold"
 SKA_digging_deeper:0 "Digging Deeper"
 SKA_digging_deeper_desc:0 "In order to have steel comparable to the Rimatans, we must dig deeper, unearth the best and most exotic of metals. This is a better focus for us than petty foreign affairs.\n\nNumber of Mine Expansions: §Y[?SKA_how_deep_var]§!"
