 SKA_central_planning:0 "Centrally Planned Economy"
 SKA_central_planning_desc:0 ""
 #focuses
 SKA_aftermath_of_miners_blight:0 "Aftermath of the Miner's Blight"
 SKA_aftermath_of_miners_blight_desc:0 "It's been more than a century since the 774-778 Miner's Blight epidemic wiped out a third of Skaelinger's dwarfs. The legacy of such a critical depopulation of our mountain home still makes ripples across dwarfen society. Countless shuttered businesses and severely depleted manpower led the Riksdag - the central government of the old Vergallheim Empire - to desperately institute a penal levy to funnel criminals and vagabonds into necessary military and production roles. Though this was intended as an emergency measure until Skaelinger recovered, the Ordorian crisis has ensured that Skaelinger remains in a permanant state of emergency. High prices on basic goods and rent along with mounting taxes to refill the state coffers ensure that most in the levy system are little more than unfortunate debtors. This has resulted in uproarious protests from the guild lobby, represented in the Riksdag by the CDL, angry that the levy is pulling bodies (and therefore representation) away from guild labor. The net effect of this crisis has been the wholesale destabilization of the dwarfen caste system, with many calling out for reforms to the helm charter to amend or abolish caste completely."
 SKA_abandon_isolationism:0 "Abandon Isolationism"
 SKA_abandon_isolationism_desc:0 "With our policies set, the time has come for the Vergall people to step back into the realm of continental affairs and reassert our position as one of the premier powers of Lathweyne."
 SKA_emergency_conclave:0 "Emergency Conclave"
 SKA_emergency_conclave_desc:0 "Oberjarl Hellirfast has returned to his ancestors. His tomb is being prepared in the ancient Ancestor Temple as the Grand Lore Council makes arrangements to elect the next Oberjarl. It is imperative we take precautionary measures to ensure the safety and sanctity of the nomination process, lest radicals take advantage of the power vacuum to sow discord. The Oberjarl is dead. Long live the Oberjarl."
 SKA_enforce_isolationism:0 "Enforce Isolationism"
 SKA_enforce_isolationism_desc:0 "How does that old Vergall adage go? 'No alliance outlasts the mountains.' Nothing good ever came from leaving the Oramfell mountains and meddling with the affairs of the other races. Why can't we just accept we are a mountain people perfectly suited to our home? As soon as this business with Ordoria is settled, we must shut our doors to the surface world and focus on rebuilding and fostering internal harmony."
 SKA_financial_recovery_endeavors:0 "Financial Recovery Endeavors"
 SKA_financial_recovery_endeavors_desc:0 "There is no time to waste. The threats of war, pestilence, famine, and civil strife loom large on the horizon. We must focus all of Skaelinger's endeavors on resolving these conflicts and overhauling the economy to prepare for war."
 SKA_appease_the_guild:0 "Appease the Guild"
 SKA_appease_the_guild_desc:0 "It is an indisputable fact that the guilds form the backbone of the Skaelinger labor force. They augment the economy with their technical skill, superior organization, and immeasurable dedication. Penal labor could never have been a sustainable alternative and it was foolish to attempt such a thing. Granting amnesty to the various debtors and felons within the penal system will also boost guild representation in our instituions, fulfilling the longtime demands of our loyal guildsmen and setting us down the road of peace and prosperity!"
 SKA_abandon_prison_labor:0 "Abandon Prison Labor"
 SKA_abandon_prison_labor_desc:0 "It's time to let freedom ring in the glorious forges and workshops of our mountain home. We will work smarter, aye. Not harder."
 SKA_decrease_basic_goods_taxes:0 "Decrease Taxation on Basic Goods"
 SKA_decrease_basic_goods_taxes_desc:0 "Our people are being bled dry by taxes on the bare necessities of living. It's tantamount to a death sentence to the various castes living in poverty. Recovering the state treasury is a priority, but no recovery is worth the immiseration of our people! Cut the taxes at once!"
 SKA_foreign_workers:0 "Foreign Workers"
 SKA_foreign_workers_desc:0 "It would be wise to remember the Vergall people do not stand alone. We have allies and sympathizers across the continent, willing to immigrate to our ancient fortress to perform the necessary work to restore Skaelinger to glory and invigorate our economy. Our doors are open to the brave migrant workers of the surface world!"
 SKA_lift_the_debts:0 "Lift the Debts"
 SKA_lift_the_debts_desc:0 "Enough is enough. Ever since the loss of the Steel Road, the poorest Skaelingers have been trapped in a spiral of debt and poverty that destroyed countless families. This cycle was perpetuated by gentry and bureaucratic elite too desperate and miserly to pay dwarfs fairly for the necessary labor they perform. This arrangement has been poisonous to society, hence all standing debts shall be cancelled at once!"
 SKA_restore_the_guilds_influence:0 "Restore the Guild's Influence"
 SKA_restore_the_guilds_influence_desc:0 "We will forge closer ties between guild and government. No infrastructure or production operation without the guild leadership, planning, and implementation at every stage of the project. They shall be granted permanent seating at our democratic assemblies and mandatory consultation on any laws that pertain to labor and production."
 SKA_stop_prison_conscription:0 "Stop Prison Conscription"
 SKA_stop_prison_conscription_desc:0 "As we vigilintly untangle the infernal mess that was the recently abolished debt and peonage systems, we are inevitably forced to confront how penal labor has sunk its talons into the army. At times a surgical hand is needed to weed out the vestigial organs of the penal system in our institutions, but this? This requires amputation. Our soldiers will be well-paid, clothed, trained, free, and committed to a nation that values their liberty, or we will be doomed. This is the only way."
 SKA_oppose_the_guild:0 "Oppose the Guild"
 SKA_oppose_the_guild_desc:0 "For too long, the guilds have obstructed the Riksdag from doing what needs to be done for the survival of Skaelinger. At every turn, they have protested, blocked, and vilified in popular consciousness the necessary measures designed by the clanlords and bannermen. The time has come for the Oberjarl to assert his rule. This is not a republic, as much as the Chartists wish otherwise. He allows the third estate to be represented, but all remain his subjects. The word of the jarl is law. Depleted and underfunded guilds will be shuttered. Rowdy guilds taken over by the Brotherhood of Equals will be outlawed. Petulant guild leaders will be expelled from the Riksdag, until the halls speak with one voice. The voice of the Oberjarl."
 SKA_enforce_prison_conscription:0 "Enforce Prison Conscription"
 SKA_enforce_prison_conscription_desc:0 "If the felons wasting precious air and nutrients in our prisons want their liberty so badly, they can earn in back in service of the state. Some dwarfs may have forgotten the road that led us here, but we are still in desperate times. We need manpower. We need as many fighters to fill our ranks as possible. When faced with annihilation, morality must abdicate the scepter to survival. No more dissent! Penal conscription is here to stay, and it will be expanded and enforced as necessary. All idle hands and debtors will cut off the dole and put to use. This is war, not a ball."
 SKA_the_army_of_skaelinger:0 "The Army of Skaelinger"
 SKA_the_army_of_skaelinger_desc:0 "With our new reforms to labor and military service, we have constructed an army worthy of our great nation's history. They will be well prepared against invaders tenacious enough to set foot on our mountains."
 SKA_enforce_prison_labor:0 "Enforce Prison Labor"
 SKA_enforce_prison_labor_desc:0 "We had a problem. That problem was a shortage of labor after the horrors of Miner's Blight. Our solution? Putting criminals to work to fill the gaps. With the guilds neutered and the halls clear of their obstuctionist whining, the Oberjarl now has a firm grip on the forces of production. If you must work, you work because your Oberjarl commands it. If you refuse, then your liberty is forfeit. Your labor belongs to the crown."
 SKA_expel_the_refugees:0 "Expel the Refugees"
 SKA_expel_the_refugees_desc:0 "For the security of the realm, we must expel the refugees. What logic is there in feeding and housing a foreign population when we can hardly do either for our native people? Besides, letting elves and men settle in Skaelinger is a massive security risk. Who knows how many Ordorian agents are among them?"
 SKA_avert_the_famine:0 "Avert the Famine"
 SKA_avert_the_famine_desc:0 "Between the loss of nearly all of Vergallheim's arable land during the collapse, the thousands of agrarian workers who succumbed to Miner's Blight, and the influx of refugees from the Ordorian Civil War, Skaelinger is well over its carrying capacity. We must secure a steady influx of food or else face a devastating famine."
 SKA_secure_ung_trade:0 "Secure [UNG.GetAdjective] Trade"
 SKA_secure_ung_trade_desc:0 "The Ungerdaler Union has cultivated rich fields of crops vital to feed a large population within its vast territory. We shall send diplomats to negotiate a grain import deal with the Freithron. This will set our budget back in the short term, but save lives in the long term."
 SKA_cultivate_mushroom_plantages:0 "Cultivate Mushroom Plantages"
 SKA_cultivate_mushroom_plantages_desc:0 "Mushrooms have long been a staple of the Skaelinger diet. Dependable, nutritious, and easy to cultivate in the dark, dank mountain interiors. We will start a program to require all propertied citizens to cultivate mushroom gardens on their land. Our people will eat plentiful from the food they grow themselves!"
 SKA_secure_ber_trade:0 "Secure Bergialier Trade"
 SKA_secure_ber_trade_desc:0 "Skaelinger's relationship with the uprooted ones in Bergial is... complicated to say the least. Nevertheless, desperate times call for desperate measures. A strong leader would swallow his pride and do whatever it takes to secure a trade deal with our wealthy cousins in the east, so that is exactly what must be done."
 SKA_lower_ratios:0 "Lower Rations"
 SKA_lower_ratios_desc:0 "In the short term, this is perhaps the most necessary measure that will yield the most immediate results in averting a famine. Unfortunately, it will also no doubt be the most controversial proposal. Subsistence is already a struggle within our borders. Cutting rations will only be a temporary measure, but it will be massively unpopular. Expect riots."
 SKA_invest_in_foreign_farms:0 "Invest in Foreign Farms"
 SKA_invest_in_foreign_farms_desc:0 "The agrarian colony of Ytholine has shown promising results. Uprooting dwarfs and planting them in farm colonies in foreign lands may well be a viable model of food supplementation. We'll rule this experiment a success and invest into expanding these colonies and establishing more on the continent."
 SKA_the_dwarfen_republic:0 "The Dwarven Republic"
 SKA_the_dwarfen_republic_desc:0 "It's time for a new chapter for the Vergall people. An end to Jarls, to tyrants, and to all manner of unelected rulers who inherit their power. We proudly wave the standard of the ancient city of Zarathum; of the first Dwarven Republic. We will take inspiration from the old and carry it into the present!"
 SKA_charter_protection_league:0 "The Charter Protection League"
 SKA_charter_protection_league_desc:0 "The Charter Protection League has been at the forefront in the defense of the Helm Charter and the advancement of democracy in Skaelinger. Who better to wield the torch as Skaelinger marches into a bright, Republican future?"
 SKA_ending_tariffs:0 "Ending Tariffs"
 SKA_ending_tariffs_desc:0 "Tariffs on foreign goods are a counter-intuitive way to bring in revenue when we our stunted economy is so dependent on foreign goods. Ending the tariffs will stimulate trade and grow our economy by several magnitudes over the next century. Take a hammer to isolationism and let freedom of trade ring!"
 SKA_price_control:0 "Price Control"
 SKA_price_control_desc:0 "Part of the reason so many Skaelingers are trapped in a cycle of debt and poverty is the inflated prices on basic goods resulting from general scarcity. Our free trade policies will give our goverment the breathing room to implement price control to help out our ailing citizens."
 SKA_proportional_riksdag_representation:0 "Proportional Riksdag Representation"
 SKA_proportional_riksdag_representation_desc:0 "This is it. The motherlode of reforms. Loyal Chartists have tried for generations to amend the Helm Charter to proportion representation in the Riksdag by population as opposed to landed wealth and status. When this bill passes, We will truly have laid the foundations for a long-lasting republic and uplifted the Helm Charter to its rightful place as a beacon for liberty everywhere!"
 SKA_dividing_underused_noble_lands:0 "Dividing Underused Noble Lands"
 SKA_dividing_underused_noble_lands_desc:0 "We have abundant land without workers and many landless workers. Logic follows that we move these unemployed paupers to the empty land to cultivate and stimulate our agriculture. The problem? Most of this land is owned by aristocratic families who have long ago fallen from grace. The land lies fallow and untapped. This situation cannot be allowed to continue. If the nobles prove unwilling or unable to grow crops for Skaelinger, then give that land to someone who will."
 SKA_universal_suffrage:0 "Universal Suffrage"
 SKA_universal_suffrage_desc:0 "For the first time in Dwarven history, all adult males will be elligible to vote without property restrictions or caste prohibitions. The gentry will protest. The old bannerlords will rattle their sabres, but the Riksdag is the true power in Skaelinger. A power derived from all its people, not just the privileged few."
 SKA_found_public_schools:0 "Found Public Schools"
 SKA_found_public_schools_desc:0 "One of the most formidible historical obstacles to class mobility is limited access to quality education. The casteless in particular have gone countless generations without literacy. If we want to build a truly egalitarian, Republican Skaelinger defended by loyal and patriotic citizens, then we must arm them with the knowledge to administer and defend our humble nation."
 SKA_abolish_grand_lore_council:0 "Abolish the Grand Lore Council"
 SKA_abolish_grand_lore_council_desc:0 "With no monarchy to steward, the Grand Lore Council only serves as an extraneous political body that overextends the reach of the Ancestor temple. It's always had an ambiguous place in the Helm Charter since the day it was established, but now it can only be an obstacle to a true republican government. Abolish this last redoubt of aristocracy!"
 SKA_teach_of_extremisms_horrors:0 "Teach of Extremism's Horrors"
 SKA_teach_of_extremisms_horrors_desc:0 "The Ordorian tragedy is a cautionary tale of what happens when extremists take hold of the reins of power in a nation. An ossified, fearful, and uncompromising elite cultivates the twin terrors of Puritan tyrrany and unchecked radical mob rule. As we guide Rthauiaur into a brighter future with functioning institutions and responsive modes of government, we must endeavor to educate both their population and our own of the horrors of extremism. We will impart on them that the liberty they fought so hard to achieve can only be preserved under a strong republican constitution with checks and balances to negate corruption and excessive power."
 SKA_absorb_moderate_radicals:0 "Absorb Moderate Brotherhood Members"
 SKA_absorb_moderate_radicals_desc:0 "The Brotherhood of Equals may have began as a terroristic secret society, but their radicalism was merely a response to the growing tyranny of the ailing monarchy. Not all Brotherhood members are dogmatic extremists. Many desire a rationally organized republic as much as any chartist. We will extend the offer to the most reasonable among them to enter the Riksdag and join our coalition, thus strengthening the republican cause and diluting the appeal of the radicals."
 SKA_sponsor_moderate_rthaur:0 "Sponsor Moderate Rthaur"
 SKA_sponsor_moderate_rthaur_desc:0 "Based on the Riksdag's diplomatic findings, the so-called 'Travellers' seem to represent the best and brightest of republicanism in Rthauiaur. Taking inspiration from our very own Helm Charter, the Travellers and their allies in the House of Vrinter will work to stabilize the revolutionary territory and replace the chaos of Derathur's mismanagement with a constitutional representative government. Liberty and the rule of law can coexist. In fact, they are symbiotic."
 SKA_international_relations:0 "Improve International Relations"
 SKA_international_relations_desc:0 "With trade comes opportunities. Opportunities to build prestige for the new Skaelinger and make our nation's presence felt on the continent. Let's encourage a free exchange of ideas. No people has anything to fear from Republican Skaelinger. We will dazzle them with our achievements and impress them with our enlightened values!"
 SKA_major_land_reforms:0 "Major Land Reforms"
 SKA_major_land_reforms_desc:0 "The biggest concession made to the Brotherhood to cement the Chartist coalition was a promise to pass an ambitious land reform program demanded by many in the lower castes. The time has come to pay our due and implement (a somewhat watered down version of) the bill as promised. It will further break up the land of the gentry, and even take some noble enterprises in the nobles' domain and put them under guild management."
 SKA_cut_ties_with_rthauriaur:0 "Cut Ties with [RTH.GetNameDef]"
 SKA_cut_ties_with_rthauriaur_desc:0 "The war is done with, and Ordoria is no more. Now we have no incentive to maintain this temporary defense pact with the Rosites and their dangerous ideology. The pact was a practical measure to secure the survival of the Vergall people. No more. No less. The Rosites had better watch themselves if they come knocking at the foot of the Oramfell mountains. They will learn the same lesson we taught their Ordorian predecessors."
 SKA_the_grandlore_council:0 "The Grand Lore Council"
 SKA_the_grandlore_council_desc:0 "The deadly attempts to hamper the constitutional process of appointing the next Oberjarl has regrettably proven that Skaelinger is not stable enough to crown the next monarch until at least after the Ordorian threat has passed. The Grand Lore Council will exercise its constitutional right to form a temporary regency council to govern the country until the crisis has passed. It will function as a republic that retains the power of the gentry and the Riksdag assembly. Many bannermen and members of the Riksdag will take umbrage at this turn of events, but we will make assurances that their power will not be threatened by this transition."
 SKA_funding_moderate_rthaur:0 "Fund Moderate Rthaur"
 SKA_funding_moderate_rthaur_desc:0 "Though our ally's government has an odiously radical bent, there exist many influential moderates with wealth, military experience, and intellect aplenty. House Vrinter is an especially curious anomaly, being the one aristocratic family in Rthauiaur to avoid the furies' bloody purges. The council deems it prudent to surreptitiously fund moderate voices in government and amplify the power of the republican aristocracy. With any luck, our most faithful allies will reestablish order in the east, opening the way to even better relations between our homelands."
 SKA_befriending_ungerdaler:0 "Befriending the [UNG.GetAdjective]"
 SKA_befriending_ungerdaler_desc:0 "Our relations with the humans in the south has always had its ups and downs, but overall the Ungerdaler Princes have been amicable neighbors with much to admire about their society. Against such malevolent forces as Ordoria, the Orcs, and the Grand Master, a reliable friend in the south would be a godsend. We'll appeal to our history of the Altallianz against the elves to make the best possible case for a closer relationship. We've had our differences, but there is no one on the continent we would rather have at our backs than the Ungerdalers."
 SKA_promoting_free_trade:0 "Promoting Free Trade"
 SKA_promoting_free_trade_desc:0 "The Guildists in the Charter Protection League may be a swamp of populism, but they are right about one thing; free trade is indespensible to the survival of a modern nation. Away with the hoarding of wealth and bullion! Let our goods flood the continent and let the best things our neighbors have to offer make their way into Skaelinger."
 SKA_our_own_steel_trade_hub:0 "Our Own Steel Trade Hub"
 SKA_our_own_steel_trade_hub_desc:0 "The steel road does not extend into our borders due to the long-standing claims Skaelinger has against Rimatu. We also lack the lava forges necessary to produce fireforge steel of our own. Nevertheless, we may be able to find a roundabout way to enter the steel market. We will send independent brokers to Rimatu to buy steel in bulk and ship them back to the homeland. We will use this material to build our own internal steel market!"
 SKA_subverting_steel_road:0 "Subverting the Steel Road"
 SKA_subverting_steel_road_desc:0 "Now that we have our own steel trade hub established, we will sell the steel at inflated prices to the northern freiprinztums in the ungerdaler union where the steel road has not yet reached. This may be in violation of many trade agreements, but fireforge steel is in such high demand, that we imagine it won't be difficult to persuade the authorities to look the other way."
 SKA_equal_representation_riksdag:0 "Equal Representation in the Riksdag"
 SKA_equal_representation_riksdag_desc:0 "As of right now the system for establishing the blocs in the Riksdag is a bit of a mess. The Ancestor Temple is free to appoint as many loremasters as they please in the loremaster's bloc so long as the Oberjarl approves it. The clan gentry in theory can only send two representatives of their clan, but some of the craftier lords married clan pretenders exiled in places like Bergial or Rimatu to petition for more representation. The commoner's bloc is the only one based roughly on proportional representation, though reduced by 2/5. In recent years, miner's blight and the penal system have significantly reduced the commoner's bloc without equivalent damage done to the other two blocs. Enough with this chaos! Henceforth, each bloc will be given an equal number of representatives, scaled to a decannual census. Three blocs in the Riksdag and an assembly divided into thirds. Simple, rational, and fair."
 SKA_lift_casteless_prohibitions:0 "Lift Casteless Prohibitions"
 SKA_lift_casteless_prohibitions_desc:0 "There exists much untapped potential within the casteless population of Skaelinger. With as many blows as our civilization has taken in recent years, we can't afford to waste a single dwarf. We will pass an amendment to the Helm Charter to allow casteless to vote in commoner's elections if they meet the property requirements, freely apply for apprenticeships at the guilds, and earn elligibility for loremaster's training at the Ancestor's Temple. Traditionalists will not be pleased, but caste in modern times is more a social construct than an ironclad restriction on social mobility. The Chartists will rejoice."
 SKA_distribute_bannerlordships:0 "Distribute Bannerlordships"
 SKA_distribute_bannerlordships_desc:0 "For generations, there has been a small collection of clan lords with outlandishly large military retinues at their beck and call who have hogged the Oberjarl candidacies in a legal grey area technically outside the Helm Charter. This cannot be allowed to persist. We will break up the bannerlords and distribute their titles to smaller clans and establish new clans from lesser family branches of the bannermen. They've had their moment in the sun for eons. A new day dawns on Skaelinger."
 SKA_revive_vergall_riks_party:0 "Revive the Vergall Riks Party"
 SKA_revive_vergall_riks_party_desc:0 "The Grand Lore Council's regency has incurred dazzling success, but we must face the facts. Loremasters may be master bureaucrats, but they are not politicians. They are not charismatic speakers, nor are they born leaders. There was a time in Vergallheim's history when Riksdag politics were organized in a rational and educated way. This was the golden age of the rule of the Vergall Riks Party. Our next initiative will be to revive the party and find the best and brightest of the gentry bloc to build a political platform and forge alliances conducive to managing a governing coalition. The regency will be abolished, and elections will once again resume under a two-party Republican model. Through monumental effort and superlative courage, we have found the middle road to greatness."
 SKA_renounce_claims_dwarven_nations:0 "Renounce Claims on Dwarven Nations"
 SKA_renounce_claims_dwarven_nations_desc:0 "In order to build healthy relations with our Dwarven brothers and establish healthy trading agreements for the mutual prosperity of the Vergall people, Skaelinger must set the example and renounce its claims on other dwarven territories stretching back to the age of Vergallheim. This will be a tremendous step forward for the entire Vergall people!"
 SKA_protective_father_nation:0 "The Father Nation Protects"
 SKA_protective_father_nation_desc:0 "Skaelinger shall act as a shield for the Vergall dwarfs of the Lathweyne continent, strong and rigid as the sturdy stone bulwarks we've made our home. Our power will extend to all places dwarfs call home to uphold the rights of Vergalls everywhere and secure their liberty."
 SKA_threats_from_the_west:0 "Threats from the West"
 SKA_threats_from_the_west_desc:0 "Ordoria isn't the only obstacle to peace and prosperity. The Grand Master's Realm and the scheming Freiprinzen of the Ungerdaler Union have designs on the resource-rich Oramfell mountains. We'll put out a firm declaration that the Oramfell mountains are Dwarven by natural right, and any intrusion will be treated with extreme prejudice!"
 SKA_puritan_opposition:0 "Puritan Opposition"
 SKA_puritan_opposition_desc:0 "Pressure from the Legion has pushed Rthaiaur diplomacy in a more patronizing direction. We shall not pretend any longer that Rtauiaur and Skaelinger are equal partners. Their rump nation was rescued by our intervention, and continues to exist only by our consent. These anarchic rebels are way in over their head with little to no sense for military strategy, discipline, or even basic common sense. They will play but a secondary role in their inevitable war with Ordoria, so we shall play the rightful part of overlord and exercise authoritative control over planning and logistics."
 SKA_anti_ordorian_stance:0 "Anti-Ordorian Stance"
 SKA_anti_ordorian_stance_desc:0 "The Skaelinger Stronghold and its elven allies in Rthauiaur are hardly the only nations on the continent worried about the revanchist extremism of the Ordorian regime. We'll put our diplomats to work in neighboring provinces in the Ungerdaler Union and the Grand Master's Realm to feel out for anti-Ordorian figures amenable to cooperating for the containment of Ordorian militarism."
 SKA_the_great_houses:0 "The Great Houses"
 SKA_the_great_houses_desc:0 "The clans Hellirfast, Palmekvist, and Grimvald were the first to swear fealty to Jorik the Mighty, who would go on to found the great nation of Vergallheim. The bannerlords of the Vergall people are jealous guardians of the Helm Charter and stewards of the traditions of old Vergallheim. It is they who preserve the continuity of institutions and ideas from the imperial era, and guard it ferociously against those who seek to torch the whole foundation."
 SKA_house_hellirfast:0 "House Hellirfast"
 SKA_house_hellirfast_desc:0 "Reev Hellirfast is a loyal practitioner of Ancestral piety, and vows to continue and advance the recent reforms implemented by his late father."
 SKA_close_republican_ties:0 "Close Republican Ties"
 SKA_close_republican_ties_desc:0 "The House of Hellirfast has distinguished itself from previous dynasties by building a rapport with radical chartists in the Riksdag. Reev Hellirfast is as committed to protecting and expanding the liberties outlined in the Helm Charter as the most committed Chartist republican, and appointing a CDL representative as the next speaker will go a long way to strengthen the bond between noble and commoner under the Charter."
 SKA_elven_support_announcement:0 "Elven Support Announcement"
 SKA_elven_support_announcement_desc:0 "The elves of Rthauiaur are allies of Skaelinger. So long as the Ordorian threat remains, they will receive unconditional military logistical support from our experienced craftsmen and administrators. Let this be the first step in a new chapter in Vergall-Elven relations."
 SKA_charter_modernization_attempts:0 "Charter Modernization Attempts"
 SKA_charter_modernization_attempts_desc:0 "Much to the chagrin of the traditionalists among the gentry, the Helm Charter has NEVER been a dead document. It is long past time we accepted this and updated the Charter to better grapple with modern dilemmas. No more intitutional prejudice against casteless. Property rights guaranteed for all social castes. Suffrage expanded and protected for all property owning men."
 SKA_lower_caste_education:0 "Education for the Lower Castes"
 SKA_lower_caste_education_desc:0 "Property rights are one thing, but amending the Charter to institutionalize education for lower castes will prove especially contentious. No matter. With the alliance established between Oberjarl and Chartist, We will expand the state education system to children of lower castes and open up universities of higher education to all adults."
 SKA_guarantee_for_support:0 "Guarantee for Support"
 SKA_guarantee_for_support_desc:0 "We will promise arms, volunteers, and supplies to our Vergall brothers should they come under threat from the sinister forces of the north. Ogre and Ork. Man and Elf. So long as the Vergall nations cover one another with a shield of solidarity, not a single one of them can break us!"
 SKA_peace_for_the_dwarfes:0 "Peace for the Dwarves"
 SKA_peace_for_the_dwarfes_desc:0 "The first cobblestone laid on the road to Vergall peace is the signing of non-aggression treaties with Rimatu and Bergial. Brother needs not fight against brother anymore. We were once one people. We can be again. If not under one banner, than at least under a shared understanding."
 SKA_mutual_defense_allegiance:0 "Mutual Defense Allegiance"
 SKA_mutual_defense_allegiance_desc:0 "The Vergall people share an interest in our mutual defense. To that end, we will forge a treaty between all Lathwynnian Dwarven nations that guarantees our independence against external threats."
 SKA_technological_military_agreement:0 "Technological Military Agreement"
 SKA_technological_military_agreement_desc:0 "Crucial to any budding alliance is the sharing of research, weapons, and equipment. Standardizing the material our armies march into battle with will be a massive step forward for Vergall military cooperation."
