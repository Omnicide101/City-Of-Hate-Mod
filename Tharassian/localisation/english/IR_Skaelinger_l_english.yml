l_english:
 #ideas
 SKA_food_imports:0 "Food Imports"
 SKA_food_imports_desc:0 "During Vergallheim, we became too reliant on food grown on the relatively flat lands that now belong to the Kurgur, and the Miner's Blight devastated what few agricultural products we could grow in the mountains, such as the Cattle Beetles. Thus we must import much food from the Union and uprooted ones in Bergialer"
 SKA_penal_levy:0 "The Penal Levy"
 SKA_penal_levy_desc:0 "Disease, bankruptcy, and a declining population have led Skaelinger to increasingly rely on prisoners for manual labor and filling the ranks of the army. High prices on housing and commercial taxes on basic goods to refill the state coffers means that many prisoners are nothing more than unfortunate debtors. The Guildists are outraged at the practice of the gentry using cheap prison labor over guild labor, and protest at the conscription law pulling bodies, and therefore representation, away from the guild lobby."
 SKA_memories_of_vergallheim:0 "Memories of the Vergallheim"
 SKA_memories_of_vergallheim_desc:0 "The old empire fell within living memory for many dwarfs. There is a great deal of nostalgia for the old times, but an even greater heaping of pessimism and regret. The dwarven people no longer trust their leaders and have become susceptible to ideas that would have been unthinkable in the recent past."
 SKA_destabilization_caste_system:0 "Destabilization of the Caste System"
 SKA_destabilization_caste_system_desc:0 "The dwarven caste system has its roots in the ancient dwarven slave states, but only became formalized by Imperial law. With the remnants of the imperial gentry having lost most of their lands to the orcs or secessionists, the caste system has become difficult to enforce and even more difficult to justify. Calls for reform or even abolition are ubiquitous in the Riksdag, but it will take a major political shift before decisive action can be taken."
 SKA_isolationism:0 "Isolationism"
 SKA_reforming_charter:0 "Reforming the Helm Charter"
 SKA_bicameral_legislature:0 "Bicameral Legislature"
 SKA_centralized_guild_federation:0 "Centralized Guild Structure"
