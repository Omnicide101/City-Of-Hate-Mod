 SKA_runesmithing_idea:0 "Runesmithing's Effects"
 SKA_runesmithing_idea_desc:0 "§WNow that we have begun runesmithing our weaponry and armor, it has caused changes in our equipment and some of our troops. It's effects currently are:\n§RAttack Bonus:[?SKA_runesmithing_attack_var]§!%\n§CDefence Bonus: [?SKA_runesmithing_defence_var]§!%\n§OBreakthrough Bonus: [?SKA_runesmithing_breakthrough_var]§!%\n§LIncrease in Attrition: [?SKA_runesmithing_attrition_var]§!%\n§GOrganization Bonus: [?SKA_runesmithing_org_var]§!%\n§HPlanning Speed Bonus: [?SKA_runesmithing_plan_var]§!%§!"
 republic_peasant_drift_idea:0 "Radical Riots"
 mohrokism_religion:0 "Soltruism"
 mohrokism_religion_desc:0 "The ancient dwarven god of the underworld, and patron deity to miners, steelworkers, and smiths. Symbols include the warhammer, the core, known as the true sun to dwarves, and bull horns. It is said that Mohrok was once a wandering spirit taking the form of a horned warrior, who challenged the best fighters of Tharassian's races to combat, and seized everything from the losers: homes, wives, kingdoms; it didn’t matter to Mohrok. This ended when he finally met his match against the dwarven champion Gungol. Determining the Dwarven race to be the strongest in the world, Mohrok pledged to be its eternal protector from his seat in the molten core of the world, where he grants the souls of the dwarven ancestors a resting place that their descendants can pray to for guidance. More than a warrior and a smith, Mohrok was a philosopher as well. Mohrok advocated a kratocratic socio-political philosophy dubbed ''the gauntlet of right.'' According to Mohrok, there is no such thing as a ''birthright'' to property, to power, or any other responsibility. Power and command belongs to those Dwarves who prove strongest and most able to wield it, regardless of their social class, caste, or ancestry. The potentially revolutionary insinuations of this philosophy, coupled with Mohrok’s association with the dangerous arcane art of rune-smithing, led the Empire to ban Mohrok worship and execute the leaders of its remaining cults. However, modern tensions around the caste system and political confusion after the fall of the empire has resulted in cells of Mohrok worshippers cropping up among soldiers, convicts, and casteless. The worship of Mohrok is primarily organized within the Legion of the Sun-Beneath-the-Stone, but some radical republicans have been known to favor him as well. Mohrok worship is strongest in Skaelinger and virtually unheard of outside it. Worship of Mohrok is called Soltruism, and his worshippers are known as Soltruists."
 mohrok_worship_bonuses:0 "Mohrok Worship"
