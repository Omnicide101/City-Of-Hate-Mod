l_english:
 #new focuses
 IRI_the_theresandrean_restoration:0 "The Theresandrean Restoration"
 IRI_the_theresandrean_restoration_desc:0 "Therseandros Chairophon has ambitious plans for reforming Irinthios, which will leave no part of the empire unseen and unreformed."
 IRI_finish_chairophons_reforms:0 "Finish Chairophon's Reforms"
 IRI_finish_chairophons_reforms_desc:0 "Wanting to ensure popular support, Chairophon has planned to reform the Senate so that the common folk have more representation, at the cost of the aristocracy."
 IRI_revive_the_kataphraktoi:0 "Revive the Kataphraktoi"
 IRI_revive_the_kataphraktoi_desc:0 "The Kataphraktoi used to be an elite division that helped protect the empire's strategic areas. They should be revived, so that our retaking of the regions occupied by monsters can go more easily"
 IRI_patronize_the_akadimia_filosofi:0 "Patronize the Akadimia Filosofi"
 IRI_patronize_the_akadimia_filosofi_desc:0 "The Akadimia Filosofi is home to many revolutionary philosophers, and it would be wise of us to sponsor them to help improve our research capabilities."
 IRI_welcome_the_merchants_back_into_the_fold:0 "Form the Irinthian Trade League"
 IRI_welcome_the_merchants_back_into_the_fold_desc:0 "A mercantile alliance with [MER.GetNameDef] would help strengthen the ties between us and our former cities. In time, it could even help lead to the re-incorporation of the free cities which left us centuries ago."
 IRI_lessons_of_the_refugee_metroples:0 "Lessons of the Refugee Metroples"
 IRI_lessons_of_the_refugee_metroples_desc:0 "After the collapse of the Irinthian Empire, many fled from the border regions to the developed cities, creating mass slums. We must learn our lesson so this will now happen again."
 IRI_final_urbanization_drive:0 "Final Urbanization Drive"
 IRI_final_urbanization_drive_desc:0 "We must make our cities the gleaming standard of Lathweyne, through rapid industrialization and development."
 IRI_accept_the_new_guilds:0 "Accept the New Guilds"
 IRI_accept_the_new_guilds_desc:0 "The Free Cities have several guilds that, after the formation of the Irinthian Trade League, wish to set up in Irinthios proper. We should allow this, so we can become even more economically advanced."
 IRI_irinthian_women:0 "Irinthian Women"
 IRI_irinthian_women_desc:0 "There are many intelligent women who have been neglected certain opportunities. We should allow them to take positions of power so that they may help guide Irinthios into a new golden age."
 IRI_review_the_army_problem:0 "Review the Army Problem"
 IRI_review_the_army_problem_desc:0 "Over the years, the military has become stagnate, and we must decide how to fix this problem."
 IRI_future_soliders:0 "Future Soldiers"
 IRI_future_soliders_desc:0 "In order to make sure the military does not stagnate again, we must bring in youth to help observe and aid the more experienced and older soldiers, though they will not take part in actual combat"
 IRI_revive_the_old_forums:0 "Revive the Old Forums"
 IRI_revive_the_old_forums_desc:0 "There used to be economic forums to decide the course of the nation every decade. We must revive these forums to ensure our prosperity, and economic dominance over the Free Cities."
 IRI_entice_foreign_merchants:0 "Entice Foreign Merchants"
 IRI_entice_foreign_merchants_desc:0 "We should try and make the Free Cities desperate to trade with us, and what better way than to inspire jealousy? By opening up trade links with more nations, we can make the Free Cities spend more to trade with us."
 IRI_protect_our_merchants:0 "Expand our Merchants' Markets"
 IRI_protect_our_merchants_desc:0 "By making sure most of our foreign products go to the Free Cities, we can ensure a monopoly on their trade and flood their market to make them indebted to us."
 IRI_review_mercantilism:0 "Review Mercantilism"
 IRI_review_mercantilism_desc:0 "After using mercantilism to economically subdue the Free Cities, we must decide how our economy should be organized afterwards, either continuing this trade-based system, or moving to a different one."
 IRI_the_budget_hole:0 "The Budget Hole"
 IRI_the_budget_hole_desc:0 ""
 IRI_public_projects:0 "Public Projects"
 IRI_public_projects_desc:0 "We must revitalize the cities and show our benevolence by creating parks and institutions that will benefit all of Irinthios."
 IRI_the_new_irinthian:0 "The New Irinthian"
 IRI_the_new_irinthian_desc:0 "We must make it so Irinthians are loyal and resourceful, able to face any threat, with the help of the state."
 IRI_the_irinthian_army:0 "The Irinthian Army"
 IRI_the_irinthian_army_desc:0 "This new army has been reformed and polished to a keen edge. It will cut through the toughest defenses, and bear the harshest sieges."
 IRI_the_empire_reborn:0 "The Empire Ready"
 IRI_the_empire_reborn_desc:0 "Now Chairophon's reforms are complete, and he can look outwards towards the reclamation of the Empire"
 IRI_to_the_army:0 "To The Army..."
 IRI_to_the_army_desc:0 ""
 IRI_a_hero:0 "A Hero"
 IRI_a_hero_desc:0 ""
 IRI_to_the_aristocracy:0 "To the Aristocracy..."
 IRI_to_the_aristocracy_desc:0 ""
 IRI_a_camerilla:0 "A Camarilla"
 IRI_a_camerilla_desc:0 ""
 IRI_to_the_people:0 "To The People..."
 IRI_to_the_people_desc:0 ""
 IRI_a_popular_king:0 "A Popular King"
 IRI_a_popular_king_desc:0 ""
 IRI_the_king_and_his_many_faces:0 "The King and His Many Faces"
 IRI_the_king_and_his_many_faces_desc:0 "A different face for each group, a united front with each face"
 IRI_land_of_mercenaries:0 "Land of the Mercenaries"
 IRI_land_of_mercenaries_desc:0 "We do not have the manpower to create a vast army necessary for reconquering our deserved land, we must acquire mercenaries in order to ensure our military domination."
 IRI_aggelos_ambition:0 "Aggelos' Ambitions"
 IRI_aggelos_ambition_desc:0 "The House of Cinyras was overthrown centuries ago, but perhaps, the time has come for it to rise up again, and lead Irinthios to greatness."
 IRI_slander_and_sophistry:0 "Slander and Sophistry"
 IRI_slander_and_sophistry_desc:0 "Chairophon has done his best to consolidate his control over Irinthios. The only way we can secure our path to victory is to slander him, and spread some less-than-savory stories about him. The truthfulness of these stories does not matter, only the results."
 IRI_mandate_of_the_moon:0 "Mandate of the Moon"
 IRI_mandate_of_the_moon_desc:0 "The House of Cinyras claimed the mandate of the moon, appointed by Selin themself as the rightful ruler of Irinthios. We must remind the people of this divine call."
 IRI_cloaks_and_daggers:0 "Cloaks and Daggers"
 IRI_cloaks_and_daggers_desc:0 "In order to ensure Aggelos' ascension to power, those loyal to Chairophon must be... disposed of."
 IRI_reach_out_to_old_friends:0 "Reach Out to Old Friends"
 IRI_reach_out_to_old_friends_desc:0 "Loyalty is stronger than deception, and by meeting those still loyal to the current Strategos of Tykinthos, Aggelos' ascension to power can be secured."
 IRI_gold_for_generals:0 "Gold For Generals"
 IRI_gold_for_generals_desc:0 "Even though its days of glory are long past, the House of Cinyras is still very rich. There are certain generals who can be bought to support his coup."
 IRI_propagate_the_common_soldiery:0 "Propagate the Common Soldiery"
 IRI_propagate_the_common_soldiery_desc:0 "As great as the glory of generals may be, it is the common soldiers who give them power. By empowering them, we can make sure of their loyalty, and Aggelos' acquisition of power."
 IRI_the_rightful_dynasty_returns:0 "The Rightful Dynasty Returns"
 IRI_the_rightful_dynasty_returns_desc:0 "The time has come, and all is right. Aggelos Cinyras will march into Tion with his supporters, and Irinthios will either be free of Chairophon, or torn apart by civil war."
 IRI_local_autonomy:0 "Local Autonomy"
 IRI_local_autonomy_desc:0 "Chairophon's centralization crushed centuries of autonomy for local rulers. It must be restored."
 IRI_remember_the_city_state_era:0 "Remember the City-State Era"
 IRI_remember_the_city_state_era_desc:0 "The City-State Era, though one of chaos, can be looked to for the glory of the individual leaders of their cities."
 IRI_merchant_hand_as_gold_standard:0 "[MER.GetName] as the Gold Standard"
 IRI_merchant_hand_as_gold_standard_desc:0 "The Free Cities of [MER.GetNameDef] are the gold standard when it comes to local autonomy. A trade league should be established so we can work more closely with them, which will hopefully lead to their re-integration into the Irinthian Empire."
 IRI_under_an_enlightened_guide:0 "Under an Enlightened Guide"
 IRI_under_an_enlightened_guide_desc:0 "Aggelos Cinyras has proved himself as the rightful leader of Irinthios, and the house of Cinyras will be disgraced no more"
 IRI_anti_ogre_propaganda:0 "Anti-Ogre Propaganda"
 IRI_anti_ogre_propaganda_desc:0 ""
 IRI_new_prime_orator:0 "A New Prime Orator"
 IRI_new_prime_orator_desc:0 "Kephalos Sosibios is a popular up-and-comer in the military, appealing to the nationalist and puritan side of politics. He was the one who suggested the mercenary military scheme, and this new popularity would give the government a boost in favor if he were a part of it."
 IRI_lessons_of_the_septist_wars:0 "Lessons of the Second Reclamation Wars"
 IRI_lessons_of_the_septist_wars_desc:0 "The Second Reclamation Wars were a series of internal conflict following the collapse of the Irinthian empire, with several city-states seceeding, before the Chairophon dynasty reunited Irinthios."
 IRI_tromoustories:0 "Tromoustories"
 IRI_tromoustories_desc:0 "Even with our loss of over half our territory, many are still hesitant to go to war with the monster races. Propaganda campaigns would help reverse this."
 IRI_expand_spending_on_army:0 "Expand Spending on the Army"
 IRI_expand_spending_on_army_desc:0 "Even with the increased amount of money pouring into the recruiting of mercenaries, more needs to be invested into the vehicle of our glory!"
 IRI_buy_weapons_trade_cities:0 "Buy Weapons From the Trade Cities"
 IRI_buy_weapons_trade_cities_desc:0 "We cannot produce enough weapons to arm all of our troops, but if we purchase them from [MER.GetNameDef], which seceeded so long ago, both of us will benefit. It might even lead to unification."
 IRI_smithy_every_neighborhood:0 "A Smithy in Every Neighborhood"
 IRI_smithy_every_neighborhood_desc:0 "We must be self-reliant if we are to restore the glory of our nation! No foreign weapons will be purchased."
 IRI_debase_currency:0 "Debase the Currency"
 IRI_debase_currency_desc:0 "We cannot afford to buy all these weapons and pay all these mercenaries with the gold reserves we currently have. But if we were to lessen the amount of gold in our coins, without anyone realizing... we could spend much more."
 IRI_reclamation_tax:0 "Reclamation Tax"
 IRI_reclamation_tax_desc:0 "In order to cover the rising costs of our armament program, we will need to extend a tax to those who can most afford it. This will be very unpopular among the nobles, however."
 IRI_prevent_nobles_from_fleeing:0 "Prevent Nobles From Fleeing"
 IRI_prevent_nobles_from_fleeing_desc:0 "After the institution of the Reclamation Tax, many nobles have fled rather than help fund the regaining of our glory. We must decide how to deal with this."
 IRI_replace_debtor_prisons_with_debtor_legions:0 "Replace Debtor Prisons with Debtor Legions"
 IRI_replace_debtor_prisons_with_debtor_legions_desc:0 "Imprisoning people who cannot afford their debts is foolish. They serve no purpose to the nation. We must remedy this by establishing legions specifically based around those who need to pay off their debts."
 IRI_sponsor_loan_sharks:0 "Sponsor Loan Fraud Agencies"
 IRI_sponsor_loan_sharks_desc:0 "We require more debtor legions, and what better way to do that than to invest into businesses based around giving people loans they cannot possibly afford to pay back?"
 IRI_buy_mercenary_contracts:0 "Buy More Mercenary Contracts"
 IRI_buy_mercenary_contracts_desc:0 ""
 IRI_facing_the_music:0 "Facing the Music"
 IRI_facing_the_music_desc:0 "Our debased currency has begun to become more of a problem than a benefit. We must deal with this quickly, before our economy collapses."
 IRI_revenge_for_embargo:0 "Liberate [MER.GetNameDef]"
 IRI_revenge_for_embargo_desc:0 "The people of [MER.GetNameDef] are crushed under the boot of the guilds, unable to trade with their homeland. We must free them from this tyranny, and reunite with them at last!"
 IRI_promise_lands_for_soldiers:0 "Promise Lands for Soldiers"
 IRI_promise_lands_for_soldiers_desc:0 "We require more soldiers, by promising more land for each soldier, based on the lands they helped conquer, we can help tempt more to join us."
 IRI_steadholder_act:0 "Steadholder Act"
 IRI_steadholder_act_desc:0 "In order to mitigate some of the demands the mercenaries have made for more lands, we will promise to protect their currently taken land and provide arms to them to defend themselves."
 IRI_invade_tlarthingia:0 "Invade Tlarthingia"
 IRI_invade_tlarthingia_desc:0 "A thorn in our side for almost a millennia, the lizards to our south helped spark the Saurid Revolt that caused the collapse of the rebellion. We must regain the territory lost to us three centuries ago, and perhaps rid ourselves of this threat once and for all..."
 IRI_the_south_regained:0 "The South Regained"
 IRI_the_south_regained_desc:0 "We have regained Cist and Putrun, and now the Saurid Revolt can finally be declared as over, after more than three centuries."
 IRI_integrate_lizardmen:0 "Integrate Lizardmen"
 IRI_integrate_lizardmen_desC:0 "In order to prevent another Saurid Revolt, we must at least try to incorporate the Lizardmen as Irinthian citizens, or else they will just revolt immediately."
 IRI_cleanse_the_swamps:0 "Cleanse the Swamps"
 IRI_cleanse_the_swamps_desc:0 "We trusted the Lizardmen before to be loyal to the empire, and look where that got us. The only way to secure our hold on our South is to cleanse it of all monsters."
 IRI_settler_missions:0 "Settler Missions"
 IRI_settler_missions_desc:0 "Now that the swamps have been cleared of the lizard menace, we can send in humans to settle the region and make it truly Irinthian."
 IRI_clear_jungle_for_farmland:0 "Clear Jungle for Farmland"
 IRI_clear_jungle_for_farmland_desc:0 "In order for our people to sustain themselves, we must clear out area for farmland and industry, or else it will just become another backwater."
 IRI_an_old_foe_vanquished:0 "An Old Foe Vanquished"
 IRI_an_old_foe_vanquished_desc:0 "Now the Kingdom of Tlarthingia is no more, and they can no longer pose a threat to us, as long as we prevent their uprising."
 IRI_welcome_tlarthingians:0 "The Search for Collaborators"
 IRI_welcome_tlarthingians_desc:0 "In order to secure our hold on Tlarthingia, we must appeal to some of the locals, who will form an important base of collaborators. There are two main movements who can either help or hinder us; the Royalists and the Republicans. We must choose which we will align with."
 IRI_exploit_north_south_divide:0 "Exploit the North-South Divide"
 IRI_exploit_north_south_divide_desc:0 "The swampy north and the flatland south of Tlarthingia are vastly different, in environment and in culture. Even after 300 years of occupation, it will still be easy to incorporate them."
 IRI_mobilize_occupation_force:0 "Mobilize the Occupation Force"
 IRI_mobilize_occupation_force_desc:0 "We must expand our occupation force in order to make sure the local Tlarthingians stay compliant."
 IRI_stabilize_the_occupation:0 "Stabilize the Occupation"
 IRI_stabilize_the_occupation_desc:0 "We cannot risk the outrage at home if we honor any promises to give the Tlarthingians power. We will simply continue the occupation indefinitely, until some time in the future where some other path is suitable."
 IRI_tlarthingian_crown:0 "Tlarthingian Crown"
 IRI_tlarthingian_crown_desc:0 "The Royalists of the Tlarthingians can be won over by promising them an autonomous kingdom within the Irinthian Empire, and we will give them this promise for the glory of our empire."
 IRI_lizardmen_senators:0 "Tlarthingian Senators"
 IRI_lizardmen_senators_desc:0 "An easy way to appeal to the Tlarthingians would be to promise them represenation in the Senate. Of course, the citizens of the Irinthian core will have greater representation, but the Tlarthingians don't need to know the fine details of their representatino."
 IRI_develop_southern_mines:0 "Develop the Southern Mines"
 IRI_develop_southern_mines_desc:0 "The southern regions of Tlarthingia have promising deposits for metals. We should exploit these resources further."
 IRI_lizard_removal_corps:0 "Lizard Removal Corps"
 IRI_lizard_removal_corps_desc:0 "In order to integrate former Tlarthingia into the empire, we must drive out the Tlarthingians and replace them with humans."
 IRI_reclaiming_burdvin:0 "Reclaim Burdvin"
 IRI_reclaiming_burdvin_desc:0 "Taken by the ogres after the collapse of the Irinthian Empire, Burdvin used to be a great city in the center of the steppes. Now it is just full of ogres. This must be fixed."
 IRI_ogre_integration:0 "Integrate the Ogres"
 IRI_ogre_integration_desc:0 "The ogres, while many think of them as savages, can be integrated into the empire as loyal citizens, though there are many who might be displeased by this."
 IRI_ogre_education:0 "Ogre Education"
 IRI_ogre_education_desc:0 "In order to become true citizens of Irinthios, the ogres must be educated."
 IRI_ogres_in_parliament:0 "Ogres in the Senate"
 IRI_ogres_in_parliament_desc:0 "While the possibility of ogres being Senators has been the boogeyman of the more conservative and puritan-aligned senators, with the current protests going on from ogres, and in order to make them true citizens, the ogres must be allowed to vote for their own Senators."
 IRI_valuable_resource:0 "A Valuable Resource"
 IRI_valuable_resource_desc:0 "The Ogres can be of great use to us, but due to their limited numbers, we can only use them so much."
 IRI_brute_troops:0 "Brute Troops"
 IRI_brute_troops_desc:0 "There are some ogres who are eager to fight, no matter who their commander is. We should exploit this by recruiting ogres into our armies, and make use of their vast size."
 IRI_recolonize_the_land:0 "Recolonize the Land"
 IRI_recolonize_the_land_desc:0 "Bilodya was once settled by many humans, until the collapse of the empire caused many to flee to the Irinthian Core. Then the Ogres moved in. We must reclaim this land from the ogres by sponsoring settlement missions."
 IRI_brute_labor:0 "Brute Labor"
 IRI_brute_labor_desc:0 "The ogres are strong, and would be a great source of manual labor."
 IRI_crush_raiding_gatherings:0 "Crush the Remaining Gatherings"
 IRI_crush_raiding_gatherings_desc:0 "Now our grip on Bilodya is secured, and we can ring the death knell of the Bilodyan resistance, by attacking and enslaving all Gatherings who remain."
 IRI_rebuilding_burdvin:0 "Rebuild Burdvin"
 IRI_rebuilding_burdvin_desc:0 "Now that the metropolis of Bilodya is under our control once again, we can repair the damage done to it by the ogres over the years, and build it into a great city once again."
 IRI_military_governor_of_bilodya:0 "Appoint a Military Governor for Bilodya"
 IRI_military_governor_of_bilodya_desc:0 "In order to pacify Bilodya, we must appoint a military governor, whose task will be to crush the gatherings and restore order in Bilodya."
 IRI_civilian_governor_of_bilodya:0 "Appoint a Civilian Governor for Bilodya"
 IRI_civilian_governor_of_bilodya_desc:0 "The Ogres are no longer a threat, and Bilodya has been reclaimed by the brave colonists. We must appoint a governor in order to further exploit the wealth of this neglected territory."
 IRI_explore_southern_frontier:0 "Explore the New Southern Frontier"
 IRI_explore_southern_frontier_desc:0 "Now our southern border expands farther south than it ever has. We must explore these regions and discover their wealth, as well as quell the Tlarthingian menace in its heartlands"
 IRI_second_class_citizens:0 "A Second Class of Citizens"
 IRI_second_class_citizens_desc:0 "Tlarthingians are not humans, they are not capable of being true citizens of the empire."
 IRI_lizard_nobles:0 "Recognize Saurid Nobles' Titles"
 IRI_lizard_nobles_desc:0 "An easy way to pacify the Tlarthingian resistance would be to recognize the titles of the nobility who live in the swamplands, and extend protection to their property."
 IRI_tlarthingian_senators:0 "The Jungle Representation Act"
 IRI_tlarthingian_senators_desc:0 "Even though we have recognized their lands and titles, the Saurid nobles push for representation in the government, as all human nobles are entitled to. We should grant this, as an easy way to ensure their loyalty."
 IRI_lizardmen_conscription:0 "Conscript the Lizardmen"
 IRI_lizardmen_conscription_desc:0 "Perhaps the Lizardmen can be encouraged to foster a sense of Irinthian patriotism if they are closely tied into our military, though initially, the conscription will be unpopular."
 IRI_ensure_noble_domination:0 "Ensure Aristocratic Domination"
 IRI_ensure_noble_domination_desc:0 "Chairophon's centralization left him with absolute power. We do not want more of his kind of tyranny. But we also do not want the common rabble to take power. Only the aristocrats, from long-founded noble houses, can be trusted with power."
 IRI_replace_chairophon_loyalists:0 "Replace Chairophon Loyalists"
 IRI_replace_chairophon_loyalists_desc:0 "There are still some who are loyal to Chairophon. They must be replaced, before they cause trouble within our new Irinthios."
 IRI_end_the_tragodia_ton_tioniton:0 "End the Tragodía ton Tionitón"
 IRI_end_the_tragodia_ton_tioniton_desc:0 "An annual tradition since the collapse of the Irinthian Empire, the Tragodía ton Tionitón follows the fall of the Irinthian empire, and the House of Cinyras' desperate attempts to save it, even though they are doomed to failure."
 IRI_legitimize_the_comedy:0 "Legitimize the Comedy"
 IRI_legitimize_the_comedy_desc:0 ""
 IRI_embrace_the_satyrics:0 "Embrace the Satyrics"
 IRI_embrace_the_satyrics_desc:0 ""
 IRI_amphoras_for_actor_and_audience:0 "Amphoras for Actor and Audience"
 IRI_amphoras_for_actor_and_audience_desc:0 ""
 IRI_create_the_doxic_drama:0 "Create the Doxic Drama"
 IRI_create_the_doxic_drama_desc:0 "The Dóxa is a popular form of theatre that is focused on drama and glory. It can be used to increase public opinion of [IRI.GetLeader]"
 IRI_soldiers_plays:0 "Solder's Plays"
 IRI_soldiers_plays_desc:0 "Soldier morale can be improved by sponsoring plays that will be preformed for them, and perhaps by them, while they are not in combat."
 IRI_pardon_asteia:0 "Pardon Asteia"
 IRI_pardon_asteia_desc:0 "Asteia Rinoloasc was a popular comedy author, making plays that mocked the aristocracy. But she was exiled. The time has come for her exile to be lifted, to help improve our theatre."
 IRI_a_reinvigorated_academy_of_theatre:0 "A Reinvigorated Acadamy of Theatre"
 IRI_a_reinvigorated_academy_of_theatre_desc:0 ""
 IRI_abolish_mercenary_towns:0 "Abolish the Mercenary Towns"
 IRI_abolish_mercenary_towns_desc:0 "Over the centuries, with the vast amount of crowns the House of Chairophon has spent on the mercenaries, they have established their own communities and towns, and hold much power in the nation. But no more! These mercenaries must be replaced by a truly Irinthian military, and costs must be cut."
 IRI_develop_the_new_frontiers:0 "Develop the New Frontier"
 IRI_develop_the_new_frontiers_desc:0 "The industrial and wealth imbalance between core Irinthios and our regained territories are vast, and we must try and rectify this by investing further into these new territories."
 IRI_never_another_monster_threat:0 "Never Another Monster Threat"
 IRI_never_another_monster_threat_desc:0 ""
 IRI_hunt_the_hunters:0 "Hunt the Hunters"
 IRI_hunt_the_hunters_desc:0 ""
 IRI_the_last_monsters:0 "The Last Monsters"
 IRI_the_last_monsters_desc:0 "The Kurgur are the last realm of monsters, and thus pose a threat to us, as well as all other humans. We must slay them, before they can slay us."
 IRI_sponsor_privateers:0 "Sponsor Privateers"
 IRI_sponsor_privateers_desc:0 "As strong as our ship-building industry is, it wouldn't hurt to hire some privateers to better harass our opponents."
 IRI_administration_problem:0 "Solving the Administrative Issue"
 IRI_administration_problem_desc:0 "Due to the rapid expansion of Irinthios from reclaiming our empire, our bureaucracy is struggling to keep up. We must solve this issue."
 IRI_empower_local_administrators:0 "Empower Local Administrators"
 IRI_empower_local_administrators_desc:0 "Instead of putting more resources into Tion, we should decentralize our bureaucracy, so that it can more easily deal with local issues"
 IRI_expand_core_bureaucracy:0 "Expand Irinthian Bureaucracy"
 IRI_expand_core_bureaucracy_desc:0 "In order to deal with this administrative issue, we must expand the Irinthian Core as a concept, and bureaucratic division, so that we can deal with Bilodya and Cist with our administration."
 IRI_city_garrison_initiative:0 "City Watch Initiative"
 IRI_city_garrison_initiative_desc:0 "By expanding our investment into the local bureaucracy and their management of issues by creating their own law enforcement divisions, we can further focus on the greater picture."
 IRI_tlarthingian_joint_administration_appointment:0 "Joint Administration in Tlarthingia"
 IRI_tlarthingian_joint_administration_appointment_desc:0 "By working together with Tlarthingians to appoint administrators, requiring both parties to approve, we can help promote compromise and stability."
 IRI_expand_irinthian_administration_in_tlarthingia:0 "Direct Administration in Tlarthingia"
 IRI_expand_irinthian_administration_in_tlarthingia_desc:0 "We cannot trust the Tlarthingians to stay loyal if we give them autonomy. We must appoint our own administrators, even if it upsets them."
 IRI_nepotistic_tradition:0 "Nepotistic Tradition"
 IRI_nepotistic_tradition_desc:0 ""
 IRI_finish_new_population_survey:0 "Finish the New Population Survey"
 IRI_finish_new_population_survey_desc:0 "In order to completely curb our overextension, we must know exactly how many citizens we have, where they are, and who they are."
 IRI_crushing_the_terrorists:0 "Crushing Dissenters"
 IRI_crushing_the_terrorists_desc:0 ""
 IRI_elimination_via_infiltration:0 "Elimination via Infiltration"
 IRI_elimination_via_infiltration_desc:0 "In order to absolutely crush the dissenters, we must infiltrate their movement, either via agents or bribery."
 IRI_return_the_favor:0 "Return the Favor"
 IRI_return_the_favor_desc:0 "If these dissenters are going to hurt our people and attack our industry, we will return the favor, and burn their homes to the ground."
 IRI_a_pacified_nation:0 "A Pacified Nation"
 IRI_a_pacified_nation_desc:0 ""
 IRI_an_empire_for_all_races:0 "An Empire for All Races"
 IRI_an_empire_for_all_races_desc:0 "We must prove the sustainability of a pluralistic state, by managing the non-humans in our empire to ensure loyalty and cohesion."
 IRI_break_up_racial_parties:0 "Break Up Racial Parties"
 IRI_break_up_racial_parties_desc:0 "If we allow parties to organize around the races, we just invite a new kind of segregationism, where the parties all oppose each other on pseudo-racist grounds. This must be prevented, to ensure a cohesive senate."
 IRI_non_interference_in_party_formation:0 "Non-Interference in Party Formation"
 IRI_non_interference_in_party_formation_desc:0 "If we were to come down on the racial parties, then some major Ogre and Tlarthingian senators might take offense, viewing it as a violation of the power we have given them."
 IRI_meet_with_racial_party_leaders:0 "Meet with Racial Party Leaders"
 IRI_meet_with_racial_party_leaders_desc:0 "In order to ensure stability, we must meet with the leaders of the racial parties, and win over their support."
 IRI_the_great_senatorial_realignment:0 "The Great Senatorial Realignment"
 IRI_the_great_senatorial_realignment_desc:0 "By crushing racial parties, we can allow the senate to grow truly diverse and align with manageable parties."
 IRI_enforce_minority_protections:0 "Enforce Minority Protections"
 IRI_enforce_minority_protections_desc:0 "There has been a long history of exploitation of the Tlarthingians and the Ogres by the Irinthians. By enforcing protections of their races, we can prevent this from ever happening again."
 IRI_universal_conscription:0 "Universal Conscription"
 IRI_universal_conscription_desc:0 "To try and combat any self-imposed segregation in the army that might cause conflict, we shall conscript equally from all races, and mix units of different races together, to create bonds that go past race."
 IRI_create_the_ethnobattalions:0 "Create the Ethnobattalions"
 IRI_create_the_ethnobattalions_desc:0 "Units composed of the same race are proven to work better together. So we shall create special divisions for our military that are all Ogre, Human, or Tlarthingian."
 IRI_start_mending_tlarthingian_ties:0 "Try to Mend Ties with the Tlarthingians"
 IRI_start_mending_tlarthingian_ties_desc:0 "If we want to maintain peace between ourselves and the Tlarthingians, we must try to soothe their fears that their Saurid brothers are being oppressed, and re-establish diplomatic ties."
 IRI_denounce_puritanism:0 "Denounce Puritanism"
 IRI_denounce_puritanism_desc:0 "We must become a bastion against puritanism, and prepare to protect the rights of all races in our borders."
 IRI_emperor_of_all_ogres_and_tlarthingians:0 "Crowned Emperor of All Ogres and Tlarthingians"
 IRI_emperor_of_all_ogres_and_tlarthingians_desc:0 "Now that we have established an empire that can exist in unity between the three races, we must ensure the support of the Ogres and Tlarthingians by proclaiming [IRI.GetLeader] as the Emperor of these two races."
 IRI_balance_the_racial_disparity:0 "Balance the Bi-Racial Empire"
 IRI_balance_the_racial_disparity_desc:0 "To ensure that our empire stays balanced, we must empower those that will stand with us as equals."
 IRI_expand_colonization_beyond_humans:0 "Expand Colonization Efforts Beyond Humans"
 IRI_expand_colonization_beyond_humans_desc:0 "Humans cannot manage or take up the entirety of our empire, we should help spread non-humans across the lands we have cleansed of vermin."
 IRI_new_nonhuman_administrators:0 "New Non-Human Administrators"
 IRI_new_nonhuman_administrators_desc:0 "We need to make sure our territory can be effectively administrated, by spreading the responsibility beyond just humans."
 IRI_hire_ogre_enforcers:0 "Hire Ogre Enforcers"
 IRI_hire_ogre_enforcers_desc:0 "To enforce our will, Ogre brute squads should be hired to deal with dissidents"
 IRI_hire_tlarthingian_slave_hunters:0 "Hire Tlarthingian Slave Hunters"
 IRI_hire_tlarthingian_slave_hunters_desc:0 "Tlarthingian hunters' abilities are well known across eastern Lathweyne. They should be hired to help hunt down escaped ogre slaves."
 IRI_invest_into_ogre_craftsmen:0 "Invest into Ogre Craftsmen"
 IRI_invest_into_ogre_craftsmen_desc:0 "In spite of a lack of industry, ogres have proved to be a very industrious race. We should help them establish businesses and spread into the guilds in Irinthios proper."
 IRI_reward_loyal_senators:0 "Reward Loyal Senators"
 IRI_reward_loyal_senators_desc:0 "Loyalty should be appreciated, so senators that support [IRI.GetLeader] will be rewarded with extensive lands to use as they see fit."
 IRI_offer_tla_nobles_bilodyan_hunting_grounds:0 "Hunting Grounds for Saurid Nobles"
 IRI_offer_tla_nobles_bilodyan_hunting_grounds_desc:0 "The Saurid nobles are well known for their hunting prowess. Perhaps by granting them hunting grounds in Bilodya, we can help ensure their loyalty."
 IRI_ensure_separateness:0 "Ensure Separateness"
 IRI_ensure_separateness_desc:0 "The differences between the races are too great, and we must try to keep stability by allowing each race to keep to itself, guided by [IRI.GetLeader]."
 IRI_tla_slave_labor:0 "Tlarthingian Slave Labor"
 IRI_tla_slave_labor_desc:0 "We should exploit the new source of labor that the Tlarthingians present, to create a greater and more profitable empire."
 IRI_human_supremacy:0 "Human Supremacy"
 IRI_human_supremacy_desc:0 "The only way we can ensure the protection of humankind in Lathweyne is through the relentless preparations of the nation to protect humanity at the cost of all other races. They will learn to bow to our rightful might, or be exterminated."
 IRI_use_imperialist_paramilitaries:0 "Use the Imperialist Paramilitaries"
 IRI_use_imperialist_paramilitaries_desc:0 ""
 IRI_ensure_human_protections:0 "Ensure Protections for Humans"
 IRI_ensure_human_protections_desc:0 "We cannot allow any monster race to be prioritized over humans, and we must protect against monster riots by increasing guard patrols and hunter parties."
 IRI_use_monster_slavery:0 "Use the Monsters for Slaves"
 IRI_use_monster_slavery_desc:0 "The monsters, in spite of their disgusting nature, do have uses, such as working in the mines and lumberyards of our empire."
 IRI_shut_down_trade_with_nonhumans:0 "Shut Down Trade with Non-Humans"
 IRI_shut_down_trade_with_nonhumans_desc:0 ""
 IRI_attack_pro_monster_activists:0 "Attack Pro-Monster Activists"
 IRI_attack_pro_monster_activists_desc:0 ""
 IRI_establish_ties_with_crime:0 "Establish Ties with the Night Tenders"
 IRI_establish_ties_with_crime_desc:0 "One of the most influential organized crime syndicates, the Night Tenders run most brothels and bars in Irinthios. If we ally with them, perhaps they can help smooth operations for us."
 IRI_pure_golden_age:0 "A Pure, Golden Age"
 IRI_pure_golden_age_desc:0 ""
 IRI_pseudo_autarky:0 "Pseudo-Autarky"
 IRI_pseudo_autarky_desc:0 ""
 IRI_economy_ready_for_total_war:0 "An Economy Ready for Total War"
 IRI_economy_ready_for_total_war_desc:0 ""
 IRI_invest_in_moving_arts:0 "Invest in the Moving Arts"
 IRI_invest_in_moving_arts_desc:0 "Now that we have entered a golden age, we must sponsor the arts and intellectuals that can help promote our golden age"
 IRI_corruption_based_economy:0 "A Corruption-Based Economy"
 IRI_corruption_based_economy_desc:0 ""
 #failure tree
 IRI_the_treaty_of_the_hand:0 "The Question of the Treaties"
 IRI_the_treaty_of_the_hand_desc:0 "There is much division on whether to abide by the treaties inflicted on us by the Tlarthingians."
 IRI_paying_off_debt:0 "Begin the War Reparation Payments"
 IRI_paying_off_debt_desc:0 "In order for our economy to recover, we must pay off the debts put on us by the Tlarthingians."
 IRI_speed_up_payments:0 "Speed Up the Payments"
 IRI_speed_up_payments_desc:0 "We must focus all our finances on paying off the debts, even if it causes instability and heavily burdens our economy for now."
 IRI_evading_the_treaties:0 "Undermine the Treaties"
 IRI_evading_the_treaties_desc:0 "These treaties are too cruel to be respected, we must try to find ways around them."
 IRI_slow_down_payments:0 "Slow Down the Reparations"
 IRI_veteran_sporting_clubs:0 "Sponsor Veteran Sporting Clubs"
 IRI_veteran_sporting_clubs_desc:0 "By establishing 'clubs' for veterans to hang out in, we can surrepticiously arrange practice drills and arm them."
 IRI_ask_for_rescind_treaty:0 "Ask for the Rescission of the Treaty of the Hand"
 IRI_ask_for_rescind_treaty_desc:0 "Now that we have paid off the war reparations, now we can ask [TLA.GetLeader] for the Treaty of the Hand to be declared null and void."
 IRI_reject_the_treaties:0 "Reject the Treaties"
 IRI_reject_the_treaties_desc:0 "Now that we have strengthened our forces, we can reject the treaties, and not fear Tlarthingia's forces if they decide to try and crush us again."
 IRI_merchant_general_thaurun:0 "Merchant-General Tenancian's Coup"
 IRI_merchant_general_thaurun_desc:0 "One of the most well-known generals and advocates for the usage of mercenaries, Perthecles Tenancian has been frustrated by the failure of the government and the lack of pay for the mercenaries under his command. In order to prevent civil strife, he believes that only seizing control can stabilize the nation."
 IRI_apply_for_loans:0 "Apply for Loans from the Hand"
 IRI_apply_for_loans_desc:0 "With our new ties with [MER.GetNameDef], we can ask them for some loans to help us pay off the Tlarthingian war reparations."
 IRI_new_mercantile_ties:0 "New Mercantile Ties"
 IRI_new_mercantile_ties_desc:0 "We should pursue closer ties with [MER.GetNameDef], so that we can both economically benefit from the resulting trade league."
 IRI_establish_work_corps:0 "Establish Work Corps"
 IRI_establish_work_corps_desc:0 "To prevent further unrest from the military and the unemployed, work corps should be established that will employ them to help rebuild our nation."
 IRI_use_military_funds_for_people:0 "Use Military Funds for the Public"
 IRI_use_military_funds_for_people_desc:0 "After paying back the mercenaries the previous administration hired, to prevent a popular uprising, we must redirect our focus from the military to the people to tend to their needs."
 IRI_extol_on_irinthian_unity:0 "Extol Irinthian Unity"
 IRI_extol_on_irinthian_unity_desc:0 "The Hand is Irinthian, and we must remind [MER.GetNameDef] of that, and how we should be united as one once more, for the good of all."
 IRI_take_the_hands_model:0 "Take the Hand's Model"
 IRI_take_the_hands_model_desc:0 "The time has come to fully embrace our inspirations from the Merchant's Hand, and become a republic as Tenancian steps down from power."
 IRI_a_new_mandate_of_moon:0 "Claim the Mandate of the Moon"
 IRI_a_new_mandate_of_moon_desc:0 "Taking advantage of his noble heritage, Tenancian has decided that he wishes to become the Irinthian emperor by claiming the Mandate of the Moon. While not unprecedented, this will cause instability until Tenancian's rule can be secured and he proves himself."
 IRI_night_dark_cloaks:0 "A Night of Dark Cloaks"
 IRI_night_dark_cloaks_desc:0 "Now that we have seized power from the House of Chairophon, we must secure our hold on power, by ridding the senate and Tion of any sympathizers who may band against us."
 IRI_preventing_repeat_of_failed_reclamation:0 "Prevent a Repeat of the Failed Reclamation"
 IRI_preventing_repeat_of_failed_reclamation_desc:0 "House Cinyras was overthrown when they failed to reclaim Bilodya after the ogres moved in. This cannot be allowed to reoccur, by securing our grasp on Bilodya."
 IRI_concessions_to_autonomous_movements:0 "Concessions to the Autonomous Movements"
 IRI_concessions_to_autonomous_movements_desc:0 "There have been separatist sentiments growing throughout the empire following its failure to reclaim Tlarthingia. We must give some concessions in order to help stabilize the nation and prevent actual secession from occurring."
 IRI_rearrange_senate_for_nobles:0 "Rearrange the Senate for Nobles"
 IRI_rearrange_senate_for_nobles_desc:0 "To secure our power, we must make sure the nobles who run the nation are willing to rule with us, by giving them greater power in the Senate over any other class."
 IRI_conference_of_cyttra:0 "The Conference of Cyttra"
 IRI_conference_of_cyttra_desc:0 "In order to ensure that we can pay the debts leveraged on us by Tlarthingia, we must cut costs. And what better way to do this than by trimming down the imperial responsibilities and handing them off to the cities?"
 IRI_reward_nobles_with_further_military:0 "Reward Nobles with Military Positions"
 IRI_reward_nobles_with_further_military_desc:0 ""
 IRI_noble_militant_autonomy:0 "Allow Aristocratic Armies"
 IRI_noble_militant_autonomy_desc:0 "While the Treaty of the Hand requires the Irinthian Empire to have a much smaller military, it does not restrict private militaries. By encouraging nobles to create their own militias, we can partially bypass the treaties."
 IRI_cinyras_return:0 "[GetCinyrasReturnText]"
 IRI_cinyras_return_desc:0 "[GetCinyrasReturnDesc]"
 IRI_cinyras_holding_on:0 "Grasping to Power"
 IRI_cinyras_holding_on_desc:0 "Following the failure to invade Tlarthingia, Aggelos' hold on power is dwindling more day by day, and he may get overthrown as he overthrew Therseandros if he cannot secure power again."
 IRI_cinyrasreturn:0 "Cinyras' Return"
 IRI_cinyrasreturn_desc:0 "Following a failure similar to the one that led to the overthrow of the House of Cinyras by the House of Chairophon, Aggelos Cinyras is eager to return the centuries-old favor..."
 IRI_reconciliation_initiative:0 "Reconciliation Initiative"
 IRI_reconciliation_initiative_desc:0 ""
 IRI_sosibos_revanchism:0 "Sosibios' Scheming"
 IRI_sosibos_revanchism_desc:0 "The failures of the monarchy are obvious to all those who strive for glory, and now Kephalos Sosibios is the only hope for military glory."
 IRI_spread_distrust_of_senators:0 "Speak Against the Senators"
 IRI_spread_distrust_of_senators_desc:0 "Obviously the reason that the grand Irinthian Empire lost to some pathetic lizards is because of the self-centered scheming of the Senators, who betrayed the nation to save their skins. We must let all the nation know of these traitors and what they deserve."
 IRI_claim_responsibility_for_victories:0 "Claim Responsibility for Military Victories"
 IRI_claim_responsibility_for_victories_desc:0 "Even though we were defeated, our army still fought valiantly against the Tlarthingians. And of course, Sosibios, as one of the leading officers, is responsible for these exploits, more than any other officer."
 IRI_paralyze_the_opposition:0 "Paralyze the Opposition"
 IRI_paralyze_the_opposition_desc:0 "There are many who wish to oppose us. We will use the paramilitary groups loyal to us to terrorize and weaken them. All will bow to Sosibios' will."
 IRI_end_of_the_emperor:0 "The End of the Emperor"
 IRI_end_of_the_emperor_desc:0 "The Emperor cannot be worked with, he is but a traitor to the nation, and he must be removed from power."
 IRI_demand_oratorship:0 "Demand the Prime Oratorship"
 IRI_demand_oratorship_desc:0 "With the growing Imperialist movement, the Emperor may be amendable to Sosibios' demands to become the Prime Orator, to guide the Senate and nation to a glorious rebirth."
 IRI_appoint_imperialist_senators:0 "Appoint Imperialist Senators"
 IRI_appoint_imperialist_senators_desc:0 "The only way to be sure that the Senate will follow Sosibios' will is for senators that align with him to be appointed."
 IRI_abolish_senate:0 "Abolish the Senate"
 IRI_abolish_senate_desc:0 "The Senate is naught but a den of corruption and decadence. The only way to improve it is to completely rid ourselves of it."
 IRI_propagate_more_mercenaries:0 "Become a Beacon for Mercenaries"
 IRI_propagate_more_mercenaries_desc:0 "To further avoid the restrictions of the Treaty of the Hand, we should expand the hiring of mercenaries to help supplement our army."
 IRI_lizard_extermination:0 "The Need for Extermination"
 IRI_lizard_extermination_desc:0 "We must seek vengeance, and destroy the Tlarthingians, as a people and a nation!"
 IRI_chairophon_consolidation:0 "Chairophon's Consolidation Efforts"
 IRI_chairophon_consolidation_desc:0 "In order to ensure his rule, Chairophon will have to change his strategy from focusing on reforms to the people to the other interest groups in Irinthios."
 IRI_empower_the_strategoi:0 "Empower the Officer Corps"
 IRI_empower_the_strategoi_desc:0 "More military figures must be involved in the management of the empire, in order to ensure that it is always ready for conflict."
 IRI_form_council_of_cities:0 "Form the Council of Cities"
 IRI_form_council_of_cities_desc:0 "To keep things stable in this new, crushed, Irinthios, we must work more with the Heads of the City Houses, instead of crushing their autonomy in the name of centralization."
 IRI_reconcile_with_nobles:0 "Reconcile with Nobles"
 IRI_reconcile_with_nobles_desc:0 "In the centralization efforts of Chairophon in the past years, heads have been butted with the various nobles and Houses of the cities. By rescinding some of these centralization efforts, we can win the loyalty of the nobles."
 IRI_decentralized_command_structure:0 "Decentralized Command Structure"
 IRI_decentralized_command_structure_desc:0 "Chairophon's micro-management of the generals caused the military to become less efficient than it could have been. To avoid this, each Strategos will get near-supreme authority of all troops in their regions."
 IRI_dual_strategoi_system:0 "The Dual Strategoi System"
 IRI_dual_strategoi_system_desc:0 "To ensure the various Strategoi's loyalty to Tion, Chairophon will appoint a new set of Strategoi to work with the old, aristocratic family Strategoi. He hopes this will allow himself to more directly control the Strategoi, though it will also ruffle feathers."
 IRI_develop_military_frontier:0 "Develop the Military Frontier"
 IRI_develop_military_frontier_desc:0 "Even from our loss to the Tlarthingians, we cannot let our new border with the ravenous Kurgur become weakened. We must develop the lands of Bilodya so that they can be defended."
 IRI_professionalized_military_focus:0 "Professionalized Military Focus"
 IRI_professionalized_military_focus_desc:0 ""
 IRI_the_pronouncement_of_emergency_powers:0 "The Pronouncement of Emergency Powers"
 IRI_the_pronouncement_of_emergency_powers_desc:0 ""
 IRI_city_based_economy:0 "City-Based Economy"
 IRI_city_based_economy_desc:0 "To further the decentralization efforts of Irinthios, the economy should transform to resemble the city-state era of old, where the economy is made up of many cities instead of one large monolith."
 #new decisions
 IRI_chairophon_faction_management_category:0 "Managing Irinthios' Interest Groups"
 IRI_chairophon_faction_management_category_desc:0 "Irinthios' political scene is very diverse, containing people of many different views. If we are to maintain stability and maximize the glory of our nation, we must make sure to court these groups effectively.\n\nAristocrat Approval: [?IRI_aristocrat_approval_var_display]\n\nMilitary Approval: [?IRI_army_approval_var_display]\n\nThe People's Approval: [?IRI_people_approval_var_display]\n\nThe Guilds' Approval: [?IRI_guild_approval_var_display]"
 IRI_faction_management_category:0 "Managing Irinthios' Interest Groups"
 IRI_faction_management_category_desc:0 "Irinthios' political scene is very diverse, containing people of many different views. If we are to maintain stability and maximize the glory of our nation, we must make sure to court these groups effectively.\n\nAristocrat Approval: [?IRI_aristocrat_approval_var_display]\n\nMilitary Approval: [?IRI_army_approval_var_display]\n\nThe People's Approval: [?IRI_people_approval_var_display]"
 IRI_faction_modifier:0 "Irinthian Interest Groups"
 IRI_faction_modifier_desc:0 "The Interest Groups of Irinthios hold much sway over its politics and stability"
 IRI_faction_modifier_guild:0 "Irinthian Interest Groups"
 IRI_faction_modifier_guild_desc:0 "The Interest Groups of Irinthios hold much sway over its politics and stability"
 IRI_cinyras_appeal_common_soldiery:0 "Meet With the Common Soldiery"
 IRI_cinyras_meet_old_friends:0 "Meet Up With Old Friends"
 IRI_cinyras_promote_mandate_of_moon:0 "Promote the Mandate of the Moon"
 IRI_sway_aristocrats:0 "Sway the Aristocrats"
 IRI_sway_army:0 "Sway the Army"
 IRI_sway_populace:0 "Sway the Populace"
 IRI_sway_guilds_chairophon:0 "Sway the Guilds"
 IRI_aggelos_scheming:0 "Aggelos' Scheming"
 IRI_aggelos_scheming_desc:0 "In order to peacefully sieze the country, the Cinyras must take care of anyone who will get in their way in the palace.\nBut, if worst comes to worst, a civil war between the Strategoi loyal to either side will occur.\n\nCurrently, our chance of success is [?IRI_cinyras_coup_chance]%\nOur chance of being discovered is [?IRI_chance_of_discovery]%\n\n[GetTionStrategosLoyalty]\n[GetTykinthosStrategosLoyalty]\n[GetCaiStrategosLoyalty]\n[GetSasnaiStrategosLoyalty]\n[GetTofnosStrategosLoyalty]\n[GetCyttraStrategosLoyalty]\n[GetMarakaiStrategosLoyalty]\n[GetTikynthaiosStrategosLoyalty]"
 IRI_aggelos_swaying_tion_strategos:0 "Swaying the Strategos of Tion"
 IRI_aggelos_swaying_tykinthos_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_tikynthaios_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_marakai_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_cyttra_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_tofnos_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_sasnai_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_swaying_cai_strategos:0 "Swaying the Strategos of [FROM.GetName]"
 IRI_aggelos_deal_with_palace_guard:0 "Deal with the Head Palace Guard"
 IRI_aggelos_spymaster_mission:0 "The Spymaster's Investigations"
 IRI_aggelos_scout_for_secret_passages_tion:0 "Scout for Secret Passages around the Palace"
 IRI_aggelos_persuade_minor_nobles_to_plot:0 "Persuade Minor Nobles to Join the Plot"
 IRI_aggelos_deal_with_chairophon_spymaster:0 "Deal with Chairophon's Spymaster"
 IRI_recolonization_of_bilodya:0 "Recolonization of Bilodya"
 IRI_recolonization_of_bilodya_desc:0 "Bilodya, after the abandonment of the Irinthians of old, was occupied by the ogres. Now that we have conquered their lands, we can correct the mistakes of our ancestors, by thoroughly recolonizing Bilodya."
 IRI_recolonize_bilodya_targeted_decision:0 "Recolonize [FROM.GetName]"
 IRI_buying_from_trade_cities:0 "Trading with the Merchant's Hand"
 IRI_buying_from_trade_cities_desc:0 "The trade cities that used to be part of the Irinthian Empire are rich, and it would be best to capitalize on what we can purchase from them, at least until their inevitable re-incorporation."
 IRI_buy_swords_trade_cities:0 "Purchase Swords"
 IRI_buy_bows_trade_cities:0 "Purchase Bows"
 IRI_buy_wood_trade_cities:0 "Purchase Lumber"
 IRI_buy_steel_trade_cities:0 "Purchase Steel"
 IRI_mercenaries_category:0 "Irinthian Mercenaries"
 IRI_mercenaries_category_desc:0 "There are many willing to fight for our cause, provided we can give the right amount of money.\nWe have promoted an idea of mercenaries claiming territory that they have conquered, which has cut down on costs, but will require us to control a certain amount of territory in order to keep the mercenaries happy.\n\nBalance of Mercenaries: [?IRI_mercenaries_recruited]/[?controlled_states]"
 IRI_recruit_mercenaries:0 "Recruit More Mercenaries"
 IRI_march_on_tion:0 "The March on Tion"
 IRI_targeted_merc_attack_decision:0 "Seize [FROM.GetAdjective] Land"
 IRI_need_more_land:0 "Steadholder-less Mercenaries Growing Restless"
 IRI_ask_for_reopening_markets:0 "Ask for [FROM.GetNameDef] to Re-Open their Markets"
 IRI_integrating_tlarthingians:0 "Integrating the Tlarthingians"
 IRI_integrating_tlarthingians_desc:0 "After centuries of enmity between us, the time has come to try and learn to live together, and we must make sure to integrate the resisting Tlarthingians into our empire, so that together, we can strive for eternal glory."
 IRI_integrate_tlarthingia_targeted_decision:0 "Integrate the Tlarthingians of [FROM.GetName]"
 IRI_tlarthingian_irinthian_pride:0 "Call Upon Loyal Tlarthingians"
 IRI_settling_tlarthingia:0 "Settling Tlarthingia"
 IRI_settling_tlarthingia_desc:0 "Now that we have taken and cleansed the land formerly occupied by the Lizardmen, we can send in proper settlers to civilize the land."
 IRI_settling_northern_tlarthingia_targeted_decision:0 "Settle [FROM.GetName]"
 IRI_settling_tlarthingia_targeted_decision:0 "Settle [FROM.GetName]"
 IRI_lizard_genocide:0 "Lizard Removal Corps"
 IRI_lizard_genocide_desc:0 ""
 IRI_cleansing_resistance:0 "Remove Resistance in [FROM.GetName]"
 IRI_promote_frontier_life:0 "Promote Frontier Life"
 IRI_merchant_hand_trade_league:0 "The Irinthian Trade League"
