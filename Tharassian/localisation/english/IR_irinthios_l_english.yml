 IRI_Irinthian_InSphere_tt:0 "Unlocks §YIrinthian Influence Sphere§! decision category. Countries we decide to influence can later become our puppets."
 iri.30.t:0 "[From.GetLeader] Asks For Our Help"
 iri.30.d:0 "A civil war broke out in Irinthios, a war against the Chairophon's tyrrany. [From.GetLeader] sent us a message, considering that we also want to avenge the dictator who previously almost invaded our country. \n\nHe proposes an agreement in which the generals leading the revolution would temporarily take over some of our troops including the high command for the duration of the war until the conflict is over."
 iri.30.a:0 "Chairophon will regret he was born"
 iri.30.b:0 "We are not being involved"
 iri.31.t:0 "[From.GetName] Gives Us The Lead"
 iri.31.d:0 "[From.GetLeader] honourably accepts our call. We shall fight the Chairophon scourge together, as one country. \n\nBilodyan army will be under our command until the end of the conflict."
 iri.31.a:0 "We will owe them a lot"
 iri.32.t:0 "[From.GetName] Does Not Answer Our Call"
 iri.32.d:0 "[From.GetLeader] honourably denied our offer. He doesn't want to get involved in a risky conflict that might go wrong anytime."
 iri.32.a:0 "Shame on them"
 iri.33.t:0 "Victory Of The Rebellion"
 iri.33.d:0 "Evil Chairopon have been captured by the revolutionists, and now awaits his fate. With our good allies, we can rejoice. The Bilodya, during the conflict has achieved fair prosperity thanks to devoted Irinthian administrators, which will not be so easily ever achieved by us. \n\nSome Bilodyan advisors are encouraging us to use the occassion to integrate our country with Irinthios, for the good future of orks and people."
 iri.33.a:0 "One heart, one nation we shall be"
 iri.33.b:0 "We fullfilled our duty"
 iri.34.t:0 "Unexpected Bilodyan Appeal"
 iri.34.d:0 "[From.GetLeader] congratulated us victory, at the same time suggesting that Bilodya could become the part of the new [Root.GetName]. Ogres admire our enthusiasm and swear faithfully to serve our people as long as we treat them with respect and as our own citizens."
 iri.34.a:0 "Let's welcome our brothers in the New Irinthios!"
 IRI_Fate_Of_The_Merchant_Cities:0 "Fate of the Merchant Cities"
 IRI_Fate_Of_The_Merchant_Cities_desc:0 "Achieving stability and a certain future, we can try to reach a consensus on the reunification of the Merchant's Hand city-states back to our country. It would be best to hold a suggestive unification referendum."
 IRI_Retake_Merchant_Cities:0 "Retake Merchant Cities By Force"
 IRI_Retake_Merchant_Cities_desc:0 "The Irinthians, who assume that they can create an independent nation called ''Merchant's Hand'', are wrong. Over the years, the dissonance between our policies has become so great that there is no peace option for them. We'll take account of all traitors."
 iri.35.t:0 "Irinthios Demands Referendum"
 iri.35.d:0 "About three days ago at the Irinthian embassy, there was a scandalous attempt to force a referendum under the threat of force. This was clearly a blatant irredentist expansion attempt. Some of our diplomats have even commented it with the ''Irinthios' imperial ambitions peaked''. In order to avoid unnecessary bloodshed and the danger of a rearming Irinthios, we conducted a quick referendum in all cities, as wished by the aggressors. \n\nAs we thought, in the referendum our citizens clearly opposed the unification."
 iri.35.a:0 "We are not surrendering to the Empire!"
 iri.35.b:0 "If we deny, they will finish us"
 iri.36.t:0 "Referendum Failed"
 iri.36.d:0 "The Merchant's Hand government agreed to our forced request of referendum. The residents clearly voted against the unification. Moreover, our embassy was closed and the ambassador was exiled. [From.GetLeader] has sent us a diplomatic note, warning us to not meddle in their domestic politics, as there will be sanctions if we ever try that. \n\nAlthough the referendum failed, there is still an option, as we do have strong claims to Merchant's Hand lands, and so we can use these to change their minds by force."
 iri.36.a:0 "Should we cut some Merchants' hands now?"
 iri.37.t:0 "Referendum Success"
 iri.37.d:0 "Despite the social turmoil that followed the news that the unification referendum was won, city authorities gave our lords full power. Although the city-states residents protest, accusing their government of faking the referendum results, they do realise any other choice would lead to a bloodshed between our nations."
 iri.37.a:0 "We won, and that's all that matters"
 iri.38.t:0 "Chairopon Reacts To Cinyras' Proposal"
 iri.38.d:0 "Today a series of Cinyras' brave liberal proposals (as usual) came from the Senate to the parliament and after thorough reading. This time though something was different. Thersseandros instead of typical boycotting, carefully listened to Aggelos' speech. \n\n''I, Thersandros Chairophon, am insulted, confused, perplexed and infuriated. This work sent by Aggelos Cinyras, speaker of the senate and political rival, has done it again. It not only talks about our current situation in the depression, but also lays out a very detailed plan for reform. It starts by condolensing on the current policies of me, than it starts going on and on about the right of workers and soldiers, where most of it i do not understand, but then it introduces an interesting Idea of The Conquerors' Law, which enables all soldiers of our army to get land from where they conquered it, going over how much contribution equals how much land and how land is to be graded. It is a very complex but in the end simple system enabling soldiers to get the land they fought for.'' \n\nBoth parliament and Senate members were shocked, noticing the Emperor giving an open approval of his pretender's ideas. Rumours say Aggelos Cinyras during his private discussion with Chairophon, asked for the permission to stand on the forum, preparing the people for the incoming reforms."
 iri.38.a:0 "The Wind of Changes is coming"
 iri.39.t:0 "Coronation of a New Emperor"
 iri.39.d:0 "Aggelos Cinyras was crowned in his hometown, Tykinthos, in a great celebration to which all citizens and nobles were invited, following the old tradition of the Cinyras family. The coronation - although Cinyras himself did not expect it - was attended by hundreds of thousands of guests - many lords who opposed the rule of Thesseandros during the revolution, generals chanting the name of the new ruler, and even guests from the most distant countries. The crowd was hypnotized, listening to and watching the ceremony. The moment of silence had came. \n\n''It is a great honour for me, and for you too. Surely, many of you wonder what should be our next step. Let me tell you - as a grandson of the Irinthian Emperor-elect I swear to protect weaker from the scourge of tyrants such as Chairophon was. I will protect you, my people. I will do what my grandfather couldn't - I will be uniting, not dividing. The peace should be brought to our continent. And the only thing that can ensure the peace, is the balance. We need alliances, we need to oppose the hegemonies. We need to show we can protect the old order. Who is with me?'' \n\nOnce silently listening crowd started shouting in approval, of which shout's echo could be heard from miles far away. The Aggelos Cinyras took the crown, dropping a tear."
 iri.39.a:0 "House of Cinyras restored its glory"
 IRI_Lizardmen_Accepted_Deal:0 " Lizardmen accepted the Cinyras' deal"
 IRI_Lizard_Join_If_Swayed_tt:0 "§YTlarthingia§! will automatically join it if they accepted our §Lprotection deal§! in past."
 iri.40.t:0 "Irinthians Want to Take The Lead"
 iri.40.d:0 "As part of their anti-imperial policy, the authorities of the new Irinthios Federation sent us an ultimatum demanding a lead in guidance of our government, seeing us and the Union as a threat to neighboring countries. \n\nAlthough on first sight it seems to be pure diplomatical nonsense, and the new Irinthain administration that has nothing to do with our region should not interfere in the Union's policy - on the other hand it is a perfect occassion to gain a good ally. Some of our advisors see the opportunity in this situation, predicting that Irinthios could be a far better overlord than Adalina."
 iri.40.a:0 "Indeed it is a good occassion"
 iri.40.b:0 "We don't let them dictate conditions"
 iri.41.t:0 "Stahlhof Concedes"
 iri.41.d:0 "The wise government of Stahlhof decided that our offer of safeguarning is just, and adequate to their situation. It seems that they never liked the order prevailing in the Union, just like we do."
 iri.41.a:0 "Splendid"
 iri.42.t:0 "Stahlhof Rejects Our Offer"
 iri.42.d:0 "Stahlhof authorities denied our offer of guidance. They seem to be stubborn enough to not see their policy is pose threat to all regional independent nation. We have no other choice - we must take over their realm using a force."
 iri.42.a:0 "A must is a must"
 iri.43.t:0 "Irinthios Gives Ultimatum"
 iri.43.d:0 "Recently, Irinthios has been allowing itself far too much. After the Chairophon removal the new government of Irinthios, headed by merely a pretender to the throne who is believed to be the righteous grandson of Emperor, now dare to force the breach of the treaty of Union between our Freiprintzums! This is not even unacceptable - this is a horrible insult towards our nation, all freiprintzums and [Root.GetLeader]. \n\nBoth sides know that this is only a pretext for an open conflict that could engulf an entire continent in the depths of eternal war, if neither side intends to back off."
 iri.43.a:0 "Bastards! Let them come..."
 iri.43.b:0 "We must concede..."
 iri.44.t:0 "Ungerdalers Exile Our Diplomat"
 iri.44.d:0 "The noble council of Ungerdaler, shocked by our ultimatum, once again verified it is what we said, drove our diplomat away from their realm almost cutting his head off. [From.GetLeader] wants to send us the message, that any Irinthian crossing the border of the freiprintzums will lose his head. \n\nIt seems that they also started mobilisation of their forces, treating our ultimatum seriously."
 iri.44.a:0 "Our blades will free their subjects"
 iri.45.t:0 "The Ungerdaler Concedes"
 iri.45.d:0 "Seeing our might, or the scale of escalation, Ungerdalers are giving the way to our demands. All freiprintzum will be released. \n\n[From.GetLeader] comments it as the ''final tragedy and death of the Union that could've been stopped, but no one cared about.''"
 iri.45.a:0 "We brought peace to continent"
 IRI_operations_in_union:0 "Challenging The Collosus"
 IRI_operations_in_union_desc:0 "The Cold War with the Union will not be an even fight. For freiprintzums, we are foreigners that are trying to meddle in their internal politics. We will need an appropriate approach, sometimes even manipulation of their discourse. \n\nThe strategies are many, but we have to keep in mind we are not the only nation fighting for the influence in this area, and the freiprintzums will rather like to follow the Union, than our lead."
 iri.46.t:0 "Irinthios Invites Us To Sign The Pact"
 iri.46.d:0 "Seeing the growing danger posed by the Puritans, Irinthios offers us to sign a pact in which we undertake to protect each other. \n\nUnfortunately, this pact does not exclude the validity of the call to wars started by Irinthios or us - which makes it a typical alliance."
 iri.46.a:0 "It sounds good"
 iri.46.b:0 "We must deny the offer"
 iri.47.t:0 "[From.GetLeader] signs the pact"
 iri.47.d:0 "Despite the differences between our countries, Lirothlind respected our will and decided to sign the pact. [From.GetLeader] shares our concerns regarding the agressive policy of the Ordoria."
 iri.47.a:0 "They understand the threat"
 iri.48.t:0 "[From.GetLeader] refuses to sign the pact"
 iri.48.d:0 "Apparently too much separates our countries. [From.GetLeader] declared that the pact cannot be accepted in its form, as it can get Lirothlind into unneccesary conflicts."
 iri.48.a:0 "They have no idea what's coming"
 iri.49.t:0 "Fate Of The Therseandros Chairophon"
 iri.49.d:0 "It was not long ago in his memories that the war ended. Not too long ago, that they then captured the tyrant Therseandros Chairpohon.\nBut now he is only staying in a cell in a fortress not far away from Tion, there he still lives with his family and children and with that a question has arisen in Irinthios that [Root.GetLeader] isn´t sure if he even wants to answer it. What should he do with the monarch and his family?"
 iri.49.a:0 "He should be banished with his family"
 iri.49.b:0 "He will be sentenced to death"
 iri.49.c:0 "Chairophon family should be only a memory..."
 iri.50.t:0 "Chairophon Family Exiled"
 iri.50.d:0 "After the grueling civil war it could be obvious that the former leader Therseandros Chairophon will be punished by the angry revolutionists. Though everyone expected his execution, the revolutionaries showed respect, deciding to banish their emperor and his family out of the country. Rumors say that Chairophon and his family left the continent for good, rejecting the offers of the asylum - to save their honour, and perhaps start a new life."
 iri.50.a:0 "A mostly good ending"
 iri.51.t:0 "Chairophon Executed By Revolutionaries"
 iri.51.d:0 "After the grueling civil war it could be obvious that the former leader Therseandros Chairophon will be punished by the angry revolutionists. The revolutionaries decided that death would be a quick and appropriate punishment. The execution took place at his own palace. \n\nApparently the last words he said were: ''I'm sorry, may the Irinthians and my fathers forgive me. I deserve my fate''."
 iri.51.a:0 "A poor guy"
 iri.52.t:0 "Chairophon Dynasty Executed"
 iri.52.d:0 "After the grueling civil war it could be obvious that the former leader Therseandros Chairophon will be punished by the angry revolutionists. But no one could expect what revolutionists were up to... \n\nThe whole family, counting 7 members including child, was dragged on the square where the hangman awaited them all. The crowd, blindly shouting ''death to Chairophons'' was is a trance, observing every man of the Chairophon dynasty being executed. There was crying. There was blood. Some wanted to intervene, but were dealt with by the crowd. There are unconfirmed rumours of some members that managed to escape, or some being on foreign courts, but according to [From.GetLeader] ''all of the Chairophons were lured, brutally beaten, and decapitated'' - whcih is also the version confirmed by the witnesses."
 iri.52.a:0 "Bloody hell..."
 #new events
 tla.3.t:0 "Irinthians have Seized the North!"
 tla.3.d:0 "In spite of our best efforts, we have been unable to defend the northern regions that once belonged to [IRI.GetNameDef], and some within the upper councils are contemplating offering the northern region's return in exchange for independence."
 tla.3.a:0 "We will try to appease the Irinthians"
 tla.3.b:0 "We will fight until the end!"
 tla.4.t:0 "[IRI.GetLeader] Refuses our Peace Offer"
 tla.4.d:0 "Not content with simply getting our northern portions, it seems that [IRI.GetLeader]'s ambitions spread across all of Tlarthingia!"
 tla.4.a:0 "There are dark days ahead."
 iri.54.t:0 "[TLA.GetLeader] Offers the Return of our Rightful Land"
 iri.54.d:0 "Not wanting to be completely subjugated, we have been offered the northern region of Tlarthingia that used to be Irinthian in exchange for peace."
 iri.54.a:0 "Yes, that is all we want"
 iri.54.b:0 "We shall deal with the lizard threat for all time"
 iri.55.t:0 "Pro-Nobility Riots"
 iri.55.d:0 "A new wave of riots have risen up in our nation, demanding the return of noble power and senatorial representation. There are rumors that these riots have been sponsored by the nobles effected by our anti-corruption measures, but nothing concrete yet."
 iri.55.a:0 "We must deal with these riots swiftly"
 iri.56.t:0 "Dealing with the Nobility"
 iri.56.d:0 "Chairophon must decide how he will deal with the nobility, either by accepting their demands and reforming to a senatorial system, or by dealing with them in a more... permanent manner, and cementing his power."
 iri.56.a:0 "Purge the Nobles"
 iri.56.b:0 "Reintroduce the Senatorial System"
 iri.57.t:0 "The Downfall of the House of Cinyras"
 iri.57.d:0 "The unifiers of the Irinthian Empire of old, the House of Cinyras was overthrown after a desparate attempt to try and reforge the empire during the Bilodyan Reclamation Campaign of 562, which ended in absolute disaster. [IRI.GetLeader]'s ancestor lead the generals and a few nobles to enact a coup against the House of Cinyras, discrediting them and sending them into exile. Only a minor branch of their house, to which Aggelos Cinyras belongs, was allowed to remain, as they pledged loyalty to the new emperor, and were assigned as the Strategos of Tikynthos."
 iri.57.a:0 "We must restore this great dynasty!"
 iri.58.t:0 "The March on Tion"
 iri.58.d:0 "Aggelos Cinyras, followed by a crowd of supporters, marched into Tion and invaded the Palace of Tion, trying to capture and murder [IRI.GetLeader]."
 iri.58.a:0 "They succeeded, and beheaded [IRI.GetLeader]"
 iri.58.b:0 "They failed, and [IRI.Getleader]'s loyalists started a civil war"
 iri.59.t:0 "Swaying the Strategos"
 iri.59.d:0 ""
 iri.59.a:0 "Threaten with Blackmail"
 iri.59.b:0 "Bribe Them"
 iri.59.c:0 "Denounce Chairophon's Centralization"
 iri.60.t:0 "The Head Palace Guard"
 iri.60.d:0 "In order for us to infiltrate the palace and dispose of Chairophon, we must first deal with the Guard, whose leader has been proven to be very accepting of coin."
 iri.60.a:0 "Assassinate Him"
 iri.60.b:0 "Bribe Him"
 iri.61.t:0 "Dealing with Chairophon's Spymaster"
 iri.61.d:0 "As of late, Chairophon's Spymaster has started to investigate our schemes, and our discovery grows more likely day by day! We must figure out how to deal with him."
 iri.62.t:0 "Coup Escalates into Civil War!"
 iri.62.d:0 "Aggelos Cinyras and his followers were unable to quickly seize the Palace of Tion, allowing for Chairophon to escape, and the Strategoi loyal to him have mobilized troops to crush the Cinyras Insurrection!"
 iri.62.a:0 "For the Mandate of the Moon!"
 iri.64.t:0 "Aristocratic Support Drops"
 iri.64.d:0 ""
 iri.64.a:0 "Oh no"
 iri.65.t:0 "The People's Support Drops"
 iri.65.d:0 ""
 iri.65.a:0 "Oh no"
 iri.66.t:0 "The Army's Support Drops"
 iri.66.d:0 ""
 iri.66.a:0 "Oh no"
 iri.67.t:0 "Irinthian Merchants Found Using Lightened Coins!"
 iri.67.d:0 ""
 iri.67.a:0 "Expel their merchants, close our posts in [IRI.GetNameDef]!"
 iri.68.t:0 "[MER.GetName]'s Ports Closed to Irinthian Merchants!"
 iri.68.d:0 "Having discovered our debased currency, [MER.GetNameDef] has decided to close all trade with us, so until we prove that we are no longer lightening our coins, or have reincorporated the trade cities, we will be unable to trade with them."
 iri.68.a:0 "Damn them!"
 iri.69.t:0 "Tromoustories"
 iri.69.d:0 "Captain Dousmanis gathered his men around the campfire, speaking of tales of atrocities that he had heard perpetrated against humans by the Tlarthingians in the Saurid Revolt, including a village where a pack of the lizardmen picked them off, one by one. By the end, his troops were practically frothing at the mouth in fury over the Tlarthingian atrocities, ready to go to war against the lizardmen"
 iri.69.a:0 "These monsters must be slain!"
 iri.69.b:0 "Smash or Pass?"
 iri.70.t:0 "Dealing with the Flight of the Nobles"
 iri.70.d:0 "After the institution of the controversial Reclamation Tax, which targets the nobles and their wealth, large amounts of aristocrats have fled the country, causing much instability and uncertainty. We must decide how to stop this flight in its tracks."
 iri.70.a:0 "Seize the Nobles' Wealth!"
 iri.70.b:0 "Confine them to House Arrest!"
 iri.70.c:0 "Lighten the Reclamation Tax"
 iri.71.t:0 "The Approaching Economic Collapse"
 iri.71.d:0 "Our lightening of the coins has given us temporary wealth, but now it has proven to be an extremely destabilizing threat, that might lead to the collapse of our economy. The two main schools of thought for solving this issue is to either try and regulate the lightened currency, though inflation will always be an issue, or to return to the old standard, though this will cause some economic slowdown for a period of time."
 iri.71.a:0 "We will return to the gold standard"
 iri.71.b:0 "We will operate with this half-gold standard"
 iri.72.t:0 "Tlarthingian Refugees Flee the North"
 iri.72.d:0 "Hordes of Tlarthingian families have fled our former north, now controlled by [IRI.GetNameDef], telling horror stories of jungle villages burned and pillaged, and the slaughter of our people."
 iri.72.a:0 "Those Damned Irinthians!"
 iri.73.t:0 "[FROM.GetName] Invests into Us"
 iri.73.d:0 "After the recent creation of the Irinthian Trade League, [FROM.GetAdjective] investments have begun to come into our economy, bolstering it."
 iri.73.a:0 "A Good Sign for Both of Us"
 iri.74.t:0 "[MER.GetLeader] Demands Greater Rights for their Guilds"
 iri.74.d:0 "Not content with their markets expanding, the guilds of [MER.GetNameDef] have begun to put pressure on us to give them greater powers and protections when compared to native Irinthian businesses."
 iri.74.a:0 "The Guilds Shall Get what They Want"
 iri.74.b:0 "Native Irinthians are More Important"
 iri.75.t:0 "Reforming the Army"
 iri.75.d:0 "The army has become too stagnant as of late, and if we are to retake our rightful lands, we must make sure our military is of the topmost form!"
 iri.75.a:0 "Reform from the Top Down"
 iri.75.b:0 "Reform from the Bottom Up"
 iri.76.t:0 "The Refugee Metroples"
 iri.76.d:0 "In the wake of the collapse of the Irinthian Empire, many fled from the frontier regions of Burdvin and Cist, towards the more developed and stable regions, such as Marakai and Cai.\nThis rapid resettlement led to massive, crime-ridden 'slum-cities', which took years to stabilize and be dealt with via Chairophon-sponsored resettlement programs.\nThe scars of the Refugee Metroples can still be felt, however, in the large slums and mixture of various dialects in the poorer parts of many major cities."
 iri.76.a:0 "We must prevent this disaster from happening again"
 iri.77.t:0 "[IRI.GetLeader] Establishes the Irinthian Trade League"
 iri.77.d:0 "Wanting to pursue closer relations with us, the Irinthian Trade League has been established for our nations to grow economically closer, though many know that [IRI.GetLeader]'s true ambitions lie with the reunification of the Free Cities and Irinthios"
 iri.77.a:0 "Let's make some money!"
 iri.78.t:0 "The Budget Hole"
 iri.78.d:0 "One of our economists has threatened to resign in protest of a new bill that would increase the funding of the military, instead of keeping our debt low."
 iri.78.a:0 "Glory is more important than a few pieces of gold"
 iri.79.t:0 "The Economic Forum"
 iri.79.d:0 "A council has been called, with the goal of trying to push further economic dominance over the Merchant's Hand to ensure a quicker annexation. There have been many proposals, such as attempting to monopolize their trade, or by looking elsewhere for trade, and pressuring the Free Cities to do more to appeal to us."
 iri.79.a:0 "We will make them require our services"
 iri.79.b:0 "We will look towards their competition"
 iri.80.t:0 "Irinthios Looking for Other Trade Partners"
 iri.80.d:0 ""
 iri.80.a:0 "That cannot be allowed! How could they?"
 iri.80.b:0 "We have our own partners too"
 iri.81.t:0 "Irinthian Merchants Flood the Market"
 iri.81.d:0 "Bringing in low prices and goods that are suspected to have been smuggled, Irinthian goods have begun to thoroughly infiltrate our economy, making us further reliant on them."
 iri.81.a:0 "Okay"
 iri.82.t:0 "Reviewing Mercantilism"
 iri.82.d:0 "There have been two main schools of thought allowed to prosper in Irinthios under [IRI.GetLeader]'s leadership. That of mercantilism, in an attempt to outcompete and dominate the Merchant's Hand. And then corporatism, where the economy would be based around the guilds."
 iri.82.a:0 "Mercantilism Provides the Greatest Wealth"
 iri.82.b:0 "Corporatism Provides the Greatest Wealth"
 iri.83.t:0 "The Strategos of Cai Swears Loyalty to Chairophon"
 iri.83.d:0 "One of the strategoi has done an act showing loyalty to Chairophon, muddying and confusing the waters with our schemes and our plans to overthrow him."
 iri.83.a:0 "One more loose end to tie up"
 iri.84.t:0 "The Strategos of Sasnai Swears Loyalty to Chairophon"
 iri.85.t:0 "The Strategos of Tofnos Swears Loyalty to Chairophon"
 iri.86.t:0 "The Strategos of Cyttra Swears Loyalty to Chairophon"
 iri.87.t:0 "The Strategos of Marakai Swears Loyalty to Chairophon"
 iri.88.t:0 "The Strategos of Tikynthaios Swears Loyalty to Chairophon"
 iri.89.t:0 "Choosing Collaborators"
 iri.89.d:0 "There are two main groups of Tlarthingians who are willing to work with us to aid our occupation. There is the much larger monarchist group, though it is more nationalist and could be troublesome to manage, and then there are the republicans, which are much weaker, but we might be able to enforce our demands on them more easily."
 iri.89.a:0 "Perhaps we can Tame the Monarchists"
 iri.89.b:0 "We can Manipulate the Republicans"
 iri.90.t:0 "The Royalist Movement Split"
 iri.90.d:0 "In Tlarthingia, the two main movements that are pro-monarchy are those that support Balger Luudz, which are much more prone to centralism and resistance, but are the larger group if we can sway them to our side. There is also Quul Huuthor, whose movement is much weaker and thus more malleable to our whims, and wishes for more regionalism than Luudz's supporters."
 iri.90.a:0 "Balger Luudz's Movement is the Easiest Option"
 iri.90.b:0 "Quul Huuthor's Movement is Better Suited"
 iri.91.t:0 "Controversial Romance Novel Floods the Markets!"
 iri.91.d:0 "Following the consolidation of Irinthian control over northern Tlarthingia, many Tlarthingians became second-class citizens, having to take many lower-paying and less prestigious jobs.\n\nA new book, published by Seria Eionmerat, has theoretically taken a jab at the kind of life a Tlarthingian maid would have. As is usual with her books, however, it is less concerned with the reality of this kind of situation than it is with the budding sexual tensions between a Tlarthingian maid and her Irinthian employer, having many interracial sex scenes that have brought outrage from both the human supremacists and the Tlarthingian sympathizers.\nWhile the human supremacists are disgusted by the depiction of the possibility of romantic and sexual relations between Tlarthingians and Irinthians, those who advocate for Tlarthingian rights call it a disgusting fetishization of an oppressed race.\n\nAs controversial as it is, it has become the number one selling romance novel within the empire, much to the dismay of many."
 iri.91.a:0 "What kind of degenerates would like this?"
 iri.91.b:0 "Where can I get a copy?"
 iri.92.t:0 "A Day at the Market"
 iri.92.d:0 "Mishkall treaded through the market, hood pulled up over his head as he carried the fruits of his hunt, before approaching a stall.\n''What do you have for me?'' the fellow Tlarthingian asked, adjusting his spectacles to get a good look at the corpse.\n''Brush Bird, big one. How much for it?''\nThe merchant took a few sniffs, before pulling out a bag of coins. ''Either 50 Silver Scales, or 12 Crowns.''\nMishkall snorted. ''You can't buy anything with scales anymore, I'll take the Crowns.''\n''There is always the black market,'' the merchant pointed out.\n''I'd rather hang onto my neck after the next market raid, thanks.'' Mishkall took the 12 coins and made his way through the market, feeling the heavy coins in his purse, wishing that he hadn't had to give up 12 silver scales, with the current exchange rate."
 iri.92.a:0 "If only the Irinthian Crown was worth more"
 iri.93.t:0 "Second Tlarthingian Revolution!"
 iri.93.d:0 "Angered by our broken promises, our Tlarthingian collaborators have taken up arms and risen up against us!"
 iri.93.a:0 "Crush Vultree's Forces!"
 iri.93.b:0 "Crush Luudz's Forces!"
 iri.93.c:0 "Crush Huuthor's Forces!"
 iri.94.t:0 "Tlarthingian Republican Movement Becomes More Loyal"
 iri.94.d:0 "Seeing the benefits of our control of Tlarthingia, the republicans have begun to increase the amount of collaboration with our garrisons."
 iri.94.a:0 "It is good of them to see reason"
 iri.95.t:0 "Tlarthingian Republican Movement Becomes More Rebellious"
 iri.95.d:0 "Growing tired of our occupation, the republicans have begun to increase their activites against our garrisons"
 iri.95.a:0 "Those Fools Will Be Crushed"
 iri.96.t:0 "Tlarthingian Royalist Movement Becomes More Loyal"
 iri.96.d:0 "Seeing the benefits of our control of Tlarthingia, the royalists have begun to increase the amount of collaboration with our garrisons."
 iri.96.a:0 "It is good of them to see reason"
 iri.97.t:0 "Tlarthingian Royalist Movement Becomes More Rebellious"
 iri.97.d:0 "Growing tired of our occupation, the royalists have begun to increase their activites against our garrisons"
 iri.97.a:0 "Those Fools Will Be Crushed"
 iri.98.t:0 "Tlarthingian Power Struggle Turns in Favor of Republicans"
 iri.98.d:0 "Recently, developments have made it so that the republicans have gained a slight advantage over the royalists, gaining more power in occupied Tlarthingia"
 iri.98.a:0 "Okay"
 iri.99.t:0 "Tlarthingian Power Struggle Turns in Favor of Royalists"
 iri.99.d:0 "Recently, developments have made it so that the royalists have gained a slight advantage over the republicans, gaining more power in occupied Tlarthingia"
 iri.100.t:0 "Balger Luudz Grows Unruly"
 iri.100.d:0 "No matter how well we have treated Balger Luudz and his people as our subjects, he has become more demanding and unsupportive of our rule as of late, and we must deal with this before he tries to inspire resistance in the people"
 iri.100.a:0 "Bribe Him"
 iri.100.b:0 "Threaten Him into Submission"
 iri.100.c:0 "Ignore Him"
 iri.101.t:0 "Cleaning the Jungles"
 iri.101.d:0 "The soldier's face contorted into a grimace as he dragged the body of the Tlarthingian out of the hut, throwing it into the raging bonfire in the center of the village. ''Why do they have to stink so much?'' he complaned.\n''Must be all of the hallucinogenic plants they eat,'' a fellow soldier joked as he carried two lizardmen children over his shoulders, before they joined their mother in the fire. They laughed, looking around the village, before moving away from the fire and wiping the sweat away from their foreheads.\nOne pulled out a bottle, swishing it around. ''Hey, I found some beer too. They must've stolen it from a richer division, ha!''"
 iri.101.a:0 "Hey, share the drink"
 iri.102.t:0 "Tlarthingian Education Initiative"
 iri.102.d2:0 "''And that, class, leads us to the start of the Saurid Rebellion, any questions?'' the teacher asked, looking over the class of Tlarthingians, orphans of soldiers who had fought against the Irinthian army, which had been generously put into education and orphan programs for their well-being.\nOne raised his hand. ''Excuse me, ma'am, but about the Saurid Revolution, is it... bad, that our parents fought against the empire?''\nThe teacher pursed her lips in thought as she looked over the class, as if trying to figure out how they would react to her answer. ''It is not... bad, per se, but what's important is that now, they are loyal citizens of Irinthios, and so are you. Fearful of the collapse of the empire, and flooded with Racial Union propaganda from the now comparably powerful Tlarthingian Kingdom to the south, many thought it would be best to join their lizardmen companions.''\nAnother student raised his hand. ''What does Racial Union mean?''\n''There is a popular theory that's existed for milennia, that states that the goal of any nation is to try and take control of all regions settled by its race. This is obviously a puritan-aligned goal, and as can be seen by the multi-racial makeup of Irinthios, is not the case all of the time.''\n''Are you saying that Irmolla Luudz was a puritan?''\nThe teacher smiled slightly. ''What have I told you about reading ahead, Werlin? But there is much academic debate by scholars over whether the king of Tlarthingia in the mid 500s was a puritan or not. They can only agree that he held many revanchist, puritan-aligned ideals. Of course there are many within Irinthios who hold similar ideals, but luckily they have been prevented from influencing Tlarthingian policy. And that is all the time we have for class, remember to thank the Emperor for his kindness and generosity towards us.''\n\nThe class stood up from their benches, which circled around where their techer stood, right hand over their chest as they turned to the east wall, where a bust of [IRI.GetLeader] stood."
 iri.102.d1:0 "''And that, class, leads us to the start of the Saurid Rebellion, any questions?'' the teacher asked, looking over the class of Tlarthingians, sons of nobles who had recently been admitted into the empire.\nOne nervously rose his hand. ''Why would they rebel against the empire, if they were treated so well?''\n''Well, it was a mix of fears of reprisals by Irinthians who blamed the Tlarthingians for the collapse of the empire, and also the fact that Irmolla Luudz helped spread lots of Racial Union propaganda in the Saurid-settled regions of southern Irinthios. In spite of the ethnic differences between Agamids and Saurids, he wanted to create a Pan-Lizardmen kingdom, which, according to Racial Union theory, should be the ultimate goal of any state with a dominant race. But, unfortunately, the Saurids were marginalized under the Agamid-dominated Tlarthingian kingdom. But now the Saurids and Irinthians are reunited, and, under the Emperor's wisdom, we all may prosper together. Now, everyone stand for the Pledge.''The class stood up from their benches, which circled around where their techer stood, right hand over their chest as they turned to the east wall, where a bust of [IRI.GetLeader] stood."
 iri.102.a:0 "Praise the Emperor!"
 iri.103.t:0 "The Kars' Senatorships"
 iri.103.d:0 "The idle chatter of the senate dipped as a hulking ogre, wearing the toga of a senator, entered the room, followed by another wearing identical clothing.\nOf course, all of the senators had known that two ogres had been selected to represent their interests in the Senate, but actually seeing them was shocking.\nThe larger of the two cleared his throat, getting the attention of the entire room as he started to speak. ''I am Kar Thaurun, senator of Bilodya, and this is Kar Grelln, also senator of Bilodya. We are honored to be welcomed as members of the Senate, and hope to disturb you all as little as possible.''\nThe two ogre senators moved across the room to their seats, togas allowing the senators to see the scars on Senator Grelln's shoulders. A few whispers about where he might have gotten those scars, from an inter-ogre conflict, or fighting against Irinthian reclamation."
 iri.103.a:0 "Senator Thaurun is well-spoken, for an ogre"
 iri.104.t:0 "The Irinthian Empire Reborn"
 iri.104.d:0 "After centuries of humiliation and rebuilding, we have finally retaken those territories which rebelled and collapsed more than 300 years ago! Now the time has come to announce to the world that we have risen again, as a pheonix!"
 iri.104.a:0 "Hopefully only the beginning of our rise"
 iri.105.t:0 "Irinthios Rises Again!"
 iri.105.d:0 "After losing its westernmost and southernmost regions during its collapse in the early 500s, Irinthios entered a period of warlordism, before the House of Chairophon managed to reunite it, and begun rebuilding it, entering a sort of isolationism as it prepared, over centuries, to retake Bilodya and Northern Tlarthingia.\n\nNow, that goal has been achieved, and Irinthios has regained its former territories, reaching its peak from long ago."
 iri.105.a:0 "Irinthian Ego Will Swell Even More Now"
 iri.105.b:0 "All Will Bow Before Our Power!"
 iri.106.t:0 "A Shrine Honoring Bassk the Scholar"
 iri.106.d:0 "As Cist has begun integrating into Irinthios, in order to help speed it up, a shrine honoring a pro-Irinthios Saurid scholar, named Bassk the Scholar, has been erected within the city, with the help of a few local collaborators.\nHe is well known for his defense of Irinthian rule during its twilight era, just before its collapse, and has been credited with delaying the Saurid Revolt by almost half a decade."
 iri.106.a:0 "May the citizens of Cist take after him"
 iri.107.t:0 "Swamp Rejuvenation Project"
 iri.107.d:0 "Following the acceptance of Tlarthingian representatives into the Senate, a big debate has occurred where they have begun proposing the increased development of the swamps that are settled by the Saurid.\nMany conservative senators oppose this due to the cost, though the Tlarthingians and more progressive senators claim that it will help tie Irinthios and its new Tlarthingian citizens together."
 iri.107.a:0 "Fund the Construction"
 iri.107.b:0 "It is too expensive"
 iri.108.t:0 "Border Crossings"
 iri.108.d:0 "Eppelas huffed as he came to the border between the autonomous Tlarthingian region, where a set of guards were sitting. ''Papers, please,'' one of them said politely, holding out their hand.\nAs he dug through his bags for his documentation, he grumbled under his breath. ''Damn lizards, why do I have to show my papers to move through Irinthios? They're the ones who lost the war.''\n''I don't make the rules, buddy,'' one said tiredly, having heard this all before. ''But you gotta have paperwork to move through the autonomous region.''\nAfter a minute of rifling through his bags, Eppelas handed over his papers, which stated he was appointed as head engineer of Cist. ''Can I cross now?'' he asked impatiently.\nTo spite him, the guard holding the papers took his sweet time double and triple-checking the paperwork, before handing it back. ''Good luck with your new post.''"
 iri.108.a:0 "I hope he isn't this unfriendly to the Saurids"
 iri.109.t:0 "The Bilodyan Trail"
 iri.109.d:0 "Zanya poked her head out of the shaded cart to look across her new home, the vast steppes of Bilodya. ''Wow, it's so flat!'' she exclaimed.\n''Yes, dear,'' her mother said, also looking into the distance, though her expression was one with more worry and less wonder than her daughter's. ''I know we are being paid well for this, but I'm still not so sure about going to a place infested with ogres.''\nZanya's father laughed. ''Look at all of the soldiers around us! It'd take an exceptionally dumb ogre to even think about attacking this convoy, and I've heard that there's already a military outpost within a mile of where our new home is going to be. We'll be safe, don't worry.''\n''There are still ogres around? I thought those monsters were all killed off!'' Zanya exclaimed.\n''Not yet, but don't worry your little head, dear,'' her father said calmly. ''It's only a matter of time. This is our home now, and they won't be able to stop us.''\nZanya pursed her lips as she looked back out at the steppes again, expression more thoughtful. ''Where are the ogres gonna go, since we've taken their home?'' she asked, a hint of sympathy in her voice.\nHer mother made a disgusted noise. ''They can crawl back into the mud, for all I care. As long as they leave us alone.''"
 iri.109.a:0 "''They are just mindless monsters, after all''"
 iri.110.t:0 "Promising Ogre Troops"
 iri.110.d:0 "Over the last month, we have noticed a cream of the crop when it comes to the ogre troops, with some being more intelligent and calmer under attack. They could be useful as either stormtroopers or officers, though the conservative officers would prefer they stay as normal rank and file."
 iri.110.a:0 "Promote the Best of the Best to be Officers"
 iri.110.b:0 "Create an Ogre Stormtrooper Division"
 iri.110.c:0 "They will stay rank and file"
 iri.111.t:0 "Ending the Tragodia"
 iri.111.d:0 "Confusion spread through the Irinthian populace as [IRI.GetLeader] made a bold announcement: that the Tragodía ton Tionitón, an annual tragedy depicting the collapse of the Irinthian Empire, would not be held that year, or evermore. He stated that instead, a new play was being made, though he did not specify the tone of this new piece."
 iri.111.a:0 "The Play will be a Satire"
 iri.111.b:0 "The Play will be a Glory"
 iri.112.t:0 "Finishing the Reforms"
 iri.112.d:0 "''My lord,'' Ocaveir protested. ''You cannot keep appealing to the common people like this, it will drive away the noble support for your reign. And for what? The common folk are fickle-minded, and will forget your reforms within the year, begging for more.''\n''And the nobles are not the same?'' Therseandros replied, raising an eyebrow. ''I am only going to increase the represenation the common folk have in the Senate. There will still be enough of you aristocrats to counter any attempt you find offensive. It is not like I am seizing your homes and selling them off.''\nOcaveir snorted. ''Give them anything, and they'll keep pushing for more and more, until they demand your head on a plate and to control the government themselves, the uneducated simpletons.''\n''Now now,'' Therseandros said softly. ''It won't be that bad. We are all united together. The Wrath of Irinthios will destroy its occupiers before any kind of revolution can happen. And we will deal with that when the time comes. But for now...''"
 iri.112.a:0 "''...the people will have a greater voice.''"
 iri.112.b:0 "''...you are right, the current balance will stay.''"
 iri.113.t:0 "[IRI.GetLeader] Offers a Peace Deal"
 iri.113.d:0 "As a stalemate in the Cist Isthmus has developed, countless soldiers have fought for no gain for either side. Wanting to end the bloodshed, [IRI.GetLeader] has offered a peace deal in exchange for the surrender of the northern swamps, which are already under control of the Irinthian army."
 iri.113.a:0 "We will never surrender!"
 iri.113.b:0 "No more Tlarthingians will needlessly die"
 iri.114.t:0 "[TLA.GetLeader] Denies Peace"
 iri.114.d:0 "Still thinking that he can repulse our reclamation, our peace deal has been stubbornly denied."
 iri.114.a:0 "Then let more of our men march to their deaths..."
 iri.115.t:0 "The Satyre of the Chair"
 iri.115.d:0 "A new Kind of Play emerged from the tragodiá ton tionitón, a kind of play that is more intended for causing Laughter than evoking emotion. Of course this kind of play would normally draw a different crowd than the usual Doxics played in the tragodiá ton tionitón, but no one expected what happened on that special Night, where the play was first played.\n\nThe plot follows a bumbling fool named 'Chair' trying to lead a group of soldier into the hostile Tlarthingian lands, he is a well meaning fool, with a kind disposition, so when he encountered a squad of Tlarthingians in a local establishment. \n\nChair lead the squad there to resupply upon spotting the Tlarthingians, he quickly engaged them in friendly small talk, trying to haggle for supplies for some coin or equipment. The Tlarthingians didn't take well to the Irinthian Squad leader trying to haggle and started fight against him, but it seemed that the Tlarthingians were more accident prone than Chair.\n\nThe first Tlarthingian died being beheading one of their own, trying to kill Chairophon, who slipped on a mug on the floor. Quickly the small Clash between Chair, who now was joined by his squad, and the Tlarthingians, who were supported by the patrons of the Establisment, escalated taking on comedic proportions, as the Squad of six fought against nearly 50 people. Though as one might expect, Chairs Squad was winning, with accidents doing more damage than anything the Irinthian could even hope to achieve. \n\nAs the room slowly cleared, some of the Tlarthingian just leaving the stage, Chair encountered another Tlarthingian, a female. Setting up a daring plan to woe her, Chair failed spectacularly to even impress, Stumbling over his first words, leading her with sweaty hands through the city and accidently dumping her when moving through a crown. not the best impression. \n\nWith that the play slowly faded out with laughter of the Audience."
 #"A complete change of tone from the Tragodía ton Tionitón, this new play is more intended for causing laughter than evoking emotion.\nThe plot follows a well-meaning but accident-prone Chair, an obvious parallel to Chairophon, trying to fight a Tlarthingian over a girl in a bar. As accident-prone as Chair is, his opponent proves to be even more so, resulting in the Tlarthingian ending up chopping his own head off while trying to murder Chair."
 iri.115.d2:0 "A new Kind of Play emerged from the tragodiá ton tionitón, a kind of play that is more intended for causing Laughter than evoking emotion. Of course this kind of play would normally draw a different crowd than the usual Doxics played in the tragodiá ton tionitón, but no one expected what happened on that special Night, where the play was first played.\nThe plot follows a bumbling fool named 'Chair' trying to win the election for the city senate, he is a overdramatic fool, who in spite of his Idiocy almost manages to win the seat. But then he discovered the love of his live, the daughter of the Cities strategos.\n\nHe ''found'' her in a bar where he was, rather drunkenly, hold a speech about the importance of Public dignity and how he would try to uphold these values, unlike the senator who of course don't do that. *He was a very persuasive speaker*. But in the middle of his sentence, he saw her enter the establishment, and taking a seat at the bar next to one of those weird Tlarthingians, already some in the Audience dreaded what would come next, but few expected what would happen.\n\nA thoroughly intoxicated Chair went over to the beautifull lady, of his choosing, but instead of going through the normal way, he jumped onto the bar and slowly walked over it to come to her, only kicking 3 drinks on his way from the table.\n But when he stood before her, he tried to bow down to get a better look of her and that was to much for his Stomach, quickly drawing away, he instead vomited over the Tlarthingian next to her. The ensuing stream of apologies to the Tlarthingian didn't help and he simply grabbed Chair and threw him through the room.\n\nThe ensuing Bar fight, made everyone watching laugh. Chair made it out of that only through sheer luck. During the following part Chair tried and succeded to woe the daughter of the Strategos, who in turn banished him from the City after Chair went a bid too far and bedded the Daughter, with it also losing the race to the senate."
 #"A complete change of tone from the Tragodía ton Tionitón, this new play is more intended for causing laughter than evoking emotion.\nThe plot follows a bumbling fool named Chair, an obvious parallel to Chairophon, trying to win election for his city in the Senate. In spite of his idiocy, he manages to almost win the seat, until he ends up sleeping with his city's Strategos' daughter, resulting in him getting driven out of the city."
 iri.115.a:0 "The laughter could be heard from Lirothlind"
 iri.116.t:0 "The Dóxa of [IRI.GetLeader]"
 iri.116.d1:0 "A piece designed to glorify Chairophon, this dramatic play covers his time as Emperor of Irinthios, with events shaping his personality. It ends with him standing with a Tlarthingian and Ogre bowing to him as he holds a sword, showing how he caused the subjugation of the two races, and is thus the restorer of the old Empire."
 iri.116.d2:0 "A piece designed to glorify Cinyras, this dramatic play shows his ancestors' overthrow by the dictatorial House of Chairophon, until eventually, after showing parts of his childhood, Cinyras leads the overthrow of Chairophon and beheads him, promising to prevent the rise of another dictator like him."
 iri.116.d3:0 "A piece designed to glorify Sosibios, this dramatic play shows his poor childhood, his ancestors having been driven out of Bilodya by the bloodthirsty orcs, until, eventually, he becomes a soldier and rises through the ranks, until he is appointed as Prime Orator by Chairophon himself. But then, he discovers that the emperor is a monster sympathizer, and leads a patriotic march on Tion to restore Irinthian glory."
 iri.116.a:0 "Truly a moving and inspirational piece"
 iri.117.t:0 "The History of the Comedy"
 iri.117.d:0 ""
 iri.117.a:0 "Maybe an acceptable alternative to the tragedy?"
 iri.118.t:0 "Economic Collapse!"
 iri.118.d:0 "Our economic policy has been disastrous, though until now no one knew how crippling it would be. Our money is now worthless, many are homeless and jobless, and it seems that each day, essentials cost more than the last."
 iri.118.a:0 "What a price we have paid..."
 iri.119.t:0 "The Saviors of Humanity"
 iri.119.d:0 "We have eliminated the 3 monster realms of Lathweyne, and now there will never be another realm that could pose a threat to any humans."
 iri.119.a:0 "We're so epic"
 iri.120.t:0 "Bilodyan Literacy Initiative"
 iri.120.d:0 "''I thought I was going to be teaching children,'' the teacher muttered to himself as he set down his materials, before handing out books intended for 3-year olds to his class of adult ogres.\n''Alright, so first we are going to learn the Irinthian alphabet.''"
 iri.120.a:0 "An amusing scene"
 iri.121.t:0 "Ogre Protests in Cai"
 iri.121.d:0 "Following the beginning of the integration campaign for ogres becoming citizens of the Irinthian Empire, many began moving into the Irinthian Core, mostly into the closest city of Cai, which now has a sizeable Ogre District.\nAnd after the latest Senate selection, many ogres have realized that their new rights may be eroded at any point if there is no one to defend their interests in the Senate. So they began to organize, appealing to local organizations and authorities.\nThere is a surprising amount of non-ogres in the protest, which is almost a hundred strong, all advocating for ogre represenation in the Irinthian Senate."
 iri.121.a:0 "In a matter of time, be patient"
 iri.122.t:0 "A Big Pest"
 iri.122.d:0 "Damocles looked out across his new home, richly furnished and with plenty of surrounding land, a smile on his face. This land was his, and he had earned it through blood and glory. His eyes narrowed as he noticed an ogre wandering across his land, drawing his crossbow.\nWith a heavy thrum, he watched the bolt streak across the distance between his home and the monster, before it knocked the thing flat, the flabby shape hanging onto its neck more of a suggestion of a head than a solid statement anymore.\n''Tch, stupid monsters. Don't know whose land they walked in on,'' he muttered."
 iri.122.a:0 "Doesn't matter that they were here first."
 iri.123.t:0 "A Confused Bureacracy"
 iri.123.d:0 "After our recent doubling of territory and vast increase in population, our administration is struggling to keep up with the new task of managing these new lands."
 iri.123.a:0 "Something must be done, and quickly"
 iri.124.t:0 "Nepotistic Appointments"
 iri.124.d:0 "With the expansion of our administration's power and scope, many nobles have begun to clamor to put family members who are grossly disqualified as administrators into the government. This would help improve their approval, however..."
 iri.124.a:0 "A few favors wouldn't hurt"
 iri.124.d:0 "Meritocracy is key in the administration"
 iri.125.t:0 "The Results of the Survey"
 iri.125.d1:0 "Our empire is vast and beautiful, diverse in so many ways, from the steppes of Bilodya to the swamps of the Putrun peninsula. And the citizens are just as diverse, from nobles in Tion to the Saurids in the slums of Cist to the ogre warriors patrolling the border with the Kurgur."
 iri.125.d2:0 "Our empire is vast and beautiful, diverse in so many ways, from the steppes of Bilodya to the swamps of the Putrun peninsula. And Irinthian national pride has never been higher, more willing to fight against the monster races and protect their new, greater, homeland."
 iri.125.a:0 "Our Ancestors Can Rest Easy Now"
 iri.126.t:0 "Claims of Terrorism"
 iri.126.d1:0 "Unwilling to accept their subjugation, some Tlarthingians have begun to enact attacks on local businesses and government buildings."
 iri.126.d2:0 "The Tlarthingian Royalists, angered by our courting of the Republicans, have begun to resort to more drastic measures to strike at our administration, including pro-Irinthian businesses and government buildings."
 iri.126.d3:0 "The Tlarthingian Republicans, angered by our courting of the Royalists, have begun to resort to more drastic measures to strike at our administration, including pro-Irinthian businesses and government buildings."
 iri.126.d4:0 "In every society, there are those who think that stealing what they want from those who work for their wealth is the better option. But as of late, these figures have begun to plague our frontiers in Bilodya and Tlarthingia."
 iri.126.d5:0 "Enraged by our acceptance of the monster races, the Imperialists have begun a terror campaign to try and sway people to their side, targeting pro-monster businesses and bombing known monster rights advocates' homes."
 iri.126.a:0 "We must stop these dissenters"
 iri.127.t:0 "A Pacified Nation"
 iri.127.d:0 "Now that we have dealt with the threats within our nation, we are able to finally look forward and outwards when it comes to reforms and expanding our empire."
 iri.127.a:0 "It is a good morning"
 iri.128.t:0 "The Formation of Racial Parties"
 iri.128.d:0 "Ever since the inclusion of the Tlarthingians and Ogres in our Senate, they have begun to drift towards their own semi-parties, choosing instead to unite into racial blocs over aligning with existing parties. There are some who point out that this could lead to the segregation of our nation, instead of multi-racial unity, and want these pseudo-parties dealt with."
 iri.128.a:0 "We must discourage this self-imposed segregation"
 iri.128.b:0 "It is their right to organize as they wish."
 iri.129.t:0 "The Meeting with Erzal Nurngi"
 iri.129.d:0 "A prominent Saurid noble who was quick to collaborate with us, Erzal Nurngi has become the de-facto head of the Tlarthingian pseudo-party, and we must ensure his loyalty, so that the Tlarthingian Rights Party will fall into line with our wishes."
 iri.129.a:0 "It is good that he is so agreeable"
 iri.130.t:0 "The Meeting with Kar Thaurun"
 iri.130.d:0 "The most influential and well-spoken ogre in the Senate, Kar Thaurun only wishes to protect his people and their rights, so as long as we do not go against these wishes, his loyalty is all but guaranteed."
 iri.130.a:0 "May the ogres prosper under our care"
 iri.131.t:0 "Irinthian Debts to [TLA.GetName] Settled!"
 iri.131.d:0 "Finally, after much effort and many payments, the war repayments set on Irinthios after the attempted invasion of Tlarthingia have been finished!"
 iri.131.a:0 "Hopefully, a new era of peace begins now"
 iri.132.t:0 "[IRI.GetLeader] asks for the Rescission of the Treaty of the Hand"
 iri.132.d:0 "Wanting to restore a sense of normalcy and defend the nation, in his words, we have been requested to allow the Irinthians to have a larger standing military."
 iri.132.a:0 "Let us remove the military restrictions in the treaty"
 iri.132.b:0 "The lessening of the treaty would be best"
 iri.133.t:0 "[TLA.GetLeader] Proposes Modifying the Treaty of the Hand"
 iri.133.d:0 "Not wanting to fully do away with the treaty that cripples our military strength, it has been proposed by the Tlarthingians that the Treaty of the Hand be modified, so that the size of our allowed army is increased, though we would still not be allowed to have a fully-sized army."
 iri.133.a:0 "It is better, at least"
 iri.133.b:0 "Damn this treaty, we will tear it to shreds!"
 iri.134.t:0 "[IRI.GetLeader] Denounces the Treaty!"
 iri.134.d:0 "Not wanting to abide by the Treaty of the Hand, [IRI.GetNameDef] has blatantly broken it by expanding its military and refusing to pay any more debts."
 iri.134.a:0 "We do not want to provoke a war..."
 iri.134.b:0 "This is an act of war!"
 iri.135.t:0 "The Rescission of the Treaty of the Hand"
 iri.135.d:0 "Believing the restrictions of the treaty are no longer necessary, [TLA.GetLeader] has agreed to drop it as long as no further antagonism comes between our two nations."
 iri.135.a:0 "A great development!"
 iri.136.t:0 "The Treatise Debate"
 iri.136.d:0 "There are many in our nation who are divided, the nationalists wanting to cast aside the treaty and go to war with the Tlarthingians again, and the more concession-minded ones, who wish to abide by the treaties until they can be diplomatically resolved. It is time for [IRI.GetLeader] to decide which side he will go with."
 iri.136.a:0 "The Treaties Will Be Maintained"
 iri.136.b:0 "We must prepare to cast off the treaties"
 iri.137.t:0 "The Merchant General's Coup"
 iri.137.d:0 "Supported by the Merchant's Hand, and a group of disaffected mercenaries, Perthecles Tenancian has invaded Tion, overthrowing [IRI.GetLeader] and imprisoning him for failing Irinthios. He has promised closer ties with the Merchant's Hand, and to appeal to the rising merchant class within Irinthios."
 iri.137.a:0 "The start of a new Irinthios?"
 iri.138.t:0 "Holding Onto Grains of Sand"
 iri.138.d:0 "Aggelos' hands were on his head as he stared at the treaty he'd been forced to sign by the Tlarthingians, barely even noticing as a servant knocked on the door.\nThe servant knocked again. ''Your Majesty, Vettias would like to see you.''\nThat was when the emperor noticed her. ''Oh, yes, send him in, please,'' he said quickly, mind racing as he tried to figure out how he would keep control of Irinthios after this failure against the Tlarthingians. His own great-great-grandfather had been overthrown after failing to invade the ogres, and he was not looking forwards to repeating history."
 iri.138.a:0 "''There must be some favors I can cash in...''"
 iri.138.b:0 "''Guards! Arrest Vettias and any dissenters in the palace!''"
 iri.139.t:0 "The Conference of Cyttra"
 iri.139.d:0 "Emperor Cinyras watched as the ruling noble families of each city, minus Tion, slowly entered the chamber usually reserved for the Cyttran Senate. ''What have you called us for?'' Ulophessa Thersilochus, the Strategoes of Cai, asked.\n''Well, my friends and allies, unfortunately costs must be cut in order to better afford the war repayments the Tlarthingians have inflicted on us. But, I believe this can be used to benefit you all. I will be granting extended powers to the various cities, reducing the powers and responsibilities of Tykinthos. I hope this sounds as good to you as it would for me, if Therseandros Chairophon had declared he would do so, instead of restricting our powers more and more with each year.''\nA few cheers came from the younger nobles, eager for more power. But even though some of the other nobles were suspicious, Aggelos Cinyras couldn't help but smile. It would be easy to sway them with more debate on the details, to make them think they had won more than what he intended to give."
 iri.139.a:0 "A Soon-to-be Successful Conference"
 iri.140.t:0 "Imperialists Storm the Palace!"
 iri.140.d:0 "Kephalos Sosibios, followed by several of his lieutenants, entered the wing of the palace the Emperor was in, sword drawn.\n\nOne of the few guards who hadn't thrown down their weapons charged out of a side hallway. ''FOR THE EMPEROR!'' he shouted, before Sosibios' sword pommel slammed into his helmet, knocking the man backwards.\n\n''Take care of him,'' Kephalos said lowly, and his lieutenants moved towards the guard, raising their swords as their general continued towards the Royal Suite.\n\nScreams came down the hall as he opened the door, finding [IRI.GetLeader] holding his wife, glaring holes through their overthrower. ''How could you do this!? Betray your nation and emp-''\n\nSosibios silenced them by raising his sword. ''You are the one who has betrayed Irinthios, leaving it in the hands of the lizards,'' he spat. He opened his mouth to burst into a fiery rant, but paused as he noticed two of his liutenants move into the doorway, one of their swords still dripping with blood. Sosibios cleared his throat. ''As I was saying. [IRI.GetLeader], I find you and your family guilty of treason,''"
 iri.140.a:0 "''...And the punishment for treason is life in prison.''"
 iri.140.b:0 "''...And the price of treason is death.''"
 iri.141.t:0 "Sosibios Appointed Prime Orator"
 iri.141.d:0 "[IRI.GetLeader] entered the Senate, Kephalos in tow. Murmurs spread throughout the room as they noticed the bloodthirsty general in their midst, wondering what he was doing here.\n''This is Kephalos Sosibios, you probably know of him for his fiery speeches after our surrender. He is the new Prime Orator.''\n''What!?'' the previous Prime Orator, Terrinas Prelanic, demanded. ''He is just a rabble-rouser! What has he done that makes him deserving of-''\n''Unlike some of you, I will work for Irinthian glory. I look forwards to working with all true Irinthian senators,'' he bowed, drawing a few claps from the younger, more nationalist senators.\nBut most senators frowned at this new prime orator, only sure that he wasn't fit for the position, and would just lead them to war again."
 iri.141.a:0 "Dark Days Ahead for the Senate..."
 iri.142.t:0 "Chairophon's Consolidation"
 iri.142.d:0 ""
 iri.142.a:0 "Align with the Aristocrats"
 iri.142.b:0 "Move towards the Military"
 iri.143.t:0 "The Pronouncement of Emergency Powers"
 iri.143.d:0 "The Strategoi Council was filled with hushed conversations as Chairophon approached the round table, it coming to a halt as he took his seat, before clearing his throat to speak.\n\n''I know there has been some mutterings of me being a tyrant, especially lately. But I believe that the dual-strategos system can help our nation grow stronger, by being able to focus more and more on the regions while I guide the nation.'' Chairophon sighed. ''But now I ask, once again, for more power. Not for my sake, but for Irinthios'. We must prepare for the Tlarthingian storm on its way, and in order to do that, I must be allowed to temporarily have emergency powers. Our nation must survive, and triumph over the Tlarthingians.''"
 iri.143.a:0 "It was a close vote, but Chairophon won his emergency powers"
 iri.144.t:0 "Ending the Stalemate"
 iri.144.d:0 "Our people tire of war, and the time has come to try and settle a peace deal"
 iri.144.a:0 "Irinthios will expand to Cist"
 iri.144.b:0 "Irinthios will be humiliated"
 iri.144.c:0 "We will fight on!"
