 city_of_erudition:0 "City of Erudition"
 city_of_erudition_desc:0 "This city is a haven for knowledge, its many libraries housing untold amounts of wisdom. The many academics and rhetoricians that reside here are a great boon to the government's administrative and technological efforts."
 city_of_foundries:0 "City of Foundries"
 city_of_foundries_desc:0 "The clang of hammer upon steel fights with the choking clouds of smog for control of the skies, as this city's many workshops and foundries belch out ever-increasing amounts of weaponry at the behest of the realm."
 city_of_harbours:0 "City of Harbours"
 city_of_harbours_desc:0 "The faint tinge of salt and the calming rush of the waves dashing upon the beach are ever-present in this city, marred only by the drunken revelries of sailors on shore leave and the aroma of stale beer spilling from the many dockside taverns."
 city_of_slavers:0 "City of Slavers"
 city_of_slavers_desc:0 "The crack of the whip is omnipresent in this place, with chain-gangs of wretches toiling and dying for their uncaring masters. Slave auctions are common, as are unceremonious mass graves for those whose bodies gave out from the squalid conditions and back-breaking labour."
 city_of_generals:0 "City of Generals"
 city_of_generals_desc:0 "It is difficult to walk for more than five steps in this city without saluting a passing officer or being saluted by greenhorn cadets of the local officer's academy. The wealth of new talent and grizzled veterancy residing here is a great boon to any army."
 smog_choked_skies:0 "Smog-Choked Skies"
 smog_choked_skies_desc:0 "The air of this land is tainted with sulphur and smoke, and breath comes difficult. Those who live here do not tend to live very long."
 roaming_monster:0 "Roaming Monster"
 roaming_monster_desc:0 "A terrifying monster is rampaging through these lands, leaving only death and destruction in its wake."
 autonomous_region:0 "Autonomous Region"
 autonomous_region_desc:0 "This city has been granted extensive privileges and liberties. This has limited the amount of wealth the state can extract from this region, but has strongly increased the people's opinion of the government."
 upset_populace:0 "Upset Populace"
 upset_populace_desc:0 "The actions of the government have angered the people of this region, and they are hindering the state's efforts at every turn."
