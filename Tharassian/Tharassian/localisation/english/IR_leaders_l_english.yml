l_english:

### Leader Descriptions ###
 politics_NPC_astrellion_desc:0 "Ulmién Astrellion, last heir to the now-defunct Kingdom of Trifell, has successfully overthrown Arthenon's despotic reign and established the Confederacy of the Northern Plains. He is a fair and just ruler, greatly beloved by the people he liberated."
 politics_NPC_stoutfellow_desc:0 "Jace Stoutfellow has succesfully ousted Ulmién and taken the throne for himself. Greedy and corrupt with a wicked streak, the best that can be said for him is that he is not as bad as Arthenon was."
 politics_GMR_arthenon_desc:0 "Arthenon, the Grand Master, sailed to the Northern Plains from the East, subjugating the many kingdoms, republics and other states of Man there. Now, he leads the Grand Master's Realm, dominating his populace with an iron grip."
 politics_UNG_vlussinger_desc:0 "Hochprinzessin Adalina Vlussinger of Faustburg is the current ruler of the Ungerdaler Union. Having ruled Faustburg for only a single year before being elected Hochprinzessin, Adalina is inexperienced, but not naive. Her sharp eye for talent and excellent skills as a judge of character have helped her greatly along the way."
 politics_UNG_council_desc:0 "The Aristokratischer Rat für Handel und staatliche Angelegenheiten, or A.R.f.H.u.s.A., has taken the reigns of Faustbürger politics from the Hochprinzessin. This loose collection of regional nobles now deliberates on matters of state, with Adalina reduced to a ceremonial role in her own Freiprinztum."
 politics_STA_schwarzenbach_desc:0 "Ferdinand Schwarzenbach, popularly known as the 'Bear of Stahlhof,' has ruled his Freiprinztum with an iron fist for decades. He has always nominally been loyal to Hochprinzessin Adalina, but rumours abound that his armies are preparing for a little more than skirmishes with Ordoria..."
 politics_STA_schwarzenbach_victorious_desc:0 "Centuries of humiliation undone in mere years. The Ungerdaler Union is shattered, their Hochprinzessin cast down and their banner trampled into the mud. Sigismund has been avenged, and Stahlhof once again dominates the North and West of the Ungerdaler lands - with Stahlkaiser Schwarzenbach at the helm. Glory to the Stahlreich!"
 politics_STA_hundlar_desc:0 "A minor noble from Unterhisting, Hundlär has received a surprise promotion following Stahlhof's defeat in the latest Ungerdaler civil war. Having lost his daughter in the wars with Ordoria, he disdains the militarism that defined the Steel Freiprinztum's previous ruler."
 politics_HLZ_rosenblut_desc:0 "Known throughout the Union as 'the Mad Freiprinz,' Kaspar Rosenblut has always been the runt of the litter. The son to the much-beloved Edmund and younger brother to Gotthard, Kaspar was never meant to rule. Some whisper he has become possessed by a Demon since his studies in far Irenthar..."
 politics_HLZ_beckenbauer_desc:0 "Freiprinz Beckenbauer is a unique figure in Ungerdaler politics - a Freiprinz that voluntarily works to limit his own power. He has actively worked to devolve the powers held by the Freiprinz of Holzbrenn, and frequently spends time among the common populace. Despite the stains on his office left by his predecessor, he is already much beloved."
 politics_HLZ_edlerrat_desc:0 "The Edlerrat oversees the day-to-day running of Holzbrenn - creating and reviewing laws, debating issues, and hearing petitions of the citizenry. They actively work to repair the relationship between the common people and the nobility, and guide Holzbrenn to retake its place as one of the Union's finest."
 politics_HLZ_speidel_desc:0 "A quiet, unassuming man that formerly worked as a clerk in the Carpenter's Guild, Melchior Speidel has found himself at the head of the Libertine faction in Holzbrenn's new Assembly. A firm believer in individual rights and liberties, he is set to guide Holzbrenn into a becoming a bastion of freedom."
 politics_HLZ_katzmann_desc:0 "Originally a humble farmer from Dreihuster, Frau Katzmann was forced to migrate to the city when the harvests failed, along with many other Holzbrenner peasants. Left without aid from the government and seeing the casual violence Elven citizens were subject to, she formed an organization to assist Holzbrenn's downtrodden, Human and Elf alike. Now, her Solidarity League has become a leading faction in Holzbrenner politics."
 politics_HLZ_pressler_desc:0 "The right-hand man of the Mad Freiprinz, Marius Pressler has violently crushed the Kirschenrevolution in Holzbrenn. Though he is not as erratic as Rosenblut was, he more than makes up for this with his sheer ruthlessness."
 politics_ORD_lothinnys_desc:0 "Officially Steward to the King, but in practice ruler of Ordoria, Isvenith Lothinnys is an Elf marked by grief and bitterness. One of High King Inskyllithe's most fanatical supporters, Lothinnys was devastated upon his death at the hands of Union troops, and Ordoria's losses to the upstart Realm to the north only cemented his virulent hatred of Humans. Lathweyne should fear the day it is subject to Lothinnys' tender mercies."
 politics_ORD_valinthir_desc:0 "His Royal Highness, High King Galerin Valinthir, is an Elf marred by the tragedies of failure upon failure. First, he failed to prevent infighting within Ordoria's armies, causing defeat after defeat until the Humiliation at Dosinnys saw the worst blow to Ordorian pride since the death of Inskyllithe and the collapse of the Second Ordorian Empire. Then, he failed to stop his own Steward, Isvenith Lothinnys, from pouncing on his weakened government and executing a soft coup to set Ordoria down a path of hate and misery. Finally, he failed in the most basic task of any sovereign; maintaining unity among his people. When the Rthaur Rebellion kicked off and Ordorian once again slaughtered Ordorian, something broke in the High King. Having failed his people, his country, and himself, he has all but retreated from politics, no longer able to bear the burden of government."
 politics_ORD_valinthir_ii_desc:0 "Heir to the throne of Ordoria, Larennis 'the Princeling' has rapidly developed into a passionate defender of the downtrodden and oppressed in Ordoria in his short, eight-decade life. This has placed him in direct opposition to Lothinnys and Vernythe alike, and it is only by the grace of his position that he has not been ground to dust by the machinations of Ordorian politics. Whether his idealism will see him save Ordoria from itself or cause himself to be damned alongside it remains to be seen."
 politics_ORD_vernythe_desc:0 "A controversial figure in the College of the Itheryn, Histarine Vernythe has forced through many reforms to align the Itheryn with his totalitarian ideals following the Rthaur Revolution that drove him from his home in Quellion. A 'Thylgar,' or 'Sophist,' since he was a young teenager, Vernythe single-handedly whipped the disparate, local philosophies of the Itheryn into one grand temple with a strict hierarchy. His opponents accuse him of bending the philosophy to fit his iron-fisted agenda, but to many he is the 'Father of the Modern Temple'."
 politics_SKA_hellirfast_desc:0 "A truly venerable figure and bedrock of Skaelinger politics, Oberjarl Hellirfast has ruled Skaelinger as the first in his position to be elected by the Grand Lore Council. He was already a well-established figure in the Rikstag by the time Zarathum was lost to the Orcs, respected by reformer and traditionalist alike for his tempered wisdom and implacable fortitude. Elected as Oberjarl for his universal popularity and middle-of-the-road politics, the Oberjarl has gradually but inexorably drifted towards the reformist factions in Skaelinger politics over the centuries, a trend that was accelerated by Ordoria's turn to rabid fanaticism. He has even gone so far as to abandon Skaelinger isolationism in the face of this new, existential threat to Dwarfkind, forging an alliance with the Elves of Rthauiaur.\n\nAlas, the Oberjarl fell prey to the vicious Miner's Blight epidemic that ravaged the Mountainhomes and slew a third of the entire Skaelinger population, and though he recovered, his health has never been the same since. Skaelinger can feel the death of its Oberjarl approaching, and the entire nation shudders to think of what may follow should the Grand Lore Council not be up to the task of electing an heir."
 politics_SKA_hellirfast_ii_desc:0 "A young and energetic Dwarf, Reev Hellirfast is the son of the previous Oberjarl and an even more avid reformer. Considered a young adult by the Dwarves, he has reached the highest possible position in Skaelinger at a mere 110 years of age - almost scandalously young for an Oberjarl. Even more unorthodox than his age are his policies, for Reev has already gone farther in months than his father has in centuries. The young Hellirfast has deepened bonds with the Elves of Rthauiaur, and even gone so far as to reach out to the Republicans of the Charter Protection League to push through reforms for the benefit of the lower castes. 'I am King of the Republicans, too,' is one of Oberjarl Hellirfast's favourite statements, and rumours abound he may even be willing to extend an olive branch to the Brotherhood of Equals..."
 politics_SKA_grimvald_desc:0 "Tight-lipped and averse to politics, Petar Grimvald 'The Stone Hermit' is not exactly what most Dwarves picture when imagining an Oberjarl. When absolutely forced to make a statement on matters, Grimvald takes abrasively conservative positions in staunch, if uninspired, defense of the status quo. As both a major investor in the many mines of Skaelinger and an instructor at its military academy, perhaps the only real domestic plans the new Oberjarl has that do not involve maintaining extant power structures are turning Skaelinger into an economic powerhouse to rival the Steel Road itself and mandating all noblemen attend the academy to learn his teachings in the art of war.\n\nGeopolitically, the Stone Hermit's caustic conservatism is even more pronounced: he advocates severing all ties with the Rose Republic of Rthauiaur, though only after Ordoria has been put in its place. Grimvald believes meddling in the affairs of others is what caused Vergallheim to collapse in the first place, and so he advocates strict isolationism for the people of Skaelinger."
 politics_SKA_palmkevist_desc:0 "A hardened veteran of the many skirmishes against the Kurgur and die-hard neo-imperialist, Kytos Palmkevist is a frequent sight at war councils on the Ordorian threat. His hardline positions and advocacy for a new era of Skaelinger jingoism have both seen him propelled to position of face of the Dwarven gentry's hawk lobby and earned him the nickname of 'The Last Vergallheimer' - though whether this is perjorative or appreciative depends on who you ask. He advocates a suspension of the Riksdag until Ordoria has been kneecapped once again, militarization of the economy, expansion of conscription and crushing the enemies of the state with an iron hand.\n\nThough he has strong support from the military and neo-imperialist ideologues, republicans and guildists accuse him of harboring Iron-Blood sympathies for his heavy-handed attitude towards the Riksdag and blatant disregard for the laws of Skaelinger. Kytos denies these allegations, openly pledging his loyalty to the Charter."