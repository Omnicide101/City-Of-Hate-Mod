 ORD_rthaur_resistance_idea_desc:0 "In spite of our brutality against the Rthaur Rebels as we come across them, many are determined to stop us, guerilla warfare disrupting our supplies. This will not be able to be stopped until we have §RRe-Established Dominance§! over the Eastern Region."
