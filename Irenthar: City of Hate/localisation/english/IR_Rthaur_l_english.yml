 RTH_prepared_revolters:0 "Prepared Revolters"
 RTH_grand_revolution_idea:0 "The Grand Revolution"
 #events
 rth.5.b:0 "Self-Governance has Come to Our Ordorian Bretheren"
 rth.18.t:0 "A Commune Consumed by a Cult of Personality"
 rth.18.d:0 "Alucien Derathur entered a village with his usual small entourage, knocking and entering a small house in order to interview the family on how things were going on the commune and ways that he could help support it, before he paused.\nThere was a painting of him sitting on the table. After their discussion, where the family assured him that nothing was wrong and saying ''Long live Derathur'' as he left the house, he entered another one, only to find another picture of him on that kitchen table.\nThe entire village had pictures of him hanging up wherever they could, which disturbed Derathur, but the village seemed to be doing well, in fact maybe even a bit more productive than the average commune."
 rth.18.a:0 "Denounce the Cult of Personality"
 rth.18.b:0 "The commune is productive, perhaps a cult of personality is useful"
 rth.19.t:0 "Alucien Derathur Requests People Remember the Revolution"
 rth.19.d:0 "After returning to Quellion, Derathur began another one of his passionate speeches, but there was noticeably less humility in his words as he talked about the revolution and how it must be kept alive.\n\n''We must constantly remind ourselves of the revolution and the change it has brought, so I will ask the people to receive printed copies of the Quellion Proclamation to be hung up in their homes.''\n\nThe Rthaur listening were somewhat caught off guard, but a cheer soon spread through the square, and printers began to be overloaded with requests for copies of the Quellion Proclomation, the declaration of their independence from Ordoria and what started the Rthaur Revolution."
 rth.19.a:0 "The Spirit of the Revolution Lives On"
 rth.20.t:0 "Derathurism"
 rth.20.d:0 ""
 rth.20.a:0 "The Father of the Revolution's Will is Strong"
 rth.21.t:0 "The Portrait Burning"
 rth.21.d:0 "Disgusted and Infuriated at the cult of personality that has sprung up around him, Alucien Derathur went to the center of the village that seemed to be consumed by the cult, and insisted that he was just a Rthaur like the rest of them, he had only lit the spark that caused the flame of the Rthaur Revolution.\n\n''I should not be worshipped, in fact the people themselves have done all the work I am praised with doing. So I ask that you discard these possessions that do nothing but threaten my humility. Please, cast them into the fire.''\n\nAnd so the people of the village built a bonfire in the center of the town, burning all their pictures of Derathur, who visibly relaxed as the fire roared."
 rth.21.a:0 "The Cult's Ambitions turned to Ashes"
 rth.22.t:0 "Derathur Asks to Retire"
 rth.22.d:0 "Facing the Council of Communes, [RTH.GetLeader] announced that he wished to retire from the Secretariat. This brought shock and murmurs throughout the room, but he pushed on, saying he was but a civil servant who stepped up in Quellion's, and then Rthauiaur's, time of need. And that now that the revolution was secured that he wished to retire, exhausted from his efforts of maintaining the revolution and doing his best, even though he knows he has made many mistakes. He asked the Council for permission to retire, and for Kastyne Solverin to succeed him as the Secretariat of the Rose Republic of Rthauiaur."
 rth.22.a:0 "And so Derathur went home"
 rth.22.b:0 "The Council managed to convince Derathur to stay, as tired as he is"
 rth.23.t:0 "The Return of the Khorinor Mountains"
 rth.23.d:0 "In the Rthaur Revolution, [SKA.GetNameDef] lent us the Khorinor Mountains for its mines and so we had some choice beyond the Loris pass when it came to travelling between Thurgithon and Quellion. But now that we have beaten Ordoria, the time the dwarves wanted us to return the mountains to them has come."
 rth.23.a:0 "We will return the mountains to our trusted allies"
 rth.23.b:0 "They are our mountains now"
 rth.24.t:0 "Dissidence from the Travellers and House Vrinter"
 rth.24.d:0 "Resistance against the Rose-Bearers has increased as of late, especially from Vrinter, recently freed from his house arrest in the past couple of years, and the Travellers, who wish to partially undo our revolution and impose centralization on our nation. Until we deal with them in one way or another, we will have to deal with their continued sabotage of our rule."
 rth.24.a:0 "We'll get to them eventually"
 rth.25.t:0 "[RTH.GetName] Returns the Khorinor Mountains"
 rth.25.d:0 "The Khorinor Mountains, which he had lended to the Rthaur to aid in their revolution several decades ago, have finally been returned to us as thanks for our alliance from [RTH.GetNameDef]."
 rth.25.a:0 "We are thankful"
 rth.25.b:0 "Return the lands we occupied from the ordorians in exchange."
 rth.26.t:0 "The Khorinor Mountains stay in Rthaur Hands"
 rth.26.d:0 "Refusing to return the mountains we lent them in their time of need, the Rthaur have betrayed us."
 rth.26.a:0 "We shall trust them no longer"
 rth.27.t:0 "Oath of Harquiss Attack"
 rth.27.d:0 "The Oath of Harquiss, a pro-Ordorian terrorist organization funded by the Ordorians and manned by disillusioned ex-minor nobles whose lives were disrupted by the Rthaur revolution, has struck again, damaging several sites of industry"
 rth.27.a:0 "We must catch them soon"
 rth.28.t:0 "The City of Thurgithon Rises Against Us"
 rth.28.d:0 "In response to our centralization policies, which the people living in Thurgithon believe has stripped them of their culture and is a threat to their way of life, the city of Thurgithon has declared independence from us. We must quickly bring an end to this betrayal of the revolution and bring them back into the fold with the help of loyalists still in the region."
 rth.28.a:0 "The Rthaur Revolution will Survive"
 rth.29.t:0 "The City of Quellion Rises Against Us"
 rth.29.d:0 "In response to our centralization policies, which the people living in Quellion believe has stripped them of their culture and is a threat to their way of life, the city of Quellion has declared independence from us. We must quickly bring an end to this betrayal of the revolution and bring them back into the fold with the help of loyalists still in the region."
 rth.29.a:0 "The Rthaur Revolution will Survive"
 rth.30.t:0 "Vrinter's Proposal"
 rth.30.d:0 "Burthys Vrinther entered the Council of Communes, looking around at the assembled members, recognizing most of them from before his house arrest.\n\n''My fellow Rthaur, we all know of the division in our country, split by the Khorinor Mountains. I have come to suggest two potential proposals to solve this. We can either grant it so each commune and city is free to have even more autonomy, or we can grant one of the two great cities of Quellion or Thurgithon an incredible amount of autonomy, bordering on creating a new country from how much freedom it has. I know this decision is tough, and I am glad that you all are deciding to go with the free route of autonomy to solve this problem instead of tyrannical measures. I have a set of papers with me that helps explain how I would go through with these measures, enough for every member to read at once. Thank you once again, Council, for this audience so I may be bold enough to suggest what I would choose to guide our nation to freedom and stability.''\n\nVrinther bowed, taking seat as the council exploded into discussion and debate."
 rth.30.a:0 "All Cities will have Autonomy"
 rth.30.b:0 "We Shall Grant the Capitals Exceptional Autonomy"
 rth.31.t:0 "Ternise Locthorin Requests to Manage Occupied Thurgithon"
 rth.31.d:0 "A minor noble that fought in the Rthaur Revolution before being driven out by the Rosites, Ternise Locthorin has yearned ever since that day to hold an important position in his home region of Thurgithon. Now that we have taken control of her home city, she has come to us, offering to help manage the occupied territory in exchange for being made the ruler of it."
 rth.31.a:0 "A Noble Collaborator could be Useful"
 rth.31.b:0 "She is mad in her ambition"
 rth.32.t:0 "[RTH.GetLeader] Proposes a Production Agreement"
 rth.32.d:0 "In order to aid each other in the war effort against Ordoria, there has been a proposal for us and [RTH.GetNameDef]'s military production to work together in order to increase production and better, more quickly, and more easily arm and train our troops."
 rth.32.a:0 "A Great Idea"
 rth.32.b:0 "A Foolish Idea"
 rth.33.t:0 "[SKA.GetLeader] Agrees to the Production Agreement"
 rth.33.d:0 ""
 rth.33.a:0 "That is good news for our effort against Ordoria"
 rth.34.t:0 "[SKA.GetLeader] Denies Production Agreement"
 rth.34.d:0 ""
 rth.34.a:0 "To deny such universal gain out of pride is foolish"
 rth.35.t:0 "Radical Terrorism Strikes Industry"
 rth.35.d:0 "Workshops within our nation have been struck and sabotaged by Rthaur sympathizers, hindering our production efforts"
 rth.35.a:0 "Those Slimy Republicans Must Be Caught"
 rth.36.t:0 "The Countryside Revolts!"
 rth.36.d:0 "The Rthaur Rebels have not spent the last 30 years idly, and in fact have seduced the otherwise pure elves of our nation onto their side! They have risen up against us in order to aid the rebel scum!"
 rth.36.a:0 "Crush the Traitors on All Sides"
 rth.37.t:0 "Ordorian War Plans"
 rth.37.d:0 "There are three main plans that have been proposed by our generals that would help us to defeat [ORD.GetNameDef]. There is the option of using cavalry in order to quickly split the nation in two by taking Varinthia, then the proposal of rushing as swiftly as we can to take Istaroth in order to capture their king and demand Ordoria's surrender. Finally there is the even bolder plan of somehow managing to turn the Ordorian Puritan Fortress of Vuid into a massive Rosite Redoubt and then spreading to the coast in order to begin to stage raids along the rest of the Ordorian coast."
 rth.37.a:0 "War Plan North has many risks, but also many rewards"
 rth.37.b:0 "War Plan Central is the most conservative and tactically sound plan"
 rth.37.c:0 "War Plan South promises a swift end to the war if we succeed"
 rth.38.t:0 "Vuid Revolution Successful!"
 rth.38.d:0 "Under the cover of night we sent troops up the river into Vuid, which quickly rallied those who supported us, storming through the city. Clashing reports of whether the governor of Vuid had been defenestrated or lynched have come to us, but overall it seems to have been very successful"
 rth.38.a:0 "We welcome our Vuidian Brothers"
 rth.39.t:0 "Vuid Revolts!"
 rth.39.d:0 "Supported by those damned Rthaur, the people of Vuid have revolted against our rule, and massacred the garrison in the city."
 rth.39.a:0 "The Vuid will be brought to heel when we destroy the Rthaur"
 rth.40.t:0 "Vuid Revolution Fails"
 rth.40.d:0 "Under the cover of night we sent troops up the river from Thurgithon into Vuid, but they did not get the support they needed from the locals. Vuid citizens who had previously sworn fealty to the Quellion Proclamation were nowhere to be found. Our incursion was a failure, the troops killed by the Vuid garrison."
 rth.40.a:0 "A tragedy"
 rth.41.t:0 "Skirmish in Vuid"
 rth.41.d:0 "Rthaur troops reportedly tried to stage a coup in Vuid, but were quickly crushed, only causing minor damage to the city."
 rth.41.a:0 "Attempting to seize our stronghold? We did not think the Rthaur were that stupid"
 rth.42.t:0 "Our Nation Split in Twain"
 rth.42.d:0 "Due to the seizure of Varinthia and the surrounding lands by the Rthaur, our northern and southern regions are partially cut off from each other, harming our war efforts against the Rthaur."
 rth.42.a:0 "We must reunite our great cities"
 rth.43.t:0 "[ORD.GetLeader] Captured!"
 rth.43.d:0 "Our glorious leader has been captured by the Rthaur, and the rebels demand the complete surrender of our forces or else they will execute our leader."
 rth.43.a:0 "We can never give in to the radical scum!"
 rth.43.b:0 "We will save our leader, at the cost of our nation"
 rth.44.t:0 "The Seizure of Ythelmare"
 rth.44.d:0 "We finally reached the end of our westward push, our troops reaching Ythelmare recently, and seizing a large amount of civilian ships that had not yet been used to flee the city. Now we can use them to help raid and invade the coastal regions of Ordoria in our war effort."
 rth.44.a:0 "Our Military will Transform from a Landlocked one to an Amphibious One"
 rth.45.t:0 "Ordorian High King Galerin Valinthir Requests Sanctuary"
 rth.45.d:0 "The former High King of [ORD.GetNameDef], Galerin Valinthir, appeared on our southern border flanked by a regiment of body guards, begging us to hold him and his guard to keep safe from the bloodthirsty Rthaur, who are tearing apart his country."
 rth.45.a:0 "We will keep the High King Safe"
 rth.45.b:0 "He will have to Look Elsewhere for Safety"
 rth.46.t:0 "The [GMR.GetName] is Protecting the Ordorian High King"
 rth.46.d:0 "We have received reports that [GMR.GetNameDef] has decided to protect Galrein Valinthir from us by providing sanctuary and richly furnished housing. This has rightfully enraged our entire nation, and relations between us have become even more strained."
 rth.46.a:0 "We Will Get Our Hands on Him... Eventually"
 rth.47.t:0 "Influencing Istaroth"
 rth.47.d:0 "The former capital of Ordoria, there is much to compete for between the various factions within [RTH.GetName] for influence over the great and historic city."
 rth.47.a:0 "The Rosites Maintain their Hold"
 rth.47.b:0 "Vrinter's Promises of Freedom Sway the City"
 rth.47.c:0 "Traveller Investment Proves Successful"
 rth.48.t:0 "Influencing Varinthia"
 rth.48.d:0 "Controlling the central lands of former Ordoria, Varinthia connects the north and south of the region, making it vital for trade within the area."
 rth.49.t:0 "Turning Vuid"
 rth.49.d:0 "The former stronghold of puritanism within Ordoria, now the militarized city would play a vital role in any sort of society that takes control of it."
 rth.50.t:0 "Investing into Ythelmare"
 rth.50.d:0 "The economic capital of Ordoria, its ports are the envy of many a nation, making it play an important part for influencing the whole of the region."
 rth.51.t:0 "Dealing with Ordorian Culture"
 rth.51.d:0 "Now we must decide what to do with the Ordorian, puritan culture that has been enforced for over a century in the region, which poses a threat to our way of life and freedom."
 rth.51.a:0 "Destroy All Traces of Ordorian Culture"
 rth.51.b:0 "Coax in Local Culture to Replace Ordorian Culture"
 rth.52.t:0 "A Vote of No Confidence"
 rth.52.d:0 "Due to the increased influence of the Vrinterites and Travellers as of late, they have begun to pressure the Council of Communes to take action against [RTH.GetLeader], and finally they have succeeded, demanding that [RTH.GetSheHe] resign from the secretariat and allow Burthys Vrinther, a popular compromise candidate for the moderates of both the Rose-Bearers and Travellers, as well as having his own political following, to be elected as the new leader of the nation."
 rth.52.a:0 "If that is the Will of the Council"
 rth.52.b:0 "This is Treason! Dissolve the Council Immediately!"
 rth.53.t:0 "The End of the United Duchies"
 rth.53.d:0 "We no longer have ownership of both Quellion and Thurgithon, so we will have to change the name of our nation to represent that."
 rth.53.a:0 "Henceforth, we shall be known as the Grand Duchy of Quellion"
 rth.53.b:0 "Henceforth, we shall be known as the Grand Duchy of Thurgithon"
 rth.54.t:0 "Watching Burthys Vrinther"
 rth.54.d:0 "From our observations of the head of House Vrinter, we see he spends most of his time engaged in political discussions, passionately believing that he knows the right path for our nation. But he does not openly defy the government, and seems to even support some of our programs, as long as they aren't overreaching in his perspective. He seems to be a loyal Rthaur, who simply wants what is best for his nation."
 rth.54.a:0 "He is a Threat who must be Confined to His House"
 rth.54.b:0 "Our views are compatible, let's invite him into the government"
 rth.55.t:0 "The New Path of the Rose-Bearers"
 rth.55.d:0 "Now the Council of Communes has assembled today in order to decide where to go. Before, in spite of Alucien's insistence that he not have a large amount of power, the entire government went along with whatever he believed was best. Now without him, it must decide what new path it will head down, led by Solverin."
 rth.55.a:0 "A more central government is required"
 rth.55.b:0 "The nation will stay decentralized, like Alucien wanted"
 rth.56.t:0 "[RTH.GetLeader] has Contacted the Brotherhood of Equals"
 rth.56.d:0 "In an unsurprising but still disturbing move to some, it has become obvious that [RTH.GetName] has opened communications with the Brotherhood of Equals, even the branches that are known for terrorist attacks"
 rth.56.a:0 "Send a Diplomatic Protest, we Will Not Tolerate This"
 rth.56.b:0 "Perhaps they are speaking on our behalf?"
 rth.57.t:0 "[RTH.GetLeader] Asks for Complete Union"
 rth.57.d:0 "Not content with overlordship, [RTH.GetNameDef] wants to get rid of our autonomy and enforce centralization upon us."
 rth.57.a:0 "We must accept"
 rth.57.b:0 "This is What Caused the Quellion Proclamation! We will now have a [ROOT.GetAdjective] Proclamation!"
 rth.58.t:0 "[FROM.GetName] Accepts Centralization"
 rth.58.d:0 ""
 rth.58.a:0 "Next Step to a Centralized Rthauiaur"
 rth.59.t:0 "The [FROM.GetAdjective] Proclamation"
 rth.59.d:0 "Offended by our request to unite, [FROM.GetNameDef] has declared complete independence from our nation."
 rth.59.a:0 "We must quickly crush these counter-revolutionaries"
 rth.60.t:0 "Alucien Derathur Chooses his Successor"
 rth.60.d:0 "Unable to handle the stresses of running the nation anymore, Derathur has called together the Council of Communes to nominate his successor. The three main candidates are Llyrin, the diplomat who has helped keep Rthaur-Skaelinger relations steady and positive since the Revolution, and rumored by many to have been groomed by Derathur himself. Then there is the isolationist Nawlr, who wants the revolution to keep to itself for the betterment of all in its borders, but hopefully not anger the anti-radicals surrounding them. Finally, there is Solverin, a fierce general who has loyally fought for the revolution since its inception."
 rth.60.a:0 "Ecernne Llyrin Shall Follow in Derathur's Footsteps"
 rth.60.b:0 "Reezma Nawlr Will Lead us to Stability"
 rth.60.c:0 "Kastyne Solverin Must Defend the Revolution"
 rth.61.t:0 "Puritan Coup"
 rth.61.d:0 "Now the Puritans have grown enough in strength to enact a coup against our pro-[RTH.GetAdjective] government and declare independence from them. Now we are free of their influence and able to reverse the changes they have made."
 rth.61.a:0 "For Elven Freedom"
 rth.62.t:0 "[FROM.GetName] is Couped by Puritans!"
 rth.62.d:0 "We have been unable to stop Puritan influence from spreading through [FROM.GetName], and now the city is firmly under Puritan control, having declared independence from us."
 rth.62.a:0 "Crush the Puritan Menace"
 rth.63.t:0 "Scrambling for a Defense"
 rth.63.d:0 "We have been completely caught off guard by the Ordorians declaring war on us, having expected the ceasefire to end at least a year later. A quick defense must be scrambled in order to ensure the protection of the revolution."
 rth.63.a:0 "Fellow Rthaur! To Arms!"
 rth.64.t:0 "Travellers Lead Reactionary Coup!"
 rth.64.d:0 "Angered by the rightful leadership of [RTH.GetLeader] and how [RTH.GetSheHe] denied their outrageous demands for them to step down, they have collaborated with reactionaries and monarchists to rise up against us!"
 rth.64.a:0 "We Must Crush the Reactionaries"
 rth.65.t:0 "[RTH.GetLeader] Ends the Alliance"
 rth.65.d:0 "Now that Ordoria has been dealt with, [RTH.GetNameDef] has ended our anti-Ordorian alliance, so both nations can now go on their own path."
 rth.65.a:0 "It is the right path"
 rth.66.t:0 "[RTH.GetLeader] Offers Anti-Schwarzenbach Aid"
 rth.66.d:0 "Recently we have been approached by a Rthaur diplomat, who has spoken of ''instability to our south and to your north'', obviously speaking of Stahlhof. Then they implied that if [UNG.GetLeader] legalized a Rosite political party, that they would be able to aid in the 'restabilization of our shared worries'."
 rth.66.a:0 "Enemy of my Enemy is my Friend..."
 rth.66.b:0 "We will never cooperate with Radicals!"
 rth.67.t:0 "Sudden Rise in Radical Unrest"
 rth.67.d:0 "The putrid Stahlrosen seem to get more popularity by the day, and this has incensed a few of them to begin doing acts of terror against our government, along with calling to the peasants to prepare to rise up against the rightful monarchy."
 rth.67.a:0 "The Rthaur Scum are obviously behind this"
 rth.68.t:0 "Radical Unrest"
 rth.68.d:0 "Somehow, Rosite factions within our nation have increased in popularity and boldness, protesting against our government and even doing a few acts of terror in order to try and move us into giving into their demands. Of course this will not move us, and our nobles have come to a consesus that by the end of the year they will have been dealt with."
 rth.69.t:0 "The Southern Forests Revolt!"
 rth.69.d:0 "Aided by Rthaur Revolutionaries, the regions of Kortinall and Nastrodoge have revolted against us, aligning with [RTH.GetNameDef]."
 rth.69.a:0 "We will crush those putrid radicals"
 rth.70.t:0 "The Fall of Thurgithon"
 rth.70.d:0 "Ordorians have recently seized the northern city of Thurgithon, cutting us off from the trade and industry of the great city."
 rth.70.a:0 "Our economic bell begins its death knells"
 rth.71.t:0 "The Fall of Quellion"
 rth.71.d:0 "Ordorians have recently seized the southern city of Quellion, cutting us off from the administrative and cultural landmarks of the great city."
 rth.71.a:0 "A tragedy for our political center"
 rth.72.t:0 "A New Revolution!"
 rth.72.d:0 "Radicals have seized parts of the countryside, demanding that our nation accept the rule of the peasants. They've obviously been supplied and supported by the Rthaur upstarts."
 rth.72.a:0 "Crush the Peasants!"
 rth.72.b:0 "We must give in to them"
 rth.73.t:0 "[RTH.GetLeader] Calls for Brotherhood of Equals to Rise Up!"
 rth.73.d:0 "In a shocking display of disregard for our anti-Ordorian alliance, Solverin has supported the Brotherhood of Equals to rise up against us in order to establish a radical government in our mountains!"
 rth.73.a:0 "May Our Ancestors Protect Us"
 rth.74.t:0 "The Khorinor Question"
 rth.74.d:0 "While the Khorinor Mountains were originally loaned to use during the Rthaur Revolution in order to provide a secure base and strengthen our nation, now our people have begun to think of it as theirs. Now that we are in an alliance with the Skaelinger, perhaps we can request its return."
 rth.74.a:0 "No, it is the Dwarves' Land"
 rth.74.b:0 "Let Us Ask for its Return"
 rth.75.t:0 "[RTH.GetLeader] Requests the Khorinor Mountains Return to [RTH.GetNameDef]"
 rth.75.d:0 "Even though we only lent the Rthaur the Khorinor Mountains until we beat the Ordorians, they have asked for us to return it due to the elves who settled there during the Revolution, as if they are not outnumbered by the dwarves who live there."
 rth.75.a:0 "We cannot deny them their request"
 rth.75.b:0 "Those Mountains are Our Homes!"
 rth.76.t:0 "Expanding the United Duchies"
 rth.76.d:0 "Now that we own all of former Ordoria, naming our nation just after our first two cities is reductive. Thus we shall declare our nation to represent all of the Central Jungles we rule!"
 rth.76.a:0 "Long Live the United Duchies of the Central Jungles!"
 rth.77.t:0 "The Breakdown of Rthauiaur!"
 rth.77.d:0 "After the death of Alucien Derathur, the man holding our nation together, the stresses and divide between the two major cities of Quellion and Thurgithon have proven to be too much, and the nation has split in two, with Thurgithon seceeding from Rthauiaur, but staying in a defense pact with us."
 rth.77.a:0 "At least it wasn't a total loss"
 rth.78.t:0 "[RTH.GetName] Splits in Two!"
 rth.78.d:0 "Following the death of Derathur, their glorious leader, and the only thing holding their nation together, the two cultural centers of the nation, due to their cultural differences, have parted ways! They are still promising to protect each other, but the Rthauiaur whole was more than the sum of its parts."
 rth.78.a:0 "Now They are Fresh for the Slaughter"
