 ORD_yntha_desc:0 "Yntha is by far the most vocal of the group, going to bat for her ideals no matter the situation. Just as she protects her ideals, she protects her friends, and none more so than her love, Alwyen."
 ORD_alwyen_desc:0 "Where Yntha is in many aspects the moral backbone of the group, Alwyen is their heart. Though not one for conflict, she is almost impossible to discourage and often rebounds into joy from even the most devastating of tragedies. Though the five face many struggles, Alwyen’s infectious happiness has carried them through many tough days, and will doubtlessly do so for many more."
 ORD_gylar_desc:0 "Gylar is far more down-to-earth than the firebrand Yntha, being willing to work with the system to improve it. He never loses sight of what is important, however, and knows when to draw the line and force a concession out of his adversary."
 ORD_thrysmere_desc:0 "Thrysmere, despite his best efforts, tends to lack the self-confidence Gylar carries. He is extremely good with numbers and patterns, and Larennis relies on him for administrative or secretarial work like no other, but his social skills often leave much to be desired. When placed in a bad spot, Thrysmere tends to be reduced to a pacing, anxious wreck, leaving his friends to tackle the social aspects of the problem while he works on a systematic solution in the background."
 ORD_galerin_advisor_desc:0 "Though the face of Ordorian politics to the populace and the wider world, High King Galerin Valinthir is not the heart of Ordorian politics. Shattered by grief over his failures to first defend against the Grand Master's Realm and then against the coup of the Steward, he has lost his heart for politics. He remains a loving father to his son, however, and always stands ready with advise or moral support should it be necessary."
 ORD_alsyon_desc:0 "Captain of the Drakeskins, Backbone of the Iron Line, Defender of Ordoria - Captain Alsyon has almost as many titles as he does battle-scars. This veteran of innumerable conflicts has lent his services to the highest bidder, for a time. He and his do not come cheap, but when war looms, they are worth their price in Fireforge Steel."
 prisoners_guests_name:0 "Prisoners and Guests"