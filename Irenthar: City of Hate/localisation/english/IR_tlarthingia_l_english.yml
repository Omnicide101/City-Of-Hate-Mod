l_english:
 #decisions
 TLA_pilgrimages_category:0 "The Grand Pilgrimages"
 TLA_pilgrimages_category_desc:0 "The priests have seen signs that another Grand Pilgrimage is necessary to keep the balance of the world. We must send groups of the faithful across Lathweyne to perform ancient rituals, or else a great tragedy will befall the world.\n\nRituals Completed: [?TLA_rituals_done]"
 TLA_send_pilgrims_to_fritzhafen:0 "Send Pilgrims to the Union"
 TLA_find_another_union_port:0 "Find Another Union Port"
 TLA_visit_skaelinger:0 "Send Pilgrims to [SKA.GetNameDef]"
 TLA_northern_pilgrimage:0 "The Northern Pilgrimage"
 #events
 tla.5.t:0 "Shivering Lizard Pilgrims"
 tla.5.d:0 "A strange sight drew the eyes of the townsfolk as a group of lizardmen from Tlarthingia crossed the border, before approaching the town hall.\n''Hello, sir,'' the leader of the group said through chattering fangs. ''We are on a pilgrimage. Would we be able to pass through [LIR.GetNameDef]? We swear that we will disturb you noble Lithorians as little as possible. Also, would we be able to purchase some coats? It's rather chilly. Too cold for the warm season.''"
 tla.5.a:0 "Give them some coats and passage"
 tla.5.b:0 "They don't belong here!"
 tla.6.t:0 "Lizardmen, Far from Home"
 tla.6.d:0 "A group of lizardmen from Tlarthingia, claiming to be pilgrims, have requested passage through [GMR.GetNameDef] in order to do a ritual, claiming it is important to keep the world safe by doing it."
 tla.6.a:0 "Keep an eye on them, but let them pass through"
 tla.6.b:0 "Send them back home"
 tla.7.t:0 "Tlarthingian Pilgrims Arrive in Irenthar"
 tla.7.d:0 "The lizardmen pilgrims have arrived in Irenthar, and reports have come of them asking about any news from Ordoria, seemingly disturbed by the answers they have received.\nA fisherman looked up from the nets he was mending, to be faced with a towering scaly figure that reminded him of a dragon.''Greetings, sir,'' the lizardman spoke. ''Would I be able to borrow your boat?''\n''What for?''\n''Well, we are a pilgrimage, and need to get to Ordoria in order to-''\nHe was interrupted by the fisherman. ''You're insane, no one in their right mind would want to go to Ordoria!''\n''I know, but there is something that needs to be done there. Could I please borrow your boat? I'll return it once we come back.''"
 tla.7.a:0 "''...You better come back with that boat''"
 tla.7.b:0 "''You're insane, go back wherever you belong!''"
 tla.8.t:0 "The Pilgrims Return"
 tla.8.d:0 "''I can't believe you loaned your boat to those crazy lizards. It's been what, two months? And they still haven't come back. They're either dead or just stole the boat,'' the fisherman's friend laughed, slapping him on the shoulder.\nThey were interrupted by a familiar shape coming through the fog, before the fisherman's boat, crewed by several lizardmen, arrived at the dock. Their leader climbed onto the dock, nodding at the fisherman. ''Thank you for letting us borrow your boat. You've done a great service for the balance of the world.''\nThen the rest of the lizardmen climbed off of the boat after tying it up, following their leader through the foggy streets."
 tla.8.a:0 "''...Thanks?''"
 tla.9.t:0 "Lizards? In the Mountains?"
 tla.9.d2:0 "Somehow, a group of pilgrims from [TLA.GetNameDef] passed the [KUR.GetAdjective] raiders safely, and have arrived in INSERT NAME OF CITY HERE, asking to be allowed passage through the mountains so they can finish their pilgrimage."
 tla.9.d1:0 "Somehow, a group of pilgrims from [TLA.GetNameDef] passed the [KUR.GetAdjective] raiders safely, and have arrived in INSERT NAME OF CITY HERE, asking to be allowed passage through the mountains so they can finish their pilgrimage. The fact that we are at war with [ORD.GetNameDef] doesn't seem to give them any pause in their request."
 tla.9.a:0 "I guess let them through"
 tla.10.t:0 "Border Patrol Encounters Group of Lizardmen"
 tla.10.d1:0 "A group of soldiers keeping watch close to the Ungerdaler front found a group of Lizardmen claiming to be pilgrims, who wish for safe passage through our territory in order to complete their pilgrimage."
 tla.10.d2:0 "A group of soldiers encountered a group of lizardmen claiming to be pilgrims, who politely asked for passageway through our lands in order to complete their pilgrimage."
 tla.10.a:0 "Those are Some Determined Pilgrims"
 tla.11.t:0 "Lizardmen Pilgrims Arrive in Port"
 tla.11.d:0 "A group of lizardmen from [TLA.GetNameDef], claiming to be pilgrims, have arrived in port, asking for passage through the Union. There are many who would oppose this, especially since Tlarthingian pirates have been harrassing our fleets for over a decade."
 tla.11.a:0 "Let Them Pass"
 tla.11.b:0 "Send Them Back to [TLA.GetNameDef]"
 tla.12.t:0 "The Priests' Call"
 tla.12.d:0 "Lately, more and more priests have received visions of grand pillars of fire shooting up across Lathweyne, before being smothered by a serpent. Logstun Hycthuus has told [TLA.GetLeader] that this means it is time for another Grand Pilgrimage, something that hasn't been done in almost a milennia. And of course, knowing it would help unite the Tlarthingians, [TLA.GetLeader] has agreed to use all of his diplomatic and political power to help these pilgrimages happen."
 tla.12.a:0 "We must prepare the pilgrims"
 tla.13.t:0 "Pilgrims Return from [FROM.GetNameDef] Empty-Handed"
 tla.13.d:0 "Unwilling to allow our pilgrims passage through their lands, the pilgrims have been sent back to Tlarthingia."
 tla.13.a:0 "We must find another way around..."
 tla.14.t:0 "Pilgrims Encounter Supernatural Threat in Spochwald"
 tla.14.d:0 "Spooky Scary Skeletons"
 tla.14.a:0 "We must help the innocent"
 tla.14.b:0 "Focus on the Greater Good of the Pilgrimage"
 tla.15.t:0 "Mysterious Lizardmen Save the Day!"
 tla.15.d:0 ""
 tla.15.a:0 "We must give our thanks to the Noble Tlarthingians"
 tla.16.t:0 "Thanks From Spochwald"
 tla.16.d:0 "Apparently a group of our pilgrims in Spochwald encountered a supernatural threat of some kind, and helped the locals deal with it. [SPW.GetLeader] has sent his personal thanks to us for their aid."
 tla.16.a:0 "Perhaps more of the faithful should follow their example"
 tla.17.t:0 "Lizardmen, Far From Home"
 tla.17.d:0 "From halfway across the continent, a group of lizardmen have come for a pilgrimage, and have asked us for permission to enter our lands to complete it."
 tla.17.a:0 "They have come a long way, let them rest a while"
 tla.18.t:0 "Pilgrims Return Successfully!"
 tla.18.d1:0 "After moving through the Union lands and enacting several rituals, our southern pilgrimage has returned!"
 tla.18.d2:0 "After moving through the northern lands of Lirothlind and [GMR.GetNameDef], and even risking death in Ordoria, our pilgrims have returned!"
 tla.18.a:0 "Amazing!"
 tla.19.t:0 "The Irinthian Issue"
 tla.19.d:0 "As we have gained the upper hand after their attempted invasion, there has been much debate over what should happen to Irinthios in the peace treaty if we win. Most Tlarthingians have little interest in Irinthian lands, and would prefer a less intrusive kind of treaty."
 tla.19.a:0 "We will hamstring the Irinthian Army"
 tla.19.b:0 "We shall treat the Irinthians as we see fit"
 tla.20.t:0 "The Treaty of the Hand"
 tla.20.d:0 "Not wanting any of our territory, our nation has been spared dissolution and subjugation, albeit with restrictions on the size of our army and the promise of paying for the destruction we have caused in Tlarthingia during our invasion."
 tla.20.a:0 "Our dreams are broken..."
 tla.21.t:0 "[FROM.GetNameDefCap] Pays Off Some Debt"
 tla.21.d:0 "The most recent shipment of [FROM.GetAdjective] payments to repay us after the war has arrived, showing [FROM.GetLeader]'s dedication to promoting the peace and wanting to prevent this war from occurring again."
 tla.21.a:0 "Good"
 #tooltips
 TLA_allowed_pilgrims:0 "Allowed Tlarthingian Pilgrims to Pass Through"